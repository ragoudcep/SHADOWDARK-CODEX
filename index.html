<script src="js/xml-generic.js"></script>
<script>

/* =========================================================================
   NAVIGATION & ÉVÉNEMENTS
   ========================================================================= */
/* Un lien [[Nom]]/résultat de recherche/puce "mentionné dans" peut techniquement pointer vers un
   type d'entité dont l'onglet n'est pas accessible au rôle courant (ex. un lien vers un Point Crawl
   MJ écrit dans une note de session, par ailleurs visible aux joueurs) — findByName()/renderText()
   ne filtrent pas par rôle à la résolution du lien, seulement au clic, ici. Signalé par Tristan
   (2026-08-10) en testant le mode aperçu : cliquer dessus ne doit PROVOQUER AUCUNE navigation (pas
   de page "ce n'est pas accessible" — juste rester exactement où on était), avec seulement un petit
   signal (toast) pour que le clic ne semble pas simplement ignoré. */
function goto(type,id){
  const tab = TAB_OF[type];
  if(effectiveRole()!=="gm" && !PLAYER_VISIBLE_TABS.includes(tab)){
    toast("Ce contenu n'est pas accessible.");
    return;
  }
  editReturnTo = null;
  view = { tab, mode:"detail", id };
  $("#search").value=""; $("#search-results").classList.remove("open");
  render();
}

// Onglets
$("#tabs").addEventListener("click", e=>{
  const b = e.target.closest("button[data-tab]"); if(!b) return;
  editReturnTo = null;
  view = { tab:b.dataset.tab, mode:"list", id:null }; render();
  document.body.classList.remove("nav-mobile-open");
});

// Filtre par thème dans l'onglet Événements
app.addEventListener("change", e=>{
  if(e.target.matches("[data-event-filter]")){ eventThemeFilter = e.target.value; renderList(); }
  else if(e.target.matches("[data-crea-sort]")){ creatureSort = e.target.value; renderList(); }
  else if(e.target.matches("[data-crea-filter]")){ creatureCatFilter = e.target.value; renderList(); }
  else if(e.target.matches("[data-table-filter]")){ tableCatFilter = e.target.value; renderList(); }
  else if(e.target.matches("[data-crawl-status-filter]")){ crawlStatusFilter = e.target.value; renderList(); }
  else if(e.target.matches("[data-init-manual-input]")){ setInitiativeManual(e.target.dataset.initManualInput, e.target.value); renderList(); }
  else if(e.target.matches("[data-gmnote-toggle]")){ toggleGmNote(e.target.dataset.gmnoteToggle); }
  else if(e.target.matches("#f-kind")){
    const dyn = e.target.value==="dynamic";
    const srcWrap = document.getElementById("dynamic-source-wrap"), rowsSec = document.getElementById("rows-section");
    if(srcWrap) srcWrap.classList.toggle("hidden", !dyn);
    if(rowsSec) rowsSec.classList.toggle("hidden", dyn);
  }
  else if(e.target.matches("#f-source")){
    const filterWrap = document.getElementById("dynamic-filter-wrap");
    if(filterWrap) filterWrap.classList.toggle("hidden", e.target.value!=="treasure");
  }
});

// Clics globaux dans l'app (délégation)
app.addEventListener("click", e=>{
  const t = e.target;
  const closest = (a)=>t.closest(`[${a}]`);
  let el;
  if((el=closest("data-toggle-group"))){ const k=el.dataset.toggleGroup; expandedGroups.has(k)?expandedGroups.delete(k):expandedGroups.add(k); renderList(); return; }
  if((el=closest("data-toggle-all"))){ const keys=(el.dataset.toggleAllKeys||"").split("|").filter(Boolean); if(el.dataset.toggleAll==="open") keys.forEach(k=>expandedGroups.add(k)); else keys.forEach(k=>expandedGroups.delete(k)); renderList(); return; }
  if((el=closest("data-toggle-reading"))){ readingMode=!readingMode; render(); return; }
  // Doit être vérifié AVANT data-open : l'étoile de favori est imbriquée dans une carte qui porte
  // elle-même data-open (ouvrir la fiche) — l'ordre des tests (et non un stopPropagation()) est ce
  // qui évite qu'un clic sur l'étoile déclenche aussi la navigation vers la fiche.
  if((el=closest("data-toggle-fav"))){
    const [ty,id]=el.dataset.toggleFav.split(":");
    const o=getEntity(ty,id); if(!o) return;
    o.favorite = !o.favorite;
    saveDB(); renderList();
    return;
  }
  if((el=closest("data-toggle-fav-filter"))){
    const ty = el.dataset.toggleFavFilter;
    if(ty==="pc") pcFavOnly=!pcFavOnly;
    else if(ty==="npc") npcFavOnly=!npcFavOnly;
    else if(ty==="creature") creatureFavOnly=!creatureFavOnly;
    else if(ty==="treasure") treasureFavOnly=!treasureFavOnly;
    else if(ty==="spell") spellFavOnly=!spellFavOnly;
    renderList();
    return;
  }
  if((el=closest("data-open"))){ const [ty,id]=el.dataset.open.split(":"); goto(ty,id); return; }
  if((el=closest("data-goto"))){ const [ty,id]=el.dataset.goto.split(":"); goto(ty,id); return; }
  if((el=t.closest("[data-create]"))){ toast(`« ${el.dataset.create} » n'existe pas encore — créez cette entité pour activer le lien.`); return; }
  if(closest("data-back")){
    if(editReturnTo){ view={tab:editReturnTo.tab, mode:"detail", id:editReturnTo.id}; editReturnTo=null; }
    else{ view.mode="list"; view.id=null; }
    render(); return;
  }
  if((el=closest("data-new"))){ editReturnTo=null; view.mode="new"; view.id=null; render(); return; }
  if((el=closest("data-edit"))){ editReturnTo=null; const [ty,id]=el.dataset.edit.split(":"); view={tab:TAB_OF[ty],mode:"edit",id}; render(); return; }
  if((el=closest("data-dup"))){ const [ty,id]=el.dataset.dup.split(":"); duplicateEntity(ty,id); return; }
  if((el=closest("data-toggle-gm-created"))){
    const [ty,id]=el.dataset.toggleGmCreated.split(":");
    const o=getEntity(ty,id); if(!o) return;
    o.gmCreated = !o.gmCreated;
    saveDB(); render();
    return;
  }
  if((el=closest("data-del"))){
    const [ty,id]=el.dataset.del.split(":");
    confirmModal("Supprimer définitivement cet élément ?", ()=>{ deleteEntity(ty,id); view.mode="list"; view.id=null; render(); toast("Supprimé."); });
    return;
  }
  if((el=closest("data-save"))){
    const ty = el.dataset.save;
    if(ty==="event") saveEvent(); else if(ty==="table") saveTable();
    else if(ty==="creature") saveCreature(); else if(ty==="session") saveSession();
    else if(ty==="npc") saveNPC(); else if(ty==="pointcrawl") saveCrawl();
    else if(ty==="pc") savePC(); else if(ty==="treasure") saveTreasure();
    else if(ty==="spell") saveSpell();
    else if(ty==="hexmap") saveHexmap();
    else if(ty==="dungeonmap") saveDungeonMap();
    return;
  }
  // Lancer les talents 2d6 (table dérivée de la classe, voir detailPC)
  if((el=closest("data-roll-talents"))){ rollTalents(el.dataset.rollTalents); return; }
  if(closest("data-gen-pc")){ generateRandomPC(); return; }
  if(closest("data-gen-npc")){ generateRandomNPC(); return; }
  // Barre d'outils du point crawl
  if(closest("data-crawl-add")){ const c=getEntity("pointcrawl",crawlState.id); if(c) openPickEventModal(c); return; }
  if(closest("data-crawl-new")){ const c=getEntity("pointcrawl",crawlState.id); if(c) openNewEventModal(c); return; }
  if(closest("data-crawl-link")){ toggleLinkMode(); return; }
  if(closest("data-crawl-print")){ printCrawl(crawlState.id); return; }
  if(closest("data-print-pcs")){ openPrintPCsModal(); return; }
  if(closest("data-print-creature-cards")){ openPrintCreatureCardsModal(); return; }
  if(closest("data-print-npc-cards")){ openPrintNPCCardsModal(); return; }
  if((el=closest("data-print-pc"))){ printPCs([el.dataset.printPc]); return; }
  // Hexcrawl
  if((el=t.closest("[data-hexq]"))){
    if(effectiveRole()==="gm"){
      if(hexPlacingPoint) createHexPointAt(+el.dataset.hexq, +el.dataset.hexr);
      else if(hexPaintingBiome) setHexBiome(+el.dataset.hexq, +el.dataset.hexr, hexPaintBiomeValue);
      else if(hexPaintingOverlay) setHexOverlay(+el.dataset.hexq, +el.dataset.hexr, hexPaintOverlayValue);
      else toggleHexFog(+el.dataset.hexq, +el.dataset.hexr);
    }
    return;
  }
  if((el=t.closest("[data-point-id]"))){ openHexPointModal(el.dataset.pointId); return; }
  if(closest("data-hex-reveal-all")){ revealAllHexes(true); return; }
  if(closest("data-hex-hide-all")){ revealAllHexes(false); return; }
  if(closest("data-hex-add-point")){ toggleHexPlacingPoint(); return; }
  if(closest("data-hex-paint-biome")){ toggleHexPaintingBiome(); return; }
  if(closest("data-hex-paint-overlay")){ toggleHexPaintingOverlay(); return; }
  if(closest("data-hex-import")){ _hexImportTarget = hexmapCurrentId; $("#file-hexjson").click(); return; }
  if(closest("data-hex-import-new")){ _hexImportTarget = null; $("#file-hexjson").click(); return; }
  // Cartes de donjon
  if(closest("data-add-mapimg")){ $("#file-mapimg").click(); return; }
  if(closest("data-dmap-replace-image")){ $("#file-mapimg-replace").click(); return; }
  if((el=closest("data-dmap-activate"))){ activateDungeonMap(el.dataset.dmapActivate); return; }
  if((el=closest("data-dmap-tool"))){ setDungeonMapTool(el.dataset.dmapTool); return; }
  if(closest("data-dmap-reveal-all")){ setAllDungeonMapStrokes(false); return; }
  if(closest("data-dmap-hide-all")){ setAllDungeonMapStrokes(true); return; }
  if(closest("data-dmap-polygon-finish")){ finishDungeonMapPolygon(getEntity("dungeonmap", dungeonMapCurrentId)); return; }
  if(closest("data-dmap-polygon-undo")){ undoDungeonMapPolygonVertex(getEntity("dungeonmap", dungeonMapCurrentId)); return; }
  if(closest("data-dmap-preview-toggle")){ toggleDungeonMapPlayerPreview(); return; }
  // Images (formulaire créature) + agrandissement
  if(closest("data-add-img")){ $("#file-img").click(); return; }
  if((el=closest("data-remove-img"))){ formImages.splice(+el.dataset.removeImg,1); renderImageThumbs(); return; }
  // Portraits (bibliothèque partagée PJ/PNJ)
  if(closest("data-open-portrait-picker")){ openPortraitPickerModal(); return; }
  if(closest("data-clear-portrait")){ formPortrait=""; refreshPortraitPickWidget(); return; }
  if((el=closest("data-lightbox"))){ openLightbox(el.dataset.lightbox); return; }
  // Répéteurs — créatures
  if(closest("data-add-attack")){ $("#attacks-wrap").insertAdjacentHTML("beforeend", attackInput({range:"close"})); return; }
  if((el=t.closest("[data-remove-attack]"))){ el.closest("[data-attackitem]").remove(); return; }
  // Répéteurs — sessions
  if(closest("data-add-entry")){ $("#entries-wrap").insertAdjacentHTML("beforeend", entryInput({label:"Jour "+($("#entries-wrap").children.length+1)})); return; }
  if((el=t.closest("[data-remove-entry]"))){ el.closest("[data-entryitem]").remove(); return; }
  // Répéteurs — tables
  if(closest("data-add-row")){ const w=$("#rows-wrap"); w.insertAdjacentHTML("beforeend", rowInput("", w.children.length)); reindexRows(); return; }
  if((el=t.closest("[data-remove-row]"))){ const it=el.closest(".repeat-item"); if(it) it.remove(); reindexRows(); return; }
  if(closest("data-apply-count")){ applyRowCount(); return; }
  // Import / modèle XML (onglet créatures)
  if(closest("data-import-xml")){ _xmlImportTarget="creature"; $("#file-xml").click(); return; }
  if(closest("data-purge")){ openPurgeModal(); return; }
  if(closest("data-xml-sample")){ xmlSample(); return; }
  if((el=closest("data-import-xml-type"))){ _xmlImportTarget=el.dataset.importXmlType; $("#file-xml").click(); return; }
  if((el=closest("data-export-xml-type"))){
    const ty=el.dataset.exportXmlType;
    if(ty==="creature") exportCreaturesXML(); else exportEntityXMLGeneric(ty);
    return;
  }
  if((el=closest("data-xml-sample-type"))){ xmlSampleGeneric(el.dataset.xmlSampleType); return; }
  // Lancer de dé sur une table
  if((el=closest("data-roll"))){ rollTable(el.dataset.roll); return; }
  if(t.id==="roll-add-session" && lastTableRoll){ addRollToCurrentSession(lastTableRoll); return; }
  // Bouton de secours dans l'état vide du focus par défaut des Point Crawl (rien "en cours"/"à visiter")
  if((el=closest("data-crawl-status-show-all"))){ crawlStatusFilter = "__all__"; renderList(); return; }
  // Table dynamique vide : lien direct vers l'onglet source (liste, pas une fiche précise)
  if((el=closest("data-goto-tab"))){
    const tab = el.dataset.gotoTab;
    if(effectiveRole()!=="gm" && !PLAYER_VISIBLE_TABS.includes(tab)){ toast("Ce contenu n'est pas accessible."); return; }
    editReturnTo=null; view={tab, mode:"list", id:null}; render(); return;
  }
  // Initiative
  if(closest("data-init-add-pc")){ openInitiativeAddPCModal(); return; }
  if(closest("data-init-add-creature")){ openInitiativeAddCreatureModal(); return; }
  if(closest("data-init-add-custom")){ promptModal("Nom du participant :", "", name=>addInitiativeCustom(name)); return; }
  if(closest("data-init-roll-all")){ rollInitiativeAll(); return; }
  if(closest("data-init-clear")){ clearInitiative(); return; }
  if((el=closest("data-init-roll"))){ rollInitiativeFor(el.dataset.initRoll); return; }
  if((el=closest("data-init-remove"))){ removeInitiativeEntry(el.dataset.initRemove); return; }
  // Roue
  if(closest("data-wheel-spin")){ spinWheel(); return; }
  if(closest("data-wheel-edit")){ openWheelEditModal(); return; }
  // To-do MJ
  if(closest("data-gmnote-add")){ promptModal("Nouvelle note :", "", text=>addGmNote(text)); return; }
  if((el=closest("data-gmnote-edit"))){ editGmNote(el.dataset.gmnoteEdit); return; }
  if((el=closest("data-gmnote-del"))){ removeGmNote(el.dataset.gmnoteDel); return; }
});

function applyRowCount(){
  const n = Math.max(1, Math.min(100, parseInt($("#row-count").value)||1));
  const w = $("#rows-wrap");
  const current = [...w.querySelectorAll(".row-input")].map(i=>i.value);
  const rows = [];
  for(let i=0;i<n;i++) rows.push(current[i]!=null?current[i]:"");
  w.innerHTML = rows.map((r,i)=>rowInput(r,i)).join("");
}
let lastTableRoll = null; // { tableTitle, text } — dernier tirage, pour l'ajout aux notes de session
function rollTable(id){
  const t = getEntity("table",id); if(!t) return;
  const isDynamic = t.kind==="dynamic";
  const items = isDynamic ? dynamicSourceItems(t) : null;
  const count = isDynamic ? items.length : t.rows.length;
  if(!count) return;
  const idx = Math.floor(Math.random()*count);
  document.querySelectorAll("#table-body tr").forEach(tr=>tr.classList.toggle("rolled", +tr.dataset.rowidx===idx));
  const plain = isDynamic ? (items[idx].name||items[idx].title||"Sans nom") : (firstLine(t.rows[idx])||"(vide)");
  const linked = isDynamic ? `[[${plain}]]` : plain; // lien cliquable une fois collé dans les notes de session
  const out = $("#roll-out"); out.textContent = `→ ${idx+1} : ${plain}`;
  const tr = document.querySelector(`#table-body tr[data-rowidx="${idx}"]`);
  if(tr) tr.scrollIntoView({block:"nearest",behavior:"smooth"});
  lastTableRoll = `${t.title||"Table"} → ${idx+1} : ${linked}`;
  const addBtn = $("#roll-add-session"); if(addBtn) addBtn.classList.remove("hidden");
}
function currentSession(){
  if(!db.sessions.length) return null;
  return [...db.sessions].sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];
}
function addRollToCurrentSession(text){
  const s = currentSession();
  if(!s){ toast("Aucune session existante — créez-en une d'abord."); return; }
  if(!s.entries || !s.entries.length) s.entries = [{id:uid(), label:"Notes", notes:""}];
  const last = s.entries[s.entries.length-1];
  last.notes = (last.notes ? last.notes+"\n" : "") + text;
  saveDB(); toast(`Ajouté aux notes de « ${s.title||"session"} ».`);
}

// Recherche
const searchInput = $("#search");
searchInput.addEventListener("input", ()=>runSearch(searchInput.value));
searchInput.addEventListener("focus", ()=>{ if(searchInput.value) runSearch(searchInput.value); });
$("#search-results").addEventListener("click", e=>{
  const it = e.target.closest("[data-goto]"); if(!it) return;
  const [ty,id]=it.dataset.goto.split(":"); goto(ty,id);
});
document.addEventListener("click", e=>{
  if(!e.target.closest(".search")) $("#search-results").classList.remove("open");
});

$("#btn-credits").addEventListener("click", openCreditsModal);
// Export / Import JSON
$("#btn-export").addEventListener("click", exportJSON);
$("#btn-broken-links").addEventListener("click", openBrokenLinksModal);
$("#btn-import").addEventListener("click", ()=>$("#file-json").click());
$("#file-json").addEventListener("change", e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=""; });
$("#file-xml").addEventListener("change", e=>{
  const f = e.target.files[0];
  if(f){ if(_xmlImportTarget==="creature") importXML(f); else importXMLGeneric(_xmlImportTarget, f); }

});
$("#file-hexjson").addEventListener("change", e=>{ if(e.target.files[0]) importHexmapJSON(e.target.files[0]); e.target.value=""; });

  [...e.target.files].forEach(f=>processImage(f, img=>{ formImages.push(img); renderImageThumbs(); }));
  e.target.value="";
});
$("#file-mapimg").addEventListener("change", e=>{
  const f = e.target.files[0];
  if(f) processMapImage(f, dataUrl=>{ formMapImage = dataUrl; renderMapImagePreview(); });
  e.target.value="";
});
$("#file-mapimg-replace").addEventListener("change", e=>{
  const f = e.target.files[0];
  const m = getEntity("dungeonmap", dungeonMapCurrentId);
  if(f && m) replaceDungeonMapImage(m, f);
  e.target.value="";
});

// Lightbox (agrandissement des illustrations)
function openLightbox(src){ const lb=$("#lightbox"); lb.querySelector("img").src=src; lb.classList.remove("hidden"); }
$("#lightbox").addEventListener("click", ()=>$("#lightbox").classList.add("hidden"));

// Révélation du résultat de la roue (cadeau/confettis) — overlay indépendant de #modal
$("#wheel-reward").addEventListener("click", e=>{
  if(e.target.id==="wheel-reward" || e.target.closest("[data-wheel-reward-close]")){ hideWheelReward(); return; }
  const viewBtn = e.target.closest("[data-wheel-view-ref]");
  if(viewBtn){
    const sep = viewBtn.dataset.wheelViewRef.indexOf(":");
    const ref = { type:viewBtn.dataset.wheelViewRef.slice(0,sep), id:viewBtn.dataset.wheelViewRef.slice(sep+1) };
    if(!wheelRefViewable(ref)) return; // re-vérifié ici : garde-fou en plus du bouton déjà conditionné
    hideWheelReward();
    goto(ref.type, ref.id);
  }
});
// Garde-fou supplémentaire : Échap ferme aussi l'écran de récompense
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && !$("#wheel-reward").classList.contains("hidden")) hideWheelReward();
});

// Fenêtres modales (point crawl : consulter un point, ajouter/créer un événement)
$("#modal").addEventListener("click", e=>{
  if(e.target.id==="modal"){ closeModal(); return; }        // clic sur le fond
  let el;
  if((el=e.target.closest("[data-goto]"))){ const [ty,id]=el.dataset.goto.split(":"); closeModal(); goto(ty,id); return; }
  if(e.target.closest("[data-modal-close]")){ closeModal(); return; }
  if(e.target.closest("[data-modal-yes]")){ const cb=_modalCb; closeModal(); if(cb) cb(); return; }
  if(e.target.closest("[data-purge-confirm]")){ const all=$("#purge-manual")&&$("#purge-manual").checked; closeModal(); purgeCreatures(all); return; }
  if((el=e.target.closest("[data-pick-portrait-file]"))){ formPortrait = el.dataset.pickPortraitFile; closeModal(); refreshPortraitPickWidget(); return; }
  if(e.target.closest("[data-xml-skip]")){ closeModal(); applyXMLImport("skip"); return; }
  if(e.target.closest("[data-xml-replace]")){ closeModal(); applyXMLImport("replace"); return; }
  if(e.target.closest("[data-xml-all]")){ closeModal(); applyXMLImport("all"); return; }
  if(e.target.closest("[data-xmlg-skip]")){ closeModal(); applyXMLImportGeneric("skip"); return; }
  if(e.target.closest("[data-xmlg-replace]")){ closeModal(); applyXMLImportGeneric("replace"); return; }
  if(e.target.closest("[data-xmlg-all]")){ closeModal(); applyXMLImportGeneric("all"); return; }

    const nameInput = document.getElementById("wheel-preset-name");

  const byTitle = new Map(db.tables.map(t=>[(t.title||"").trim().toLowerCase(), t]));

  const seedOne = (tpl, isDynamic) => {
    const existing = byTitle.get(tpl.title.toLowerCase());
    if(existing){
      if(!existing.category && tpl.category){ existing.category = tpl.category; categorized++; }
      return;
    }
    const o = { id:uid(), title:tpl.title, category:tpl.category||"", context:tpl.context };
    if(isDynamic){ o.kind="dynamic"; o.source=tpl.source; o.sourceFilter=tpl.sourceFilter||""; o.rows=[]; }
    else { o.kind="static"; o.rows=[...tpl.rows]; }
    db.tables.push(o);
    byTitle.set(tpl.title.toLowerCase(), o);
    added++;
  };
  SHADOWDARK_DEFAULT_TABLES.forEach(tpl=>seedOne(tpl,false));
  SHADOWDARK_DEFAULT_DYNAMIC_TABLES.forEach(tpl=>seedOne(tpl,true));
  return { added, categorized };
}

/* ------------------------------- Démarrage ------------------------------- */
const authScreen = $("#auth-screen");
const authError = $("#auth-error");
const appHeader = document.getElementById("app-header");

function showAuthScreen(msg){
  appHeader.classList.add("hidden");
  app.innerHTML = "";
  authScreen.classList.remove("hidden");
  if(msg){ authError.textContent = msg; authError.classList.remove("hidden"); }
  else{ authError.classList.add("hidden"); authError.textContent = ""; }
}
function hideAuthScreen(){
  authScreen.classList.add("hidden");
  appHeader.classList.remove("hidden");
}

/* Rôle de l'utilisateur connecté : "gm" (accès complet) ou "player" (lecture seule, carnet de route uniquement).
   Valeur par défaut prudente tant que non déterminé : on ne considère jamais quelqu'un "gm" par erreur. */
let myRole = "player";
async function fetchMyRole(){
  try{
    const { data:{ user } } = await sb.auth.getUser();
    if(!user) return "player";
    const { data, error } = await sb.from("profiles").select("role").eq("id", user.id).maybeSingle();
    if(error || !data) return "player";
    return data.role==="gm" ? "gm" : "player";
  }catch(e){ console.error(e); return "player"; }
}

/* Mode aperçu joueur global (bouton dans le header) : simulation d'affichage pour le MJ, ne change
   jamais le vrai rôle de session/Supabase — myRole reste "gm", seul l'AFFICHAGE bascule. Tout le
   reste du code (rendu de listes/détails, boutons créer/éditer, filtres de contenu comme la carte
   de donjon active ou les entrées de carnet de route visibles) teste déjà le rôle exclusivement via
   des comparaisons "gm"/"player" — en centralisant ces comparaisons sur effectiveRole() plutôt que
   sur myRole directement, ce même mode aperçu couvre automatiquement TOUS ces endroits d'un coup,
   sans avoir à dupliquer la logique de filtrage à la main pour chaque onglet. Voir togglePlayerPreview(). */
let previewAsPlayer = false;
function effectiveRole(){ return previewAsPlayer ? "player" : myRole; }

/* Cache les onglets et actions réservés au MJ pour un compte joueur */
function applyRoleUI(){
  document.querySelectorAll("#tabs button[data-tab]").forEach(b=>{
    b.classList.toggle("hidden", effectiveRole()!=="gm" && !PLAYER_VISIBLE_TABS.includes(b.dataset.tab));
  });
  const exp = document.getElementById("btn-export"), imp = document.getElementById("btn-import"), bl = document.getElementById("btn-broken-links");
  if(exp) exp.classList.toggle("hidden", effectiveRole()!=="gm");
  if(imp) imp.classList.toggle("hidden", effectiveRole()!=="gm");
  if(bl) bl.classList.toggle("hidden", effectiveRole()!=="gm");
  const searchWrap = document.getElementById("search-wrap");
  if(searchWrap) searchWrap.classList.toggle("hidden", effectiveRole()!=="gm");
  // Le bouton d'aperçu lui-même doit rester visible pour le vrai MJ même PENDANT l'aperçu (pour
  // pouvoir en sortir) — il teste donc le vrai myRole, jamais effectiveRole().
  const pbtn = document.getElementById("btn-player-preview");
  if(pbtn){ pbtn.classList.toggle("hidden", myRole!=="gm"); pbtn.classList.toggle("active-mode", previewAsPlayer); }
  // Filtre "mes créations" : outil de curation MJ, comme export/import/liens — masqué en mode
  // aperçu joueur (contrairement au bouton d'aperçu lui-même), pas de raison de le garder visible
  // en simulant ce que voit un joueur.
  const gcbtn = document.getElementById("btn-gm-created-filter");
  if(gcbtn){ gcbtn.classList.toggle("hidden", effectiveRole()!=="gm"); gcbtn.classList.toggle("active-mode", gmCreatedOnly); }
}

/* Bascule le mode aperçu joueur global : simulation d'affichage uniquement, ne touche jamais à
   myRole ni à la session Supabase. Ne change JAMAIS d'onglet — que ce soit à l'activation ou à la
   désactivation — pour un aller-retour instantané (Tristan a signalé qu'un saut automatique vers
   "Carnet de route" à chaque activation était pénible : il fallait ensuite renaviguer manuellement
   vers l'onglet sur lequel il travaillait). Deux garde-fous seulement, gérés ailleurs :
   - un onglet réservé au MJ (hors PLAYER_VISIBLE_TABS) affiche un état "non visible aux joueurs" à
     la place de son contenu réel pendant l'aperçu, sans jamais rediriger vers un autre onglet
     (voir la garde dans render()) ;
   - un formulaire de création/édition en cours ne doit jamais être exposé tel quel en aperçu (les
     données non enregistrées seraient de toute façon perdues au premier re-rendu) : on retombe sur
     la liste du MÊME onglet, dans un sens comme dans l'autre. */
function togglePlayerPreview(){
  if(myRole!=="gm") return; // jamais utilisable par un vrai compte joueur, même en théorie
  previewAsPlayer = !previewAsPlayer;
  if(view.mode==="edit" || view.mode==="new") view = { tab:view.tab, mode:"list", id:null };
  applyRoleUI();
  const banner = document.getElementById("preview-banner");
  if(banner) banner.classList.toggle("hidden", !previewAsPlayer);
  document.body.classList.toggle("preview-active", previewAsPlayer);
  syncPreviewBannerHeight();
  render();
}
/* Cale --preview-banner-h sur la hauteur réellement rendue du bandeau (le texte peut passer sur
   deux lignes sur un écran étroit) — sert au décalage du header en CSS (voir ci-dessus). Appelé au
   basculement du mode et au redimensionnement de la fenêtre tant qu'il reste actif (rotation d'un
   téléphone, par ex.). */
function syncPreviewBannerHeight(){
  const banner = document.getElementById("preview-banner");
  if(!banner || banner.classList.contains("hidden")) return;
  document.documentElement.style.setProperty("--preview-banner-h", banner.getBoundingClientRect().height+"px");
}
window.addEventListener("resize", ()=>{ if(previewAsPlayer) syncPreviewBannerHeight(); });
window.addEventListener("orientationchange", ()=>{ if(previewAsPlayer) setTimeout(syncPreviewBannerHeight, 50); });

async function startApp(){
  hideAuthScreen();
  app.innerHTML = `<div class="empty"><span class="big">⏳</span>Chargement de la campagne…</div>`;
  try{
    myRole = await fetchMyRole();
    db = await fetchRemoteDB();
    loadPortraitsManifest(); // en parallèle, pas bloquant
    if(effectiveRole()==="gm" && countItems(db)===0){
      const legacy = loadLegacyLocalDB();
      if(legacy && countItems(legacy)>0){
        db = legacy;
        await saveDB();
        toast(`Données locales migrées vers la base de données (${countItems(db)} élément(s)).`);
      } else {
        seedIfEmpty();
      }
    }
    if(effectiveRole()==="gm"){
      const { added, categorized } = seedShadowdarkDefaultTables();
      if(added>0 || categorized>0){
        await saveDB();
        const parts = [];
        if(added>0) parts.push(`${added} table(s) aléatoire(s) du livre de base ajoutée(s)`);
        if(categorized>0) parts.push(`${categorized} catégorisée(s)`);
        toast(parts.join(" · ")+".");
      }
    }
  }catch(e){
    console.error(e);
    app.innerHTML = `<div class="empty"><span class="big">⚠</span>Impossible de charger les données depuis la base. Vérifiez votre connexion, puis rechargez la page.</div>`;
    return;
  }
  applyRoleUI();
  if(effectiveRole()!=="gm") view = { tab:"sessions", mode:"list", id:null };
  render();
}

async function initApp(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await startApp(); }
  else{ showAuthScreen(); }
}

$("#auth-submit").addEventListener("click", async ()=>{
  const email = $("#auth-email").value.trim();
  const password = $("#auth-password").value;
  if(!email || !password){ authError.textContent = "Email et mot de passe requis."; authError.classList.remove("hidden"); return; }
  const btn = $("#auth-submit");
  btn.disabled = true; btn.textContent = "Connexion…";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = "✓ Se connecter";
  if(error){ authError.textContent = "Connexion impossible : "+error.message; authError.classList.remove("hidden"); return; }
  await startApp();
});
$("#auth-password").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#auth-submit").click(); });
document.getElementById("btn-logout").addEventListener("click", async ()=>{ await sb.auth.signOut(); location.reload(); });
document.getElementById("btn-player-preview").addEventListener("click", togglePlayerPreview);
document.getElementById("btn-exit-preview").addEventListener("click", togglePlayerPreview);
document.getElementById("btn-gm-created-filter").addEventListener("click", ()=>{
  // render() (pas renderList() directement) : respecte le mode courant (liste/détail/formulaire)
  // plutôt que de forcer une navigation — même principe que togglePlayerPreview(), jamais de saut
  // de vue imposé par un simple bouton de filtre.
  gmCreatedOnly = !gmCreatedOnly;
  applyRoleUI();
  render();
});

// Marge d'onglets repliable (tapoter pour ouvrir/fermer)
// Desktop/tablette (≥641px) : colonne fixe, ouverte par défaut, état mémorisé.
// Mobile (≤640px) : tiroir par-dessus le contenu, fermé par défaut, jamais mémorisé.
const NAV_COLLAPSED_KEY = "sdcodex_nav_collapsed";
const navMobileQuery = window.matchMedia("(max-width:640px)");
if(!navMobileQuery.matches && localStorage.getItem(NAV_COLLAPSED_KEY)==="1") document.body.classList.add("nav-collapsed");
document.getElementById("btn-nav-toggle").addEventListener("click", ()=>{
  if(navMobileQuery.matches){
    document.body.classList.toggle("nav-mobile-open");
  } else {
    const collapsed = document.body.classList.toggle("nav-collapsed");
    localStorage.setItem(NAV_COLLAPSED_KEY, collapsed ? "1" : "0");
  }
});
document.getElementById("nav-backdrop").addEventListener("click", ()=>{
  document.body.classList.remove("nav-mobile-open");
});

(function(){
  const field = document.getElementById("starfield");
  const n = 70;
  for(let i=0;i<n;i++){
    const s = document.createElement("span");
    s.className = "star";
    const size = (Math.random()*1.6+0.6).toFixed(2);
    s.style.width = size+"px"; s.style.height = size+"px";
    s.style.left = (Math.random()*100).toFixed(2)+"%";
    s.style.top = (Math.random()*100).toFixed(2)+"%";
    s.style.setProperty("--lo", (Math.random()*.25+.05).toFixed(2));
    s.style.setProperty("--hi", (Math.random()*.4+.55).toFixed(2));
    s.style.animationDuration = (Math.random()*4+2).toFixed(2)+"s";
    s.style.animationDelay = (Math.random()*6).toFixed(2)+"s";
    field.appendChild(s);
  }
})();
initApp();
</script>
