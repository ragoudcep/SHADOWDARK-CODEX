<body>

<style>
  :root{
    --bg:#080809; --bg2:#0f0f10; --panel:#161516; --panel2:#1d1c1e;
    --border:#2c2a2c; --border2:#403d40;
    --text:#e4e1da; --muted:#9c9698; --faint:#655f62;
    --gold:#c1913f; --gold2:#e0b968; --blood:#7c2a35; --blood2:#a8474f;
    --violet:#7a6690; --violet2:#a08fb5;
    --link:#9c9fdb; --link-bad:#b6636b; --green:#6fae6a;
    --radius:10px; --shadow:0 8px 28px rgba(0,0,0,.55);
    --font: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --display: "IM Fell English SC", var(--font);
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --blackletter: "JSL Blackletter", var(--font);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    position:relative;
    background:
      radial-gradient(1000px 550px at 50% -8%, #201530 0%, transparent 58%),
      radial-gradient(900px 500px at 92% 6%, #180f22 0%, transparent 55%),
      radial-gradient(1100px 700px at -8% 100%, #0d0a14 0%, transparent 60%),
      radial-gradient(1500px 950px at 50% 45%, transparent 45%, rgba(0,0,0,.65) 100%),
      linear-gradient(160deg, #140c1f 0%, #0a0710 55%, #060508 100%);
    color:var(--text); font-family:var(--font); line-height:1.5;
    min-height:100vh;
  }
  #starfield{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
  #starfield .star{position:absolute; border-radius:50%; background:#fff; animation-name:star-twinkle; animation-timing-function:ease-in-out; animation-iteration-count:infinite}
  @keyframes star-twinkle{ 0%,100%{opacity:var(--lo)} 50%{opacity:var(--hi)} }
  a{color:var(--link); text-decoration:none}
  a:hover{color:var(--violet2); text-decoration:underline}
  button{font-family:var(--ui); cursor:pointer}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg, #0c0c0d 0%, #0c0c0df5 100%);
    border-bottom:1px solid var(--border);
    box-shadow:0 1px 0 rgba(193,145,63,.18);
    backdrop-filter:blur(6px);
  }
  .bar{
    max-width:1100px; margin:0 auto; padding:.7rem 1rem;
    display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:.6rem; font-weight:400; letter-spacing:.5px; font-family:var(--display)}
  .brand>span:not(.rune){font-size:1.35rem; text-transform:uppercase; letter-spacing:1px}
  .brand .rune{
    font-size:1.4rem; color:var(--gold2);
    filter:drop-shadow(0 0 9px rgba(193,145,63,.5));
  }
  .brand small{display:block; font-size:.62rem; color:var(--faint); font-family:var(--ui); letter-spacing:2.5px; text-transform:uppercase; font-weight:600}
  .search{position:relative; flex:1 1 260px; min-width:180px}
  .search input{
    width:100%; padding:.55rem .8rem; border-radius:20px;
    background:var(--panel); border:1px solid var(--border2); color:var(--text);
    font-family:var(--ui); font-size:.9rem; outline:none;
  }
  .search input:focus{border-color:var(--gold)}
  .search .mag{position:absolute; left:.75rem; top:50%; transform:translateY(-50%); color:var(--faint)}
  .search-results{
    position:absolute; top:110%; left:0; right:0; background:var(--panel2);
    border:1px solid var(--border2); border-radius:var(--radius); box-shadow:var(--shadow);
    max-height:60vh; overflow:auto; z-index:60; display:none;
  }
  .search-results.open{display:block}
  .sr-item{padding:.5rem .8rem; border-bottom:1px solid var(--border); cursor:pointer; font-family:var(--ui); font-size:.88rem}
  .sr-item:last-child{border-bottom:none}
  .sr-item:hover{background:var(--panel)}
  .sr-item .tag{font-size:.65rem}
  .sr-empty{padding:.8rem; color:var(--faint); font-family:var(--ui); font-size:.85rem}
  .hbtns{display:flex; gap:.4rem}
  .icon-btn{
    background:var(--panel); border:1px solid var(--border2); color:var(--muted);
    border-radius:8px; padding:.45rem .6rem; font-size:.8rem;
  }
  .icon-btn:hover{color:var(--gold2); border-color:var(--gold)}

  /* ---------- Tabs ---------- */
  nav.tabs{max-width:1100px; margin:0 auto; padding:0 1rem; display:flex; gap:.15rem; overflow-x:auto;
    scrollbar-width:thin; scrollbar-color:var(--border2) transparent}
  nav.tabs::-webkit-scrollbar{height:6px}
  nav.tabs::-webkit-scrollbar-track{background:transparent}
  nav.tabs::-webkit-scrollbar-thumb{background:var(--border2); border-radius:4px}
  nav.tabs::-webkit-scrollbar-thumb:hover{background:var(--gold)}
  nav.tabs button{
    background:transparent; border:none; color:var(--muted); font-size:.72rem; font-weight:600;
    padding:.6rem .65rem; border-bottom:2px solid transparent; white-space:nowrap;
    text-transform:uppercase; letter-spacing:.35px; border-right:1px solid var(--border);
  }
  nav.tabs button:last-child{border-right:none}
  nav.tabs button:hover{color:var(--text)}
  nav.tabs button.active{color:var(--gold2); border-bottom-color:var(--gold); text-shadow:0 0 10px rgba(193,145,63,.35)}

  /* ---------- Layout ---------- */
  main{max-width:1100px; margin:0 auto; padding:1.2rem 1rem 4rem; overflow-x:clip}
  .card h3, .card p, .prose, .bullets li, .sb-line, .detail h1, .group-head, table.tbl td{ overflow-wrap:anywhere; }
  .page-head{display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem; flex-wrap:wrap}
  .page-head h1{font-size:1.9rem; margin:0; color:var(--gold2); font-weight:400; font-family:var(--display); letter-spacing:.5px}
  .page-head .sub{color:var(--faint); font-family:var(--ui); font-size:.8rem}

  .btn{
    background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#241a07; border:none;
    padding:.55rem .9rem; border-radius:8px; font-weight:700; font-size:.85rem;
    box-shadow:0 2px 0 #6e4f1c, 0 3px 10px rgba(0,0,0,.35);
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--panel); color:var(--text); border:1px solid var(--border2); box-shadow:none}
  .btn.ghost:hover{border-color:var(--gold)}
  .btn.danger{background:var(--panel); color:var(--blood2); border:1px solid #5a2f2f; box-shadow:none}
  .btn.danger:hover{background:#2a1a1a}
  .btn.sm{padding:.35rem .6rem; font-size:.75rem}

  /* ---------- Cards grid ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:.9rem}
  .card{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--border); border-radius:var(--radius); padding:1rem;
    cursor:pointer; transition:border-color .15s, transform .1s;
    position:relative; overflow:hidden;
  }
  .card:hover{border-color:var(--gold); transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,.5), 0 0 0 1px rgba(193,145,63,.18)}
  .card h3{margin:.1rem 0 .35rem; font-size:1.08rem; color:var(--text)}
  .card p{margin:0; color:var(--muted); font-family:var(--ui); font-size:.82rem;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
  .card .meta{margin-top:.6rem; display:flex; gap:.4rem; flex-wrap:wrap}
  .tag{
    font-family:var(--ui); font-size:.68rem; font-weight:700; letter-spacing:.4px;
    padding:.15rem .5rem; border-radius:20px; text-transform:uppercase;
    background:var(--panel); border:1px solid var(--border2); color:var(--muted);
  }
  .tag.creature{color:#ff9d68; border-color:#8a4a2c; background:rgba(255,157,104,.13)}
  .tag.event{color:#c9a3f7; border-color:#6a4a8f; background:rgba(201,163,247,.13)}
  .tag.table{color:#5fe6d8; border-color:#2e7a70; background:rgba(95,230,216,.12)}
  .tag.session{color:#9fc4ff; border-color:#3e5c9e; background:rgba(159,196,255,.13)}
  .tag.spell{color:#9db4ff; border-color:#3c4a8a; background:rgba(157,180,255,.13)}
  .tag.priest{color:#ffe9b8; border-color:#8a7a3a; background:rgba(255,233,184,.13)}
  .tag.wizard{color:#c9a3f7; border-color:#6a4a8f; background:rgba(201,163,247,.13)}
  .tag.seer{color:#a8d8b9; border-color:#3a6a4a; background:rgba(168,216,185,.13)}
  .tag.witch{color:#f0a8a3; border-color:#8a3a3a; background:rgba(240,168,163,.13)}
  .tag.chaos{color:#ff6b6b; border-color:#8f3a3a; background:rgba(255,107,107,.13)}
  .tag.loyal{color:#6fe06a; border-color:#3a7a37; background:rgba(111,224,106,.13)}
  .tag.neutre{color:var(--muted)}
  .tag.gold{color:#ffcf6e; border-color:#8a6a2a; background:rgba(255,207,110,.13)}

  .group-head{font-family:var(--display); font-size:1.25rem; color:var(--gold2); font-weight:400; letter-spacing:.3px;
    margin:.2rem 0 .8rem; padding-bottom:.4rem; border-bottom:1px solid var(--border); cursor:pointer;
    display:flex; align-items:center; gap:.5rem; user-select:none}
  .group-head:hover{color:var(--gold)}
  .group-head .grp-arrow{margin-left:auto; font-size:.8rem; transition:transform .15s; color:var(--faint)}
  .group-head.collapsed .grp-arrow{transform:rotate(-90deg)}
  .group-body.collapsed{display:none}
  .group-head .faint{font-weight:400; font-size:.82rem; color:var(--muted); opacity:.85}

  .empty{
    text-align:center; padding:3rem 1rem; color:var(--faint); font-family:var(--ui);
    border:1px dashed var(--border2); border-radius:var(--radius);
  }
  .empty .big{font-size:2.4rem; display:block; margin-bottom:.5rem; opacity:.6}

  /* ---------- Detail ---------- */
  .detail{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--border);
    border-radius:var(--radius); padding:1.4rem; box-shadow:var(--shadow)}
  .back{background:none; border:none; color:var(--muted); font-family:var(--ui); font-size:.85rem; padding:.2rem 0; margin-bottom:.8rem}
  .back:hover{color:var(--gold2)}
  .detail h1{margin:.1rem 0 .2rem; color:var(--gold2); font-family:var(--display); font-size:2rem; font-weight:700; letter-spacing:.5px; text-transform:uppercase}
  .detail .actions-row{display:flex; gap:.5rem; margin:1rem 0; flex-wrap:wrap; align-items:center}
  .detail .actions{display:flex; gap:.5rem; flex-wrap:wrap}
  body.reading-mode .actions{display:none}
  body.reading-mode .detail{font-size:1.18em; max-width:760px; margin:0 auto}
  body.reading-mode .detail h1{font-size:2.6rem}
  body.reading-mode .reading-toggle{background:var(--gold); color:#241a07; border-color:var(--gold)}
  .section{margin-top:1.3rem}
  .section > h2{
    font-size:.8rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--gold);
    font-family:var(--ui); font-weight:700; margin:0 0 .5rem; padding-bottom:.35rem;
    border-bottom:1px solid var(--border); display:flex; align-items:center; gap:.5rem;
  }
  .section > h2::after{content:""; flex:1 1 auto; height:1px; background:linear-gradient(90deg,var(--border2),transparent)}
  .bullets{margin:0; padding-left:1.2rem}
  .bullets li{margin:.25rem 0}
  .prose{white-space:pre-wrap}
  .muted{color:var(--muted)}
  .faint{color:var(--faint)}

  /* stat block */
  .statblock{border:1px solid var(--border2); border-radius:var(--radius); padding:1rem; background:#150f1c;
    background-image:linear-gradient(180deg, rgba(193,145,63,.07), transparent 30%);
    box-shadow:inset 0 0 0 1px rgba(193,145,63,.08)}
  .sb-top{display:flex; gap:1rem; flex-wrap:wrap; align-items:baseline}
  .sb-line{display:flex; gap:1.5rem; flex-wrap:wrap; margin:.6rem 0; font-family:var(--ui); font-size:.9rem}
  .sb-line b{color:var(--gold2)}
  .abilities-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:.4rem; margin:.8rem 0; text-align:center}
  .ab{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:.4rem .2rem}
  .ab .n{font-family:var(--ui); font-size:.62rem; letter-spacing:1px; color:var(--faint); text-transform:uppercase}
  .ab .v{font-size:1.2rem; font-weight:700; color:var(--text)}
  .attack-row{padding:.4rem 0; border-top:1px dashed var(--border); font-family:var(--ui); font-size:.88rem}
  .attack-row:first-child{border-top:none}
  hr.rule{border:none; border-top:1px solid var(--border); margin:.8rem 0}

  /* backlinks */
  .backlinks{margin-top:1.4rem; padding-top:1rem; border-top:1px solid var(--border)}
  .backlinks h2{font-size:.8rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--gold); font-family:var(--ui)}
  .bl-group{margin:.6rem 0}
  .bl-group .lbl{font-family:var(--ui); font-size:.72rem; color:var(--faint); text-transform:uppercase; letter-spacing:1px}
  .bl-chip{display:inline-block; margin:.25rem .3rem .1rem 0; padding:.3rem .6rem; border-radius:8px;
    background:var(--panel); border:1px solid var(--border2); font-family:var(--ui); font-size:.83rem; cursor:pointer}
  .bl-chip:hover{border-color:var(--gold)}

  /* wiki links in prose */
  a.wl{color:var(--link); border-bottom:1px dotted var(--link); cursor:pointer}
  a.wl.bad{color:var(--link-bad); border-bottom-style:dashed}
  a.wl.creature{color:#e39b7b; border-color:#e39b7b}
  a.wl.event{color:var(--violet2); border-color:var(--violet2)}
  a.wl.table{color:#7fc9c1; border-color:#7fc9c1}
  a.wl.session{color:#9db4e0; border-color:#9db4e0}

  /* ---------- Forms ---------- */
  .form{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--border);
    border-radius:var(--radius); padding:1.4rem; box-shadow:var(--shadow)}
  .form h1{margin-top:0; color:var(--gold2); font-family:var(--display); font-weight:400; font-size:1.7rem}
  .field{margin-bottom:1rem}
  .field label{display:block; font-family:var(--ui); font-size:.78rem; font-weight:600; letter-spacing:.5px;
    color:var(--muted); margin-bottom:.35rem; text-transform:uppercase}
  .field .hint{font-weight:400; text-transform:none; color:var(--faint); letter-spacing:0}
  input[type=text], input[type=number], input[type=date], input[type=email], input[type=password], textarea, select{
    width:100%; padding:.6rem .7rem; background:var(--bg2); border:1px solid var(--border2);
    border-radius:8px; color:var(--text); font-family:var(--ui); font-size:.9rem; outline:none;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--gold)}
  textarea{resize:vertical; min-height:90px; line-height:1.5}
  .row{display:flex; gap:.8rem; flex-wrap:wrap}
  .row > .field{flex:1 1 120px; margin-bottom:0}
  .subgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(80px,1fr)); gap:.6rem}
  .repeat-item{background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:.7rem; margin-bottom:.6rem}
  .repeat-item .rrow{display:flex; gap:.5rem; flex-wrap:wrap; align-items:flex-end}
  .form-actions{display:flex; gap:.6rem; margin-top:1.4rem; flex-wrap:wrap}
  .link-help{font-family:var(--ui); font-size:.75rem; color:var(--faint); background:var(--bg2);
    border:1px solid var(--border); border-radius:8px; padding:.5rem .7rem; margin-top:.4rem}
  .link-help code{color:var(--gold2); font-family:ui-monospace,monospace}

  /* dice result */
  .roll-result{margin:.6rem 0; font-family:var(--ui); color:var(--gold2); font-weight:700}
  tr.rolled{background:rgba(216,162,74,.14)}
  table.tbl{width:100%; border-collapse:collapse; font-family:var(--ui); font-size:.9rem}
  table.tbl th, table.tbl td{padding:.5rem .6rem; text-align:left; border-bottom:1px solid var(--border); vertical-align:top}
  table.tbl th{color:var(--gold); font-size:.72rem; text-transform:uppercase; letter-spacing:1px}
  table.tbl td.idx{width:2.5rem; color:var(--faint); font-variant-numeric:tabular-nums; text-align:right}

  /* images */
  .tag.npc{color:#ffd98f; border-color:#8a6a2a; background:rgba(255,217,143,.13)}
  a.wl.npc{color:#ffd98f; border-color:#ffd98f}
  .tag.pointcrawl{color:#6fd0f5; border-color:#2a6a8a; background:rgba(111,208,245,.13)}
  a.wl.pointcrawl{color:#6fd0f5; border-color:#6fd0f5}
  .tag.pc{color:#7ef096; border-color:#2f7a45; background:rgba(126,240,150,.13)}
  a.wl.pc{color:#7ef096; border-color:#7ef096}
  .tag.trouvaille{color:#b8d8a8; border-color:#4a6a3a; background:rgba(184,216,168,.12)}
  .tag.relique{color:#c9a3f7; border-color:#6a4a8f; background:rgba(201,163,247,.13)}
  .tag.regalia{color:#ffcf6e; border-color:#8a6a2a; background:rgba(255,207,110,.13)}
  a.wl.treasure{color:#e0c06a; border-color:#e0c06a}

  /* point crawl */
  .crawl-toolbar{display:flex; gap:.5rem; flex-wrap:wrap; margin:.6rem 0 .2rem}
  .btn.ghost.active-mode{background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#2a1e08; border-color:var(--gold)}
  .crawl-help{font-family:var(--ui); font-size:.78rem; color:var(--faint); margin:.2rem 0 .7rem; line-height:1.4}
  .crawl-map-scroll{overflow:auto; border:1px solid var(--border2); border-radius:var(--radius); max-height:66vh;
    background:radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1px) 0 0/24px 24px, var(--bg2)}
  .crawl-canvas{position:relative; width:1400px; height:900px}
  #hex-svg{ width:100%; height:auto; display:block; min-width:900px; }
  .hexcell polygon{ stroke:#1a1510; stroke-width:1; }
  .hex-editable{ cursor:pointer; }
  .hex-editable:hover polygon:first-child{ filter:brightness(1.3); }
  .hex-editable:hover .hex-biome-img, .hex-editable:hover .hex-overlay-img{ filter:brightness(1.15); }
  .hex-placing .hex-editable, .hex-painting-biome .hex-editable, .hex-painting-overlay .hex-editable{ cursor:crosshair; }
  .hex-icon{ font-size:14px; pointer-events:none; user-select:none; }
  .hex-biome-img, .hex-overlay-img{ pointer-events:none; }
  .overlay-picker{ display:flex; flex-wrap:wrap; gap:.4rem; margin:.3rem 0 .6rem; max-height:230px; overflow-y:auto;
    padding:.6rem; background:var(--bg2); border:1px solid var(--border2); border-radius:8px; }
  .overlay-pick{ width:60px; height:52px; background:#1a1510; border:1px solid #3a3226; border-radius:4px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:2px; color:var(--muted); font-weight:800; font-size:1.1rem; }
  .overlay-pick img{ width:100%; height:100%; object-fit:contain; }
  .overlay-pick:hover{ border-color:var(--gold); }
  .overlay-pick.active{ border-color:var(--gold2); background:#2a2116; }
  .biome-picker .overlay-pick{ width:72px; height:62px; }
  .hex-fog{ fill:#0c0a08; }
  .hex-fog-gm{ fill:#0c0a08; opacity:.55; pointer-events:none; }
  .hexpoint{ cursor:pointer; }
  .hexpoint:hover .hexpoint-icon-svg, .hexpoint:hover .hexpoint-icon{ filter:brightness(1.35); }
  .hexpoint-icon{ fill:#e0453a; font-weight:800; font-family:var(--ui); pointer-events:none; user-select:none; transition:filter .15s; }
  .hexpoint-icon-svg{ fill:#e0453a; color:#e0453a; pointer-events:none; transition:filter .15s; }
  .hexpoint-ring{ fill:none; stroke:#8a8a8a; stroke-width:1.3; stroke-dasharray:2 1.5; pointer-events:none; }
  .icon-picker{ display:grid; grid-template-columns:repeat(7,1fr); gap:.35rem; margin-top:.3rem; }
  .icon-pick{ aspect-ratio:1; background:#1a1510; border:1px solid #3a3226; border-radius:4px; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:.3rem; font-family:var(--ui); font-weight:800; }
  .icon-pick svg{ width:100%; height:100%; fill:currentColor; }
  .icon-pick:hover{ border-color:var(--gold); color:var(--gold); }
  .icon-pick.active{ border-color:var(--gold2); color:var(--gold2); background:#2a2116; }
  .crawl-canvas > svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
  .crawl-canvas > svg line{stroke:var(--border2); stroke-width:3; pointer-events:stroke; cursor:pointer}
  .crawl-canvas > svg line:hover{stroke:var(--gold)}
  .crawl-canvas > svg text{fill:var(--muted); font-family:var(--ui); font-size:12px; pointer-events:none; paint-order:stroke; stroke:var(--bg2); stroke-width:4px}
  .crawl-node{position:absolute; min-width:96px; max-width:180px; background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--border2); border-radius:10px; padding:.5rem .6rem; cursor:grab; user-select:none;
    font-family:var(--ui); font-size:.83rem; box-shadow:0 3px 10px rgba(0,0,0,.45); touch-action:none; z-index:1}
  .crawl-node:hover{border-color:var(--gold)}
  .crawl-node:active{cursor:grabbing}
  .crawl-node.linkmode{cursor:pointer}
  .crawl-node.linkfrom{border-color:var(--gold2); box-shadow:0 0 0 2px var(--gold), 0 3px 10px rgba(0,0,0,.45)}
  .crawl-node.missing{opacity:.65; border-style:dashed}
  .crawl-node .nt{display:inline-flex; align-items:center; justify-content:center; width:1.5em; height:1.5em; flex:0 0 auto;
    border-radius:50%; background:var(--gold); color:#2a1e08; font-weight:700; font-size:.75rem; margin-right:.4rem; vertical-align:middle}

  /* initiative — timeline de combat verticale (mobile d'abord) */
  .init-group-label{font-family:var(--ui); font-size:.72rem; text-transform:uppercase; letter-spacing:.6px;
    color:var(--faint); margin:1.1rem 0 .5rem}
  .init-group-label:first-of-type{margin-top:0}
  .init-track{display:flex; flex-direction:column; gap:.5rem}
  .init-card{display:flex; align-items:center; gap:.7rem; flex-wrap:wrap;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--border); border-radius:var(--radius); padding:.55rem .7rem}
  .init-rank{flex:0 0 auto; width:1.8rem; text-align:center; font-family:var(--display); font-size:1.1rem; color:var(--gold2)}
  .init-portrait{flex:0 0 auto; width:44px; height:44px; border-radius:8px; object-fit:cover; border:1px solid var(--border2)}
  .init-portrait-fallback{display:flex; align-items:center; justify-content:center; font-size:1.3rem; background:var(--bg2); color:var(--faint)}
  .init-body{flex:1 1 120px; min-width:0}
  .init-name{font-family:var(--ui); font-weight:700; font-size:.92rem; color:var(--text); overflow-wrap:anywhere}
  .init-sub{font-family:var(--ui); font-size:.74rem; color:var(--muted)}
  .init-value{flex:0 0 auto; min-width:2.2rem; text-align:center; font-family:var(--display); font-size:1.3rem; color:var(--gold2)}
  .init-value.empty{color:var(--faint); font-size:1rem}
  .init-controls{flex:0 0 auto; display:flex; align-items:center; gap:.3rem}
  input.init-manual-input{width:3.6rem; padding:.3rem .4rem; font-size:.82rem; text-align:center}
  @media (max-width:640px){
    .init-controls{width:100%; justify-content:flex-end; margin-top:.3rem}
  }

  /* modal */
  #modal{position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; align-items:center; justify-content:center; z-index:150; padding:1rem}
  #modal .modal-box{background:var(--panel2); border:1px solid var(--border2); border-radius:var(--radius);
    box-shadow:var(--shadow); max-width:580px; width:100%; max-height:86vh; overflow:auto; padding:1.3rem}
  .modal-list{max-height:52vh; overflow:auto; margin-top:.6rem}
  .modal-list .mli{padding:.55rem .7rem; border:1px solid var(--border); border-radius:8px; margin-bottom:.4rem; cursor:pointer; font-family:var(--ui); font-size:.88rem}
  .modal-list .mli:hover{border-color:var(--gold); background:var(--panel)}

  /* roue — roue de la fortune (bonus à gagner), SVG pur + easter egg cadeau/confettis */
  .wheel-stage{display:flex; flex-direction:column; align-items:center; gap:1.1rem; padding:1.2rem 0 2rem}
  .wheel-frame{position:relative; width:min(78vw,340px); aspect-ratio:1/1}
  .wheel-pointer{position:absolute; top:-14px; left:50%; transform:translateX(-50%); width:0; height:0;
    border-left:14px solid transparent; border-right:14px solid transparent; border-top:22px solid var(--gold2);
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.6)); z-index:2}
  .wheel-hub{position:absolute; top:50%; left:50%; width:15%; height:15%; transform:translate(-50%,-50%);
    border-radius:50%; background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold) 60%,#7a5a22 100%);
    border:2px solid var(--border2); box-shadow:0 2px 8px rgba(0,0,0,.6); z-index:2}
  .wheel-rotor{display:block; width:100%; height:100%; filter:drop-shadow(0 6px 18px rgba(0,0,0,.55));
    transform:rotate(0deg); transition:transform 5400ms cubic-bezier(.12,.67,.1,1)} /* durée = WHEEL_SPIN_MS en JS, à garder synchronisée */
  .wheel-rotor path{stroke:var(--bg); stroke-width:2}
  .wheel-rotor text{fill:#f3ead9; stroke:rgba(0,0,0,.6); stroke-width:3px; paint-order:stroke fill;
    font-family:var(--ui); font-weight:600}
  .wheel-spin-btn{font-size:1.02rem; padding:.7rem 1.7rem}
  .wheel-spin-btn:disabled{opacity:.55; cursor:default; filter:grayscale(.4)}
  .wheel-empty-hint{max-width:420px; text-align:center}

  .wheel-seg-item .rrow{align-items:center}
  .wheel-seg-hint{font-family:var(--ui); font-size:.78rem; color:var(--faint); margin:-.2rem 0 .8rem}

  /* révélation du résultat : boîte cadeau qui s'ouvre + confettis + bannière */
  #wheel-reward{position:fixed; inset:0; z-index:200; background:rgba(5,3,8,.82); display:flex;
    align-items:center; justify-content:center; padding:1rem; overflow:hidden}
  #wheel-reward.hidden{display:none}
  .wheel-reward-inner{position:relative; display:flex; flex-direction:column; align-items:center; gap:1.1rem; text-align:center; z-index:1}
  .gift-box{position:relative; width:120px; height:96px; margin-top:.5rem}
  .gift-box .gift-base{position:absolute; left:0; bottom:0; width:100%; height:70px; border-radius:6px 6px 3px 3px;
    background:linear-gradient(160deg,var(--blood2),var(--blood)); box-shadow:0 10px 22px rgba(0,0,0,.6)}
  .gift-box .gift-base::before{content:""; position:absolute; left:50%; top:0; bottom:0; width:16%; transform:translateX(-50%);
    background:var(--gold2)}
  .gift-box .gift-lid{position:absolute; left:-6px; right:-6px; top:14px; height:26px; border-radius:6px;
    background:linear-gradient(160deg,var(--gold2),var(--gold)); box-shadow:0 4px 10px rgba(0,0,0,.5); transform-origin:20% 100%}
  .gift-box .gift-lid::before{content:""; position:absolute; left:50%; top:-14px; width:22px; height:22px; transform:translateX(-50%);
    border-radius:50% 50% 0 0/60% 60% 0 0; background:var(--gold2); box-shadow:-14px 4px 0 -2px var(--gold), 14px 4px 0 -2px var(--gold)}
  @keyframes wheel-gift-shake{
    0%,100%{transform:rotate(0)} 20%{transform:rotate(-4deg)} 40%{transform:rotate(4deg)}
    60%{transform:rotate(-3deg)} 80%{transform:rotate(3deg)}
  }
  .gift-box.shake{animation:wheel-gift-shake .55s ease-in-out}
  @keyframes wheel-lid-pop{ to{ transform:translate(14px,-54px) rotate(-32deg); opacity:0 } }
  .gift-box.open .gift-lid{animation:wheel-lid-pop .5s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes wheel-burst{ 0%{opacity:0; transform:translate(-50%,-50%) scale(.2)} 40%{opacity:.9} 100%{opacity:0; transform:translate(-50%,-50%) scale(2.4)} }
  .gift-box.open::after{content:""; position:absolute; left:50%; top:20%; width:40px; height:40px; border-radius:50%;
    background:radial-gradient(circle,rgba(224,185,104,.9),transparent 70%); animation:wheel-burst .6s ease-out forwards}
  .wheel-reward-banner{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:.9rem; opacity:0; transform:translateY(8px) scale(.94);
    transition:opacity .5s ease, transform .5s cubic-bezier(.34,1.56,.64,1)}
  /* z-index:2 = garde-fou pour que le bandeau (et le bouton Fermer) restent toujours cliquables
     au-dessus des confettis, même si un navigateur gère l'empilement autrement que prévu */
  .wheel-reward-banner.show{opacity:1; transform:translateY(0) scale(1)}
  /* "Joyeux anniversaire" = point focal de l'écran de révélation, largement plus gros que le bonus gagné */
  .wheel-reward-happy{position:relative; font-family:var(--display); font-size:4.4rem; font-weight:400; letter-spacing:1px;
    line-height:1.05; background:linear-gradient(180deg,var(--gold2),var(--gold)); -webkit-background-clip:text; background-clip:text;
    color:transparent; text-shadow:0 0 30px rgba(224,185,104,.5); animation:none}
  .wheel-reward-banner.show .wheel-reward-happy{
    animation:wheel-happy-pop .7s cubic-bezier(.34,1.7,.4,1) both, wheel-happy-glow 1.7s ease-in-out .7s infinite}
  .wheel-reward-happy::after{content:""; position:absolute; left:50%; top:50%; width:150%; height:320%; z-index:-1;
    transform:translate(-50%,-50%) scale(.3); border-radius:50%;
    background:radial-gradient(circle,rgba(224,185,104,.55),transparent 65%); opacity:0}
  .wheel-reward-banner.show .wheel-reward-happy::after{animation:wheel-happy-flash .9s ease-out .05s both}
  @keyframes wheel-happy-pop{
    0%{transform:scale(.25) rotate(-6deg); opacity:0}
    55%{transform:scale(1.2) rotate(2deg); opacity:1}
    75%{transform:scale(.93) rotate(-1deg)}
    100%{transform:scale(1) rotate(0)}
  }
  @keyframes wheel-happy-glow{
    0%,100%{filter:drop-shadow(0 0 16px rgba(224,185,104,.5))}
    50%{filter:drop-shadow(0 0 34px rgba(224,185,104,.9))}
  }
  @keyframes wheel-happy-flash{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.2)}
    35%{opacity:.9}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1.6)}
  }
  /* le bonus gagné reste sous le gros titre "Joyeux anniversaire", mais doit rester bien lisible
     (demande explicite : nettement plus gros que l'ancien .92rem) */
  .wheel-reward-prize{font-family:var(--ui); font-size:1.55rem; font-weight:600; color:var(--gold2); max-width:420px;
    background:var(--panel2); border:1px solid var(--gold); border-radius:var(--radius); padding:.8rem 1.2rem; line-height:1.3}
  @media (max-width:640px){ .wheel-reward-prize{font-size:1.2rem; max-width:90vw} }
  .confetti-layer{position:absolute; inset:-10% -5% auto -5%; height:0; pointer-events:none}
  .confetti-piece{position:absolute; top:-5vh; width:8px; height:14px; opacity:0; animation:wheel-confetti-fall linear forwards}
  @keyframes wheel-confetti-fall{
    0%{opacity:1; transform:translateY(0) rotate(0deg)}
    100%{opacity:0; transform:translateY(100vh) rotate(540deg)}
  }
  @media (max-width:640px){ .wheel-reward-happy{font-size:2.7rem} }

  /* autocomplétion des liens [[…]] */
  #ac-pop{position:fixed; z-index:300; background:var(--panel2); border:2px solid var(--gold); border-radius:8px;
    box-shadow:0 0 0 3px rgba(193,145,63,.18), var(--shadow); min-width:230px; max-width:340px; max-height:270px; overflow:auto; display:none; font-family:var(--ui)}
  #ac-pop.open{display:block}
  #ac-pop .ac-title{padding:.4rem .6rem; font-size:.68rem; text-transform:uppercase; letter-spacing:.6px; color:var(--gold2); border-bottom:1px solid var(--border); background:rgba(193,145,63,.08)}
  #ac-pop .aci{padding:.55rem .6rem; cursor:pointer; font-size:.92rem; display:flex; align-items:center; gap:.5rem; border-bottom:1px solid var(--border)}
  #ac-pop .aci:last-of-type{border-bottom:none}
  #ac-pop .aci.sel, #ac-pop .aci:hover{background:var(--panel)}
  #ac-pop .aci .nm{color:var(--text)}
  #ac-pop .ac-empty{padding:.55rem .6rem; color:var(--faint); font-size:.82rem}
  #ac-pop .ac-hint{padding:.35rem .6rem; font-size:.68rem; color:var(--faint); border-top:1px solid var(--border); position:sticky; bottom:0; background:var(--panel2)}
  .card .thumb{width:calc(100% + 2rem); height:130px; object-fit:cover; object-position:center 15%; margin:-1rem -1rem .7rem; display:block; border-bottom:1px solid var(--border)}
  .gallery{display:flex; flex-wrap:wrap; gap:.6rem; margin-top:.3rem}
  .gallery .gimg{width:120px; height:120px; object-fit:cover; border-radius:8px; border:1px solid var(--border2); cursor:zoom-in; transition:transform .1s}
  .gallery .gimg:hover{transform:scale(1.04); border-color:var(--gold)}
  .img-thumb{position:relative; display:inline-block; margin:.3rem .3rem 0 0}
  .img-thumb img{width:92px; height:92px; object-fit:cover; border-radius:8px; border:1px solid var(--border2)}
  .img-del{position:absolute; top:-7px; right:-7px; background:var(--blood); color:#fff; border:none;
    border-radius:50%; width:22px; height:22px; cursor:pointer; font-size:.75rem; line-height:1; box-shadow:0 1px 4px rgba(0,0,0,.5)}
  #lightbox{position:fixed; inset:0; background:rgba(0,0,0,.88); display:flex; align-items:center; justify-content:center;
    z-index:200; padding:2rem; cursor:zoom-out}
  #lightbox img{max-width:100%; max-height:100%; border-radius:8px; box-shadow:var(--shadow)}

  /* Portraits — bibliothèque partagée PJ/PNJ */
  .portrait-gray{filter:grayscale(1)}
  .detail-portrait{width:126px; aspect-ratio:63/88; object-fit:cover; border-radius:8px; border:1px solid var(--border2);
    float:right; margin:0 0 .6rem 1rem; box-shadow:var(--shadow)}
  .portrait-pick{display:flex; align-items:center; gap:.8rem}
  .portrait-current{width:63px; aspect-ratio:63/88; object-fit:cover; border-radius:6px; border:1px solid var(--border2); filter:grayscale(1)}
  .portrait-current.empty{display:flex; align-items:center; justify-content:center; font-size:.68rem; color:var(--faint); text-align:center; background:var(--panel2)}
  .portrait-pick-actions{display:flex; flex-direction:column; gap:.35rem; align-items:flex-start}
  .portrait-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:.5rem; max-height:60vh; overflow-y:auto; margin:.4rem 0}
  .portrait-opt{position:relative; cursor:pointer; border-radius:6px; overflow:hidden; border:1px solid var(--border2)}
  .portrait-opt img{width:100%; aspect-ratio:63/88; object-fit:cover; display:block; filter:grayscale(1); transition:transform .1s}
  .portrait-opt:hover img{transform:scale(1.05); }
  .portrait-opt.used{cursor:not-allowed; opacity:.35}
  .portrait-opt.used img{filter:grayscale(1) blur(.5px)}
  .portrait-opt .badge{position:absolute; bottom:2px; left:2px; right:2px; background:rgba(0,0,0,.75); color:#e0a05a;
    font-size:.6rem; text-align:center; border-radius:3px; padding:1px 2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  /* toast */
  #toast{position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel2); border:1px solid var(--gold); color:var(--text); padding:.7rem 1.1rem;
    border-radius:10px; font-family:var(--ui); font-size:.85rem; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:.25s; z-index:100}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  .session-entry{border-left:2px solid var(--border2); padding:.2rem 0 .2rem 1rem; margin:.9rem 0}
  .session-entry .etitle{font-family:var(--ui); font-weight:700; color:var(--gold2); font-size:.9rem}

  /* ---------- Grand écran : onglets en colonne dans une marge à gauche ---------- */
  @media (min-width:1300px){
    .bar{min-height:56px}
    nav.tabs{
      /* position:fixed est positionné par rapport à <header>, pas au viewport, car header a
         un backdrop-filter (ça en fait le containing block d'un descendant fixed — piège CSS
         classique). top/left restent corrects (header est lui-même collé en 0,0 via sticky),
         mais bottom:0 donnait une hauteur ridicule : on calcule donc la hauteur via 100vh,
         qui elle référence toujours le viewport quel que soit le containing block. */
      position:fixed; top:56px; left:0; height:calc(100vh - 56px); width:196px; max-width:196px;
      margin:0; padding:1rem .6rem 1rem; flex-direction:column; align-items:stretch;
      overflow-y:auto; overflow-x:hidden; gap:.15rem;
      border-right:1px solid var(--border); border-bottom:none;
      background:linear-gradient(180deg, #0c0c0d 0%, #0c0c0df5 100%);
      z-index:45;
    }
    nav.tabs button{
      width:100%; text-align:left; border-right:none; border-bottom:none;
      border-left:2px solid transparent; border-radius:6px; padding:.55rem .65rem .55rem .6rem;
    }
    nav.tabs button.active{ background:var(--panel2); border-left-color:var(--gold); }
    main{ margin:0 0 0 196px; max-width:1100px; }
  }
  @media (max-width:640px){
    .brand small{display:none}
    .abilities-grid{grid-template-columns:repeat(3,1fr)}
    main{padding:1rem .7rem 4rem}
    .bar{gap:.5rem; padding:.6rem .7rem}
    /* recherche sur sa propre ligne, pleine largeur */
    .search{flex:1 1 100%; order:3}
    /* onglets : passage à la ligne, tous visibles, en pastilles (fini le défilement horizontal) */
    nav.tabs{flex-wrap:wrap; overflow:visible; gap:.4rem; padding:0 .5rem .5rem}
    nav.tabs button{flex:1 1 auto; font-size:.85rem; font-weight:600; padding:.65rem .8rem; min-height:44px;
      border-bottom:none; border-right:none; border-radius:10px; background:var(--panel); border:1px solid var(--border)}
    nav.tabs button.active{background:var(--panel2); color:var(--gold2); border-color:var(--gold)}
    /* cartes en une colonne */
    .grid{grid-template-columns:1fr; gap:.7rem}
    .card p{-webkit-line-clamp:2}
    /* détails / formulaires moins d'air perdu */
    .detail, .form{padding:1rem}
    .page-head h1{font-size:1.3rem}
    .detail h1{font-size:1.4rem}
    /* plan du point crawl : hauteur raisonnable, boutons pleine largeur */
    .crawl-map-scroll{max-height:56vh}
    .crawl-toolbar{gap:.4rem}
    .crawl-toolbar .btn{flex:1 1 40%}
    /* modales presque plein écran */
    #modal{padding:.5rem}
    #modal .modal-box{padding:1rem}
    /* pied de champs & lignes de stats plus compacts */
    .sb-line{gap:.9rem}
  }
  .hidden{display:none !important}
  body[data-tab="sessions"] main{
    --panel:#1a1421; --panel2:#231b2c; --border:#382c48; --border2:#4d3d63;
  }
  body[data-tab="tables"] main{
    --panel:#122220; --panel2:#1a2e2b; --border:#2a4a45; --border2:#3d6a62;
  }
  body[data-tab="pointcrawls"] main{
    --panel:#131b20; --panel2:#1a252d; --border:#293b47; --border2:#385061;
  }
  body[data-tab="creatures"] main{
    --panel:#201713; --panel2:#2d201a; --border:#473329; --border2:#614638;
  }
  body[data-tab="pcs"] main{
    --panel:#132017; --panel2:#1a2d20; --border:#294733; --border2:#386146;
  }
  body[data-tab="npcs"] main{
    --panel:#201d13; --panel2:#2d291a; --border:#474029; --border2:#615738;
  }
  body[data-tab="pcs"] main .card h3{font-size:1.3rem; text-transform:uppercase; letter-spacing:.5px}
  body[data-tab="events"] main .tag.event, body[data-tab="events"] main .tag.gold{
    color:#e8d9a8; border-color:#a68a4a; background:rgba(214,181,110,.22);
  }
  body[data-tab="events"] main .grid .card{
    background:linear-gradient(180deg,#8a7248,#6f5a37); border-color:#a3854f; color:#f0e2ba;
  }
  body[data-tab="events"] main .grid .card:hover{border-color:#d4b876; box-shadow:0 10px 26px rgba(0,0,0,.5), 0 0 0 1px rgba(212,184,118,.35)}
  body[data-tab="events"] main .grid .card h3{color:#fbeec4; text-align:center}
  body[data-tab="events"] main .grid .card p{color:#d8c393; text-align:center; font-size:.78rem; opacity:.85}
  #auth-screen{position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; background:var(--bg); padding:1rem}
  #auth-screen .form{width:100%; max-width:380px}

  /* ---------- Impression PDF d'un point crawl (fond blanc, économe en encre) ---------- */
  #print-area{display:none}
  @media print{
    @page{ size:A4 portrait; margin:14mm; }
    @page mapland{ size:A4 landscape; margin:11mm; }
    header, main, #toast, #modal, #lightbox, #ac-pop{ display:none !important; }
    html, body{ background:#fff !important; }
    #print-area{ display:block !important; color:#241f18; font-family:var(--font);
      -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    #print-area h1{ width:100%; font-family:var(--blackletter); font-size:30pt; font-weight:normal; color:#4a3a1a; margin:0 0 5pt; text-wrap:balance; text-transform:uppercase; letter-spacing:1pt; text-align:center; }
    #print-area .pp-desc{ width:100%; font-family:var(--ui); color:#555; font-size:10pt; margin:0 0 10pt; text-align:center; }
    #print-area .pp-map{ page:mapland; break-after:page; height:186mm; display:flex; flex-direction:column; align-items:center;
      border:2.5pt solid #201b12; box-shadow:5pt 5pt 0 rgba(0,0,0,.32); padding:9mm; }
    #print-area .pp-svg{ width:100%; flex:1 1 auto; min-height:0; display:block; margin:0 auto; }
    #print-area .pp-svg line{ stroke:#8a744a; stroke-width:2; }
    #print-area .pp-svg .elbl{ fill:#6a5a3a; font-family:var(--ui); font-size:11px; }
    #print-area .pp-svg rect{ fill:#fff; stroke:#3a332a; stroke-width:1.4; }
    #print-area .pp-svg .numc{ fill:#b8892f; }
    #print-area .pp-svg .numt{ fill:#fff; font-family:var(--ui); font-weight:700; font-size:13px; }
    #print-area .pp-svg .ptitle{ fill:#2a241c; font-family:var(--font); font-size:13px; }
    #print-area h2{ font-size:15pt; color:#4a3a1a; border-bottom:1.5pt solid #cbb27f; padding-bottom:3pt; margin:0 0 11pt; text-transform:uppercase; letter-spacing:.5pt; }
    #print-area .pp-event{ break-inside:avoid; margin:0 0 11pt; padding-bottom:8pt; border-bottom:1px solid #e4dbc6; }
    #print-area .pp-event:last-child{ border-bottom:none; }
    #print-area .pp-event h3{ font-size:13pt; color:#2a241c; margin:0 0 5pt; display:flex; align-items:center; gap:7pt; flex-wrap:wrap; text-transform:uppercase; letter-spacing:.4pt; }
    #print-area .pp-num{ display:inline-flex; align-items:center; justify-content:center; width:1.7em; height:1.7em;
      border-radius:50%; background:#b8892f; color:#fff; font-family:var(--ui); font-size:10pt; font-weight:700; flex:0 0 auto; }
    #print-area .pp-theme{ font-family:var(--ui); font-size:8pt; color:#8a7748; border:1px solid #d8c79a; border-radius:10px; padding:1pt 6pt; font-weight:600; }
    #print-area .pp-sec{ margin:3pt 0; }
    #print-area .pp-sec h4{ font-family:var(--ui); font-size:8pt; text-transform:uppercase; letter-spacing:.5pt; color:#9a7b3a; margin:5pt 0 2pt; }
    #print-area .pp-sec ul{ margin:0; padding-left:15pt; }
    #print-area .pp-sec li{ font-size:10.5pt; margin:1pt 0; line-height:1.35; }
    #print-area .pp-link{ font-weight:700; text-decoration:underline; text-decoration-thickness:.5pt; text-underline-offset:1.5pt; }
    #print-area .pp-appendix{ break-before:page; }
    /* ---- Fiches de PJ (une par page A4) ---- */
    #print-area .pp-pcsheet{ break-after:page; }
    #print-area .pp-pcsheet:last-child{ break-after:auto; }
    #print-area .pp-pcstats{ display:flex; flex-wrap:wrap; gap:6pt; margin:2pt 0 12pt; }
    #print-area .pp-pcbox{ border:1.3pt solid #cbb27f; border-radius:4pt; padding:4pt 10pt; min-width:50pt; text-align:center; }
    #print-area .pp-pcbox label{ display:block; font-family:var(--ui); font-size:7pt; text-transform:uppercase; letter-spacing:.5pt; color:#9a7b3a; }
    #print-area .pp-pcbox .v{ font-size:13pt; font-weight:700; color:#2a241c; }
    #print-area .pp-tal{ width:100%; border-collapse:collapse; margin:2pt 0 4pt; }
    #print-area .pp-tal td{ font-size:9.5pt; padding:1.5pt 4pt; border-bottom:.5pt solid #e4dbc6; vertical-align:top; }
    #print-area .pp-tal td:first-child{ width:2.6em; text-align:center; font-weight:700; color:#8a7748; }
    #print-area .pp-pc-currency{ font-family:var(--ui); font-size:9pt; color:#6a5a3a; margin:1pt 0 5pt; }
    #print-area .pp-inv-list{ columns:2; column-gap:16pt; margin:0; padding-left:15pt; }
    #print-area .pp-inv-list li{ font-size:10pt; line-height:1.6; border-bottom:.5pt dotted #cbb27f; min-height:13pt; break-inside:avoid; padding-right:6pt; }
  }

<div id="starfield"></div>
<header id="app-header" class="hidden">
  <div class="bar">
    <div class="brand">
      <span class="rune">✦</span>
      <span>Codex<small>Campagne Shadowdark</small></span>
    </div>
    <div class="search" id="search-wrap">
      <input id="search" type="text" placeholder="Rechercher une créature, un événement, une table…" autocomplete="off">
      <div id="search-results" class="search-results"></div>
    </div>
    <div class="hbtns">
      <button class="icon-btn" id="btn-credits" title="Crédits des icônes">ⓘ Crédits</button>
      <button class="icon-btn" id="btn-broken-links" title="Voir les liens [[...]] qui ne pointent vers rien">⚠ Liens</button>
      <button class="icon-btn" id="btn-export" title="Exporter toutes les données (JSON)">⭳ Export</button>
      <button class="icon-btn" id="btn-import" title="Importer des données (JSON)">⭱ Import</button>
      <button class="icon-btn" id="btn-logout" title="Se déconnecter">⎋ Déconnexion</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="sessions">Sessions</button>
    <button data-tab="tables">Tables aléatoires</button>
    <button data-tab="events">Événements</button>
    <button data-tab="pointcrawls">Point Crawl</button>
    <button data-tab="creatures">Créatures</button>
    <button data-tab="spells">Sorts</button>
    <button data-tab="pcs">PJ</button>
    <button data-tab="npcs">PNJ</button>
    <button data-tab="treasures">Trésor</button>
    <button data-tab="roadbook">Carnet de route</button>
    <button data-tab="hexmaps">Hexcrawl</button>
    <button data-tab="initiative">Initiative</button>
    <button data-tab="wheel">Roue</button>
  </nav>
</header>

<div id="auth-screen" class="hidden">
  <div class="form">
    <h1>🔒 Connexion au Codex</h1>
    <div class="field"><label>Email</label><input type="email" id="auth-email" autocomplete="username"></div>
    <div class="field"><label>Mot de passe</label><input type="password" id="auth-password" autocomplete="current-password"></div>
    <p id="auth-error" class="hidden" style="color:var(--blood2);font-family:var(--ui);font-size:.85rem;margin:0 0 .8rem 0"></p>
    <div class="form-actions"><button class="btn" id="auth-submit">✓ Se connecter</button></div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="file-json" accept="application/json,.json" class="hidden">
<input type="file" id="file-xml" accept="text/xml,application/xml,.xml" class="hidden">
<input type="file" id="file-img" accept="image/*" multiple="" class="hidden">

<script>
"use strict";
/* ==========================================================================
   GRIMOIRE — Gestionnaire de campagne Shadowdark
   Persistance via Supabase (compte unique). Sans dépendance ni build.
   Huit entités : sessions, événements, tables, créatures, PNJ, point crawls, PJ, trésors.
   Liens inter-entités via la syntaxe [[Nom]] + rétroliens (backlinks).
   ========================================================================== */

/* ----------------------------- Stockage (Supabase) ------------------------ */
const SUPABASE_URL = "https://fvwzkjwnzjivxvgvbocq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2d3pranduemppdnh2Z3Zib2NxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzExNTAsImV4cCI6MjEwMTQ0NzE1MH0.djxNfJNOzVW2kWQIKHNnZxR3HBLq-dgOb3qsDDCuvhI";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STORE_KEY = "grimoire_shadowdark_v1"; // ancien cache localStorage — conservé en lecture seule, uniquement pour la migration initiale
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id" + Date.now() + Math.random().toString(36).slice(2));

const emptyDB = () => ({ sessions:[], events:[], creatures:[], tables:[], npcs:[], pointcrawls:[], pcs:[], treasures:[], roadbook:[], hexmaps:[], spells:[], initiative:[], wheel:[] });

/* Lit l'ancien contenu localStorage (avant migration vers Supabase). Ne sert qu'une fois, au premier login. */
function loadLegacyLocalDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return Object.assign(emptyDB(), d);
  }catch(e){ return null; }
}

/* Charge les 8 tables depuis Supabase (une ligne par entité, colonne `data` en jsonb) */
async function fetchRemoteDB(){
  const out = emptyDB();
  for(const col of DB_COLS){
    const { data, error } = await sb.from(col).select("data");
    if(error){
      // Une table manquante (ex : script SQL pas encore exécuté) ne doit pas bloquer tout le reste.
      console.error(`Table "${col}" indisponible :`, error);
      continue;
    }
    out[col] = (data||[]).map(r=>r.data);
  }
  return out;
}

let storageOK = true;
/* Pousse tout le contenu actuel de `db` vers Supabase (upsert — n'efface jamais rien).
   Les suppressions sont gérées explicitement via deleteRemote()/wipeRemoteTable(). */
async function saveDB(){
  try{
    for(const col of DB_COLS){
      if(!db[col].length) continue;
      const rows = db[col].map(o=>({ id:o.id, data:o, updated_at:new Date().toISOString() }));
      const { error } = await sb.from(col).upsert(rows);
      if(error) throw error;
    }
    storageOK = true;
  }catch(e){
    console.error(e);
    if(storageOK){ storageOK = false;
      toast("Connexion à la base de données impossible : la dernière modification n'a peut-être pas été synchronisée.");
    }
  }
}

/* Sauvegarde dédiée à la table "initiative", volontairement à part de saveDB().
   saveDB() parcourt DB_COLS et abandonne dès la première collection en échec (throw) —
   or "pcs" est traité avant "initiative" dans cette liste : un enregistrement à problème
   n'importe où dans db.pcs bloquait alors silencieusement toute sauvegarde du suivi
   d'initiative pour le reste de la session (la carte semblait s'ajouter puis disparaissait
   au tick de polling suivant, qui re-récupérait l'état distant jamais réellement mis à jour). */
async function saveInitiative(){
  try{
    if(!db.initiative.length) return;
    const rows = db.initiative.map(o=>({ id:o.id, data:o, updated_at:new Date().toISOString() }));
    const { error } = await sb.from("initiative").upsert(rows);
    if(error) throw error;
  }catch(e){
    console.error(e);
    toast("Connexion à la base de données impossible : le suivi d'initiative n'a peut-être pas été synchronisé.");
  }
}

async function deleteRemote(col, id){
  try{ const { error } = await sb.from(col).delete().eq("id", id); if(error) throw error; }
  catch(e){ console.error(e); toast("Erreur de synchronisation lors de la suppression."); }
}

/* Résout un nom [[...]] vers une entité (insensible à la casse) */
function findByName(name){
  const n = name.trim().toLowerCase();
  for(const c of db.creatures) if((c.name||"").toLowerCase()===n) return {type:"creature", id:c.id};
  for(const e of db.events)    if((e.title||"").toLowerCase()===n) return {type:"event", id:e.id};
  for(const t of db.tables)    if((t.title||"").toLowerCase()===n) return {type:"table", id:t.id};
  for(const s of db.sessions)  if((s.title||"").toLowerCase()===n) return {type:"session", id:s.id};
  for(const p of db.npcs)      if((p.name||"").toLowerCase()===n) return {type:"npc", id:p.id};
  for(const pc of db.pointcrawls) if((pc.title||"").toLowerCase()===n) return {type:"pointcrawl", id:pc.id};
  for(const pj of db.pcs)         if((pj.name||"").toLowerCase()===n) return {type:"pc", id:pj.id};
  for(const tr of db.treasures)   if((tr.name||"").toLowerCase()===n) return {type:"treasure", id:tr.id};
  for(const sp of db.spells)      if((sp.name||"").toLowerCase()===n) return {type:"spell", id:sp.id};
  return null;
}

/* Rend un texte libre : échappe le HTML puis transforme [[Nom]] en lien cliquable */
function renderText(text){
  if(!text) return "";
  let html = esc(text);
  html = html.replace(/\[\[([^\]]+)\]\]/g, (m, raw)=>{
    const name = raw.trim();
    const hit = findByName(name);
    if(hit){
      return `<a class="wl ${hit.type}" data-goto="${hit.type}:${hit.id}">${esc(name)}</a>`;
    }
    return `<a class="wl bad" title="Aucune entité nommée « ${esc(name)} »" data-create="${esc(name)}">${esc(name)}</a>`;
  });
  return html;
}

/* Transforme un texte multi-lignes en liste à puces (ignore les lignes vides) */
function renderBullets(text){
  const lines = String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return `<p class="faint">— (vide)</p>`;
  return `<ul class="bullets">${lines.map(l=>`<li>${renderText(l)}</li>`).join("")}</ul>`;
}
/* Section à puces rendue seulement si elle contient quelque chose (sinon rien) */
function bulletSection(label, text){
  const has = String(text||"").split(/\r?\n/).some(l=>l.trim());
  return has ? `<div class="section"><h2>${label}</h2>${renderBullets(text)}</div>` : "";
}
function eventSectionsHTML(e, opts){
  const secs = bulletSection((opts&&opts.short?"① Description":"① Description & ambiance"), e.description)
    + bulletSection((opts&&opts.short?"② Pièges":"② Pièges — conditions & conséquences"), e.traps)
    + bulletSection("③ Secrets à découvrir", e.secrets);
  return secs.trim() ? secs : `<p class="faint" style="font-family:var(--ui)">Aucun détail renseigné pour l'instant.</p>`;
}

/* Concatène tout le texte cherchable/liable d'une entité */
function entityText(type, o){
  if(type==="creature") return [o.name,o.category,o.desc,o.abilities,(o.attacks||[]).map(a=>a.name+" "+a.damage).join(" ")].join(" \n ");
  if(type==="event")    return [o.title,o.theme,o.description,o.traps,o.secrets].join(" \n ");
  if(type==="table")    return [o.title,o.category,o.context,(o.rows||[]).join(" \n ")].join(" \n ");
  if(type==="session")  return [o.title,(o.entries||[]).map(e=>e.label+" "+e.notes).join(" \n ")].join(" \n ");
  if(type==="npc")      return [o.name,o.description,o.physique,o.age,o.possessions,o.objectif,o.moyens,o.comportement].join(" \n ");
  if(type==="pointcrawl") return [o.title,o.description,(o.nodes||[]).map(nd=>{const ev=getEntity("event",nd.eventId);return ev?ev.title:"";}).join(" ")].join(" \n ");
  if(type==="pc")       return [o.name,o.ancestry,o.cls,o.info,o.skills,o.spells,o.inventory,(o.talents||[]).map(t=>t.text).join(" ")].join(" \n ");
  if(type==="treasure") return [o.name,treasureCatLabel(o.category),o.description,o.bonus,o.boon,o.curse,o.personality].join(" \n ");
  if(type==="spell")    return [o.name,spellClassLabel(o.class),o.tier?"rang "+o.tier:"",o.range,o.duration,o.effect].join(" \n ");
  return "";
}
function entityTitle(type,o){ return (type==="creature"||type==="npc"||type==="pc"||type==="treasure"||type==="spell") ? o.name : o.title; }

/* Extrait les noms référencés en [[...]] dans un texte */
function extractLinks(text){
  const out = []; const re = /\[\[([^\]]+)\]\]/g; let m;
  while((m=re.exec(text||""))) out.push(m[1].trim().toLowerCase());
  return out;
}

/* Calcule les rétroliens vers une entité cible : qui la mentionne en [[...]] ? */
function findBrokenLinks(){
  const results = [];
  const collections = [["event",db.events],["table",db.tables],["session",db.sessions],["creature",db.creatures],["npc",db.npcs],["pointcrawl",db.pointcrawls],["pc",db.pcs],["treasure",db.treasures],["spell",db.spells]];
  for(const [type,list] of collections){
    for(const o of list){
      const links = extractLinks(entityText(type,o));
      const bad = [...new Set(links)].filter(n=>n && !findByName(n));
      if(bad.length) results.push({type, id:o.id, title:entityTitle(type,o)||"Sans titre", names:bad});
    }
  }
  return results;
}

function backlinksTo(targetType, targetId){
  const target = getEntity(targetType, targetId);
  if(!target) return {};
  const targetName = entityTitle(targetType, target).toLowerCase();
  const groups = { event:[], table:[], session:[], creature:[], npc:[], pointcrawl:[], pc:[], treasure:[], spell:[] };
  const scan = (type, list)=>{
    for(const o of list){
      if(type===targetType && o.id===targetId) continue;
      const links = extractLinks(entityText(type,o));
      if(links.includes(targetName)) groups[type].push({type, id:o.id, title:entityTitle(type,o)});
    }
  };
  scan("event", db.events); scan("table", db.tables);
  scan("session", db.sessions); scan("creature", db.creatures); scan("npc", db.npcs); scan("pointcrawl", db.pointcrawls); scan("pc", db.pcs); scan("treasure", db.treasures); scan("spell", db.spells);
  return groups;
}

/* Renommage : met à jour tous les liens [[Ancien nom]] → [[Nouveau nom]] dans toute la base */
function replaceLinksEverywhere(oldName, newName){
  const from = String(oldName||"").trim().toLowerCase();
  if(!from) return 0;
  let count = 0;
  const fix = s => s.replace(/\[\[([^\]]+)\]\]/g, (m, nm)=> nm.trim().toLowerCase()===from ? `[[${newName}]]` : m);
  const walk = obj => {
    if(Array.isArray(obj)){ obj.forEach(walk); return; }
    if(obj && typeof obj==="object"){
      for(const k in obj){
        if(k==="images") continue;                 // on saute les données d'images (base64)
        const v = obj[k];
        if(typeof v==="string"){ if(v.indexOf("[[")>=0){ const nv=fix(v); if(nv!==v){ obj[k]=nv; count++; } } }
        else if(v && typeof v==="object") walk(v);
      }
    }
  };
  walk(db);
  return count;
}
function maybePropagate(oldName, newName){
  if(!oldName || !newName || oldName===newName) return 0;
  return replaceLinksEverywhere(oldName, newName);
}

/* =========================================================================
   INITIATIVE — timeline de combat en direct (MJ + joueurs)
   Une seule table de combat active à la fois. Chaque participant référence un
   PJ ou une créature existants (nom/portrait/PV/CA résolus en direct depuis
   db.pcs/db.creatures, jamais dupliqués) ou porte un nom libre ("custom").
   Synchro joueurs : polling léger (pas de Supabase Realtime pour cette v1 —
   un combat n'a pas besoin d'une latence inférieure à quelques secondes).
   ========================================================================= */
let initiativePollTimer = null;
function stopInitiativePolling(){ if(initiativePollTimer){ clearInterval(initiativePollTimer); initiativePollTimer=null; } }
function startInitiativePolling(){
  if(initiativePollTimer) return;
  initiativePollTimer = setInterval(async ()=>{
    if(view.tab!=="initiative"){ stopInitiativePolling(); return; }
    if(document.activeElement && document.activeElement.matches && document.activeElement.matches("[data-init-manual-input]")) return; // ne pas écraser une saisie manuelle en cours
    try{
      const { data, error } = await sb.from("initiative").select("data");
      if(error) return; // table pas encore créée côté Supabase, ou souci réseau — on retente au prochain tick
      db.initiative = (data||[]).map(r=>r.data);
      if(view.tab==="initiative") renderList();
    }catch(e){ /* silencieux, on retente au prochain tick */ }
  }, 4500);
}

/* Nom/visuel figés au moment de l'ajout au combat — jamais un lookup live pour l'identité.
   Nécessaire car les joueurs n'ont pas de lecture RLS sur "creatures" (pour ne pas leur
   spoiler les stats des monstres) : un lookup live échouerait silencieusement côté joueur
   et affichait à tort "Créature supprimée". Les stats (CA/PV/sous-titre) restent en direct
   dans initiativeEntryInfo() et n'apparaissent donc que pour un rôle qui peut les lire. */
function initiativeSnapshot(kind, entity){
  if(kind==="pc"){
    return {
      name: entity.name || "Sans nom",
      image: entity.portrait ? `portraits/${entity.portrait}` : ((entity.images&&entity.images[0]) ? entity.images[0].data : ""),
      grayscale: !!entity.portrait
    };
  }
  return {
    name: entity.name || "Sans nom",
    image: (entity.images&&entity.images[0]) ? entity.images[0].data : "",
    grayscale: false
  };
}

function initiativeEntryInfo(entry){
  if(entry.kind==="custom") return { name: entry.name || "Sans nom", sub:"", image:"", grayscale:false, icon:"⚔", ac:"", hp:"" };
  const icon = entry.kind==="pc" ? "🛡" : "🐲";
  const live = entry.kind==="pc" ? db.pcs.find(p=>p.id===entry.refId) : db.creatures.find(c=>c.id===entry.refId);
  // Migration silencieuse des entrées créées avant l'introduction du snapshot (le MJ a toujours
  // la lecture complète, donc c'est le rôle le plus sûr pour combler rétroactivement le snapshot manquant).
  if(myRole==="gm" && !entry.name && live){ Object.assign(entry, initiativeSnapshot(entry.kind, live)); saveInitiative(); }
  const name = entry.name || (live && live.name) || (entry.kind==="pc" ? "PJ supprimé" : "Créature supprimée");
  const image = entry.image || "";
  const grayscale = !!entry.grayscale;
  if(!live) return { name, sub:"", image, grayscale, icon, ac:"", hp:"" };
  const sub = entry.kind==="pc" ? [live.ancestry, live.cls].filter(Boolean).join(" · ") : (live.category || "");
  const ac = live.ac, hp = entry.kind==="pc" ? (live.hpCurrent||live.hp) : live.hp;
  return { name, sub, image, grayscale, icon, ac, hp };
}

function addInitiativeEntry(entry){
  db.initiative.push(Object.assign({ id:uid(), initiative:null, manual:false }, entry));
  saveInitiative(); renderList();
}
function addInitiativeFromPC(pcId){
  const pc = db.pcs.find(p=>p.id===pcId); if(!pc) return;
  addInitiativeEntry(Object.assign({ kind:"pc", refId:pcId }, initiativeSnapshot("pc", pc)));
}
function addInitiativeFromCreature(creatureId){
  const c = db.creatures.find(cr=>cr.id===creatureId); if(!c) return;
  addInitiativeEntry(Object.assign({ kind:"creature", refId:creatureId }, initiativeSnapshot("creature", c)));
}
function addInitiativeCustom(name){
  const n = (name||"").trim();
  if(!n) return;
  addInitiativeEntry({ kind:"custom", name:n });
}
function computeInitiativeRoll(e){
  let value = rollDice(1,20);
  if(e.kind==="pc"){ const pc = db.pcs.find(p=>p.id===e.refId); if(pc) value += ABILITY_MOD(pc.dex); }
  return value;
}
function rollInitiativeFor(id){
  const e = db.initiative.find(x=>x.id===id); if(!e) return;
  e.initiative = computeInitiativeRoll(e); e.manual = false;
  saveInitiative(); renderList();
}
function rollInitiativeAll(){
