/* =========================================================================
   ASSISTANT DE CRÉATION PAS-À-PAS (2026-08-12, audit docs/TODO.md « PJ —
   création scriptée », validé par Tristan) — coexiste avec le bouton
   instantané generateRandomPC() (inchangé) et le formulaire manuel formPC()
   (inchangé, reste le mode d'édition d'une fiche existante). Étapes dans
   l'ordre officiel Shadowdark (Ascendance → Classe → Caractéristiques →
   Historique/Talent → Équipement), chacune avec trois choix Garder /
   Relancer / Saisir moi-même, avant de passer à la suivante. Réutilise le
   moteur de tirage par champ (rollAscendance() etc., voir plus haut).
   Aucune sauvegarde tant que "Enregistrer ce personnage" n'a pas été
   cliqué à la dernière étape (récapitulatif) — cf. décision de Tristan.

   Retour de Tristan (2026-08-12, après premier essai) : la v1 remplaçait
   tout l'écran à chaque étape (une seule question visible à la fois, rien
   qui reste des étapes précédentes, pas de résumé pendant le parcours) —
   "on sait plus ce qu'on a créé avant". Refonte : chaque étape confirmée
   s'ajoute en PERMANENCE sur une fiche qui se construit au même endroit,
   avec le même gabarit visuel que la fiche PJ existante (pcWizardSheetHTML,
   réutilise les classes .statblock/.abilities-grid/.section de detailPC) —
   rien ne disparaît, seule la case "à décider maintenant" avance le long de
   la fiche. Chaque jet (initial ou relance) est aussi tracé dans un journal
   (pcWizard.log, un 🎲/✎ + un intitulé de dé par ligne) consultable à tout
   moment sous l'étape active, pour ne jamais perdre le fil de "quel dé a
   donné quoi".
   ========================================================================= */
let pcWizard = null; // { draft:{...}, stepIndex, value, manual, rolled, log:[] } — null hors assistant

const PC_WIZARD_LABELS = {
  ancestry:"Ascendance", cls:"Classe", alignment:"Alignement",
  abilities:"Caractéristiques (3d6 × 6)", hp:"Points de vie",
  origin:"Origine", talent:"Talent de classe (2d6)", talent2:"Talent supplémentaire (Ambitieux)",
  name:"Nom", languages:"Langues", deity:"Divinité", mentor:"Mentor",
  spells:"Sorts connus (rang 1)", gold:"Or de départ", equipment:"Équipement de départ", review:"Récapitulatif"
};
/* Liste ordonnée des étapes, recalculée à chaque rendu depuis le brouillon en
   cours — les étapes conditionnelles (talent supplémentaire, divinité,
   mentor, sorts) n'apparaissent qu'une fois le champ dont elles dépendent
   (ascendance/classe) confirmé, donc leur présence ne peut plus changer une
   fois qu'on les a dépassées. */
function pcWizardStepList(d){
  const cd = CLASSES_DATA[d.cls];
  const steps = [
    {id:"ancestry", group:"Ascendance"},
    {id:"cls", group:"Classe"},
    {id:"alignment", group:"Historique"},
    {id:"abilities", group:"Caractéristiques"},
    {id:"hp", group:"Caractéristiques"},
    {id:"origin", group:"Historique"},
    {id:"talent", group:"Historique"}
  ];
  if(d.ancestryName==="Ambitieux") steps.push({id:"talent2", group:"Historique"});
  steps.push({id:"name", group:"Historique"});
  steps.push({id:"languages", group:"Historique"});
  if(d.cls==="Prêtre") steps.push({id:"deity", group:"Historique"});
  if(cd && cd.usesMentor) steps.push({id:"mentor", group:"Historique"});
  if(cd && cd.spellClass && cd.spellsKnownLvl1>0) steps.push({id:"spells", group:"Historique"});
  steps.push({id:"gold", group:"Équipement"});
  steps.push({id:"equipment", group:"Équipement"});
  steps.push({id:"review", group:"Équipement"});
  return steps;
}
function pcWizardRoll(id, d){
  const cd = CLASSES_DATA[d.cls];
  switch(id){
    case "ancestry": return rollAscendance();
    case "cls": return rollClass();
    case "alignment": return rollAlignment();
    case "abilities": return rollAbilityScores();
    case "hp": { const asc=ASCENDANCES[d.ancestryName]; return rollHP(cd, ABILITY_MOD(d.scores.con), !!(asc&&asc.robust)); }
    case "origin": return rollOrigin();
    case "talent": case "talent2": return rollTalent(cd);
    case "name": return rollName();
    case "languages": return rollLanguages(cd);
    case "deity": return rollDeity(d.alignment);
    case "mentor": return rollMentor();
    case "spells": return rollSpellsKnown(cd, d.cls);
    case "gold": return rollGold();
    case "equipment": return rollStartingEquipment(cd);
  }
}
function pcWizardApply(id, d, value){
  switch(id){
    case "ancestry": d.ancestryName=value.name; d.ancestryUnmatched=value.unmatched; break;
    case "cls": d.cls=value; break;
    case "alignment": d.alignment=value; break;
    case "abilities": d.scores=value; break;
    case "hp": d.hp=value; break;
    case "origin": d.origin=value; break;
    case "talent": d.talentRolls[0]=value; break;
    case "talent2": d.talentRolls[1]=value; break;
    case "name": d.name=value; break;
    case "languages": d.languages=value; break;
    case "deity": d.deity=value; break;
    case "mentor": d.mentor=value; break;
    case "spells": d.spellLines=value; break;
    case "gold": d.gold=value; break;
    case "equipment": d.equipment=value; break;
  }
}
function pcWizardDisplayHTML(id, value, d){
  const P = s=>`<p style="font-family:var(--ui);font-size:1.05rem;margin:.4rem 0">${s}</p>`;
  const sgn = m=>(m>=0?"+":"")+m;
  switch(id){
    case "ancestry": {
      const asc = ASCENDANCES[value.name];
      return P(`<b>${esc(value.name)}</b>`) + `<p class="muted" style="font-family:var(--ui)">${esc(asc?asc.trait:"Ascendance personnalisée — aucun bonus mécanique automatique.")}</p>`;
    }
    case "cls": { const c=CLASSES_DATA[value]; return P(`<b>${esc(value)}</b>`) + (c?`<p class="muted" style="font-family:var(--ui)">Dé de vie d${c.hitDie} · Armes : ${esc(c.weapons)}</p>`:""); }
    case "alignment": return P(`<b>${esc(cap(value))}</b>`);
    case "abilities": {
      const stats=[["FOR","str"],["DEX","dex"],["CON","con"],["INT","int"],["SAG","wis"],["CHA","cha"]];
      return `<div class="subgrid">${stats.map(([lbl,k])=>`<div class="field" style="margin:0"><label>${lbl}</label><div style="font-family:var(--ui);font-size:1.1rem">${value[k]} (${sgn(ABILITY_MOD(value[k]))})</div></div>`).join("")}</div>`;
    }
    case "hp": return P(`<b>${value} PV</b>`);
    case "origin": return P(esc(value));
    case "talent": case "talent2": return P(`2d6 = <b>${esc(String(value.total))}</b> → ${renderText(value.text||"—")}`);
    case "name": return P(`<b>${esc(value)}</b>`);
    case "languages": return P(esc(value.join(", ")));
    case "deity": return P(`<b>${esc(value)}</b>`);
    case "mentor": { const m=MENTORS[value]; return P(`<b>${esc(value)}</b>`) + (m?`<p class="muted" style="font-family:var(--ui)">${esc(m.desc)}</p>`:""); }
    case "spells": return value.length ? `<ul class="bullets">${value.map(s=>`<li>${renderText(s)}</li>`).join("")}</ul>` : P("Aucun sort disponible pour l'instant.");
    case "gold": return P(`<b>${value} po</b>`);
    case "equipment": {
      const armor = ARMOR_DATA.find(a=>a.id===value.armorId);
      const weapons = (value.weaponIds||[]).map(id=>WEAPONS_DATA.find(w=>w.id===id)).filter(Boolean);
      return P([
        `<b>${esc(armor?armor.name:"Sans armure")}</b>${value.shield?" + Bouclier":""}`,
        weapons.length?weapons.map(w=>esc(w.name)).join(", "):"Aucune arme"
      ].join(" · "));
    }
  }
}

function pcWizardReadManual(id, d){
  switch(id){
    case "ancestry": { const name=$("#wiz-in").value; return { name, unmatched: !ASCENDANCES[name] }; }
    case "cls": return $("#wiz-in").value;
    case "alignment": return $("#wiz-in").value;
    case "abilities": { const o={}; ["str","dex","con","int","wis","cha"].forEach(k=> o[k]=parseInt(document.getElementById("wiz-in-"+k).value)||10); return o; }
    case "hp": return Math.max(1, parseInt($("#wiz-in").value)||1);
    case "origin": return $("#wiz-in").value.trim();
    case "talent": case "talent2": { const cd=CLASSES_DATA[d.cls]; const roll=$("#wiz-in").value; const row=cd&&cd.talents.find(t=>t.roll===roll); return { total:"choisi", text: row?row.text:"" }; }
    case "name": return $("#wiz-in").value.trim();
    case "languages": return $("#wiz-in").value.split(",").map(s=>s.trim()).filter(Boolean);
    case "deity": return $("#wiz-in").value.trim();
    case "mentor": return $("#wiz-in").value;
    case "spells": return $("#wiz-in").value.split("\n").map(s=>s.trim()).filter(Boolean);
    case "gold": return Math.max(0, parseInt($("#wiz-in").value)||0);
    case "equipment": {
      const armorSel = document.getElementById("wiz-in-armor");
      const shieldEl = document.getElementById("wiz-in-shield");
      const weaponIds = [...document.querySelectorAll(".wiz-in-weapon:checked")].map(el=>el.value);
      return { armorId: armorSel?armorSel.value:"none", shield: !!(shieldEl&&shieldEl.checked), weaponIds };
    }
  }
}
/* Une ligne de journal par jet (initial ou relance) — sert à ne jamais perdre le fil de "quel dé
   a donné quoi", y compris à travers plusieurs relances successives du même champ. `manual:true`
   bascule l'icône ✎ (saisie) au lieu de 🎲 (jet). */
function pcWizardFieldLog(id, value, d, manual){
  const cd = CLASSES_DATA[d.cls];
  const icon = manual ? "✎" : "🎲";
  switch(id){
    case "ancestry": return `${icon} d12 Ascendance → ${value.name}`;
    case "cls": return `${icon} Classe → ${value}`;
    case "alignment": return `${icon} d3 Alignement → ${cap(value)}`;
    case "abilities": return `${icon} 3d6 × 6 Caractéristiques → ` + ["str","dex","con","int","wis","cha"].map(k=>`${k.toUpperCase()} ${value[k]}`).join(", ");
    case "hp": return `${icon} d${cd?cd.hitDie:"?"} + mod. CON PV → ${value}`;
    case "origin": return `${icon} d20 Origine → ${value}`;
    case "talent": return `${icon} 2d6 Talent de classe → ${value.total} : ${firstLine(value.text||"—")}`;
    case "talent2": return `${icon} 2d6 Talent supplémentaire (Ambitieux) → ${value.total} : ${firstLine(value.text||"—")}`;
    case "name": return `${icon} Nom → ${value}`;
    case "languages": return `${icon} Langues → ${value.join(", ")}`;
    case "deity": return `${icon} Divinité → ${value}`;
    case "mentor": return `${icon} Mentor → ${value}`;
    case "spells": return `${icon} Sorts de rang 1 → ${value.length?value.join(", "):"aucun disponible"}`;
    case "gold": return `${icon} 2d6 × 5 Or → ${value} po`;
    case "equipment": {
      const armor = ARMOR_DATA.find(a=>a.id===value.armorId);
      const weapons = (value.weaponIds||[]).map(id=>WEAPONS_DATA.find(w=>w.id===id)).filter(Boolean).map(w=>w.name);
      return `${icon} Équipement de départ → ${armor?armor.name:"Sans armure"}${value.shield?" + Bouclier":""}${weapons.length?" · "+weapons.join(", "):""}`;
    }
    default: return `${icon} ${id}`;
  }
}
/* La fiche en construction : ne rend QUE les champs déjà confirmés dans le brouillon, avec le
   même gabarit visuel que detailPC() (.statblock/.abilities-grid/.section) — chaque étape
   confirmée s'ajoute ici de façon permanente et ne disparaît plus (retour de Tristan après le
   premier essai de l'assistant, voir commentaire plus haut). */
function pcWizardSheetHTML(d){
  const mods = {};
  if(d.scores) ["str","dex","con","int","wis","cha"].forEach(k=> mods[k]=ABILITY_MOD(d.scores[k]));
  const sgn = m=>(m>=0?"+":"")+m;
  const parts = [];
  if(d.name || d.ancestryName || d.cls || d.alignment){
    const subline = [d.ancestryName, d.cls].filter(Boolean).join(" · ") + (d.alignment ? ` · ${esc(cap(d.alignment))}` : "");
    parts.push(`<h1 style="margin-bottom:.1rem">${esc(d.name || "Personnage en cours…")}</h1>`);
    if(subline) parts.push(`<p class="muted" style="font-family:var(--ui)">${subline}</p>`);
  }
  if(d.ancestryName){
    const asc = ASCENDANCES[d.ancestryName];
    parts.push(`<p class="muted" style="font-family:var(--ui);font-size:.85rem">${esc(asc?asc.trait:"Ascendance personnalisée — aucun bonus mécanique automatique.")}</p>`);
  }
  if(d.scores){
    const ac = d.equipment
      ? computeACFromLoadout({equippedArmor:d.equipment.armorId, armorMagicBonus:0, equippedShield:d.equipment.shield, shieldMagicBonus:0}, mods.dex)
      : computeAC(mods.dex);
    parts.push(`<div class="statblock">
      <div class="sb-line">
        <span><b>CA</b> ${ac}</span>
        ${d.hp!=null?`<span><b>PV</b> ${d.hp} / ${d.hp}</span>`:""}
      </div>
      <div class="abilities-grid">
        ${["str","dex","con","int","wis","cha"].map(k=>`<div class="ab"><div class="n">${k.toUpperCase()}</div><div class="v">${d.scores[k]} (${sgn(mods[k])})</div></div>`).join("")}
      </div>
    </div>`);
  }
  if(d.origin || (d.talentRolls && d.talentRolls.length)){
    parts.push(`<div class="section"><h2>🎯 Historique</h2>
      ${d.origin?`<p style="font-family:var(--ui)">${esc(d.origin)}</p>`:""}
      ${(d.talentRolls||[]).map((r,i)=>`<p style="font-family:var(--ui)">Talent${d.talentRolls.length>1?" "+(i+1):""} (2d6=${esc(String(r.total))}) : ${renderText(r.text||"—")}</p>`).join("")}
    </div>`);
  }
  const infoLine = [
    d.languages ? `Langues : ${esc(d.languages.join(", "))}` : "",
    d.deity ? `Divinité : ${esc(d.deity)}` : "",
    d.mentor ? `Mentor : ${esc(d.mentor)}` : ""
  ].filter(Boolean).join(" · ");
  if(infoLine) parts.push(`<p class="muted" style="font-family:var(--ui);font-size:.85rem">${infoLine}</p>`);
  if(d.mentor && MENTORS[d.mentor]) parts.push(`<p class="muted" style="font-family:var(--ui);font-size:.8rem">${esc(MENTORS[d.mentor].desc)}</p>`);
  if(d.spellLines && d.spellLines.length){
    parts.push(`<div class="section"><h2>✨ Sortilèges</h2>${renderBullets(d.spellLines.join("\n"))}</div>`);
  }
  if(d.gold!=null || d.equipment){
    const invSlots = d.scores ? computeInvSlots(d.cls, d.scores.str, mods.con) : null;
    const armor = d.equipment ? ARMOR_DATA.find(a=>a.id===d.equipment.armorId) : null;
    const weapons = d.equipment ? (d.equipment.weaponIds||[]).map(id=>WEAPONS_DATA.find(w=>w.id===id)).filter(Boolean) : [];
    parts.push(`<div class="section"><h2>🎒 Équipement</h2><p style="font-family:var(--ui)">${d.gold!=null?`${d.gold} po de départ`:""}${invSlots!=null?` · ${invSlots} emplacements d'inventaire`:""}${armor?` · ${esc(armor.name)}${d.equipment.shield?" + Bouclier":""}`:""}${weapons.length?` · ${weapons.map(w=>esc(w.name)).join(", ")}`:""}</p></div>`);
  }
  return parts.join("\n");
}
/* Étape active : le tirage en cours de décision (Garder/Relancer/Saisir moi-même), plus le
   journal des jets déjà effectués — reste visible sous la fiche en construction (jamais à sa
   place, jamais en remplacement d'elle). */
function pcWizardActiveStepHTML(step, label){
  const d = pcWizard.draft;
  const body = pcWizard.manual ? pcWizardManualHTML(step.id, d, pcWizard.value) : pcWizardDisplayHTML(step.id, pcWizard.value, d);
  const logHTML = pcWizard.log.length ? `<details class="wiz-log" style="margin-top:.7rem">
      <summary style="font-family:var(--ui);font-size:.8rem;cursor:pointer" class="muted">🎲 Journal des jets (${pcWizard.log.length})</summary>
      <div style="font-family:var(--ui);font-size:.8rem;max-height:180px;overflow-y:auto;margin-top:.4rem">
        ${pcWizard.log.slice().reverse().map(l=>`<div style="padding:.15rem 0;border-bottom:1px solid var(--border,rgba(128,128,128,.25))">${esc(l)}</div>`).join("")}
      </div>
    </details>` : "";
  return `<div class="section wiz-active-step" style="border:1px solid var(--gold,#b08d57);border-radius:8px">
    <h2><span class="wiz-die-spin">${pcWizard.manual?"✎":"🎲"}</span> ${esc(label)}</h2>

    <div class="form-actions" style="flex-wrap:wrap;margin-top:.6rem">
      ${pcWizard.manual
        ? `<button class="btn" data-wiz-confirm-manual="1">✓ Valider et continuer</button><button class="btn ghost" data-wiz-cancel-manual="1">Annuler la saisie</button>`
        : `<button class="btn" data-wiz-keep="1">✓ Garder</button><button class="btn ghost" data-wiz-reroll="1">🎲 Relancer</button><button class="btn ghost" data-wiz-manual="1">✎ Saisir moi-même</button>`}
    </div>

  </div>`;
}
function startPCWizard(){
  pcWizard = { draft:{ talentRolls:[] }, stepIndex:0, value:undefined, manual:false, rolled:false, log:[] };

const PC_WIZARD_STYLE = `<style>@keyframes wizDieSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}.wiz-die-spin{display:inline-block;animation:wizDieSpin .5s ease-out}</style>`;

  if(!pcWizard) return startPCWizard();
  const steps = pcWizardStepList(pcWizard.draft);
  if(pcWizard.stepIndex>=steps.length) pcWizard.stepIndex = steps.length-1;
  const step = steps[pcWizard.stepIndex];
  const isReview = step.id==="review";
  if(!isReview && !pcWizard.rolled && !pcWizard.manual){
    pcWizard.value = pcWizardRoll(step.id, pcWizard.draft);
    pcWizard.rolled = true;
    pcWizard.log.push(pcWizardFieldLog(step.id, pcWizard.value, pcWizard.draft, false));

/* Relance un champ du formulaire PJ (bouton 🎲 à côté du label, voir formPC()) en réutilisant le
   moteur de tirage partagé avec l'assistant pas-à-pas. Modifie uniquement le DOM du formulaire —
   aucun saveDB() ici, la sauvegarde reste groupée via le bouton "Enregistrer" (savePC()). */
function handlePCFieldReroll(kind){
  const clsVal = document.getElementById("f-cls") ? document.getElementById("f-cls").value : "";
  const cd = CLASSES_DATA[clsVal];
  const sgn = m=>(m>=0?"+":"")+m;
  switch(kind){
    case "name": $("#f-name").value = rollName(); break;
    case "ancestry": {
      const r = rollAscendance();
      const sel = $("#f-ancestry");
      if([...sel.options].some(o=>o.value===r.name)) sel.value = r.name;
      else toast(`Ascendance tirée : « ${r.name} » — personnalisée, absente du menu déroulant (à ajouter dans l'onglet Tables aléatoires ou à saisir ailleurs).`);
      break;
    }
    case "cls": {
      const sel = $("#f-cls"); sel.value = rollClass();
      sel.dispatchEvent(new Event("change")); // rafraîchit le champ Mentor
      break;
    }
    case "alignment": $("#f-align").value = rollAlignment(); break;
    case "abilities": {
      const scores = rollAbilityScores();
      ["str","dex","con","int","wis","cha"].forEach(k=>{ $("#f-"+k).value = `${scores[k]} (${sgn(ABILITY_MOD(scores[k]))})`; });
      break;
    }
    case "hp": {
      if(!cd){ toast("Choisis d'abord une classe pour relancer les PV."); return; }
      const conMod = parseAbilityMod($("#f-con").value);
      const asc = ASCENDANCES[$("#f-ancestry").value];
      const hp = rollHP(cd, conMod, !!(asc && asc.robust));
      $("#f-hp").value = String(hp); $("#f-hpCurrent").value = String(hp);
      break;
    }
    case "languages": {
      if(!cd){ toast("Choisis d'abord une classe pour relancer les langues."); return; }
      $("#f-languages").value = rollLanguages(cd).join(", ");
      break;
    }
    case "deity": $("#f-deity").value = rollDeity($("#f-align").value); break;
    case "mentor": { const sel=$("#f-mentor"); if(sel) sel.value = rollMentor(); break; }
    case "origin": { const ta=$("#f-skills"); ta.value = (ta.value?ta.value+"\n":"") + rollOrigin(); break; }
    case "spells": {
      if(!cd || !cd.spellClass){ toast("Cette classe ne lance pas de sorts."); return; }
      const ta = $("#f-spells");
      ta.value = (ta.value?ta.value+"\n":"") + rollSpellsKnown(cd, clsVal).join("\n");
      break;
    }
    case "gold": { const ta=$("#f-inventory"); ta.value = (ta.value?ta.value+"\n":"") + `${rollGold()} po pour acheter votre équipement de départ.`; break; }
    case "invSlots": {
      const strScore = parseInt($("#f-str").value)||10;
      const conMod = parseAbilityMod($("#f-con").value);
      $("#f-invSlots").value = String(computeInvSlots(clsVal, strScore, conMod));
      break;
    }
  }
}
function savePC(){
  const o = view.mode==="edit" ? getEntity("pc",view.id) : {id:uid()};
  const _old = view.mode==="edit" ? o.name : null;
  o.name = $("#f-name").value.trim();
  o.ancestry = $("#f-ancestry").value.trim();
  o.cls = $("#f-cls").value.trim();
  o.level = $("#f-level").value.trim();
  o.alignment = $("#f-align").value;
  o.ac = $("#f-ac").value.trim();
  o.hp = $("#f-hp").value.trim();
  o.hpCurrent = $("#f-hpCurrent").value.trim();
  ["str","dex","con","int","wis","cha"].forEach(k=> o[k]=$("#f-"+k).value.trim());
  o.skills = $("#f-skills").value;
  o.spells = $("#f-spells").value;
  o.invSlots = $("#f-invSlots").value.trim();
  o.inventory = $("#f-inventory").value;
  o.info = $("#f-info").value;
  o.languages = $("#f-languages").value.trim();
  o.deity = $("#f-deity").value.trim();
  o.masteredWeapon = $("#f-masteredWeapon").value.trim();
  o.mentor = $("#f-mentor").value;
  o.images = formImages.slice();
  o.portrait = formPortrait || "";
  if(!o.name){ toast("Le nom est requis."); return; }
  if(view.mode==="new") db.pcs.push(o);
  const _n = maybePropagate(_old, o.name);
  saveDB(); toast("Personnage enregistré."+(_n?` · ${_n} lien(s) mis à jour`:"")); view={tab:"pcs",mode:"detail",id:o.id}; render();
}

/* Section "Classe" (2026-08-11) : entièrement calculée en direct depuis p.cls/CLASSES_DATA —
   aucune donnée de classe n'est stockée sur le PJ, donc changer sa classe dans le formulaire met
   instantanément à jour armes/armures/capacités/sorts/DD/talents affichés ici, y compris pour un
   PJ créé à la main (pas seulement ceux générés aléatoirement). Réutilisée par printPCSheet(). */
/* Étiquette de sous-section dans la fiche Classe — même langage visuel que les en-têtes de
   colonne des tableaux (table.tbl th), pour rester cohérent sans ajouter de classe CSS. */
const CLASS_SUBLABEL_STYLE = "font-family:var(--ui);font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--gold);margin:.9rem 0 .35rem";
function pcClassSectionHTML(p){
  const cd = CLASSES_DATA[p.cls];
  if(!cd) return "";
  const featureList = `<ul class="bullets">${cd.feature.map(f=>`<li>${f.name?`<b>${esc(f.name)}</b> — `:""}${renderText(f.text)}</li>`).join("")}</ul>`;
  let spellBlock = "";
  if(cd.spellClass){
    if(cd.spellsKnownLvl1>0){
      // Table des rangs 1-5/DD et ligne "Test d'incantation" retirées (2026-08-18, demande de
      // Tristan : "ça ne sert à rien") — la valeur de lancement est affichée directement à côté
      // de chaque sort connu, voir pcSpellLinesHTML().
      spellBlock = `<div style="${CLASS_SUBLABEL_STYLE}">Incantation</div>
        <p style="font-family:var(--ui);font-size:.9rem;margin:.2rem 0">Sorts connus (rang 1) : ${cd.spellsKnownLvl1}${p.cls==="Prêtre" ? " (+ Renvoi des morts-vivants, offert)" : ""}</p>`;
    } else if(cd.spellsFromLevel){
      spellBlock = `<div style="${CLASS_SUBLABEL_STYLE}">Incantation</div>
        <p style="font-family:var(--ui);font-size:.9rem;margin:.2rem 0">Aucun sort connu au 1er niveau — vous gagnez l'incantation à partir du niveau ${cd.spellsFromLevel}.</p>`;
    }
  }
  let weaponBlock = "";
  if(p.masteredWeapon && p.masteredWeapon.trim()){
    const bonus = 1 + Math.floor((parseInt(p.level)||1)/2);
    weaponBlock = `<p style="font-family:var(--ui);font-size:.9rem;margin:.4rem 0"><b>Arme maîtrisée</b> : ${esc(p.masteredWeapon)} (+${bonus} aux jets d'attaque et de dégâts avec cette arme)</p>`;
  }
  let mentorBlock = "";
  if(cd.usesMentor && p.mentor && MENTORS[p.mentor]){
    const men = MENTORS[p.mentor];
    mentorBlock = `<div style="${CLASS_SUBLABEL_STYLE}">Mentor — ${esc(p.mentor)}</div>
      <p class="faint" style="font-family:var(--ui);font-size:.85rem;margin:.2rem 0 .5rem">${esc(men.desc)}</p>
      <div class="sheet-scroll-tbl"><table class="tbl"><thead><tr><th style="width:4.5rem">2d6</th><th>Bienfait</th></tr></thead>
        <tbody>${men.benefits.map(b=>`<tr><td class="idx" style="text-align:center">${esc(b.roll)}</td><td>${renderText(b.text)}</td></tr>`).join("")}</tbody></table></div>`;
  } else if(cd.usesMentor){
    mentorBlock = `<div style="${CLASS_SUBLABEL_STYLE}">Mentor</div><p class="faint" style="font-family:var(--ui);font-size:.85rem;margin:.2rem 0">Aucun mentor choisi — sélectionnez-en un dans la fiche pour voir sa table de Bienfaits.</p>`;
  }
  // Bloc compact (2026-08-18) : plus de `.section > h2` (marge/ligne de séparation pensées pour
  // une page pleine largeur) — ce contenu vit dans une case déjà cadrée par le bandeau noir
  // "Talents / Sorts" du panneau, donc juste une petite ligne de résumé + les mêmes sous-titres
  // que le reste de la fiche (CLASS_SUBLABEL_STYLE).
  return `<p style="font-family:var(--ui);font-size:.85rem;margin:0 0 .3rem"><b>${esc(p.cls)}</b> · d${cd.hitDie} PV &nbsp;·&nbsp; ${esc(cd.weapons)} &nbsp;·&nbsp; ${esc(cd.armor)}</p>
    <div style="${CLASS_SUBLABEL_STYLE}">Capacités</div>
    ${featureList}
    ${weaponBlock}
    ${spellBlock}
    <div style="${CLASS_SUBLABEL_STYLE}">Talents (2d6)</div>
    <div style="margin:.2rem 0 .35rem"><button class="btn sm" data-roll-talents="${p.id}">🎲 Lancer 2d6</button> <span id="talent-roll-out" class="roll-result"></span></div>
    <div class="sheet-scroll-tbl"><table class="tbl"><thead><tr><th style="width:4.5rem">2d6</th><th>Talent / évolution</th></tr></thead>
      <tbody id="talents-body">${cd.talents.map(t=>`<tr data-roll-range="${esc(t.roll)}"><td class="idx" style="text-align:center">${esc(t.roll)}</td><td>${renderText(t.text)}</td></tr>`).join("")}</tbody></table></div>
    ${mentorBlock}`;
}
/* =========================================================================
   FICHE PJ GRAPHIQUE (2026-08-13, demande de Tristan) — remplace l'ancienne fiche en prose
   par une fiche en cases encadrées cliquables, inspirée de la mise en page d'une feuille de
   perso Shadowdark classique (fichier de référence : Shazsod.pdf, colonnes encadrées +
   bandeaux de section noirs Talents/Sorts et Équipement). Chaque case cliquable relance CE
   champ précis via le moteur de tirage partagé (rollAscendance() etc., voir plus haut) —
   même sauvegarde différée que partout ailleurs dans l'appli : cliquer ne modifie qu'un
   brouillon local (`pcSheetDraft`), rien n'est écrit en base tant que le bouton
   "✓ Enregistrer les modifications" n'a pas été cliqué. `formPC()` (formulaire classique)
   reste disponible via "✎ Modifier" pour les champs en texte libre (compétences, sorts,
   inventaire, notes) qui ne se prêtent pas à un clic-pour-relancer. */
let pcSheetDraft = null; // { ...champs du PJ..., id } — brouillon local de la fiche cliquable, null hors fiche
/* Champ actuellement basculé en saisie manuelle (menu déroulant/texte) sur la fiche graphique —
   un seul à la fois. Distinct du clic sur le petit bouton 🎲 (relance immédiate, pas de menu) :
   retour de Tristan après le premier essai, les deux clics doivent avoir des effets différents
   ("le petit bouton avec le d... relance. Si je clique sur le nom... ça met le menu déroulant"). */
let pcSheetManualField = null;
// Champs qui proposent une saisie manuelle en plus de la relance — réutilise le même gabarit
// d'input que l'assistant pas-à-pas (pcWizardManualHTML/pcWizardReadManual, voir plus haut).
const PC_SHEET_MANUAL_KINDS = new Set(["name","ancestry","cls","alignment","origin","languages","deity","mentor","hp","abilities"]);
function pcOriginLine(skills){ return firstLine(skills); }
function pcSetOriginLine(skills, newOrigin){
  const lines = String(skills||"").split(/\r?\n/);
  if(!lines.length || !lines[0].trim()) return [newOrigin, ...lines.filter((l,i)=>i>0)].join("\n");
  lines[0] = newOrigin;
  return lines.join("\n");
}
/* Valeur actuelle d'un champ de la fiche, reformatée dans la forme attendue par
   pcWizardManualHTML()/pcWizardReadManual() (ex. les caractéristiques y sont des nombres bruts,
   pas le texte "14 (+2)" stocké sur le PJ). */
function pcSheetManualCurrentValue(kind, d){
  switch(kind){
    case "ancestry": return { name: d.ancestry, unmatched: !ASCENDANCES[d.ancestry] };
    case "cls": return d.cls;
    case "alignment": return d.alignment;
    case "abilities": { const o={}; ["str","dex","con","int","wis","cha"].forEach(k=> o[k]=parseInt(d[k])||10); return o; }
    case "hp": return parseInt(d.hp)||1;
    case "origin": return pcOriginLine(d.skills);
    case "name": return d.name;
    case "languages": return String(d.languages||"").split(",").map(s=>s.trim()).filter(Boolean);
    case "deity": return d.deity;
    case "mentor": return d.mentor;
  }
}
/* Applique une valeur saisie manuellement (lue par pcWizardReadManual) au brouillon de la
   fiche — inverse de pcSheetManualCurrentValue, reconvertit vers le format stocké sur le PJ. */
function applyPCSheetManualValue(kind, d, raw){
  const sgn = m=>(m>=0?"+":"")+m;
  switch(kind){
    case "ancestry": d.ancestry = raw.name; break;
    case "cls": d.cls = raw; break;
    case "alignment": d.alignment = raw; break;
    case "abilities": ["str","dex","con","int","wis","cha"].forEach(k=>{ d[k] = `${raw[k]} (${sgn(ABILITY_MOD(raw[k]))})`; }); break;
    case "hp": d.hp = String(raw); d.hpCurrent = String(raw); break;
    case "origin": d.skills = pcSetOriginLine(d.skills, raw); break;
    case "name": d.name = raw; break;
    case "languages": d.languages = raw.join(", "); break;
    case "deity": d.deity = raw; break;
    case "mentor": d.mentor = raw; break;
  }
}
function detailPC(p){
  if(!pcSheetDraft || pcSheetDraft.id!==p.id){ pcSheetDraft = JSON.parse(JSON.stringify(p)); pcSheetManualField = null; }
  const d = pcSheetDraft;
  const dirty = JSON.stringify(d)!==JSON.stringify(p);
  const cd = CLASSES_DATA[d.cls];
  const titre = d.cls ? titleFor(d.cls, d.alignment, d.level) : "";
  const ascTrait = d.ancestry
    ? (ASCENDANCES[d.ancestry]
        ? ascendanceTraitText(d.ancestry, d.cls)
        : `Ascendance personnalisée (« ${d.ancestry} ») : non reconnue par les règles de l'appli, aucun bonus mécanique automatique.`)
    : "";
  const ab = [["FOR","str"],["DEX","dex"],["CON","con"],["INT","int"],["SAG","wis"],["CHA","cha"]];
  /* Case de fiche : bouton 🎲 = relance immédiate ; cliquer sur la valeur = bascule en saisie
     manuelle (menu déroulant pour les listes fermées, texte pour le reste) — deux actions
     distinctes, demande explicite de Tristan. `kind` sans entrée dans PC_SHEET_MANUAL_KINDS
     (ex. "ac") garde le bouton 🎲 mais pas de saisie manuelle (rien à choisir dans une liste). */
  const box = (label, val, kind, extra)=>{
    if(kind && pcSheetManualField===kind){
      return `<div class="sheet-box">
        <span class="lbl">${esc(label)}</span>
        ${pcWizardManualHTML(kind, d, pcSheetManualCurrentValue(kind, d))}
        <div style="margin-top:.45rem;display:flex;gap:.4rem">
          <button type="button" class="btn ghost sm" data-sheet-manual-confirm="${kind}">✓ Valider</button>
          <button type="button" class="btn ghost sm" data-sheet-manual-cancel="1">Annuler</button>
        </div>
      </div>`;
    }
    const canManual = kind && PC_SHEET_MANUAL_KINDS.has(kind);
    return `<div class="sheet-box">
      ${kind?`<button type="button" class="icon-btn sm dice-btn" data-sheet-reroll="${kind}" title="Relancer">🎲</button>`:""}
      <span class="lbl">${esc(label)}</span>
      <span class="val${canManual?" clickable-val":""}" ${canManual?`data-sheet-value="${kind}" title="Cliquer pour saisir/choisir manuellement"`:""}>${val}</span>${extra||""}
    </div>`;
  };
  const origin = pcOriginLine(d.skills);
  const restSkills = String(d.skills||"").split(/\r?\n/).slice(1).filter(l=>l.trim());
  const sgn = m=>(m>=0?"+":"")+m;
  const weaponLoadout = (d.weapons||[]).map(w=>weaponLoadoutLine(w,d)).filter(Boolean);
  const weaponBlock = [
    d.masteredWeapon
      ? `${esc(d.masteredWeapon)} (maîtrisée) : +${1+Math.floor((parseInt(d.level)||1)/2)}`
      : (cd ? `Armes autorisées : ${esc(cd.weapons)}` : "—"),
    ...weaponLoadout.map(w=>`${esc(w.name)} : attaque ${sgn(w.atk)}, dégâts ${esc(w.dmg)}`)
  ].join("<br>");
  const spellCastMod = (cd && cd.spellClass && cd.spellAbility) ? totalAbilityMod(d,cd.spellAbility) : null;
  const spellCastLine = spellCastMod!==null
    ? `Test d'incantation : 1d20${sgn(spellCastMod)} <span class="faint">(${ABILITY_LABELS[cd.spellAbility]})</span>`
    : "";
  // CA automatique (2026-08-18, demande de Tristan : "ça ne devrait pas avoir besoin d'appuyer
  // sur relancer") — recalculée à CHAQUE rendu depuis l'armure/bouclier équipés + mod. DEX total,
  // jamais stockée comme une valeur qu'on tire/édite manuellement sur cette fiche ; synchronisée
  // dans pcSheetDraft.ac uniquement au moment d'Enregistrer (savePCSheet), pour que les listes/PDF
  // qui lisent p.ac directement restent corrects sans recalcul.
  const acValue = computeACFromLoadout(d, totalAbilityMod(d,"dex"));
  const abilitiesBoxHTML = (pcSheetManualField==="abilities")
    ? `<div class="sheet-box">
        <span class="lbl">Caractéristiques</span>
        ${pcWizardManualHTML("abilities", d, pcSheetManualCurrentValue("abilities", d))}
        <div style="margin-top:.45rem;display:flex;gap:.4rem">
          <button type="button" class="btn ghost sm" data-sheet-manual-confirm="abilities">✓ Valider</button>
          <button type="button" class="btn ghost sm" data-sheet-manual-cancel="1">Annuler</button>
        </div>
      </div>`
    : `<div class="sheet-box">
        <button type="button" class="icon-btn sm dice-btn" data-sheet-reroll="abilities" title="Relancer les 6 caractéristiques (3d6)">🎲</button>
        <span class="lbl">Caractéristiques</span>
        <div class="sheet-abilities">${ab.map(([lbl,k])=>{
          const score = abilityScoreOf(d[k]);
          const bonus = Number(d.abilityBonuses && d.abilityBonuses[k]) || 0;
          const total = parseAbilityMod(d[k]) + bonus;
          return `<div class="ab-line">
            <b class="clickable-val" data-sheet-value="abilities" title="Cliquer pour saisir le score manuellement">${lbl} ${score||"—"}</b>
            <input type="text" class="ab-bonus" data-pc-ability-bonus="${k}" value="${bonus?esc(String(bonus)):""}" placeholder="+0" title="Bonus d'objets/effets sur cette caractéristique">
            <span class="ab-total" title="Modificateur total (base + bonus d'objets)">${sgn(total)}</span>
          </div>`;
        }).join("")}</div>
      </div>`;
  const leftCol = `<div class="pc-sheet-col">
    ${abilitiesBoxHTML}
    <div class="sheet-row2">
      ${box("PV", `${esc(d.hpCurrent||"—")} / ${esc(d.hp||"—")}`, "hp")}
      <div class="sheet-box"><span class="lbl">CA</span><span class="val" title="Calculée depuis l'équipement porté ci-dessous">${acValue}</span></div>
    </div>
    <div class="sheet-box">
      <span class="lbl">Attaques</span>
      <div class="val" style="font-size:.9rem">${weaponBlock}${spellCastLine?`<br>${spellCastLine}`:""}</div>
    </div>
    <div class="sheet-box sheet-panel">
      <div class="sheet-banner">Équipement porté</div>
      <div class="row" style="gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem">
        <div class="field" style="flex:1 1 160px;margin:0"><label style="font-size:.75rem">Armure</label>
          <select data-pc-armor="1">${pcArmorOptions(cd, d.equippedArmor).map(a=>`<option value="${a.id}" ${(d.equippedArmor||"none")===a.id?"selected":""}>${esc(a.name)}</option>`).join("")}</select></div>
        <div class="field" style="flex:0 1 100px;margin:0"><label style="font-size:.75rem">Bonus magique</label>
          <input type="text" data-pc-armor-bonus="1" value="${d.armorMagicBonus?esc(String(d.armorMagicBonus)):""}" placeholder="+0"></div>
      </div>
      <label style="display:flex;align-items:center;gap:.4rem;font-family:var(--ui);font-size:.82rem;margin-bottom:.5rem;cursor:${pcShieldAllowed(cd,d)?"pointer":"not-allowed"};${pcShieldAllowed(cd,d)?"":"opacity:.55"}" title="${pcShieldAllowed(cd,d)?"":"Cette classe n'autorise pas les boucliers"}">
        <input type="checkbox" data-pc-shield="1" ${d.equippedShield?"checked":""} ${pcShieldAllowed(cd,d)?"":"disabled"} style="width:auto"> Bouclier (+2 CA)
        ${d.equippedShield?`<input type="text" data-pc-shield-bonus="1" value="${d.shieldMagicBonus?esc(String(d.shieldMagicBonus)):""}" placeholder="+0" style="width:4rem">`:""}
      </label>
      <div id="pc-weapons-wrap">
        ${(d.weapons||[]).map((w,i)=>`<div class="row" style="gap:.4rem;align-items:flex-end;margin-bottom:.4rem">
          <div class="field" style="flex:1 1 140px;margin:0"><select data-pc-weapon-select="${i}">
            <option value="">— Choisir une arme —</option>
            ${pcWeaponOptions(cd, w.weaponId).map(wd=>`<option value="${wd.id}" ${w.weaponId===wd.id?"selected":""}>${esc(wd.name)} (${wd.damage})</option>`).join("")}
          </select></div>
          <div class="field" style="flex:0 1 80px;margin:0"><input type="text" data-pc-weapon-bonus="${i}" value="${w.magicBonus?esc(String(w.magicBonus)):""}" placeholder="+0"></div>
          <button type="button" class="btn danger sm" data-pc-weapon-remove="${i}">✕</button>
        </div>`).join("")}
      </div>
      <button type="button" class="btn ghost sm" data-pc-weapon-add="1" style="margin-bottom:.5rem">+ Ajouter une arme</button>
      <p class="faint" style="font-family:var(--ui);font-size:.8rem;margin:0 0 .5rem">${d.invSlots?`${esc(d.invSlots)} emplacements`:""} <button type="button" class="icon-btn sm" data-sheet-reroll="gold" title="Ajouter un tirage d'or de départ" style="width:1.4rem;height:1.4rem;padding:0;border-radius:50%;vertical-align:middle">🎲</button></p>
      ${d.inventory?`<ol class="sheet-gear-list">${String(d.inventory).split(/\r?\n/).filter(l=>l.trim()).map(l=>`<li>${renderText(l)}</li>`).join("")}</ol>`:'<p class="faint" style="font-family:var(--ui);font-size:.85rem">(vide)</p>'}
    </div>
  </div>`;
  // Portrait (2026-08-18, retour de Tristan) : déplacé en tête de la colonne du milieu, à côté
  // de Nom/Ascendance rétrécis, plutôt qu'en pleine largeur en haut de la colonne de gauche ou
  // dans une section "Portraits" séparée tout en bas de la fiche — objectif "rectangle sans
  // vide". Si aucun portrait officiel (d.portrait, choisi via portraitFieldHTML) n'est défini,
  // on retombe sur la première image de la galerie libre (d.images) : plusieurs PJ plus anciens
  // n'ont qu'une illustration déposée là, faute d'avoir utilisé le sélecteur de portrait dédié —
  // pas de raison de la laisser perdue en bas de page si elle peut servir de portrait. Dans ce
  // cas, cette même image est retirée de la galerie affichée en bas pour ne pas apparaître deux
  // fois (voir galleryImages plus bas).
  const usesFirstImageAsPortrait = !d.portrait && d.images && d.images.length>0;
  const portraitSrc = d.portrait ? `portraits/${esc(d.portrait)}` : (usesFirstImageAsPortrait ? d.images[0].data : "");
  const galleryImages = usesFirstImageAsPortrait ? d.images.slice(1) : (d.images||[]);
  const midCol = `<div class="pc-sheet-col">
    <div style="display:flex;gap:.6rem;align-items:flex-start">
      <div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:.6rem">

        ${box("Ascendance", esc(d.ancestry||"—"), "ancestry")}
      </div>
      ${portraitSrc?`<img class="detail-portrait portrait-gray" src="${portraitSrc}" alt="" style="width:96px;aspect-ratio:63/88;float:none;margin:0;flex:0 0 auto">`:""}
    </div>
    ${ascTrait?`<p class="faint" style="font-family:var(--ui);font-size:.78rem;margin:-.4rem 0 0">${esc(ascTrait)}</p>`:""}
    ${box("Classe", esc(d.cls||"—"), "cls")}
    ${box("Titre", esc(titre||"—"))}
    ${box("Alignement", esc(cap(d.alignment)||"—"), "alignment")}
    ${box("Origine", esc(origin||"—"), "origin")}
    ${box("Langues", esc(d.languages||"—"), "languages")}
    ${d.cls==="Prêtre"?box("Divinité", esc(d.deity||"—"), "deity"):""}
    ${cd&&cd.usesMentor?box("Mentor", esc(d.mentor||"—"), "mentor"):""}
    ${restSkills.length?`<div class="sheet-box"><span class="lbl">Compétences</span>${renderBullets(restSkills.join("\n"))}</div>`:""}
    ${d.info?`<div class="sheet-box">
      <span class="lbl">Informations</span>
      <div class="prose" style="font-family:var(--ui);font-size:.85rem">${renderText(d.info)}</div>
    </div>`:""}
  </div>`;
  const rightCol = `<div class="pc-sheet-col">
    <div class="sheet-box sheet-panel">
      <div class="sheet-banner">Talents / Sorts</div>
      ${pcClassSectionHTML(d)}
      ${pcSpellLinesHTML(d, spellCastMod)}
    </div>
  </div>`;
  app.innerHTML = `<div class="detail">
    <button class="back" data-back="1">← PJ</button>
    <span class="tag pc">PJ</span>
    <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
      <h1>${esc(d.name||"Sans nom")}</h1>
      ${favStarHTML("pc",p.id,p.favorite,true)}
    </div>
    ${detailActions("pc",p.id,{hideEdit:true})}
    <div style="margin:.2rem 0 .8rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
      <button class="btn ghost sm" data-print-pc="${p.id}">🖨 Imprimer cette fiche (PDF)</button>
      ${dirty?`<button class="btn" data-sheet-save="${p.id}">✓ Enregistrer les modifications</button><button class="btn ghost" data-sheet-discard="${p.id}">↺ Annuler les modifications</button>`:`<span class="faint" style="font-family:var(--ui);font-size:.8rem">Clique une case pour la modifier (🎲 relance, texte = saisie) — rien n'est enregistré tant que tu ne cliques pas sur "Enregistrer".</span>`}
    </div>
    <div class="pc-sheet">${leftCol}${midCol}${rightCol}</div>
    ${galleryImages.length?`<div class="section"><h2>Portraits</h2>
      <div class="gallery">${galleryImages.map(img=>`<img class="gimg" src="${img.data}" alt="${esc(img.name||'')}" data-lightbox="${img.data}">`).join("")}</div></div>`:""}
    ${backlinksBlock("pc",p.id)}

   pour spellCastLine ci-dessus) s'applique à tous, donc affiché à droite de CHAQUE ligne plutôt
   que dans un tableau séparé de DD par rang (retiré, jugé inutile par Tristan). */
function pcSpellLinesHTML(d, spellCastMod){
  const lines = String(d.spells||"").split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return "";
  const castTxt = spellCastMod!==null ? `1d20${spellCastMod>=0?"+":""}${spellCastMod}` : "";
  return `<div style="${CLASS_SUBLABEL_STYLE}">Sortilèges connus</div>

/* Relance un champ de la fiche graphique — modifie uniquement pcSheetDraft (jamais db.pcs
   directement), puis réaffiche. Réutilise le même moteur de tirage que l'assistant pas-à-pas
   et les boutons de relance de formPC(). */
function handlePCSheetReroll(kind){
  const d = pcSheetDraft; if(!d) return;
  const cd = CLASSES_DATA[d.cls];
  const sgn = m=>(m>=0?"+":"")+m;
  switch(kind){
    case "name": d.name = rollName(); break;
    case "ancestry": {
      const r = rollAscendance();
      d.ancestry = r.name;
      if(r.unmatched) toast(`Ascendance tirée : « ${r.name} » — personnalisée, aucun bonus mécanique automatique.`);
      break;
    }
    case "cls": d.cls = rollClass(); break;
    case "alignment": d.alignment = rollAlignment(); break;
    case "abilities": {
      const scores = rollAbilityScores();
      ["str","dex","con","int","wis","cha"].forEach(k=>{ d[k] = `${scores[k]} (${sgn(ABILITY_MOD(scores[k]))})`; });
      break;
    }
    case "hp": {
      if(!cd){ toast("Choisis d'abord une classe pour relancer les PV."); return; }
      const conMod = parseAbilityMod(d.con);
      const asc = ASCENDANCES[d.ancestry];
      const hp = rollHP(cd, conMod, !!(asc&&asc.robust));
      d.hp = String(hp); d.hpCurrent = String(hp);
      break;
    }
    case "origin": d.skills = pcSetOriginLine(d.skills, rollOrigin()); break;
    case "languages": {
      if(!cd){ toast("Choisis d'abord une classe pour relancer les langues."); return; }
      d.languages = rollLanguages(cd).join(", ");
      break;
    }
    case "deity": d.deity = rollDeity(d.alignment); break;
    case "mentor": d.mentor = rollMentor(); break;
    case "gold": d.inventory = (d.inventory?d.inventory+"\n":"") + `${rollGold()} po pour acheter votre équipement de départ.`; break;
    // CA retirée d'ici (2026-08-18) : plus de bouton de relance, elle est recalculée à chaque
    // rendu de detailPC() directement depuis l'équipement/les caractéristiques — voir acValue.
  }
  render();
}

function rollTalents(id){
  const p = getEntity("pc",id); if(!p) return;
  const total = (1+Math.floor(Math.random()*6)) + (1+Math.floor(Math.random()*6));
  let matched = null;
  document.querySelectorAll("#talents-body tr").forEach(tr=>{
    const inRange = rangeContains(tr.dataset.rollRange, total);
    tr.classList.toggle("rolled", inRange);
    if(inRange) matched = tr;
  });
  const out = $("#talent-roll-out");
  out.textContent = `→ 2d6 = ${total} : ${matched ? matched.children[1].textContent.trim() : "aucune ligne correspondante"}`;
  if(matched) matched.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function rangeContains(range, n){
  range = String(range||"").trim(); if(!range) return false;
  let m;
  if((m = range.match(/^(\d+)\s*[-–]\s*(\d+)$/))){ const a=+m[1], b=+m[2]; return n>=Math.min(a,b) && n<=Math.max(a,b); }
  if((m = range.match(/^(\d+)\s*\+$/))) return n >= +m[1];
  if(/^\d+$/.test(range)) return n === +range;
  return false;
}

    <div class="meta" style="margin-top:.6rem">${s.range?`<span class="tag">Portée : ${esc(s.range)}</span>`:""}${s.duration?`<span class="tag">Durée : ${esc(s.duration)}</span>`:""}</div>
    ${(s.effect&&s.effect.trim())
      ? `<div class="section"><h2>Effet</h2>${renderBullets(s.effect)}</div>`
      : `<p class="faint" style="font-family:var(--ui)">Aucun effet renseigné.</p>`}
    <p class="faint" style="font-family:var(--ui);font-size:.82rem">DD pour lancer : ${spellCastDC(s.tier)} (10 + rang). Échec de 5 ou plus (ou 1 naturel) : le sort est perdu jusqu'au prochain repos — à suivre manuellement, non tracké par l'appli pour l'instant.</p>
    ${backlinksBlock("spell",s.id)}
  </div>`;
}

<script>
/* ---- Import XML des créatures (format libre & tolérant, avec gestion des doublons) ---- */
let _xmlPending = null;
function importXML(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const doc = new DOMParser().parseFromString(r.result, "application/xml");
      if(doc.querySelector("parsererror")) throw new Error("XML mal formé");
      const nodes = doc.getElementsByTagName("creature").length ? [...doc.getElementsByTagName("creature")]
        : [...doc.documentElement.children].filter(n=>/creature|monster|stat/i.test(n.tagName));
      if(!nodes.length) throw new Error("Aucune balise <creature> trouvée");
      _xmlPending = nodes.map(parseCreatureNode).filter(c=>c.name);
      const existing = new Set(db.creatures.map(c=>(c.name||"").toLowerCase()));
      const dupes = _xmlPending.filter(c=>existing.has((c.name||"").toLowerCase())).length;
      openModal(`<h2 style="margin:.1rem 0 .5rem;color:var(--gold2)">Importer ${_xmlPending.length} créature(s)</h2>
        <p style="font-family:var(--ui);font-size:.9rem;line-height:1.55;color:var(--muted);margin:0 0 1rem">
          ${dupes>0 ? `<b style="color:var(--gold2)">${dupes}</b> portent un nom déjà présent (doublons potentiels).<br>` : `Aucun doublon détecté.<br>`}
          <b style="color:var(--green)">Ignorer les doublons</b> : n'ajoute que les nouvelles.<br>
          <b style="color:var(--gold2)">Remplacer les doublons</b> : met à jour les fiches existantes (par nom), ajoute les nouvelles.<br>
          <b>Tout ajouter</b> : ajoute tout, même en double.</p>
        <div class="form-actions" style="margin-top:0;flex-wrap:wrap">
          <button class="btn" data-xml-skip="1">⏭ Ignorer les doublons</button>
          <button class="btn ghost" data-xml-replace="1">♻ Remplacer les doublons</button>
          <button class="btn ghost" data-xml-all="1">➕ Tout ajouter</button>
          <button class="btn ghost" data-modal-close="1">Annuler</button>
        </div>`);
    }catch(e){ toast("Import XML échoué : "+e.message); }
  };
  r.readAsText(file);
}
function applyXMLImport(mode){
  if(!_xmlPending) return;
  let added=0, replaced=0, skipped=0;
  const byName = {}; db.creatures.forEach(c=>{ byName[(c.name||"").toLowerCase()] = c; });
  _xmlPending.forEach(c=>{
    const key = (c.name||"").toLowerCase();
    const exist = byName[key];
    if(exist && mode!=="all"){
      if(mode==="replace"){
        const id=exist.id, imgs=exist.images;
        Object.keys(exist).forEach(k=>delete exist[k]);
        Object.assign(exist, c); exist.id=id; exist.imported=true;
        if((!c.images||!c.images.length) && imgs && imgs.length) exist.images=imgs;
        replaced++;
      } else skipped++;                       // mode "skip"
    } else {
      c.id=uid(); c.imported=true; db.creatures.push(c); byName[key]=c; added++;
    }
  });
  _xmlPending=null; saveDB(); view={tab:"creatures",mode:"list",id:null}; render();
  toast(`Import : ${added} ajoutée(s), ${replaced} remplacée(s), ${skipped} ignorée(s).`);
}
function openPurgeModal(){
  const manual = db.creatures.filter(c=>c.manual).length;
  const other = db.creatures.length - manual;
  openModal(`<h2 style="margin:.1rem 0 .5rem;color:var(--blood2)">Vider les créatures</h2>
    <p style="font-family:var(--ui);font-size:.9rem;line-height:1.55;color:var(--muted);margin:0 0 .9rem">
      <b>${other}</b> créature(s) importée(s) ou non marquée(s) seront <b style="color:var(--blood2)">supprimées</b>.<br>
      <b>${manual}</b> créée(s) à la main seront <b style="color:var(--green)">conservées</b>.</p>
    <label style="display:flex;align-items:center;gap:.5rem;font-family:var(--ui);font-size:.88rem;margin-bottom:1.1rem;cursor:pointer">
      <input type="checkbox" id="purge-manual" style="width:auto"> Supprimer aussi les ${manual} créature(s) créée(s) à la main</label>
    <div class="form-actions" style="margin-top:0">
      <button class="btn danger" data-purge-confirm="1">🗑 Vider</button>
      <button class="btn ghost" data-modal-close="1">Annuler</button>
    </div>`);
}
function purgeCreatures(all){
  const before = db.creatures.length;
  const removed = all ? db.creatures.slice() : db.creatures.filter(c=>!c.manual);
  db.creatures = all ? [] : db.creatures.filter(c=>c.manual);
  removed.forEach(c=>deleteRemote("creatures", c.id));
  view={tab:"creatures",mode:"list",id:null}; render();
  toast(`${before-db.creatures.length} créature(s) supprimée(s).`);
}
function parseCreatureNode(node){
  const get = (sel)=>{ const el = node.querySelector(sel); return el ? el.textContent.trim() : ""; };
  const attrOr = (sel, attr, fallbackSel)=>{
    const el = node.querySelector(sel);
    if(el && el.getAttribute(attr)!=null) return el.getAttribute(attr).trim();
    return fallbackSel!=null ? get(fallbackSel) : "";
  };
  const c = {
    name: get("name") || node.getAttribute("name") || "",
    category: get("category") || get("categorie") || "",
    desc: get("description") || get("desc") || "",
    ac: get("ac") || get("armorclass") || attrOr("stats","ac"),
    hp: get("hp") || get("hitpoints") || attrOr("stats","hp"),
    level: get("level") || attrOr("stats","level"),
    alignment: (get("alignment")||"chaos").toLowerCase(),
    abilities: get("abilities") || get("special") || get("immunities") || "",
    attacks: []
  };
  // Caractéristiques : soit <stats str=".."/>, soit balises individuelles <str>..</str>
  const statsEl = node.querySelector("stats") || node.querySelector("abilities-scores");
  const keys = {str:["str","strength"],dex:["dex","dexterity"],con:["con","constitution"],int:["int","intelligence"],wis:["wis","sag","wisdom","sagesse"],cha:["cha","charisma","charisme"]};
  Object.entries(keys).forEach(([k,aliases])=>{
    let v="";
    if(statsEl){ for(const a of aliases){ if(statsEl.getAttribute(a)!=null){ v=statsEl.getAttribute(a); break; } } }
    if(!v){ for(const a of aliases){ const el=node.querySelector(a); if(el){ v=el.textContent.trim(); break; } } }
    c[k]=v;
  });
  // normaliser alignement
  if(/cha|chaos/.test(c.alignment)) c.alignment="chaos";
  else if(/loy|law/.test(c.alignment)) c.alignment="loyal";
  else if(/neut/.test(c.alignment)) c.alignment="neutre";
  // Attaques
  node.querySelectorAll("attack").forEach(a=>{
    const nm = a.getAttribute("name") || (a.querySelector("name")?.textContent) || a.textContent.trim();
    c.attacks.push({
      name: (nm||"").trim(),
      bonus: a.getAttribute("bonus") || a.querySelector("bonus")?.textContent?.trim() || "",
      damage: a.getAttribute("damage") || a.querySelector("damage")?.textContent?.trim() || "",
      range: normRange(a.getAttribute("range") || a.querySelector("range")?.textContent?.trim() || "close")
    });
  });
  return c;
}
function normRange(r){
  r=(r||"").toLowerCase();
  if(/far|long|lointain/.test(r)) return "far";
  if(/near|inter|proche|moyen/.test(r)) return "near";
  return "close";
}
function xmlSample(){
  const sample = `<?xml version="1.0" encoding="UTF-8"?>
<!-- Modèle d'import de créatures Codex (Shadowdark).
     Format libre et tolérant : les caractéristiques peuvent être données
     soit en attributs de <stats/>, soit en balises individuelles.
     L'alignement accepte : chaos / loyal / neutre. -->
<creatures>
  <creature>
    <name>Gobelin des cavernes</name>
    <description>Petit humanoïde fourbe qui chasse en meute.</description>
    <ac>13</ac>
    <hp>5</hp>
    <level>1</level>
    <alignment>chaos</alignment>
    <stats str="-1" dex="+2" con="+1" int="+0" wis="-1" cha="-1"/>
    <attacks>
      <attack name="Dague rouillée" bonus="+2" damage="1d6-1" range="close"/>
      <attack name="Fronde" bonus="+2" damage="1d4" range="far"/>
    </attacks>
    <abilities>Vision dans le noir 18m. Avantage en meute (3+).</abilities>
  </creature>

  <creature>
    <name>Spectre du seuil</name>
    <description>Ombre gardienne liée à une porte scellée.</description>
    <ac>12</ac><hp>18</hp><level>4</level><alignment>chaos</alignment>
    <!-- variante : caractéristiques en balises -->
    <str>+0</str><dex>+3</dex><con>+2</con><int>+1</int><wis>+2</wis><cha>+3</cha>
    <attacks>
      <attack name="Toucher glacial" bonus="+4" damage="2d6" range="close"/>
    </attacks>
    <abilities>Immunité : poison, charme, épuisement. Insaisissable (traverse les murs).</abilities>
  </creature>
</creatures>`;
  downloadBlob(new Blob([sample],{type:"application/xml"}), "modele-creatures-shadowdark.xml");
  toast("Modèle XML téléchargé.");
}
function exportCreaturesXML(){
  const items = db.creatures;
  if(!items.length){ toast("Rien à exporter pour l'instant."); return; }
  const body = items.map(c=>{
    const atk = (c.attacks||[]).map(a=>`      <attack name="${esc(a.name||"")}" bonus="${esc(a.bonus||"")}" damage="${esc(a.damage||"")}" range="${esc(a.range||"")}"/>`).join("\n");
    return `  <creature>
    <name>${esc(c.name||"")}</name>
    <category>${esc(c.category||"")}</category>
    <description>${esc(c.desc||"")}</description>
    <ac>${esc(c.ac||"")}</ac>
    <hp>${esc(c.hp||"")}</hp>
    <level>${esc(c.level||"")}</level>
    <alignment>${esc(c.alignment||"")}</alignment>
    <stats str="${esc(c.str||"")}" dex="${esc(c.dex||"")}" con="${esc(c.con||"")}" int="${esc(c.int||"")}" wis="${esc(c.wis||"")}" cha="${esc(c.cha||"")}"/>
    <attacks>
${atk}
    </attacks>
    <abilities>${esc(c.abilities||"")}</abilities>
  </creature>`;
  }).join("\n\n");
  const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<creatures>\n${body}\n</creatures>`;
  downloadBlob(new Blob([xml],{type:"application/xml"}), "export-creatures-shadowdark.xml");
  toast(`Export XML : ${items.length} créature(s).`);
}

</script>

<script>

/* =========================================================================
   NAVIGATION & ÉVÉNEMENTS
   ========================================================================= */
/* Un lien [[Nom]]/résultat de recherche/puce "mentionné dans" peut techniquement pointer vers un
   type d'entité dont l'onglet n'est pas accessible au rôle courant (ex. un lien vers un Point Crawl
   MJ écrit dans une note de session, par ailleurs visible aux joueurs) — findByName()/renderText()
   ne filtrent pas par rôle à la résolution du lien, seulement au clic, ici. Signalé par Tristan
   (2026-08-10) en testant le mode aperçu : cliquer dessus ne doit PROVOQUER AUCUNE navigation (pas
   de page "ce n'est pas accessible" — juste rester exactement où on était), avec seulement un petit
   signal (toast) pour que le clic ne semble pas simplement ignoré. */
function goto(type,id){
  const tab = TAB_OF[type];
  if(effectiveRole()!=="gm" && (!PLAYER_VISIBLE_TABS.includes(tab) || !playerCanViewEntity(type, getEntity(type,id)))){
    toast("Ce contenu n'est pas accessible.");
    return;
  }
  editReturnTo = null;
  view = { tab, mode:"detail", id };
  $("#search").value=""; $("#search-results").classList.remove("open");
  render();
}

// Onglets
$("#tabs").addEventListener("click", e=>{
  const b = e.target.closest("button[data-tab]"); if(!b) return;
  editReturnTo = null;
  view = { tab:b.dataset.tab, mode:"list", id:null }; render();
  document.body.classList.remove("nav-mobile-open");
});

// Filtre par thème dans l'onglet Événements
app.addEventListener("change", e=>{
  if(e.target.matches("[data-event-filter]")){ eventThemeFilter = e.target.value; renderList(); }
  else if(e.target.matches("[data-crea-sort]")){ creatureSort = e.target.value; renderList(); }
  else if(e.target.matches("[data-crea-filter]")){ creatureCatFilter = e.target.value; renderList(); }
  else if(e.target.matches("[data-table-filter]")){ tableCatFilter = e.target.value; renderList(); }
  else if(e.target.matches("[data-crawl-status-filter]")){ crawlStatusFilter = e.target.value; renderList(); }
  else if(e.target.matches("[data-init-manual-input]")){ setInitiativeManual(e.target.dataset.initManualInput, e.target.value); renderList(); }
  else if(e.target.matches("[data-gmnote-toggle]")){ toggleGmNote(e.target.dataset.gmnoteToggle); }
  else if(e.target.matches("#f-kind")){
    const dyn = e.target.value==="dynamic";
    const srcWrap = document.getElementById("dynamic-source-wrap"), rowsSec = document.getElementById("rows-section");
    if(srcWrap) srcWrap.classList.toggle("hidden", !dyn);
    if(rowsSec) rowsSec.classList.toggle("hidden", dyn);
  }
  else if(e.target.matches("#f-source")){
    const filterWrap = document.getElementById("dynamic-filter-wrap");
    if(filterWrap) filterWrap.classList.toggle("hidden", e.target.value!=="treasure");
  }
  else if(e.target.matches("[data-pc-armor]")){ if(pcSheetDraft){ pcSheetDraft.equippedArmor = e.target.value; render(); } }
  else if(e.target.matches("[data-pc-armor-bonus]")){ if(pcSheetDraft){ pcSheetDraft.armorMagicBonus = e.target.value; render(); } }
  else if(e.target.matches("[data-pc-shield]")){ if(pcSheetDraft){ pcSheetDraft.equippedShield = e.target.checked; render(); } }
  else if(e.target.matches("[data-pc-shield-bonus]")){ if(pcSheetDraft){ pcSheetDraft.shieldMagicBonus = e.target.value; render(); } }
  else if(e.target.matches("[data-pc-weapon-select]")){
    if(pcSheetDraft){ const i=+e.target.dataset.pcWeaponSelect; if(pcSheetDraft.weapons&&pcSheetDraft.weapons[i]){ pcSheetDraft.weapons[i].weaponId = e.target.value; render(); } }
  }
  else if(e.target.matches("[data-pc-weapon-bonus]")){
    if(pcSheetDraft){ const i=+e.target.dataset.pcWeaponBonus; if(pcSheetDraft.weapons&&pcSheetDraft.weapons[i]){ pcSheetDraft.weapons[i].magicBonus = e.target.value; render(); } }
  }
  else if(e.target.matches("[data-pc-ability-bonus]")){
    if(pcSheetDraft){ const k=e.target.dataset.pcAbilityBonus; if(!pcSheetDraft.abilityBonuses) pcSheetDraft.abilityBonuses={}; pcSheetDraft.abilityBonuses[k] = e.target.value; render(); }
  }
});

// Clics globaux dans l'app (délégation)
app.addEventListener("click", e=>{
  const t = e.target;
  const closest = (a)=>t.closest(`[${a}]`);
  let el;
  if((el=closest("data-toggle-group"))){ const k=el.dataset.toggleGroup; expandedGroups.has(k)?expandedGroups.delete(k):expandedGroups.add(k); renderList(); return; }
  if((el=closest("data-toggle-all"))){ const keys=(el.dataset.toggleAllKeys||"").split("|").filter(Boolean); if(el.dataset.toggleAll==="open") keys.forEach(k=>expandedGroups.add(k)); else keys.forEach(k=>expandedGroups.delete(k)); renderList(); return; }
  if((el=closest("data-toggle-reading"))){ readingMode=!readingMode; render(); return; }
  // Doit être vérifié AVANT data-open : l'étoile de favori est imbriquée dans une carte qui porte
  // elle-même data-open (ouvrir la fiche) — l'ordre des tests (et non un stopPropagation()) est ce
  // qui évite qu'un clic sur l'étoile déclenche aussi la navigation vers la fiche.
  if((el=closest("data-toggle-fav"))){
    const [ty,id]=el.dataset.toggleFav.split(":");
    const o=getEntity(ty,id); if(!o) return;
    o.favorite = !o.favorite;
    saveDB(); renderList();
    return;
  }
  if((el=closest("data-toggle-wip"))){
    const o=getEntity("treasure",el.dataset.toggleWip); if(!o) return;
    o.wip = !o.wip;
    saveDB(); renderList();
    return;
  }
  if((el=closest("data-toggle-player-visible"))){
    const o=getEntity("treasure",el.dataset.togglePlayerVisible); if(!o) return;
    o.playerVisible = !o.playerVisible;
    saveDB(); renderList();
    return;
  }
  if((el=closest("data-toggle-fav-filter"))){
    const ty = el.dataset.toggleFavFilter;
    if(ty==="pc") pcFavOnly=!pcFavOnly;
    else if(ty==="npc") npcFavOnly=!npcFavOnly;
    else if(ty==="creature") creatureFavOnly=!creatureFavOnly;
    else if(ty==="treasure") treasureFavOnly=!treasureFavOnly;
    else if(ty==="spell") spellFavOnly=!spellFavOnly;
    renderList();
    return;
  }
  if(closest("data-toggle-wip-filter")){ treasureWipOnly=!treasureWipOnly; renderList(); return; }
  if((el=closest("data-open"))){ const [ty,id]=el.dataset.open.split(":"); goto(ty,id); return; }
  if((el=closest("data-goto"))){ const [ty,id]=el.dataset.goto.split(":"); goto(ty,id); return; }
  if((el=t.closest("[data-create]"))){ toast(`« ${el.dataset.create} » n'existe pas encore — créez cette entité pour activer le lien.`); return; }
  if(closest("data-back")){
    if(view.mode==="wizard") pcWizard = null; // abandon de l'assistant : rien n'a été enregistré
    if(view.tab==="pcs" && view.mode==="detail") pcSheetDraft = null; // abandon des relances non enregistrées de la fiche graphique
    if(editReturnTo){ view={tab:editReturnTo.tab, mode:"detail", id:editReturnTo.id}; editReturnTo=null; }
    else{ view.mode="list"; view.id=null; }
    render(); return;
  }
  if((el=closest("data-new"))){ editReturnTo=null; view.mode="new"; view.id=null; render(); return; }
  if((el=closest("data-edit"))){ editReturnTo=null; const [ty,id]=el.dataset.edit.split(":"); if(ty==="pc") pcSheetDraft=null; view={tab:TAB_OF[ty],mode:"edit",id}; render(); return; }
  if((el=closest("data-dup"))){ const [ty,id]=el.dataset.dup.split(":"); duplicateEntity(ty,id); return; }
  if((el=closest("data-toggle-gm-created"))){
    const [ty,id]=el.dataset.toggleGmCreated.split(":");
    const o=getEntity(ty,id); if(!o) return;
    o.gmCreated = !o.gmCreated;
    saveDB(); render();
    return;
  }
  if((el=closest("data-del"))){
    const [ty,id]=el.dataset.del.split(":");
    confirmModal("Supprimer définitivement cet élément ?", ()=>{ deleteEntity(ty,id); view.mode="list"; view.id=null; render(); toast("Supprimé."); });
    return;
  }
  if((el=closest("data-save"))){
    const ty = el.dataset.save;
    if(ty==="event") saveEvent(); else if(ty==="table") saveTable();
    else if(ty==="creature") saveCreature(); else if(ty==="session") saveSession();
    else if(ty==="npc") saveNPC(); else if(ty==="pointcrawl") saveCrawl();
    else if(ty==="pc") savePC(); else if(ty==="treasure") saveTreasure();
    else if(ty==="spell") saveSpell();
    else if(ty==="hexmap") saveHexmap();
    else if(ty==="dungeonmap") saveDungeonMap();
    return;
  }
  // Lancer les talents 2d6 (table dérivée de la classe, voir detailPC)
  if((el=closest("data-roll-talents"))){ rollTalents(el.dataset.rollTalents); return; }
  if(closest("data-gen-pc")){ generateRandomPC(); return; }
  if(closest("data-gen-npc")){ generateRandomNPC(); return; }
  // Assistant de création pas-à-pas (PJ)
  if(closest("data-pc-wizard-start")){ startPCWizard(); return; }
  if(closest("data-wiz-keep")){
    const steps = pcWizardStepList(pcWizard.draft);
    const step = steps[pcWizard.stepIndex];
    pcWizardApply(step.id, pcWizard.draft, pcWizard.value);
    pcWizard.stepIndex++; pcWizard.value=undefined; pcWizard.manual=false; pcWizard.rolled=false;
    render(); return;
  }
  if(closest("data-wiz-reroll")){
    const steps = pcWizardStepList(pcWizard.draft);
    const step = steps[pcWizard.stepIndex];
    pcWizard.value = pcWizardRoll(step.id, pcWizard.draft);
    pcWizard.log.push(pcWizardFieldLog(step.id, pcWizard.value, pcWizard.draft, false));
    render(); return;
  }
  if(closest("data-wiz-manual")){ pcWizard.manual = true; render(); return; }
  if(closest("data-wiz-cancel-manual")){ pcWizard.manual = false; render(); return; }
  if(closest("data-wiz-confirm-manual")){
    const steps = pcWizardStepList(pcWizard.draft);
    const step = steps[pcWizard.stepIndex];
    const val = pcWizardReadManual(step.id, pcWizard.draft);
    pcWizard.log.push(pcWizardFieldLog(step.id, val, pcWizard.draft, true));
    pcWizardApply(step.id, pcWizard.draft, val);
    pcWizard.stepIndex++; pcWizard.value=undefined; pcWizard.manual=false; pcWizard.rolled=false;
    render(); return;
  }
  if(closest("data-wiz-save")){ finishPCWizard(); return; }
  // Boutons de relance champ par champ sur la fiche PJ existante (formPC) — voir handlePCFieldReroll()
  if((el=closest("data-reroll"))){ handlePCFieldReroll(el.dataset.reroll); return; }
  // Fiche PJ graphique (cases cliquables) — voir detailPC()/handlePCSheetReroll()
  if((el=closest("data-sheet-reroll"))){ handlePCSheetReroll(el.dataset.sheetReroll); return; }
  if((el=closest("data-sheet-save"))){ savePCSheet(el.dataset.sheetSave); return; }
  if((el=closest("data-sheet-discard"))){ discardPCSheet(el.dataset.sheetDiscard); return; }
  if((el=closest("data-sheet-value"))){ pcSheetManualField = el.dataset.sheetValue; render(); return; }
  if(closest("data-sheet-manual-cancel")){ pcSheetManualField = null; render(); return; }
  if((el=closest("data-sheet-manual-confirm"))){
    const kind = el.dataset.sheetManualConfirm;
    if(pcSheetDraft){ applyPCSheetManualValue(kind, pcSheetDraft, pcWizardReadManual(kind, pcSheetDraft)); }
    pcSheetManualField = null;
    render(); return;
  }
  if(closest("data-pc-weapon-add")){

/* Intitulés de colonnes lus dans l'entête de la grille (vide = table simple à une colonne). Un
   intitulé laissé vide est remplacé par « Colonne N » plutôt qu'ignoré : le supprimer décalerait
   les cellules des rangées, alors que l'utilisateur voulait juste ne pas le nommer. */
function formTableColumns(){
  const inputs = [...document.querySelectorAll("#cols-head .col-name-input")];
  if(inputs.length<2) return [];
  return inputs.map((el,i)=> el.value.trim() || `Colonne ${i+1}`);
}
/* Contenu courant des rangées du formulaire, une entrée par rangée, chacune = tableau de cellules
   (une par champ de la rangée) — lu depuis le DOM, donc reflète les colonnes actuellement rendues. */
function formTableRowCells(){
  return [...document.querySelectorAll("#rows-wrap .repeat-item")]
    .map(item=>[...item.querySelectorAll(".row-input")].map(i=>i.value.trim()));
}
function applyRowCount(){
  const n = Math.max(1, Math.min(100, parseInt($("#row-count").value)||1));
  const cols = formTableColumns();
  const current = formTableRowCells();
  const rows = [];
  for(let i=0;i<n;i++) rows.push(current[i] || []);
  $("#rows-wrap").innerHTML = rows.map((r,i)=>rowInput(r,i,cols)).join("");
}
/* Redessine entête + rangées pour un nouveau jeu de colonnes, en conservant la saisie en cours.
   Les cellules sont seulement redimensionnées (complétées à vide / tronquées), JAMAIS redécoupées :
   repasser par la forme texte « A / B » pour la refendre casserait toute cellule contenant elle-même
   un « / » (« le/la rattrape. »), c'est-à-dire précisément le défaut que le passage aux cellules
   distinctes corrige. Ajouter une colonne ajoute donc une case vide, comme dans un tableur. */
function renderTableEditorGrid(cols, cellRows){
  const n = Math.max(1, cols.length);
  const rows = cellRows.map(cells=>{
    const out = cells.slice(0,n);
    while(out.length<n) out.push("");
    return out;
  });
  $("#cols-head").innerHTML = colsHeadHTML(cols);
  $("#rows-wrap").innerHTML = rows.map((r,i)=>rowInput(r,i,cols)).join("");
  const jm = $("#f-joinmode"); if(jm) jm.classList.toggle("hidden", cols.length<2);
}
/* Ajout d'une colonne. Depuis une table simple, on en crée DEUX (l'existante, jusque-là implicite,
   plus la nouvelle) — sinon la table resterait à une colonne et le clic semblerait sans effet. */
function addTableColumn(){
  const cols = formTableColumns();
  const next = cols.length ? [...cols, `Colonne ${cols.length+1}`] : ["Colonne 1","Colonne 2"];
  renderTableEditorGrid(next, formTableRowCells());
}
/* Suppression d'une colonne : son contenu part avec elle dans chaque rangée. Retomber à une seule
   colonne ramène la table au format simple (l'entête redevient « Résultat »). */
function removeTableColumn(idx){
  const cols = formTableColumns();
  if(!cols.length) return;
  const rows = formTableRowCells().map(cells=>cells.filter((_,c)=>c!==idx));
  const next = cols.filter((_,c)=>c!==idx);
  renderTableEditorGrid(next.length>1?next:[], rows);
}
let lastTableRoll = null; // { tableTitle, text } — dernier tirage, pour l'ajout aux notes de session
function rollTable(id){
  const t = getEntity("table",id); if(!t) return;
  const isDynamic = t.kind==="dynamic";
  const items = isDynamic ? dynamicSourceItems(t) : null;
  const count = isDynamic ? items.length : t.rows.length;
  if(!count) return;
  const idx = Math.floor(Math.random()*count);
  document.querySelectorAll("#table-body tr").forEach(tr=>tr.classList.toggle("rolled", +tr.dataset.rowidx===idx));
  const plain = isDynamic ? (items[idx].name||items[idx].title||"Sans nom") : (firstLine(tableRowText(t.rows[idx]))||"(vide)");
  const linked = isDynamic ? `[[${plain}]]` : plain; // lien cliquable une fois collé dans les notes de session
  const out = $("#roll-out"); out.textContent = `→ ${idx+1} : ${plain}`;
  const tr = document.querySelector(`#table-body tr[data-rowidx="${idx}"]`);
  if(tr) tr.scrollIntoView({block:"nearest",behavior:"smooth"});
  lastTableRoll = `${t.title||"Table"} → ${idx+1} : ${linked}`;
  const addBtn = $("#roll-add-session"); if(addBtn) addBtn.classList.remove("hidden");
}
function currentSession(){
  if(!db.sessions.length) return null;
  return [...db.sessions].sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];
}
function addRollToCurrentSession(text){
  const s = currentSession();
  if(!s){ toast("Aucune session existante — créez-en une d'abord."); return; }
  if(!s.entries || !s.entries.length) s.entries = [{id:uid(), label:"Notes", notes:""}];
  const last = s.entries[s.entries.length-1];
  last.notes = (last.notes ? last.notes+"\n" : "") + text;
  saveDB(); toast(`Ajouté aux notes de « ${s.title||"session"} ».`);
}

  let el;

  if(e.target.closest("[data-modal-close]")){ closeModal(); return; }

  if(e.target.closest("[data-xml-replace]")){ closeModal(); applyXMLImport("replace"); return; }
  if(e.target.closest("[data-xml-all]")){ closeModal(); applyXMLImport("all"); return; }
  if(e.target.closest("[data-xmlg-skip]")){ closeModal(); applyXMLImportGeneric("skip"); return; }
  if(e.target.closest("[data-xmlg-replace]")){ closeModal(); applyXMLImportGeneric("replace"); return; }
  if(e.target.closest("[data-xmlg-all]")){ closeModal(); applyXMLImportGeneric("all"); return; }
  if(e.target.closest("[data-import-merge]")){ const d=_importData; closeModal(); if(d){ const n=mergeDB(d); saveDB(); view={tab:"sessions",mode:"list",id:null}; render(); toast(`Fusion : ${n} élément(s) ajouté(s).`); } return; }
  if(e.target.closest("[data-import-replace]")){
    const d=_importData; closeModal();
    if(d){
      db=Object.assign(emptyDB(), d);
      view={tab:"sessions",mode:"list",id:null}; render();
      toast("Import : données remplacées. Synchronisation en cours…");
      (async ()=>{
        try{ for(const col of DB_COLS) await wipeRemoteTable(col); await saveDB(); toast("Synchronisation terminée."); }
        catch(err){ console.error(err); toast("Erreur lors de la synchronisation du remplacement."); }
      })();
    }
    return;
  }
  if(e.target.closest("[data-modal-ok]")){ const cb=_modalCb; const v=$("#modal-prompt-input")?$("#modal-prompt-input").value:""; closeModal(); if(cb) cb(v); return; }
  if((el=e.target.closest("[data-goto-event]"))){ closeModal(); goto("event", el.dataset.gotoEvent); return; }
  if((el=e.target.closest("[data-edit-event]"))){ closeModal(); editReturnTo={tab:"pointcrawls", id:crawlState.id}; view={tab:"events",mode:"edit",id:el.dataset.editEvent}; render(); return; }
  if((el=e.target.closest("[data-remove-node]"))){ const c=getEntity("pointcrawl",crawlState.id); if(c) removeNode(c, el.dataset.removeNode); closeModal(); return; }

  if((el=e.target.closest("[data-pick-event]"))){ const c=getEntity("pointcrawl",crawlState.id); if(c) addNodeForEvent(c, el.dataset.pickEvent); closeModal(); return; }
  if(e.target.closest("[data-create-event-save]")){ const c=getEntity("pointcrawl",crawlState.id); if(c) createEventFromModal(c); return; }
  if((el=e.target.closest("[data-pick-init-pc]"))){ addInitiativeFromPC(el.dataset.pickInitPc); closeModal(); return; }
  if((el=e.target.closest("[data-pick-init-creature]"))){ addInitiativeFromCreature(el.dataset.pickInitCreature); closeModal(); return; }

  if((el=e.target.closest("[data-wheel-remove-seg]"))){ const it=el.closest(".wheel-seg-item"); if(it) it.remove(); reindexWheelSegRows(); return; }
  if(e.target.closest("[data-wheel-save-segments]")){ saveWheelSegments(); return; }
  if((el=e.target.closest("[data-wheel-preset]"))){ applyWheelPreset(el.dataset.wheelPreset); return; }
  if(e.target.closest("[data-wheel-preset-table]")){
    const sel = document.getElementById("wheel-table-select");
    if(sel && sel.value) applyWheelPresetFromTable(sel.value);
    return;
  }
  if(e.target.closest("[data-wheel-save-preset]")){
    // Champ inline plutôt qu'un promptModal() séparé : l'ancien flux remplaçait tout le contenu de
    // la modale d'édition de la roue le temps de saisir un nom (même conteneur #modal réutilisé),
    // ce qui donnait l'impression trompeuse que l'action faisait "autre chose" que simplement
    // ajouter un préréglage à la liste juste au-dessus — signalé par Tristan (2026-08-11).
    const nameInput = document.getElementById("wheel-preset-name");
    const name = nameInput ? nameInput.value.trim() : "";
    if(!name){ toast("Donne un nom au préréglage avant de l'enregistrer."); if(nameInput) nameInput.focus(); return; }
    const vals = wheelReadRows();
    if(vals.length < 2){ toast("Remplis au moins deux bonus avant d'enregistrer un préréglage."); return; }
    wheelSaveCurrentAsPreset(name);
    return;
  }
  if((el=e.target.closest("[data-wheel-custom-preset]"))){ wheelApplyCustomPreset(el.dataset.wheelCustomPreset); return; }
  if((el=e.target.closest("[data-wheel-delete-preset]"))){ wheelDeleteCustomPreset(el.dataset.wheelDeletePreset); return; }
});
