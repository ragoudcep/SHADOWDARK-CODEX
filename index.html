<script>
"use strict";
/* ==========================================================================
   GRIMOIRE — Gestionnaire de campagne Shadowdark
   Persistance via Supabase (compte unique). Sans dépendance ni build.
   Huit entités : sessions, événements, tables, créatures, PNJ, point crawls, PJ, trésors.
   Liens inter-entités via la syntaxe [[Nom]] + rétroliens (backlinks).
   ========================================================================== */

/* ----------------------------- Stockage (Supabase) ------------------------ */
const SUPABASE_URL = "https://fvwzkjwnzjivxvgvbocq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2d3pranduemppdnh2Z3Zib2NxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzExNTAsImV4cCI6MjEwMTQ0NzE1MH0.djxNfJNOzVW2kWQIKHNnZxR3HBLq-dgOb3qsDDCuvhI";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STORE_KEY = "grimoire_shadowdark_v1"; // ancien cache localStorage — conservé en lecture seule, uniquement pour la migration initiale
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id" + Date.now() + Math.random().toString(36).slice(2));

const emptyDB = () => ({ sessions:[], events:[], creatures:[], tables:[], npcs:[], pointcrawls:[], pcs:[], treasures:[], hexmaps:[], spells:[], initiative:[], wheel:[], dungeonmaps:[], gmnotes:[], cursedscrolledits:[] });

/* Lit l'ancien contenu localStorage (avant migration vers Supabase). Ne sert qu'une fois, au premier login. */
function loadLegacyLocalDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return Object.assign(emptyDB(), d);
  }catch(e){ return null; }
}

/* Charge les 8 tables depuis Supabase (une ligne par entité, colonne `data` en jsonb).
   Les 15 requêtes partent en parallèle (Promise.all) au lieu de s'enchaîner une par une —
   sur un for/await séquentiel, la latence réseau de chaque requête s'additionnait à
   chaque F5, ce qui dominait largement le temps de chargement réel de la page. */
async function fetchRemoteDB(){
  const out = emptyDB();
  await Promise.all(DB_COLS.map(async col => {
    const { data, error } = await sb.from(col).select("data");
    if(error){
      // Une table manquante (ex : script SQL pas encore exécuté) ne doit pas bloquer tout le reste.
      console.error(`Table "${col}" indisponible :`, error);
      return;
    }
    out[col] = (data||[]).map(r=>r.data);
  }));
  return out;
}

let storageOK = true;
/* Pousse tout le contenu actuel de `db` vers Supabase (upsert — n'efface jamais rien).
   Les suppressions sont gérées explicitement via deleteRemote()/wipeRemoteTable(). */
async function saveDB(){
  try{
    for(const col of DB_COLS){
      if(!db[col].length) continue;
      const rows = db[col].map(o=>({ id:o.id, data:o, updated_at:new Date().toISOString() }));
      const { error } = await sb.from(col).upsert(rows);
      if(error) throw error;
    }
    storageOK = true;
  }catch(e){
    console.error(e);
    if(storageOK){ storageOK = false;
      toast("Connexion à la base de données impossible : la dernière modification n'a peut-être pas été synchronisée.");
    }
  }
}

/* Sauvegarde dédiée à la table "initiative", volontairement à part de saveDB().
   saveDB() parcourt DB_COLS et abandonne dès la première collection en échec (throw) —
   or "pcs" est traité avant "initiative" dans cette liste : un enregistrement à problème
   n'importe où dans db.pcs bloquait alors silencieusement toute sauvegarde du suivi
   d'initiative pour le reste de la session (la carte semblait s'ajouter puis disparaissait
   au tick de polling suivant, qui re-récupérait l'état distant jamais réellement mis à jour). */
async function saveInitiative(){
  try{
    if(!db.initiative.length) return;
    const rows = db.initiative.map(o=>({ id:o.id, data:o, updated_at:new Date().toISOString() }));
    const { error } = await sb.from("initiative").upsert(rows);
    if(error) throw error;
  }catch(e){
    console.error(e);
    toast("Connexion à la base de données impossible : le suivi d'initiative n'a peut-être pas été synchronisé.");
  }
}

async function deleteRemote(col, id){
  try{ const { error } = await sb.from(col).delete().eq("id", id); if(error) throw error; }
  catch(e){ console.error(e); toast("Erreur de synchronisation lors de la suppression."); }
}

async function wipeRemoteTable(col){
  const { error } = await sb.from(col).delete().not("id","is",null);
  if(error) throw error;
}

let db = emptyDB();

/* --------------------------- État de navigation -------------------------- */
let view = { tab:"sessions", mode:"list", id:null }; // mode: list | detail | edit | new
let formImages = []; // état temporaire des images pendant l'édition d'une créature / PNJ
let PORTRAITS_MANIFEST = []; // catalogue portraits/manifest.json (bibliothèque partagée PJ/PNJ)
let portraitsReady = false;
let formPortrait = ""; // portrait sélectionné pendant l'édition d'un PJ/PNJ
let formMapImage = ""; // data URL temporaire pendant l'édition d'une carte de donjon
let crawlState = { id:null, linkMode:false, linkFrom:null }; // état de l'éditeur de point crawl
let editReturnTo = null; // {tab,id} — si défini, où revenir après l'édition d'un événement ouvert depuis un point crawl
let eventThemeFilter = "";
let expandedGroups = new Set(); // groupes repliés par défaut ; contient les clés explicitement dépliées
let creatureSort = "name";      // tri des créatures : name | lvlAsc | lvlDesc
let creatureCatFilter = "";     // filtre de catégorie ("" = toutes/regroupées, "__none__" = sans catégorie)
let tableCatFilter = "";        // filtre de catégorie des tables aléatoires (même principe que creatureCatFilter)
let readingMode = false; // "mode table de jeu" : masque les contrôles GM, agrandit le texte des fiches
let crawlStatusFilter = ""; // filtre de statut des point crawls ("" = tous)
/* Filtre global "mes créations" (2026-08-11) : contrairement aux filtres ci-dessus (par onglet),
   celui-ci est UNIQUE et partagé par tous les onglets qui portent le marqueur o.gmCreated (voir
   detailActions()) — bouton dans l'en-tête, pas un <select> par liste. Appliqué explicitement dans
   chaque list*() concerné(e) (mécanique, comme tous les filtres existants du fichier) plutôt que
   via un Proxy global sur `db` : `db` sert aussi à l'écriture (saveDB() doit toujours voir la
   collection complète, jamais une vue filtrée, sous peine de supprimer silencieusement du contenu
   non marqué au prochain enregistrement) — un filtre à l'affichage seulement, jamais sur `db`
   lui-même, élimine ce risque par construction. */
let gmCreatedOnly = false;
function filterGmCreated(list){ return gmCreatedOnly ? list.filter(o=>o.gmCreated) : list; }
/* Favoris (2026-08-11), demandé par Tristan : une petite étoile à cocher sur PJ / PNJ / Créatures /
   Trésor / Sorts, avec un filtre "favoris uniquement" PAR ONGLET (contrairement à gmCreatedOnly,
   qui est un seul bouton global dans l'en-tête) — Tristan veut pouvoir n'afficher que ses favoris
   dans un onglet donné indépendamment des autres, même principe que creatureCatFilter/tableCatFilter.
   Réservé au MJ (comme le marqueur gmCreated) : pas de notion d'utilisateur/préférence individuelle
   dans le modèle de données actuel, donc un favori est un marqueur partagé sur la fiche elle-même —
   masqué en aperçu joueur et pour un vrai compte joueur pour éviter toute confusion. */
let pcFavOnly = false, npcFavOnly = false, creatureFavOnly = false, treasureFavOnly = false, spellFavOnly = false;
function filterFavorites(list, only){ return only ? list.filter(o=>o.favorite) : list; }

/* WIP trésor (2026-08-16), demandé par Tristan : marqueur "en cours d'édition" sur un objet de
   trésorerie (t.wip), masqué PAR DÉFAUT dans la liste — contrairement à favori/gmCreated qui ne
   filtrent que si on active le bouton, ici c'est l'inverse (caché par défaut, un bouton permet de
   les réafficher) puisque le but est justement de ne pas polluer la liste avec des objets pas finis.
   Réservé au trésor pour l'instant (pas de demande pour les autres onglets) et au MJ (même logique
   que favori/gmCreated : masqué en aperçu joueur et pour un vrai compte joueur). */
let treasureWipOnly = false;
function filterWip(list, only){ return only ? list.filter(o=>o.wip) : list.filter(o=>!o.wip); }
function wipIconHTML(id,wip,inline){
  if(effectiveRole()!=="gm") return "";
  return `<button class="fav-star fav-star-wip${wip?" fav-star-on":""}${inline?" fav-star-inline":""}" data-toggle-wip="${id}" title="${wip?"Marquer comme terminé":"Marquer comme WIP"}">🚧</button>`;
}
function wipFilterBtnHTML(only){
  return `<button class="btn ghost sm${only?" active-mode":""}" data-toggle-wip-filter="1" title="Les objets WIP sont masqués de la liste normale — ce bouton bascule vers eux uniquement">${only?"🚧 WIP uniquement":"🚧 Voir les WIP"}</button>`;
}
/* Bascule rapide "visible aux joueurs" sur un objet du Trésor, sans passer par le formulaire —
   même bouton que WIP/favori mais posé juste à sa gauche (voir .fav-star-visible dans style.css). */
function playerVisibleIconHTML(id,visible,inline){
  if(effectiveRole()!=="gm") return "";
  return `<button class="fav-star fav-star-visible${visible?" fav-star-on":""}${inline?" fav-star-inline":""}" data-toggle-player-visible="${id}" title="${visible?"Masquer aux joueurs":"Rendre visible aux joueurs"}">👁</button>`;
}
function favStarHTML(type,id,fav,inline){
  if(effectiveRole()!=="gm") return "";
  return `<button class="fav-star${fav?" fav-star-on":""}${inline?" fav-star-inline":""}" data-toggle-fav="${type}:${id}" title="${fav?"Retirer des favoris":"Ajouter aux favoris"}">${fav?"★":"☆"}</button>`;
}
function favFilterBtnHTML(type,only){
  return `<button class="btn ghost sm${only?" active-mode":""}" data-toggle-fav-filter="${type}" title="N'afficher que les favoris de cet onglet">${only?"★ Favoris uniquement":"☆ Tous"}</button>`;
}
/* Statut d'avancement d'un point crawl (c.status), demandé par Tristan pour s'y retrouver entre
   plusieurs chantiers en parallèle — champ facultatif, "" ou absent = non catégorisé (aucune
   migration : un point crawl existant sans statut reste juste non filtré/sans badge). */
const CRAWL_STATUSES = [
  { value:"creation",  label:"En création",  cls:"status-creation" },
  { value:"avisiter",  label:"À visiter",     cls:"status-avisiter" },
  { value:"encours",   label:"En cours",      cls:"status-encours" },
  { value:"visite",    label:"Déjà visité",   cls:"status-visite" }
];
function crawlStatusMeta(v){ return CRAWL_STATUSES.find(s=>s.value===v) || null; }

/* Couleur libre par nœud d'un point crawl (n.color), demandée par Tristan pour marquer visuellement
   sur le schéma lui-même quels points un groupe a déjà visités (ou tout autre repère perso) — palette
   restreinte plutôt qu'un picker RGB complet. "" ou absent = pas de couleur (rendu par défaut du nœud). */
const NODE_COLORS = [
  { value:"",       label:"Aucune",        hex:null,      border:null },
  { value:"vert",   label:"Vert (visité)", hex:"#7fe06a",  border:"#3a7a37" },
  { value:"bleu",   label:"Bleu",          hex:"#6fd0f5",  border:"#2a6a8a" },
  { value:"violet", label:"Violet",        hex:"#c9a3f7",  border:"#6a4a8f" },
  { value:"orange", label:"Orange",        hex:"#ffb454",  border:"#8a6a2a" },
  { value:"rouge",  label:"Rouge",         hex:"#ff6b6b",  border:"#8f3a3a" },
  { value:"gris",   label:"Gris-bleu",     hex:"#8aa0c9",  border:"#3e5c78" }
];
function nodeColorMeta(v){ return NODE_COLORS.find(c=>c.value===v) || null; }

const TYPE_LABEL = { creature:"Créature", event:"Événement", table:"Table", session:"Session", npc:"PNJ", pointcrawl:"Point Crawl", pc:"PJ", treasure:"Trésor", hexmap:"Hexcrawl", spell:"Sort" };
const TABS = ["sessions","tables","events","pointcrawls","creatures","spells","pcs","npcs","treasures","hexmaps","dungeonmaps","initiative","wheel","gmnotes","cursedscroll"];
const TYPE_OF_TAB = { sessions:"session", tables:"table", events:"event", creatures:"creature", spells:"spell", npcs:"npc", pointcrawls:"pointcrawl", pcs:"pc", treasures:"treasure", hexmaps:"hexmap", dungeonmaps:"dungeonmap", initiative:"initiative", wheel:"wheel", gmnotes:"gmnote" };
const TREASURE_CATS = [["equipement","Équipement"],["trouvaille","Trouvaille"],["relique","Relique"],["regalia","Régalia"]];
function treasureCatLabel(k){ const f=TREASURE_CATS.find(c=>c[0]===k); return f?f[1]:(k||"Trésor"); }

/* ------------------------------ Utilitaires ------------------------------ */
const $ = s => document.querySelector(s);
const app = $("#app");

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* Résout un nom [[...]] vers une entité (insensible à la casse) */
function findByName(name){
  const n = name.trim().toLowerCase();
  for(const c of db.creatures) if((c.name||"").toLowerCase()===n) return {type:"creature", id:c.id};
  for(const e of db.events)    if((e.title||"").toLowerCase()===n) return {type:"event", id:e.id};
  for(const t of db.tables)    if((t.title||"").toLowerCase()===n) return {type:"table", id:t.id};
  for(const s of db.sessions)  if((s.title||"").toLowerCase()===n) return {type:"session", id:s.id};
  for(const p of db.npcs)      if((p.name||"").toLowerCase()===n) return {type:"npc", id:p.id};
  for(const pc of db.pointcrawls) if((pc.title||"").toLowerCase()===n) return {type:"pointcrawl", id:pc.id};
  for(const pj of db.pcs)         if((pj.name||"").toLowerCase()===n) return {type:"pc", id:pj.id};
  for(const tr of db.treasures)   if((tr.name||"").toLowerCase()===n) return {type:"treasure", id:tr.id};
  for(const sp of db.spells)      if((sp.name||"").toLowerCase()===n) return {type:"spell", id:sp.id};
  return null;
}
const TAB_OF = { creature:"creatures", event:"events", table:"tables", session:"sessions", npc:"npcs", pointcrawl:"pointcrawls", pc:"pcs", treasure:"treasures", hexmap:"hexmaps", dungeonmap:"dungeonmaps", spell:"spells", initiative:"initiative", wheel:"wheel", gmnote:"gmnotes" };
// Hoisté hors de applyRoleUI() pour être réutilisable ailleurs (ex. wheelRefViewable() : le bouton
// "Voir" d'un bonus gagné à la roue ne doit être proposé à un joueur que pour un type d'entité
// déjà public via cette même liste — une seule règle de visibilité, pas une inventée en double).
const PLAYER_VISIBLE_TABS = ["sessions","hexmaps","dungeonmaps","spells","pcs","initiative","wheel","treasures"];
/* L'onglet Trésor est visible aux joueurs (ci-dessus), mais seuls les objets marqués
   t.playerVisible par le MJ leur sont réellement montrés (liste ET fiche) — la Malédiction
   (et plus généralement tout champ MJ) reste cachée même sur un objet montré. Centralise ici
   la règle par-entité pour que goto() et wheelRefViewable() (js/wheel.js) ne divergent pas. */
function playerCanViewEntity(type, o){
  if(!o) return false;
  if(type==="treasure") return !!o.playerVisible;
  return true;
}

/* Rend un texte libre : échappe le HTML puis transforme [[Nom]] en lien cliquable */
function renderText(text){
  if(!text) return "";
  const s = String(text);
  const re = /\[\[([^\]]+)\]\]/g;
  let html = "", last = 0, m;
  while((m = re.exec(s))){
    html += esc(s.slice(last, m.index));
    const name = m[1].trim();
    const hit = findByName(name);
    html += hit
      ? `<a class="wl ${hit.type}" data-goto="${hit.type}:${hit.id}">${esc(name)}</a>`
      : `<a class="wl bad" title="Aucune entité nommée « ${esc(name)} »" data-create="${esc(name)}">${esc(name)}</a>`;
    last = re.lastIndex;
  }
  html += esc(s.slice(last));
  return html;
}

/* Transforme un texte multi-lignes en liste à puces (ignore les lignes vides) */
function renderBullets(text){
  const lines = String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return `<p class="faint">— (vide)</p>`;
  return `<ul class="bullets">${lines.map(l=>`<li>${renderText(l)}</li>`).join("")}</ul>`;
}
/* Section à puces rendue seulement si elle contient quelque chose (sinon rien) */
function bulletSection(label, text){
  const has = String(text||"").split(/\r?\n/).some(l=>l.trim());
  return has ? `<div class="section"><h2>${label}</h2>${renderBullets(text)}</div>` : "";
}
function eventSectionsHTML(e, opts){
  const secs = bulletSection((opts&&opts.short?"① Description":"① Description & ambiance"), e.description)
    + bulletSection((opts&&opts.short?"② Pièges":"② Pièges — conditions & conséquences"), e.traps)
    + bulletSection("③ Secrets à découvrir", e.secrets);
  return secs.trim() ? secs : `<p class="faint" style="font-family:var(--ui)">Aucun détail renseigné pour l'instant.</p>`;
}

/* Concatène tout le texte cherchable/liable d'une entité */
function entityText(type, o){
  if(type==="creature") return [o.name,o.category,o.desc,o.abilities,(o.attacks||[]).map(a=>a.name+" "+a.damage).join(" ")].join(" \n ");
  if(type==="event")    return [o.title,o.theme,o.description,o.traps,o.secrets].join(" \n ");
  if(type==="table")    return [o.title,o.category,o.context,(o.rows||[]).map(tableRowText).join(" \n ")].join(" \n ");
  if(type==="session")  return [o.title,(o.entries||[]).map(e=>e.label+" "+e.notes).join(" \n ")].join(" \n ");
  if(type==="npc")      return [o.name,o.description,o.physique,o.age,o.possessions,o.objectif,o.moyens,o.comportement].join(" \n ");
  if(type==="pointcrawl") return [o.title,o.description,(o.nodes||[]).map(nd=>{const ev=getEntity("event",nd.eventId);return ev?ev.title:"";}).join(" ")].join(" \n ");
  if(type==="pc")       return [o.name,o.ancestry,o.cls,o.info,o.skills,o.spells,o.inventory,o.languages,o.deity,o.masteredWeapon,o.mentor].join(" \n ");
  if(type==="treasure") return [o.name,treasureCatLabel(o.category),o.description,o.bonus,o.boon,o.curse,o.personality].join(" \n ");
  if(type==="spell")    return [o.name,spellClassLabel(o.class),o.tier?"rang "+o.tier:"",o.range,o.duration,o.effect].join(" \n ");
  return "";
}
function entityTitle(type,o){ return (type==="creature"||type==="npc"||type==="pc"||type==="treasure"||type==="spell") ? o.name : o.title; }

/* Extrait les noms référencés en [[...]] dans un texte */
function extractLinks(text){
  const out = []; const re = /\[\[([^\]]+)\]\]/g; let m;
  while((m=re.exec(text||""))) out.push(m[1].trim().toLowerCase());
  return out;
}

/* Calcule les rétroliens vers une entité cible : qui la mentionne en [[...]] ? */
function findBrokenLinks(){
  const results = [];
  const collections = [["event",db.events],["table",db.tables],["session",db.sessions],["creature",db.creatures],["npc",db.npcs],["pointcrawl",db.pointcrawls],["pc",db.pcs],["treasure",db.treasures],["spell",db.spells]];
  for(const [type,list] of collections){
    for(const o of list){
      const links = extractLinks(entityText(type,o));
      const bad = [...new Set(links)].filter(n=>n && !findByName(n));
      if(bad.length) results.push({type, id:o.id, title:entityTitle(type,o)||"Sans titre", names:bad});
    }
  }
  return results;
}

function backlinksTo(targetType, targetId){
  const target = getEntity(targetType, targetId);
  if(!target) return {};
  const targetName = entityTitle(targetType, target).toLowerCase();
  const groups = { event:[], table:[], session:[], creature:[], npc:[], pointcrawl:[], pc:[], treasure:[], spell:[] };
  const scan = (type, list)=>{
    for(const o of list){
      if(type===targetType && o.id===targetId) continue;
      const links = extractLinks(entityText(type,o));
      if(links.includes(targetName)) groups[type].push({type, id:o.id, title:entityTitle(type,o)});
    }
  };
  scan("event", db.events); scan("table", db.tables);
  scan("session", db.sessions); scan("creature", db.creatures); scan("npc", db.npcs); scan("pointcrawl", db.pointcrawls); scan("pc", db.pcs); scan("treasure", db.treasures); scan("spell", db.spells);
  return groups;
}

function collectionOf(type){ return { creature:db.creatures, event:db.events, table:db.tables, session:db.sessions, npc:db.npcs, pointcrawl:db.pointcrawls, pc:db.pcs, treasure:db.treasures, hexmap:db.hexmaps, dungeonmap:db.dungeonmaps, spell:db.spells, initiative:db.initiative, wheel:db.wheel, gmnote:db.gmnotes }[type]; }
function getEntity(type,id){ return collectionOf(type).find(o=>o.id===id); }
function deleteEntity(type,id){
  const c = collectionOf(type); const i = c.findIndex(o=>o.id===id);
  if(i>=0){ c.splice(i,1); deleteRemote(TAB_OF[type], id); }
}

/* Renommage : met à jour tous les liens [[Ancien nom]] → [[Nouveau nom]] dans toute la base */
function replaceLinksEverywhere(oldName, newName){
  const from = String(oldName||"").trim().toLowerCase();
  if(!from) return 0;
  let count = 0;
  const fix = s => s.replace(/\[\[([^\]]+)\]\]/g, (m, nm)=> nm.trim().toLowerCase()===from ? `[[${newName}]]` : m);
  const walk = obj => {
    if(Array.isArray(obj)){ obj.forEach(walk); return; }
    if(obj && typeof obj==="object"){
      for(const k in obj){
        if(k==="images") continue;                 // on saute les données d'images (base64)
        const v = obj[k];
        if(typeof v==="string"){ if(v.indexOf("[[")>=0){ const nv=fix(v); if(nv!==v){ obj[k]=nv; count++; } } }
        else if(v && typeof v==="object") walk(v);
      }
    }
  };
  walk(db);
  return count;
}
function maybePropagate(oldName, newName){
  if(!oldName || !newName || oldName===newName) return 0;
  return replaceLinksEverywhere(oldName, newName);
}

/* =========================================================================
   RENDU PRINCIPAL
   ========================================================================= */
function render(){
  if(initiativePollTimer && view.tab!=="initiative") stopInitiativePolling();
  // effectiveRole()==="gm" en plus de view.tab!=="dungeonmaps" : contrairement à l'Initiative
  // (pollée pour les DEUX rôles, donc seul le changement d'onglet importe), le poll des cartes de
  // donjon n'est démarré QUE côté joueur (playerDungeonMapView()) — un MJ qui active puis désactive
  // l'aperçu joueur global sans changer d'onglet laissait tourner ce timer indéfiniment en tâche de
  // fond, puisque la condition ne testait jamais un retour à "gm" sur le MÊME onglet. Chaque tick
  // suivant écrasait alors `db.dungeonmaps` avec les données fraîches ET appelait `renderList()`
  // directement (pas `render()`), qui ignore `view.mode` et réaffiche donc la LISTE même si le MJ
  // était en train de consulter le détail d'une carte — d'où la fermeture intempestive ~2,5s après
  // un aller-retour en aperçu (signalé par Tristan : la fiche se refermait toute seule peu après
  // ouverture). Voir docs/AUDIT.md pour le détail du diagnostic.
  if(dungeonMapsPollTimer && (view.tab!=="dungeonmaps" || effectiveRole()==="gm")) stopDungeonMapsPolling();
  if(wheelAudioActive && view.tab!=="wheel") stopWheelTensionSound();
  // onglets actifs
  document.body.setAttribute("data-tab", view.tab);
  document.body.classList.toggle("reading-mode", readingMode);
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active", b.dataset.tab===view.tab));
  window.scrollTo({top:0});

  // Aperçu joueur sur un onglet réservé au MJ (hors PLAYER_VISIBLE_TABS, ex. Créatures, Trésor) :
  // ces onglets n'ont aucune branche de rendu "joueur" (rien à filtrer, ils n'existent tout
  // simplement pas pour un vrai compte joueur) — on affiche donc un état dédié SANS changer
  // d'onglet ni de mode, plutôt que de rediriger ailleurs. Voir togglePlayerPreview().
  if(effectiveRole()!=="gm" && !PLAYER_VISIBLE_TABS.includes(view.tab)){
    app.innerHTML = emptyState("🚫", "Cet onglet n'est pas visible aux joueurs.");
    return;
  }

  if(view.mode==="detail") return renderDetail();
  if(view.mode==="edit" || view.mode==="new") return renderForm();
  if(view.mode==="wizard") return renderPCWizard();
  return renderList();
}

/* ------------------------------- LISTES ---------------------------------- */
function renderList(){
  if(view.tab==="events")    return listEvents();
  if(view.tab==="tables")    return listTables();
  if(view.tab==="creatures") return listCreatures();
  if(view.tab==="spells")    return listSpells();
  if(view.tab==="sessions")  return listSessions();
  if(view.tab==="npcs")      return listNPCs();
  if(view.tab==="pointcrawls") return listCrawls();
  if(view.tab==="pcs")       return listPCs();
  if(view.tab==="treasures") return listTreasures();
  if(view.tab==="hexmaps")   return listHexmaps();
  if(view.tab==="dungeonmaps") return viewDungeonMaps();
  if(view.tab==="initiative") return listInitiative();
  if(view.tab==="wheel")      return viewWheel();
  if(view.tab==="gmnotes")    return listGmNotes();
  if(view.tab==="cursedscroll") return viewCursedScroll();
}

function diceIcon(n){
  const s = 'stroke="currentColor" fill="none" stroke-width="1.3" stroke-linejoin="round"';
  const s2 = 'stroke="currentColor" stroke-width="1" fill="none"';
  let shape;
  if(n===4) shape = `<polygon points="7,1.5 12.5,12 1.5,12" ${s}/><path d="M7,1.5 L7,12 M1.5,12 L7,7 L12.5,12" ${s2}/>`;
  else if(n===6) shape = `<rect x="2" y="2" width="10" height="10" ${s}/>`;
  else if(n===8) shape = `<polygon points="7,0.8 12.8,7 7,13.2 1.2,7" ${s}/><path d="M1.2,7 L12.8,7" ${s2}/>`;
  else if(n===10) shape = `<polygon points="7,0.8 11.5,4.5 9.5,13.2 4.5,13.2 2.5,4.5" ${s}/><path d="M2.5,4.5 L11.5,4.5" ${s2}/>`;
  else if(n===12) shape = `<polygon points="7,0.8 13,5.1 10.7,12.2 3.3,12.2 1,5.1" ${s}/><path d="M7,0.8 L7,6 M13,5.1 L7,6 L1,5.1 M10.7,12.2 L7,6 M3.3,12.2 L7,6" ${s2}/>`;
  else if(n===20) shape = `<polygon points="7,0.6 13,4.3 13,9.7 7,13.4 1,9.7 1,4.3" ${s}/><path d="M7,0.6 L7,7 M13,4.3 L7,7 M13,9.7 L7,7 M7,13.4 L7,7 M1,9.7 L7,7 M1,4.3 L7,7" ${s2}/>`;
  else shape = `<circle cx="7" cy="7" r="6.2" ${s}/>`;
  return `<svg width="14" height="14" viewBox="0 0 14 14" style="vertical-align:-2px;margin-right:.3rem">${shape}</svg>`;
}
/* ------------------ Tables dynamiques (tirent parmi une collection existante de l'appli) ------------------
   Une table "dynamique" (t.kind==="dynamic") ne stocke pas de contenu figé dans t.rows : à la place, elle
   pointe vers une collection de l'appli (t.source, ex. "creature") et, en option, un filtre (t.sourceFilter,
   utile pour les trésors classés par catégorie). Son "d-quelque-chose" et son contenu sont recalculés en
   direct à chaque affichage/tirage à partir de ce qui existe alors dans `db` — elle grossit toute seule au
   fil de la campagne, et est vide tant que rien n'a été créé dans la collection visée. `tab` ci-dessous est
   à la fois la clé de `db` et le nom de l'onglet (creatures/npcs/treasures partagent les deux). */
const DYNAMIC_TABLE_SOURCES = {
  creature: { tab:"creatures", hasCategoryFilter:false },
  npc:      { tab:"npcs",      hasCategoryFilter:false },
  treasure: { tab:"treasures", hasCategoryFilter:true },
  spell:    { tab:"spells",    hasCategoryFilter:false }
};
function dynamicSourceItems(t){
  const meta = DYNAMIC_TABLE_SOURCES[t.source];
  if(!meta) return [];
  let list = db[meta.tab] || [];
  if(t.sourceFilter){
    list = list.filter(x => (x.category || (meta.tab==="treasures" ? "trouvaille" : "")) === t.sourceFilter);
  }
  return list;
}
function tableSize(t){ return t.kind==="dynamic" ? dynamicSourceItems(t).length : (t.rows||[]).length; }

function tableCategories(){
  const set = new Set();
  db.tables.forEach(t=>{ if(t.category && t.category.trim()) set.add(t.category.trim()); });

}
function tableCard(t){

    <div class="meta"><span class="tag table">${diceIcon(size)}d${size}</span>${t.kind==="dynamic"?`<span class="tag gold">⚡ Dynamique</span>`:""}${t.category?`<span class="tag gold">${esc(t.category)}</span>`:""}</div>

function tableGrid(list){ return `<div class="grid" style="margin-bottom:1.4rem">${list.map(tableCard).join("")}</div>`; }

    const allOpen = allKeys.length && allKeys.every(k=>expandedGroups.has(k));
    sections.unshift(`<div style="margin-bottom:.8rem"><button class="btn ghost sm" data-toggle-all="${allOpen?'close':'open'}" data-toggle-all-keys="${esc(allKeys.join('|'))}">${allOpen?'⊟ Tout fermer':'⊞ Tout ouvrir'}</button></div>`);
    body = sections.join("");

function levelNum(l){
  l = String(l||"").trim();
  let m;
  if((m = l.match(/^(\d+)\s*\/\s*(\d+)/))) return (+m[1])/(+m[2]);   // niveaux fractionnaires (1/2, 1/4…)
  if((m = l.match(/-?\d+(\.\d+)?/))) return parseFloat(m[0]);
  return -1;
}
function creatureCategories(){
  const set = new Set();
  db.creatures.forEach(c=>{ if(c.category && c.category.trim()) set.add(c.category.trim()); });
  return [...set].sort((a,b)=>a.localeCompare(b));
}
function sortCreatures(list){
  const s = creatureSort;
  const a = [...list];
  if(s==="lvlAsc")  a.sort((x,y)=>levelNum(x.level)-levelNum(y.level) || (x.name||"").localeCompare(y.name||""));
  else if(s==="lvlDesc") a.sort((x,y)=>levelNum(y.level)-levelNum(x.level) || (x.name||"").localeCompare(y.name||""));
  else a.sort((x,y)=>(x.name||"").localeCompare(y.name||""));
  return a;
}

function renderDetail(){
  const type = TYPE_OF_TAB[view.tab];
  const o = getEntity(type, view.id);
  if(!o){ view.mode="list"; return render(); }
  if(type==="event")    return detailEvent(o);
  if(type==="table")    return detailTable(o);
  if(type==="creature") return detailCreature(o);
  if(type==="spell")    return detailSpell(o);
  if(type==="session")  return detailSession(o);
  if(type==="npc")      return detailNPC(o);
  if(type==="pointcrawl") return detailCrawl(o);
  if(type==="pc")       return detailPC(o);
  if(type==="treasure") return detailTreasure(o);
  if(type==="hexmap") return detailHexmap(o);
  // detailDungeonMap() est TOUJOURS la vue d'édition MJ (peu importe qui l'appelle) — un vrai
  // compte joueur ne l'atteint jamais (aucune carte n'est cliquable côté joueur), mais un MJ en
  // aperçu qui était déjà sur le détail d'une carte au moment de basculer le mode doit retomber sur
  // le même rendu qu'un vrai joueur : la carte ACTIVE en lecture seule, pas forcément celle ouverte.
  if(type==="dungeonmap") return effectiveRole()==="gm" ? detailDungeonMap(o) : playerDungeonMapView();
}

/* opts.hideReading (2026-08-17) : le "mode table de jeu" (agrandit le texte, masque les contrôles
   MJ) n'a pas de sens sur une vue essentiellement visuelle comme la carte hexcrawl — pas de texte
   à agrandir, contrôles déjà masqués aux joueurs indépendamment de ce mode. Demande de Tristan :
   plutôt que de l'y laisser sans effet utile, on le retire sur cette vue (voir detailHexmap). */
function detailActions(type,id,opts){
  opts = opts||{};
  const reading = document.body.classList.contains("reading-mode");
  const toggleBtn = opts.hideReading ? "" : `<button class="btn ghost sm reading-toggle" data-toggle-reading="1">${reading?"👁 Quitter le mode table":"👁 Mode table de jeu"}</button>`;
  if(effectiveRole()!=="gm") return `<div class="actions-row">${toggleBtn}</div>`;
  // Marqueur "créé par le MJ" — demandé par Tristan (2026-08-11) pour distinguer, plus tard, ce
  // qu'il a écrit à la main de ce qui vient d'un import en masse, d'une génération aléatoire
  // (generateRandomNPC/PC) ou d'un contenu produit par une IA en test. Volontairement un simple
  // bascule manuelle, jamais positionnée automatiquement à la création — un import/une génération
  // aléatoire n'a aucune raison de se marquer "MJ" tout seul, et l'inverse (deviner que la saisie
  // manuelle d'un formulaire = toujours "du MJ") serait faux dès qu'un contenu créé par IA est
  // recopié dans un formulaire. Uniquement visible/modifiable par le MJ (jamais en mode aperçu
  // joueur, jamais par un vrai compte joueur) — sert de base à un futur filtre "n'afficher que mes
  // créations" (voir docs/TODO.md), pas encore implémenté.
  const o = getEntity(type,id);
  const gmMade = !!(o && o.gmCreated);
  const authorBtn = `<button class="btn ghost sm" data-toggle-gm-created="${type}:${id}" title="Bascule manuelle — jamais déduite automatiquement. Sert à distinguer ce que tu as écrit à la main de ce qui vient d'un import, d'une génération aléatoire ou d'une IA.">${gmMade?"🖋 Créé par le MJ":"🎲 Import / génération"}</button>`;
  // hideEdit (2026-08-18) : la fiche PJ graphique se modifie entièrement en cliquant sur ses
  // cases (voir detailPC/box()) — le bouton "✎ Modifier" (formulaire classique) n'y sert plus à
  // rien, demande explicite de Tristan de le retirer pour ce type d'entité uniquement.
  const editBtn = opts.hideEdit ? "" : `<button class="btn ghost sm" data-edit="${type}:${id}">✎ Modifier</button>`;
  return `<div class="actions-row">${toggleBtn}${authorBtn}<div class="actions">
    ${editBtn}
    <button class="btn ghost sm" data-dup="${type}:${id}">⧉ Dupliquer</button>
    <button class="btn danger sm" data-del="${type}:${id}">🗑 Supprimer</button>
  </div></div>`;
}
function duplicateEntity(type,id){
  const src = getEntity(type,id); if(!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid();
  // régénère les identifiants des sous-éléments pour éviter les collisions
  (copy.entries||[]).forEach(x=>{ x.id=uid(); x.visible=false; }); // une copie ne doit jamais être visible aux joueurs à leur insu
  (copy.nodes||[]).forEach(x=>x.id=uid());
  (copy.edges||[]).forEach(x=>x.id=uid());
  (copy.images||[]).forEach(x=>x.id=uid());
  (copy.strokes||[]).forEach(x=>x.id=uid());
  if(type==="dungeonmap") copy.active = false; // une copie ne doit jamais être affichée aux joueurs à leur insu
  if(type==="pointcrawl") copy.status = ""; // une copie repart à zéro : pas "déjà visité" comme l'original
  if(type==="npc"||type==="pc") delete copy.portrait; // le portrait d'origine reste réservé à la fiche source
  if(type==="creature"||type==="npc"||type==="pc"||type==="treasure"||type==="spell"||type==="dungeonmap") copy.name = (copy.name||"Sans nom")+" (copie)";
  if(type==="creature"){ copy.manual = true; delete copy.imported; }   // un doublon créé à la main est protégé du vidage
  else copy.title = (copy.title||"Sans titre")+" (copie)";
  collectionOf(type).push(copy);
  saveDB(); view={tab:TAB_OF[type],mode:"detail",id:copy.id}; render(); toast("Dupliqué.");
}

/* Tables « multi-colonnes » (2026-08-12, demande de Tristan) : certaines tables du livre sont
   conçues pour être lues de deux façons — une ligne entière déjà composée (comportement
   historique de l'appli, seul mode existant jusqu'ici), OU un jet indépendant par colonne
   (ex. Génération de noms par syllabes : 4d20 séparés, un par colonne, plutôt qu'une ligne
   entière) pour un résultat plus varié. `t.columns` (tableau de libellés) marque une table
   comme multi-colonnes ; chaque ligne de `t.rows` reste stockée comme avant (une chaîne,
   segments séparés par « / », dans l'ordre de `t.columns`) — aucune migration de données
   nécessaire, seulement un second mode de tirage et un affichage en colonnes. `t.joinMode`
   pilote comment recomposer un résultat tiré colonne par colonne :
   - "concat" : mots à assembler (le générateur de noms) — les tirets de bordure de chaque
     segment sont retirés puis les segments sont collés (« Van- » + « -us » → « Vanus »).
   - "space"  : phrase à espaces (ex. Nom de taverne : « Le Sanglier » + « Ivre »).
   - "comma"  : description à virgules (ex. Traits des potions : « Épicée, Bouillonne,
     Traînées violettes »).
   - (par défaut) "list" : résultats indépendants affichés séparément, un par colonne (ex.
     Pièges : Piège / Déclencheur / Dégâts ne se concatènent pas, ce sont 3 effets distincts). */
/* Découpe une ligne multi-colonnes. Le séparateur canonique est « / » ENTOURÉ D'ESPACES : un « / »
   collé au texte appartient à la phrase, pas à la structure (signalé par Tristan le 2026-08-18 —
   « Fuir un passé qui le/la rattrape. / Diplomatie » perdait sa colonne Moyens, le « le/la » étant
   pris pour une séparation). On ne retombe sur un découpage au « / » nu que si la version espacée
   ne produit pas assez de segments, pour ne pas casser d'anciennes lignes saisies sans espaces. */
function splitTableRow(row, n){
  const s = String(row||"");
  let parts = s.split(/\s+\/\s+/).map(x=>x.trim());
  if(parts.length < n) parts = s.split("/").map(x=>x.trim());
  while(parts.length<n) parts.push("");
  return parts.slice(0,n);
}
/* ---- Lignes multi-colonnes : cellules réelles plutôt qu'une chaîne à découper ----------------
   Format de stockage d'une ligne : un TABLEAU de cellules (["Ambition","Moyen"]) quand la table a
   des colonnes, une simple chaîne sinon. L'ancien format (tout dans une chaîne, colonnes séparées
   par « / ») reste lu sans migration obligatoire via splitTableRow — mais il est fragile dès qu'une
   cellule contient elle-même un « / » (« le/la »), d'où ce passage à des cellules distinctes,
   demandé par Tristan le 2026-08-18. normalizeTableRows() convertit une table en place au premier
   chargement, et l'éditeur écrit désormais toujours des tableaux.
   - tableColCount(t)      : nombre de colonnes (1 si la table n'est pas multi-colonnes).
   - tableRowCells(t,row)  : cellules d'une ligne, quel que soit son format de stockage.
   - tableRowText(row)     : forme texte d'une ligne (pour l'export XML, la roue, l'impression,
                             la recherche — tout ce qui manipule une ligne comme un seul libellé). */
function tableColCount(t){ return (t && t.columns && t.columns.length) ? t.columns.length : 1; }
function tableRowCells(t, row){
  const n = tableColCount(t);
  if(Array.isArray(row)){
    const cells = row.map(c=>String(c==null?"":c).trim());
    while(cells.length<n) cells.push("");
    return cells.slice(0,n);
  }
  return n>1 ? splitTableRow(row,n) : [String(row==null?"":row)];
}
function tableRowText(row){
  return Array.isArray(row) ? row.filter(c=>String(c||"").trim()).join(" / ") : String(row==null?"":row);
}
/* Convertit les lignes d'une table multi-colonnes de l'ancien format chaîne vers des cellules.
   Renvoie true si la table a effectivement été modifiée (pour savoir s'il faut sauvegarder). */
function normalizeTableRows(t){
  if(!t || tableColCount(t)<2 || !Array.isArray(t.rows) || !t.rows.length) return false;
  if(t.rows.every(r=>Array.isArray(r))) return false;
  t.rows = t.rows.map(r=>tableRowCells(t,r));
  return true;
}
function tableColumnsHeadHTML(t){
  if(!t.columns || !t.columns.length) return `<th>Résultat</th>`;
  return t.columns.map(c=>`<th>${esc(c)}</th>`).join("");
}
function tableColumnsRowHTML(t, row){
  if(!t.columns || !t.columns.length) return `<td>${renderText(tableRowText(row))||'<span class="faint">—</span>'}</td>`;
  return tableRowCells(t, row).map(seg=>`<td>${renderText(seg)||'<span class="faint">—</span>'}</td>`).join("");
}

        </tbody></table>
    </div>`;
  app.innerHTML = `<div class="detail">
    <button class="back" data-back="1">← Tables aléatoires</button>
    <div class="meta"><span class="tag table">Table · d${rows.length||0}</span>${isDynamic?`<span class="tag gold">⚡ Dynamique</span>`:""}${isMultiCol?`<span class="tag gold">🧩 ${t.columns.length} colonnes</span>`:""}${t.category?`<span class="tag gold">${esc(t.category)}</span>`:""}</div>
    <h1>${esc(t.title||"Sans titre")}</h1>
    ${detailActions("table",t.id)}
    ${t.context?`<div class="section"><h2>Contexte</h2><div class="prose">${renderText(t.context)}</div></div>`:""}
    ${resultsBlock}
    ${backlinksBlock("table",t.id)}
  </div>`;
}
/* Tirage colonne par colonne (voir commentaire au-dessus de detailTable) : un jet indépendant
   par colonne, chacun sur l'ensemble des lignes de la table — pas un seul jet qui prend toute
   la ligne. Recompose le résultat selon `t.joinMode`. */
function rollTableColumns(id){
  const t = getEntity("table",id); if(!t || !t.columns || !t.rows || !t.rows.length) return;
  const n = t.columns.length;
  const pickedRowIdx = [];
  const segs = t.columns.map((label,i)=>{
    const idx = Math.floor(Math.random()*t.rows.length);
    pickedRowIdx.push(idx);
    return { label, value: tableRowCells(t, t.rows[idx])[i] };
  });
  document.querySelectorAll("#table-body tr").forEach(tr=>tr.classList.toggle("rolled", pickedRowIdx.includes(+tr.dataset.rowidx)));
  let plain, linked;
  if(t.joinMode==="concat"){
    plain = segs.map(s=>s.value.replace(/^-+/,"").replace(/-+$/,"")).join("");
    linked = plain;
  } else if(t.joinMode==="space"){
    plain = segs.map(s=>s.value).filter(Boolean).join(" ");
    linked = plain;
  } else if(t.joinMode==="comma"){
    plain = segs.map(s=>s.value).filter(Boolean).join(", ");
    linked = plain;
  } else {
    plain = segs.map(s=>`${s.label} : ${s.value}`).join(" · ");
    linked = plain;
  }
  // Résultat composé mis en avant dans un encart dédié (pas juste les lignes surlignées dans le
  // tableau) — demande de Tristan : "il faut combiner le résultat, c'est ça qui est amusant".
  const box = $("#roll-cols-out");
  if(box){
    box.classList.remove("hidden");
    box.innerHTML = (t.joinMode==="concat"||t.joinMode==="space"||t.joinMode==="comma")
      ? renderText(plain)
      : segs.map(s=>`<div style="margin:.15rem 0"><span style="font-family:var(--ui);font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted,#999);font-weight:400">${esc(s.label)}</span><br>${renderText(s.value)}</div>`).join("");
  }
  const out = $("#roll-out"); out.textContent = `→ ${plain}`;
  lastTableRoll = `${t.title||"Table"} → ${linked}`;
  const addBtn = $("#roll-add-session"); if(addBtn) addBtn.classList.remove("hidden");
}

function fmtMod(v){
  if(v===undefined||v===null||v==="") return "—";
  const s = String(v).trim();
  if(/^[+-]/.test(s)) return s;
  const n = Number(s);
  if(!isNaN(n)) return (n>=0?"+":"")+n;
  return s;
}

/* Entête de la grille de saisie : un intitulé ÉDITABLE par colonne, aligné sur les champs des
   rangées en dessous (mêmes largeurs flex, mêmes cales de 2.5rem à gauche et de la largeur du
   bouton ✕ à droite). C'est ici, et nulle part ailleurs, que se définissent les colonnes d'une
   table — le nom saisi devient l'entête affiché sur la fiche et le libellé du tirage par colonne.
   Une table sans colonne (cas courant) affiche simplement « Résultat », non modifiable. */
function colsHeadHTML(columns){
  const cols = columns||[];
  const cell = cols.length>1
    ? cols.map((c,i)=>`<div class="field" style="flex:1 1 160px">
        <div style="display:flex;gap:.25rem">
          <input type="text" class="col-name-input" value="${esc(c)}" placeholder="Colonne ${i+1}">
          <button class="btn danger sm" data-remove-column="${i}" title="Supprimer cette colonne">✕</button>
        </div></div>`).join("")
    : `<div class="field" style="flex:1 1 200px"><label class="hint" style="margin:0">Résultat</label></div>`;
  return `<div class="rrow" style="margin-bottom:.35rem;align-items:flex-end">
    <div class="field" style="flex:0 0 2.5rem"></div>
    ${cell}
    <div style="flex:0 0 2.2rem"></div>
  </div>`;
}
/* Une rangée = autant de champs que de colonnes (un seul si la table n'en définit pas). Chaque
   cellule est saisie séparément : plus de « / » à taper à la main, et une cellule peut contenir un
   « / » sans casser le découpage (voir tableRowCells). Les intitulés ne sont pas répétés ici, ils
   sont dans l'entête (colsHeadHTML) qui coiffe la grille. */
function rowInput(cells,i,columns){
  const cols = (columns&&columns.length) ? columns : [""];
  const vals = Array.isArray(cells) ? cells : [cells];
  const fields = cols.map((label,c)=>`
      <div class="field" style="flex:1 1 ${cols.length>1?"160":"200"}px">
        <input type="text" class="row-input" data-col="${c}" value="${esc(vals[c]||"")}" placeholder="${cols.length>1?esc(label||("Colonne "+(c+1))):"Résultat…"}">
      </div>`).join("");
  return `<div class="repeat-item" data-rowitem>
    <div class="rrow">
      <div class="field" style="flex:0 0 2.5rem"><label>#${i+1}</label></div>
      ${fields}
      <button class="btn danger sm" data-remove-row>✕</button>
    </div></div>`;
}
function reindexRows(){
  document.querySelectorAll("#rows-wrap .repeat-item").forEach((el,i)=>{ el.querySelector("label").textContent = "#"+(i+1); });
  const cnt = document.querySelectorAll("#rows-wrap .repeat-item").length;

  if(o.kind==="dynamic"){
    o.source = $("#f-source").value;
    o.sourceFilter = o.source==="treasure" ? $("#f-source-filter").value : "";
    o.rows = [];
  } else {
    // Rangées stockées en cellules dès qu'il y a plusieurs colonnes, en chaîne simple sinon —
    // voir tableRowCells/tableRowText pour le pourquoi de ces deux formats.
    const cols = formTableColumns();
    const cellRows = formTableRowCells();
    if(cols.length>1){
      o.columns = cols;
      o.joinMode = $("#f-joinmode") ? $("#f-joinmode").value : "";
      o.rows = cellRows.map(cells=>tableRowCells(o, cells));

  if(view.mode==="new") db.tables.push(o);
  const _n = maybePropagate(_old, o.title);
  saveDB(); toast("Table enregistrée."+(_n?` · ${_n} lien(s) mis à jour`:"")); view={tab:"tables",mode:"detail",id:o.id}; render();
}

/* -------------------------- Portraits (bibliothèque) --------------------- */
/* Catalogue partagé de ~300 illustrations (portraits/manifest.json), utilisable
   sur les fiches PJ et PNJ. Un même fichier ne peut être assigné qu'à une seule
   fiche à la fois : la disponibilité se calcule en direct depuis db.pcs/db.npcs
   (pas de table séparée à tenir à jour ni à faire dériver). */
async function loadPortraitsManifest(){
  if(portraitsReady) return;
  try{
    const r = await fetch("portraits/manifest.json");
    if(r.ok) PORTRAITS_MANIFEST = await r.json();
  }catch(e){ /* facultatif : l'appli fonctionne sans */ }
  portraitsReady = true;
}
function portraitOwnerLabel(file, excludeId){
  const pc = db.pcs.find(p=>p.portrait===file && p.id!==excludeId);
  if(pc) return `PJ : ${pc.name||"Sans nom"}`;
  const npc = db.npcs.find(n=>n.portrait===file && n.id!==excludeId);
  if(npc) return `PNJ : ${npc.name||"Sans nom"}`;
  return "";
}
function usedPortraitFiles(excludeId){
  const used = new Set();
  db.pcs.forEach(p=>{ if(p.portrait && p.id!==excludeId) used.add(p.portrait); });
  db.npcs.forEach(n=>{ if(n.portrait && n.id!==excludeId) used.add(n.portrait); });
  return used;
}
function availablePortraits(excludeId){
  const used = usedPortraitFiles(excludeId);
  return PORTRAITS_MANIFEST.filter(p=>!used.has(p.file));
}
function pickRandomPortrait(race){
  const pool = availablePortraits(null);
  if(!pool.length) return "";
  const byRace = race ? pool.filter(p=>p.race && p.race.toLowerCase()===String(race).toLowerCase()) : [];
  const from = byRace.length ? byRace : pool;
  return from[Math.floor(Math.random()*from.length)].file;
}

function processImage(file, cb){
  if(!file.type || !file.type.startsWith("image/")){ toast("Fichier ignoré (pas une image)."); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    const src = reader.result;
    const im = new Image();
    im.onload = ()=>{
      const max = 1000; let w = im.width, h = im.height;
      if(Math.max(w,h) <= max){ cb({id:uid(),name:file.name,data:src}); return; }
      const scale = max/Math.max(w,h); w = Math.round(w*scale); h = Math.round(h*scale);
      const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(im,0,0,w,h);
      const mime = file.type.includes("png") ? "image/png" : "image/jpeg";
      cb({id:uid(),name:file.name,data:canvas.toDataURL(mime, 0.85)});
    };
    im.onerror = ()=>toast("Image illisible.");
    im.src = src;
  };
  reader.readAsDataURL(file);
}
/* Variante de processImage() pour les cartes de donjon : plafond de résolution plus haut (une
   carte doit rester lisible — texte, portes, grille — ce que 1000px écraserait), qualité JPEG
   légèrement réduite pour compenser. Callback reçoit directement la data URL (pas de galerie
   ici, une seule image par carte), stockée telle quelle dans le jsonb Supabase comme le reste
   des images de l'appli (pas de bucket Storage séparé — voir docs/AUDIT.md). */
function processMapImage(file, cb){
  if(!file.type || !file.type.startsWith("image/")){ toast("Fichier ignoré (pas une image)."); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    const src = reader.result;
    const im = new Image();
    im.onload = ()=>{
      const max = 1800; let w = im.width, h = im.height;
      if(Math.max(w,h) <= max){ cb(src); return; }
      const scale = max/Math.max(w,h); w = Math.round(w*scale); h = Math.round(h*scale);
      const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(im,0,0,w,h);
      const mime = file.type.includes("png") ? "image/png" : "image/jpeg";
      cb(canvas.toDataURL(mime, 0.82));
    };
    im.onerror = ()=>toast("Image illisible.");
    im.src = src;
  };
  reader.readAsDataURL(file);
}

    <div class="field"><label>🎭 Comportement / attitude</label><textarea id="f-comportement" style="min-height:60px" placeholder="Lâche face au danger, cruel face au plus faible…">${esc(n.comportement)}</textarea></div>
    <div class="field"><label>Stats de combat <span class="hint">(facultatif — utile si ce PNJ peut se battre)</span></label>
      <div class="row">
        <div class="field" style="flex:0 1 110px"><label>CA</label><input type="text" id="f-ac" value="${esc(n.ac||"")}" placeholder="11"></div>
        <div class="field" style="flex:0 1 110px"><label>PV</label><input type="text" id="f-hp" value="${esc(n.hp||"")}" placeholder="4"></div>
        <div class="field" style="flex:1 1 220px"><label>Arme de base</label><input type="text" id="f-weapon" value="${esc(n.weapon||"")}" placeholder="Dague (1d4)"></div>
      </div>
      <div class="subgrid">
        ${stats.map(([lbl,k])=>`<div class="field" style="margin:0"><label>${lbl}</label><input type="text" id="f-${k}" value="${esc(n[k]||"")}" placeholder="—"></div>`).join("")}
      </div>
    </div>
    <div class="field"><label>Sortilèges <span class="hint">(si lanceur de sorts ; un par ligne, liens [[…]] possibles)</span></label><textarea id="f-spells" style="min-height:50px" placeholder="[[Lumière]]">${esc(n.spells||"")}</textarea></div>
    ${portraitFieldHTML(formPortrait)}
    <div class="field"><label>Autres images <span class="hint">(PNG, JPEG… plusieurs possibles)</span></label>
      <div id="images-wrap"></div>
      <button class="btn ghost sm" data-add-img="1" style="margin-top:.5rem">🖼 Ajouter une image</button>

    <div class="form-actions"><button class="btn" data-save="npc">✓ Enregistrer</button><button class="btn ghost" data-back="1">Annuler</button></div>
  </div>`;
  renderImageThumbs();
}
function saveNPC(){
  const o = view.mode==="edit" ? getEntity("npc",view.id) : {id:uid()};
  const _old = view.mode==="edit" ? o.name : null;
  o.name = $("#f-name").value.trim();
  ["description","physique","age","possessions","objectif","moyens","comportement","ac","hp","str","dex","con","int","wis","cha","weapon","spells"].forEach(k=> o[k]=$("#f-"+k).value);
  o.images = formImages.slice();
  o.portrait = formPortrait || "";
  if(!o.name){ toast("Le nom est requis."); return; }
  if(view.mode==="new") db.npcs.push(o);
  const _n = maybePropagate(_old, o.name);
  saveDB(); toast("PNJ enregistré."+(_n?` · ${_n} lien(s) mis à jour`:"")); view={tab:"npcs",mode:"detail",id:o.id}; render();
}

<script src="js/pointcrawl.js"></script>
<script src="js/modal.js"></script>
<script>
let _importData = null; // etat de staging pour l'import JSON (voir js/importexport.js une fois extrait)

/* ---- Export PDF d'un point crawl (schéma numéroté + événements numérotés) ---- */
function stripLinks(text){ return String(text||"").replace(/\[\[([^\]]+)\]\]/g, "$1"); }
/* Rendu texte pour le PDF : échappe le HTML puis met en valeur les renvois [[Nom]] (gras + souligné) */
function renderTextPrint(text){
  return esc(String(text||"")).replace(/\[\[([^\]]+)\]\]/g, (m, nm)=>`<span class="pp-link">${nm.trim()}</span>`);
}
function printSection(label, text){
  const lines = String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return "";   // on masque les sections vides pour un rendu épuré
  return `<div class="pp-sec"><h4>${label}</h4><ul>${lines.map(l=>`<li>${renderTextPrint(l)}</li>`).join("")}</ul></div>`;
}

/* ---- Annexes du PDF de point crawl : résout les [[liens]] cités dans les événements
   du plan vers leurs créatures / trésors / tables, et imprime leur fiche complète. ---- */
function printCreatureBlock(c){
  const stats = [["FOR",c.str],["DEX",c.dex],["CON",c.con],["INT",c.int],["SAG",c.wis],["CHA",c.cha]]
    .filter(([,v])=>v).map(([l,v])=>`${l} ${esc(v)}`).join(" · ");
  const attacks = (c.attacks||[]).filter(a=>a.name||a.damage)
    .map(a=>`${esc(a.name||"Attaque")}${a.bonus?" "+esc(a.bonus):""} (${esc(a.damage||"?")}${a.range?", "+esc(rangeLabel(a.range)):""})`).join(" ; ");
  return `<div class="pp-event">
    <h3><span>${esc(c.name||"Sans nom")}</span>${c.category?`<span class="pp-theme">${esc(c.category)}</span>`:""}</h3>
    <div class="pp-sec"><ul><li>CA ${esc(c.ac||"?")} · PV ${esc(c.hp||"?")} · Niv. ${esc(c.level||"?")}${c.alignment?" · "+esc(cap(c.alignment)):""}${stats?" · "+stats:""}</li></ul></div>
    ${attacks?`<div class="pp-sec"><h4>Attaques</h4><ul><li>${attacks}</li></ul></div>`:""}
    ${printSection("Capacités & immunités", c.abilities)}
    ${c.desc?`<div class="pp-sec"><ul><li>${renderTextPrint(c.desc)}</li></ul></div>`:""}
  </div>`;
}
function printTreasureBlock(t){
  return `<div class="pp-event">
    <h3><span>${esc(t.name||"Sans nom")}</span><span class="pp-theme">${esc(treasureCatLabel(t.category))}</span></h3>
    ${printSection("Description", t.description)}
    ${printSection("Bonus", t.bonus)}
    ${printSection("Atout", t.boon)}
    ${printSection("Malédiction", t.curse)}
    ${printSection("Personnalité", t.personality)}
  </div>`;
}
function printTableBlock(t){
  // Pour une table dynamique, imprime un instantané de son contenu actuel (elle n'a pas de rows stockées).
  const rowsArr = t.kind==="dynamic" ? dynamicSourceItems(t).map(x=>x.name||x.title||"Sans nom") : (t.rows||[]);
  const rows = rowsArr.map((r,i)=>`<li>${i+1}. ${renderTextPrint(tableRowText(r))}</li>`).join("");
  return `<div class="pp-event">
    <h3><span>${esc(t.title||"Sans titre")}</span></h3>
    ${t.context?`<div class="pp-sec"><h4>Contexte</h4><ul><li>${renderTextPrint(t.context)}</li></ul></div>`:""}
    ${rows?`<div class="pp-sec"><h4>Résultats (d${rowsArr.length})</h4><ul>${rows}</ul></div>`:""}
  </div>`;
}
function buildPrintAppendix(nodes){
  const names = new Set();
  nodes.forEach(n=>{
    const ev = getEntity("event", n.eventId); if(!ev) return;
    [ev.description, ev.traps, ev.secrets].forEach(t=> extractLinks(t).forEach(nm=>names.add(nm)));
  });
  const creatures=[], treasures=[], tables=[], seen=new Set();
  names.forEach(nm=>{
    const hit = findByName(nm); if(!hit || seen.has(hit.type+":"+hit.id)) return;
    seen.add(hit.type+":"+hit.id);
    if(hit.type==="creature") creatures.push(getEntity("creature",hit.id));
    else if(hit.type==="treasure") treasures.push(getEntity("treasure",hit.id));
    else if(hit.type==="table") tables.push(getEntity("table",hit.id));
  });
  creatures.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  treasures.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  tables.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
  let html = "";
  if(creatures.length) html += `<section class="pp-events pp-appendix"><h2>Annexe — Créatures rencontrées (${creatures.length})</h2>${creatures.map(printCreatureBlock).join("")}</section>`;
  if(treasures.length) html += `<section class="pp-events pp-appendix"><h2>Annexe — Trésors & reliques (${treasures.length})</h2>${treasures.map(printTreasureBlock).join("")}</section>`;
  if(tables.length) html += `<section class="pp-events pp-appendix"><h2>Annexe — Tables aléatoires (${tables.length})</h2>${tables.map(printTableBlock).join("")}</section>`;
  return html;
}
function crawlDiagramSVG(c){
  const NW = 152, NH = 44, pad = 28, nodes = c.nodes||[];
  if(!nodes.length) return "";
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  nodes.forEach(n=>{ const x=n.x||0, y=n.y||0; minX=Math.min(minX,x); minY=Math.min(minY,y); maxX=Math.max(maxX,x+NW); maxY=Math.max(maxY,y+NH); });
  const ox=minX-pad, oy=minY-pad, w=(maxX-minX)+pad*2, h=(maxY-minY)+pad*2;
  const byId = id=>nodes.find(n=>n.id===id);
  const cx = n=>(n.x||0)+NW/2, cy = n=>(n.y||0)+NH/2;
  const edges = (c.edges||[]).map(e=>{
    const a=byId(e.from), b=byId(e.to); if(!a||!b) return "";
    const mx=(cx(a)+cx(b))/2, my=(cy(a)+cy(b))/2;
    return `<line x1="${cx(a)}" y1="${cy(a)}" x2="${cx(b)}" y2="${cy(b)}"/>${e.label?`<text class="elbl" x="${mx}" y="${my-4}" text-anchor="middle">${esc(e.label)}</text>`:""}`;
  }).join("");
  const boxes = nodes.map((n,i)=>{
    const ev=getEntity("event",n.eventId), title=ev?ev.title:"(événement supprimé)", x=n.x||0, y=n.y||0;
    return `<g class="pnode">
      <rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="7"/>
      <circle class="numc" cx="${x+16}" cy="${y+16}" r="11"/>
      <text class="numt" x="${x+16}" y="${y+20.5}" text-anchor="middle">${i+1}</text>
      <text class="ptitle" x="${x+32}" y="${y+29}">${esc(truncate(title,17))}</text>
    </g>`;
  }).join("");
  return `<svg viewBox="${ox} ${oy} ${w} ${h}" class="pp-svg" xmlns="http://www.w3.org/2000/svg">${edges}${boxes}</svg>`;
}
function printCrawl(id){
  const c = getEntity("pointcrawl", id); if(!c) return;
  const nodes = c.nodes||[];
  if(!nodes.length){ toast("Ajoutez au moins un point avant d'imprimer."); return; }
  const events = nodes.map((n,i)=>{
    const ev=getEntity("event",n.eventId);
    if(!ev) return `<div class="pp-event"><h3><span class="pp-num">${i+1}</span> <span>(événement supprimé)</span></h3></div>`;
    return `<div class="pp-event">
      <h3><span class="pp-num">${i+1}</span> <span>${esc(ev.title)}</span>${ev.theme?`<span class="pp-theme">${esc(ev.theme)}</span>`:""}</h3>
      ${printSection("Description & ambiance", ev.description)}
      ${printSection("Pièges — conditions & conséquences", ev.traps)}
      ${printSection("Secrets à découvrir", ev.secrets)}
    </div>`;
  }).join("");
  $("#print-area").innerHTML = `
    <section class="pp-map">
      <h1>${esc(c.title||"Point Crawl")}</h1>
      ${c.description?`<p class="pp-desc">${renderTextPrint(c.description)}</p>`:""}
      ${crawlDiagramSVG(c)}
    </section>
    <section class="pp-events"><h2>Événements du plan (${nodes.length})</h2>${events}</section>
    ${buildPrintAppendix(nodes)}`;
  document.fonts.load('30pt "JSL Blackletter"').catch(()=>{}).then(()=> window.print());
}

/* ---- Impression de fiches PJ (une par page A4, inspirée de la fiche perso vierge) ---- */
function pcInfoRest(info){
  const skipRe = /^\s*(Titre|Langues|Divinité|Trait d'ascendance.*|Armes autorisées|Armures autorisées|Capacités de classe|Jet de talent.*|PJ généré automatiquement.*)\s*:?/i;
  return String(info||"").split(/\r?\n/).filter(l=>!skipRe.test(l)).join("\n").trim();
}
function printInventoryList(p){
  const filled = String(p.inventory||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const slots = Math.max(parseInt(p.invSlots)||0, 10, filled.length);
  const items = []; for(let i=0;i<slots;i++) items.push(filled[i] ? esc(filled[i]) : "");
  return `<div class="pp-sec pp-pc-inv"><h4>Inventaire${p.invSlots?` — ${esc(p.invSlots)} emplacements (10 ou Force, la plus haute valeur)`:""}</h4>
    <div class="pp-pc-currency">PO ______&nbsp;&nbsp;&nbsp; PA ______&nbsp;&nbsp;&nbsp; PC ______</div>
    <ol class="pp-inv-list">${items.map(t=>`<li>${t}</li>`).join("")}</ol></div>`;
}
/* Bloc « Classe » du PDF — même source que pcClassSectionHTML (CLASSES_DATA[p.cls]), juste avec
   les classes CSS d'impression au lieu de celles de la fiche détail. */
function printClassBlock(p){
  const cd = CLASSES_DATA[p.cls];
  if(!cd) return "";
  const featureList = `<ul>${cd.feature.map(f=>`<li>${f.name?`<b>${esc(f.name)}</b> — `:""}${renderTextPrint(f.text)}</li>`).join("")}</ul>`;
  let spellLine = "";
  if(cd.spellClass){
    if(cd.spellsKnownLvl1>0){
      const dc = [1,2,3,4,5].map(r=>`Rang ${r} : DD ${spellCastDC(r)}`).join(" · ");
      const mod = cd.spellAbility ? parseAbilityMod(p[cd.spellAbility]) : 0;
      const rollLine = cd.spellAbility ? `Test d'incantation : 1d20${mod>=0?"+":""}${mod} (${ABILITY_LABELS[cd.spellAbility]})<br>` : "";
      spellLine = `<p><b>Incantation</b> — Sorts connus (rang 1) : ${cd.spellsKnownLvl1}${p.cls==="Prêtre"?" (+ Renvoi des morts-vivants, offert)":""}<br>${rollLine}${dc}</p>`;
    } else if(cd.spellsFromLevel){
      spellLine = `<p><b>Incantation</b> — aucun sort connu au 1er niveau, à partir du niveau ${cd.spellsFromLevel}.</p>`;
    }
  }
  let weaponLine = "";
  if(p.masteredWeapon && p.masteredWeapon.trim()){
    const bonus = 1 + Math.floor((parseInt(p.level)||1)/2);
    weaponLine = `<p><b>Arme maîtrisée</b> : ${esc(p.masteredWeapon)} (+${bonus} attaque/dégâts)</p>`;
  }
  let mentorLine = "";
  if(cd.usesMentor && p.mentor && MENTORS[p.mentor]){
    const men = MENTORS[p.mentor];
    mentorLine = `<p><b>Mentor</b> : ${esc(p.mentor)}</p>
      <table class="pp-tal"><tbody>${men.benefits.map(b=>`<tr><td>${esc(b.roll)}</td><td>${renderTextPrint(b.text)}</td></tr>`).join("")}</tbody></table>`;
  }
  return `<div class="pp-sec"><h4>Classe — ${esc(p.cls)}</h4>
    <p>Dé de vie d${cd.hitDie} · Armes : ${esc(cd.weapons)} · Armures : ${esc(cd.armor)}</p>
    ${featureList}
    ${weaponLine}${spellLine}
    <table class="pp-tal"><tbody>${cd.talents.map(t=>`<tr><td>${esc(t.roll)}</td><td>${renderTextPrint(t.text)}</td></tr>`).join("")}</tbody></table>
    ${mentorLine}
  </div>`;
}
function printPCSheet(p){
  const ab = [["FOR","str"],["DEX","dex"],["CON","con"],["INT","int"],["SAG","wis"],["CHA","cha"]];
  const titre = p.cls ? titleFor(p.cls, p.alignment, p.level) : "";
  const notes = pcInfoRest(p.info); // sécurité : retire encore les éventuelles lignes figées d'anciens PJ non nettoyés
  const sub = [p.ancestry,p.cls,p.level?`Niveau ${p.level}`:"",titre,p.alignment?cap(p.alignment):""].filter(Boolean).join(" · ");
  return `<section class="pp-pcsheet">
    <h1>${esc(p.name||"Sans nom")}</h1>
    <p class="pp-desc">${esc(sub||"—")}${p.languages?` · Langues : ${esc(p.languages)}`:""}${p.deity?` · Divinité : ${esc(p.deity)}`:""}</p>
    <div class="pp-pcstats">
      <div class="pp-pcbox"><label>PV</label><div class="v">${esc(p.hpCurrent||"—")}/${esc(p.hp||"—")}</div></div>
      <div class="pp-pcbox"><label>CA</label><div class="v">${esc(p.ac||"—")}</div></div>
      ${ab.map(([lbl,k])=>`<div class="pp-pcbox"><label>${lbl}</label><div class="v">${esc(p[k]||"—")}</div></div>`).join("")}
    </div>
    ${printClassBlock(p)}
    ${printSection("Compétences", p.skills)}
    ${p.spells&&p.spells.trim() ? printSection("Sortilèges", p.spells) : ""}
    ${printInventoryList(p)}
    ${notes ? printSection("Notes", notes) : ""}
  </section>`;
}
function printPCs(ids){
  const list = ids.map(id=>getEntity("pc",id)).filter(Boolean);
  if(!list.length){ toast("Sélectionnez au moins un PJ."); return; }
  $("#print-area").innerHTML = list.map(printPCSheet).join("");
  document.fonts.load('30pt "JSL Blackletter"').catch(()=>{}).then(()=> window.print());
}
function openPrintPCsModal(){
  const items = db.pcs;
  if(!items.length){ toast("Aucun PJ à imprimer."); return; }
  openModal(`<div style="display:flex;justify-content:space-between;align-items:center;gap:1rem">
      <h2 style="margin:0;color:var(--gold2)">Imprimer des fiches PJ</h2>
      <button class="icon-btn" data-modal-close="1">✕</button></div>
    <p class="faint" style="font-family:var(--ui);margin:.3rem 0 .8rem">Une fiche A4 par personnage coché.</p>
    <div style="max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:.4rem;margin-bottom:.8rem">
      ${items.map(p=>`<label style="display:flex;align-items:center;gap:.5rem;font-family:var(--ui);font-size:.9rem;cursor:pointer">
        <input type="checkbox" class="pcp-check" value="${p.id}" checked style="width:auto"> ${esc(p.name||"Sans nom")} <span class="faint">(${esc(p.cls||"—")})</span>
      </label>`).join("")}
    </div>
    <div class="form-actions">
      <button class="btn ghost sm" id="pcp-all">Tout cocher</button>
      <button class="btn ghost sm" id="pcp-none">Tout décocher</button>
      <button class="btn" id="pcp-go">🖨 Imprimer la sélection</button>
    </div>`);
  document.getElementById("pcp-all").addEventListener("click", ()=> document.querySelectorAll(".pcp-check").forEach(c=>c.checked=true));
  document.getElementById("pcp-none").addEventListener("click", ()=> document.querySelectorAll(".pcp-check").forEach(c=>c.checked=false));
  document.getElementById("pcp-go").addEventListener("click", ()=>{
    const ids = [...document.querySelectorAll(".pcp-check:checked")].map(c=>c.value);
    closeModal();
    printPCs(ids);
  });

/* ---- Export "cartes à jouer" des créatures (recto illustration, verso stat bloc) ----
   Format standard 63×88mm (cartes à jouer type Magic), 3×3 = 9 cartes par page A4, SANS espace
   entre les cartes (grille CSS sans gap) — chaque bordure de cellule devient une ligne de découpe
   continue sur toute la hauteur/largeur de la page, ce qui permet de couper au massicot en quelques
   passes droites plutôt que carte par carte. Demande explicite de Tristan (2026-08-10) : "collées
   entre elles, sinon il faut faire plus de traits de découpe".
   Recto et verso sont générés comme deux groupes de pages SÉPARÉS (tout le recto, puis tout le
   verso), dans le MÊME ordre/même position de grille — pas de retournement/miroir tenté pour un
   recto-verso imprimé en duplex sur une même feuille : la convention de retournement (bord long/bord
   court) dépend de l'imprimante et du pilote de chacun, impossible à vérifier depuis cette session.
   Choix volontairement robuste : Tristan imprime/découpe les deux jeux de feuilles séparément, puis
   associe chaque recto à son verso par position (même case sur la même page = même créature), et les
   colle/laminae dos à dos lui-même. Chaque page porte un repère "Recto/Verso — page N/T" pour ne pas
   se tromper d'association. */
function creatureCardFrontHTML(c){
  const img = (c.images && c.images[0]) ? c.images[0].data : "";
  return `<div class="pp-card pp-card-front">
    ${img
      ? `<img class="pp-card-art" src="${img}" alt="">`
      : `<div class="pp-card-noart"><span>${esc((c.name||"?").trim().slice(0,1).toUpperCase())}</span></div>`}
    <div class="pp-card-frontfoot">
      <div class="pp-card-name">${esc(c.name||"Sans nom")}</div>
      ${c.category?`<div class="pp-card-cat">${esc(c.category)}</div>`:""}
    </div>
  </div>`;
}
function creatureCardBackHTML(c){
  const stats = [["FOR",c.str],["DEX",c.dex],["CON",c.con],["INT",c.int],["SAG",c.wis],["CHA",c.cha]]
    .filter(([,v])=>v).map(([l,v])=>`${l} ${esc(fmtMod(v))}`).join(" · ");
  const attacks = (c.attacks||[]).filter(a=>a.name||a.damage)
    .map(a=>`${esc(a.name||"Attaque")}${a.bonus?" "+esc(a.bonus):""} (${esc(a.damage||"?")})`).join(" ; ");
  return `<div class="pp-card pp-card-back">
    <div class="pp-card-back-name">${esc(c.name||"Sans nom")}</div>
    <div class="pp-card-back-line">CA ${esc(c.ac||"—")} · PV ${esc(c.hp||"—")} · Niv. ${esc(c.level||"—")}${c.alignment?" · "+esc(cap(c.alignment)):""}</div>
    ${stats?`<div class="pp-card-back-line">${stats}</div>`:""}
    ${attacks?`<div class="pp-card-back-sec"><b>Attaques</b>${attacks}</div>`:""}
    ${c.abilities?`<div class="pp-card-back-sec"><b>Capacités</b>${renderTextPrint(c.abilities)}</div>`:""}
  </div>`;
}
/* Pagination générique en grille 3×3 (9/page) — partagée entre l'export cartes des Créatures et
   celui des PNJ ci-dessous, seul le rendu recto/verso de chaque case change (htmlFn). */
function cardGridPages(items, htmlFn, labelFn){
  const totalPages = Math.max(1, Math.ceil(items.length/9));
  const pages = [];
  for(let i=0;i<items.length;i+=9){
    const pageNum = i/9+1;
    const slice = items.slice(i, i+9);
    const cells = slice.map(htmlFn).join("")

    pages.push(`<div class="pp-cards-page"><div class="pp-cards-pagelabel">${labelFn(pageNum,totalPages)}</div><div class="pp-cards-grid">${cells}</div></div>`);
  }
  return pages.join("");
}

   GÉNÉRATION ALÉATOIRE DE PJ — règles de création de personnage tirées du
   Quickstart Joueur (p.12-31). Réutilise les sorts déjà importés (db.spells)
   pour les classes de lanceurs, et complète les Tables aléatoires avec les
   tables manquantes du livre (Origines, Ascendances, Langues, Divinités) +
   une table de Noms maison (non issue du livre, purement pratique).
   ========================================================================= */
const ABILITY_MOD = (score)=>{
  const n = parseInt(score)||10;
  if(n<=3) return -4; if(n<=5) return -3; if(n<=7) return -2; if(n<=9) return -1;
  if(n<=11) return 0; if(n<=13) return 1; if(n<=15) return 2; if(n<=17) return 3; return 4;
};
const ABILITY_LABELS = {str:"Force", dex:"Dextérité", con:"Constitution", int:"Intelligence", wis:"Sagesse", cha:"Charisme"};
/* Un PJ stocke ses caractéristiques en texte libre (ex. "14 (+2)", parfois juste "+2" ou juste
   "14" selon comment la fiche a été remplie) — pas de champ numérique dédié pour le modificateur.
   Pour calculer le bonus réel d'incantation d'UN personnage (2026-08-12, demande de Tristan
   après avoir vu un exemple de shadowdarklings.net), on tente d'abord d'extraire le modificateur
   déjà écrit entre parenthèses, puis un modificateur seul, et en dernier recours on le calcule
   depuis un score brut via ABILITY_MOD() — pour ne jamais planter sur un champ vide ou mal formaté. */
function parseAbilityMod(raw){
  const s = String(raw||"").trim();
  if(!s) return 0;
  const inParens = s.match(/\(\s*([+-]?\d+)\s*\)/);
  if(inParens) return parseInt(inParens[1]);
  if(/^[+-]\d+$/.test(s)) return parseInt(s);
  const n = parseInt(s);
  return isNaN(n) ? 0 : ABILITY_MOD(n);
}
/* Modificateur total d'une caractéristique = modificateur de base (parseAbilityMod) + bonus
   d'objets/effets cumulés (p.abilityBonuses[k], ex : +1 INT d'un objet magique porté) — demande
   explicite de Tristan (2026-08-18) : la fiche doit distinguer score → mod. de base → total avec
   objets, et tout calcul en jeu (CA, attaque, DD d'incantation...) doit utiliser ce TOTAL, pas
   juste le mod. de base, sans quoi porter l'objet n'aurait aucun effet réel. */
function totalAbilityMod(d, k){ return parseAbilityMod(d[k]) + (Number(d.abilityBonuses && d.abilityBonuses[k]) || 0); }
/* Score brut affichable (pas le modificateur) depuis le texte stocké sur une caractéristique —
   "16 (+3)" et "16" donnent "16" ; un simple modificateur déjà saisi (ex. ancien PJ en "+2", sans
   score) ne permet pas de retrouver le score, d'où le "—". */
function abilityScoreOf(raw){
  const s = String(raw||"").trim();
  if(!s || /^[+-]/.test(s)) return null;
  const m = s.match(/^(\d+)/);
  return m ? m[1] : null;
}

   absente/vide ou si aucune ligne ne correspond à l'alignement. */
function rollDeity(alignment){
  const divEntries = appTableEntries("Divinités");
  if(divEntries && divEntries.length){
    const withAlign = divEntries.map(e=>{
      const m = e.raw.match(/\(([^)]*)\)/);
      return { name:e.name, align: m ? m[1].trim().toLowerCase() : null };
    });
    const candidates = withAlign.filter(e=>e.align===alignment);
    return (candidates.length ? pick(candidates) : pick(withAlign)).name;
  }

function pcArmorOptions(cd, currentArmorId){
  const list = classAllowedArmor(cd);
  if(currentArmorId && !list.some(a=>a.id===currentArmorId)){
    const cur = ARMOR_DATA.find(a=>a.id===currentArmorId);
    if(cur) return [...list, cur];
  }
  return list;
}
function pcWeaponOptions(cd, currentWeaponId){
  const list = classAllowedWeapons(cd);
  if(currentWeaponId && !list.some(w=>w.id===currentWeaponId)){
    const cur = WEAPONS_DATA.find(w=>w.id===currentWeaponId);
    if(cur) return [...list, cur];
  }
  return list;
}
function pcShieldAllowed(cd, d){ return classAllowsShield(cd) || !!(d && d.equippedShield); }
/* Tirage d'équipement de départ : une armure (pondérée vers "sans armure"/légère, cohérent avec un
   personnage niveau 1 qui n'a pas forcément les moyens d'une armure de plates à 130 po), un
   bouclier si la classe l'autorise (1 chance sur 3), une arme au hasard parmi celles permises. */
function rollStartingEquipment(cd){
  const armors = classAllowedArmor(cd);
  const armor = armors[Math.floor(Math.random()*armors.length)];
  const shield = classAllowsShield(cd) && Math.random()<(1/3);
  const weapons = classAllowedWeapons(cd);
  const weapon = weapons.length ? weapons[Math.floor(Math.random()*weapons.length)] : null;
  return { armorId: armor.id, shield, weaponIds: weapon ? [weapon.id] : [] };
}

function generateRandomPC(){
  seedCharGenTables();
  const cls = rollClass();
  const cd = CLASSES_DATA[cls];
  const alignment = rollAlignment();
  // 2026-08-13 : pioche désormais dans la table live "Ascendances" (onglet Tables aléatoires),
  // pas dans la constante ASCENDANCES — un ajout/retrait/modification fait par le MJ dans cet
  // onglet est donc pris en compte ici. Contrepartie assumée (accord de Tristan) : si le nom
  // extrait de la ligne piochée ne correspond à aucune entrée connue de ASCENDANCES (ex. le MJ a
  // ajouté une ascendance personnalisée), elle reste piochable mais perd tout effet mécanique
  // automatique (ex. le bonus de PV de "Robuste" ne s'applique qu'à ce nom exact) — averti par
  // toast ici, et rappelé en continu sur la fiche PJ via ascendanceTraitText()/detailPC().
  const { name: ancestryName, unmatched: ancestryUnmatched } = rollAscendance();
  const asc = ASCENDANCES[ancestryName] || { trait: ascendanceTableRawFor(ancestryName) || ancestryName, robust:false };

  const scores = rollAbilityScores();
  const mods = {}; Object.keys(scores).forEach(k=> mods[k]=ABILITY_MOD(scores[k]));

  const hp = rollHP(cd, mods.con, asc.robust);

  const level = "1";

  const talentRolls = [rollTalent(cd)];
  if(ancestryName==="Ambitieux") talentRolls.push(rollTalent(cd)); // jet de talent supplémentaire

  // Langues (2026-08-11) : plus liées à l'ascendance (supprimée avec les races) — chaque PJ tire
  // 1 langue courante au hasard en plus de la commune ; les bonus de classe (Magicien, etc.)
  // s'ajoutent par-dessus comme avant.
  const languages = rollLanguages(cd);

  const origine = rollOrigin();
  const nom = rollName();

  // 2026-08-13 : idem Ascendances, pioche dans la table live "Divinités" — voir rollDeity().
  const deity = cls==="Prêtre" ? rollDeity(alignment) : "";
  // Mentor (2026-08-12, Ensorceleur) : choix obligatoire pour la classe, tiré au hasard à la
  // génération faute de pouvoir demander au joueur — modifiable ensuite via le formulaire.
  const mentor = cd.usesMentor ? rollMentor() : "";

  const spellLines = (cd.spellClass && cd.spellsKnownLvl1>0) ? rollSpellsKnown(cd, cls) : [];

  const gold = rollGold();
  const equip = rollStartingEquipment(cd);
  const ac = computeACFromLoadout({equippedArmor:equip.armorId, armorMagicBonus:0, equippedShield:equip.shield, shieldMagicBonus:0}, mods.dex);
  const sgn = m => (m>=0?"+":"")+m;
  const invSlots = computeInvSlots(cls, scores.str, mods.con);

  const o = {
    id: uid(), name: nom, ancestry: ancestryName, cls: cls, level: level, alignment: alignment,
    ac: String(ac), hp: String(hp), hpCurrent: String(hp),
    str: `${scores.str} (${sgn(mods.str)})`, dex: `${scores.dex} (${sgn(mods.dex)})`, con: `${scores.con} (${sgn(mods.con)})`,
    int: `${scores.int} (${sgn(mods.int)})`, wis: `${scores.wis} (${sgn(mods.wis)})`, cha: `${scores.cha} (${sgn(mods.cha)})`,
    skills: [origine, cls==="Voleur" ? "Formé (avantage) : Grimper ; Se mouvoir en silence et se cacher ; Adopter des déguisements ; Repérer/désamorcer des pièges ; Tâches délicates (crochetage, pickpocket)." : ""].filter(Boolean).join("\n"),
    spells: spellLines.join("\n"),
    invSlots: String(invSlots),
    inventory: `${gold} po pour acheter le reste de votre équipement de départ (nourriture, corde, torches... — voir l'onglet Armurerie).`,
    languages: languages.join(", "),
    deity: deity,
    masteredWeapon: "",
    mentor: mentor,
    equippedArmor: equip.armorId, armorMagicBonus: 0,
    equippedShield: !!equip.shield, shieldMagicBonus: 0,
    weapons: (equip.weaponIds||[]).map(id=>({weaponId:id, magicBonus:0})),
    // Titre, langues (déjà stockées à part), armes/armures/capacités de classe et talents ne
    // sont plus figés ici : ils sont recalculés en direct depuis p.cls/p.ascendance à
    // l'affichage (voir detailPC/printPCSheet) — seul le jet de talent initial (un événement
    // ponctuel, pas une règle de classe) reste noté ici à titre d'historique. Pas de ligne
    // "PJ généré automatiquement" (retirée le 2026-08-12, Tristan : inutile et se retrouvait
    // imprimée sur la fiche de perso).
    info: talentRolls.map((r,i)=>`Jet de talent initial ${talentRolls.length>1?(i+1)+" ":""}(2d6=${r.total}) : ${r.text||"—"}`).join("\n"),
    images: [],
    portrait: pickRandomPortrait()
  };

  db.pcs.push(o);
  saveDB();
  toast(`${nom} (${ancestryName} ${cls}) généré !${ancestryUnmatched ? " Ascendance personnalisée : aucun bonus mécanique automatique (voir la fiche du PJ)." : ""}`);
  view = {tab:"pcs", mode:"detail", id:o.id};
  render();
}

  const genBtn = effectiveRole()==="gm" ? `<button class="btn ghost sm" data-pc-wizard-start="1">🧭 Créer un personnage</button>
    <button class="btn ghost sm" data-gen-pc="1">🎲 Générer un PJ aléatoire</button>
