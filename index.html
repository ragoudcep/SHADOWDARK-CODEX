<script>
"use strict";
/* ==========================================================================
   GRIMOIRE — Gestionnaire de campagne Shadowdark
   Persistance via Supabase (compte unique). Sans dépendance ni build.
   Huit entités : sessions, événements, tables, créatures, PNJ, point crawls, PJ, trésors.
   Liens inter-entités via la syntaxe [[Nom]] + rétroliens (backlinks).
   ========================================================================== */

/* ----------------------------- Stockage (Supabase) ------------------------ */
const SUPABASE_URL = "https://fvwzkjwnzjivxvgvbocq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2d3pranduemppdnh2Z3Zib2NxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzExNTAsImV4cCI6MjEwMTQ0NzE1MH0.djxNfJNOzVW2kWQIKHNnZxR3HBLq-dgOb3qsDDCuvhI";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STORE_KEY = "grimoire_shadowdark_v1"; // ancien cache localStorage — conservé en lecture seule, uniquement pour la migration initiale
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id" + Date.now() + Math.random().toString(36).slice(2));

const emptyDB = () => ({ sessions:[], events:[], creatures:[], tables:[], npcs:[], pointcrawls:[], pcs:[], treasures:[], hexmaps:[], spells:[], initiative:[], wheel:[], dungeonmaps:[] });

/* Lit l'ancien contenu localStorage (avant migration vers Supabase). Ne sert qu'une fois, au premier login. */
function loadLegacyLocalDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return Object.assign(emptyDB(), d);
  }catch(e){ return null; }
}

/* Charge les 8 tables depuis Supabase (une ligne par entité, colonne `data` en jsonb) */
async function fetchRemoteDB(){
  const out = emptyDB();
  for(const col of DB_COLS){
    const { data, error } = await sb.from(col).select("data");
    if(error){
      // Une table manquante (ex : script SQL pas encore exécuté) ne doit pas bloquer tout le reste.
      console.error(`Table "${col}" indisponible :`, error);
      continue;
    }
    out[col] = (data||[]).map(r=>r.data);
  }
  return out;
}

let storageOK = true;
/* Pousse tout le contenu actuel de `db` vers Supabase (upsert — n'efface jamais rien).
   Les suppressions sont gérées explicitement via deleteRemote()/wipeRemoteTable(). */
async function saveDB(){
  try{
    for(const col of DB_COLS){
      if(!db[col].length) continue;
      const rows = db[col].map(o=>({ id:o.id, data:o, updated_at:new Date().toISOString() }));
      const { error } = await sb.from(col).upsert(rows);
      if(error) throw error;
    }
    storageOK = true;
  }catch(e){
    console.error(e);
    if(storageOK){ storageOK = false;
      toast("Connexion à la base de données impossible : la dernière modification n'a peut-être pas été synchronisée.");
    }
  }
}

/* Sauvegarde dédiée à la table "initiative", volontairement à part de saveDB().
   saveDB() parcourt DB_COLS et abandonne dès la première collection en échec (throw) —
   or "pcs" est traité avant "initiative" dans cette liste : un enregistrement à problème
   n'importe où dans db.pcs bloquait alors silencieusement toute sauvegarde du suivi
   d'initiative pour le reste de la session (la carte semblait s'ajouter puis disparaissait
   au tick de polling suivant, qui re-récupérait l'état distant jamais réellement mis à jour). */
async function saveInitiative(){
  try{
    if(!db.initiative.length) return;
    const rows = db.initiative.map(o=>({ id:o.id, data:o, updated_at:new Date().toISOString() }));
    const { error } = await sb.from("initiative").upsert(rows);
    if(error) throw error;
  }catch(e){
    console.error(e);
    toast("Connexion à la base de données impossible : le suivi d'initiative n'a peut-être pas été synchronisé.");
  }
}

async function deleteRemote(col, id){
  try{ const { error } = await sb.from(col).delete().eq("id", id); if(error) throw error; }
  catch(e){ console.error(e); toast("Erreur de synchronisation lors de la suppression."); }
}

async function wipeRemoteTable(col){
  const { error } = await sb.from(col).delete().not("id","is",null);
  if(error) throw error;
}

let db = emptyDB();

/* --------------------------- État de navigation -------------------------- */
let view = { tab:"sessions", mode:"list", id:null }; // mode: list | detail | edit | new
let formImages = []; // état temporaire des images pendant l'édition d'une créature / PNJ
let PORTRAITS_MANIFEST = []; // catalogue portraits/manifest.json (bibliothèque partagée PJ/PNJ)
let portraitsReady = false;
let formPortrait = ""; // portrait sélectionné pendant l'édition d'un PJ/PNJ
let formMapImage = ""; // data URL temporaire pendant l'édition d'une carte de donjon
let crawlState = { id:null, linkMode:false, linkFrom:null }; // état de l'éditeur de point crawl
let editReturnTo = null; // {tab,id} — si défini, où revenir après l'édition d'un événement ouvert depuis un point crawl
let eventThemeFilter = "";
let expandedGroups = new Set(); // groupes repliés par défaut ; contient les clés explicitement dépliées
let creatureSort = "name";      // tri des créatures : name | lvlAsc | lvlDesc
let creatureCatFilter = "";     // filtre de catégorie ("" = toutes/regroupées, "__none__" = sans catégorie)
let tableCatFilter = "";        // filtre de catégorie des tables aléatoires (même principe que creatureCatFilter)
let readingMode = false; // "mode table de jeu" : masque les contrôles GM, agrandit le texte des fiches
let crawlStatusFilter = ""; // filtre de statut des point crawls ("" = tous)
/* Statut d'avancement d'un point crawl (c.status), demandé par Tristan pour s'y retrouver entre
   plusieurs chantiers en parallèle — champ facultatif, "" ou absent = non catégorisé (aucune
   migration : un point crawl existant sans statut reste juste non filtré/sans badge). */
const CRAWL_STATUSES = [
  { value:"creation",  label:"En création",  cls:"status-creation" },
  { value:"avisiter",  label:"À visiter",     cls:"status-avisiter" },
  { value:"encours",   label:"En cours",      cls:"status-encours" },
  { value:"visite",    label:"Déjà visité",   cls:"status-visite" }
];
function crawlStatusMeta(v){ return CRAWL_STATUSES.find(s=>s.value===v) || null; }

const TYPE_LABEL = { creature:"Créature", event:"Événement", table:"Table", session:"Session", npc:"PNJ", pointcrawl:"Point Crawl", pc:"PJ", treasure:"Trésor", hexmap:"Hexcrawl", spell:"Sort" };
const TABS = ["sessions","tables","events","pointcrawls","creatures","spells","pcs","npcs","treasures","hexmaps","dungeonmaps","initiative","wheel"];
const TYPE_OF_TAB = { sessions:"session", tables:"table", events:"event", creatures:"creature", spells:"spell", npcs:"npc", pointcrawls:"pointcrawl", pcs:"pc", treasures:"treasure", hexmaps:"hexmap", dungeonmaps:"dungeonmap", initiative:"initiative", wheel:"wheel" };
const TREASURE_CATS = [["trouvaille","Trouvaille"],["relique","Relique"],["regalia","Régalia"]];
function treasureCatLabel(k){ const f=TREASURE_CATS.find(c=>c[0]===k); return f?f[1]:(k||"Trésor"); }

/* ------------------------------ Utilitaires ------------------------------ */
const $ = s => document.querySelector(s);
const app = $("#app");

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* Résout un nom [[...]] vers une entité (insensible à la casse) */
function findByName(name){
  const n = name.trim().toLowerCase();
  for(const c of db.creatures) if((c.name||"").toLowerCase()===n) return {type:"creature", id:c.id};
  for(const e of db.events)    if((e.title||"").toLowerCase()===n) return {type:"event", id:e.id};
  for(const t of db.tables)    if((t.title||"").toLowerCase()===n) return {type:"table", id:t.id};
  for(const s of db.sessions)  if((s.title||"").toLowerCase()===n) return {type:"session", id:s.id};
  for(const p of db.npcs)      if((p.name||"").toLowerCase()===n) return {type:"npc", id:p.id};
  for(const pc of db.pointcrawls) if((pc.title||"").toLowerCase()===n) return {type:"pointcrawl", id:pc.id};
  for(const pj of db.pcs)         if((pj.name||"").toLowerCase()===n) return {type:"pc", id:pj.id};
  for(const tr of db.treasures)   if((tr.name||"").toLowerCase()===n) return {type:"treasure", id:tr.id};
  for(const sp of db.spells)      if((sp.name||"").toLowerCase()===n) return {type:"spell", id:sp.id};
  return null;
}
const TAB_OF = { creature:"creatures", event:"events", table:"tables", session:"sessions", npc:"npcs", pointcrawl:"pointcrawls", pc:"pcs", treasure:"treasures", hexmap:"hexmaps", dungeonmap:"dungeonmaps", spell:"spells", initiative:"initiative", wheel:"wheel" };
// Hoisté hors de applyRoleUI() pour être réutilisable ailleurs (ex. wheelRefViewable() : le bouton
// "Voir" d'un bonus gagné à la roue ne doit être proposé à un joueur que pour un type d'entité
// déjà public via cette même liste — une seule règle de visibilité, pas une inventée en double).
const PLAYER_VISIBLE_TABS = ["sessions","hexmaps","dungeonmaps","spells","pcs","initiative","wheel"];

/* Rend un texte libre : échappe le HTML puis transforme [[Nom]] en lien cliquable */
function renderText(text){
  if(!text) return "";
  const s = String(text);
  const re = /\[\[([^\]]+)\]\]/g;
  let html = "", last = 0, m;
  while((m = re.exec(s))){
    html += esc(s.slice(last, m.index));
    const name = m[1].trim();
    const hit = findByName(name);
    html += hit
      ? `<a class="wl ${hit.type}" data-goto="${hit.type}:${hit.id}">${esc(name)}</a>`
      : `<a class="wl bad" title="Aucune entité nommée « ${esc(name)} »" data-create="${esc(name)}">${esc(name)}</a>`;
    last = re.lastIndex;
  }
  html += esc(s.slice(last));
  return html;
}

/* Transforme un texte multi-lignes en liste à puces (ignore les lignes vides) */
function renderBullets(text){
  const lines = String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return `<p class="faint">— (vide)</p>`;
  return `<ul class="bullets">${lines.map(l=>`<li>${renderText(l)}</li>`).join("")}</ul>`;
}
/* Section à puces rendue seulement si elle contient quelque chose (sinon rien) */
function bulletSection(label, text){
  const has = String(text||"").split(/\r?\n/).some(l=>l.trim());
  return has ? `<div class="section"><h2>${label}</h2>${renderBullets(text)}</div>` : "";
}
function eventSectionsHTML(e, opts){
  const secs = bulletSection((opts&&opts.short?"① Description":"① Description & ambiance"), e.description)
    + bulletSection((opts&&opts.short?"② Pièges":"② Pièges — conditions & conséquences"), e.traps)
    + bulletSection("③ Secrets à découvrir", e.secrets);
  return secs.trim() ? secs : `<p class="faint" style="font-family:var(--ui)">Aucun détail renseigné pour l'instant.</p>`;
}

/* Concatène tout le texte cherchable/liable d'une entité */
function entityText(type, o){
  if(type==="creature") return [o.name,o.category,o.desc,o.abilities,(o.attacks||[]).map(a=>a.name+" "+a.damage).join(" ")].join(" \n ");
  if(type==="event")    return [o.title,o.theme,o.description,o.traps,o.secrets].join(" \n ");
  if(type==="table")    return [o.title,o.category,o.context,(o.rows||[]).join(" \n ")].join(" \n ");
  if(type==="session")  return [o.title,(o.entries||[]).map(e=>e.label+" "+e.notes).join(" \n ")].join(" \n ");
  if(type==="npc")      return [o.name,o.description,o.physique,o.age,o.possessions,o.objectif,o.moyens,o.comportement].join(" \n ");
  if(type==="pointcrawl") return [o.title,o.description,(o.nodes||[]).map(nd=>{const ev=getEntity("event",nd.eventId);return ev?ev.title:"";}).join(" ")].join(" \n ");
  if(type==="pc")       return [o.name,o.ancestry,o.cls,o.info,o.skills,o.spells,o.inventory,(o.talents||[]).map(t=>t.text).join(" ")].join(" \n ");
  if(type==="treasure") return [o.name,treasureCatLabel(o.category),o.description,o.bonus,o.boon,o.curse,o.personality].join(" \n ");
  if(type==="spell")    return [o.name,spellClassLabel(o.class),o.tier?"rang "+o.tier:"",o.range,o.duration,o.effect].join(" \n ");
  return "";
}
function entityTitle(type,o){ return (type==="creature"||type==="npc"||type==="pc"||type==="treasure"||type==="spell") ? o.name : o.title; }

/* Extrait les noms référencés en [[...]] dans un texte */
function extractLinks(text){
  const out = []; const re = /\[\[([^\]]+)\]\]/g; let m;
  while((m=re.exec(text||""))) out.push(m[1].trim().toLowerCase());
  return out;
}

/* Calcule les rétroliens vers une entité cible : qui la mentionne en [[...]] ? */
function findBrokenLinks(){
  const results = [];
  const collections = [["event",db.events],["table",db.tables],["session",db.sessions],["creature",db.creatures],["npc",db.npcs],["pointcrawl",db.pointcrawls],["pc",db.pcs],["treasure",db.treasures],["spell",db.spells]];
  for(const [type,list] of collections){
    for(const o of list){
      const links = extractLinks(entityText(type,o));
      const bad = [...new Set(links)].filter(n=>n && !findByName(n));
      if(bad.length) results.push({type, id:o.id, title:entityTitle(type,o)||"Sans titre", names:bad});
    }
  }
  return results;
}
function openCreditsModal(){
  openModal(`<h2 style="margin-top:0;color:var(--gold2)">ⓘ Crédits</h2>
    <p style="font-family:var(--ui);font-size:.9rem;line-height:1.6">
      Les icônes du picker de points d'intérêt (Hexcrawl) proviennent de
      <a href="https://game-icons.net" target="_blank" rel="noopener">game-icons.net</a>,
      sous licence <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a>.
    </p>
    <p style="font-family:var(--ui);font-size:.85rem;line-height:1.6;color:var(--muted)">
      Auteurs : Cathelineau, Delapouite, Kier Heyl, Lorc, Skoll (via game-icons.net).
    </p>
    <div class="form-actions"><button class="btn ghost" data-modal-close="1">Fermer</button></div>`);
}
function openBrokenLinksModal(){
  const results = findBrokenLinks();
  const count = results.reduce((n,r)=>n+r.names.length,0);
  const body = results.length ? results.map(r=>`
    <div class="mli" data-goto="${r.type}:${r.id}">
      <div style="font-weight:700;color:var(--gold2)">${esc(r.title)} <span class="faint" style="font-weight:400">(${TYPE_LABEL[r.type]})</span></div>
      <div style="margin-top:.3rem;display:flex;gap:.3rem;flex-wrap:wrap">${r.names.map(n=>`<span class="tag" style="color:var(--link-bad);border-color:#5a2f2f">[[${esc(n)}]]</span>`).join("")}</div>
    </div>`).join("") : `<p class="faint" style="font-family:var(--ui)">Aucun lien cassé — tout est bien référencé.</p>`;
  openModal(`<h2 style="margin-top:0;color:var(--gold2)">⚠ Liens cassés${count?` (${count})`:""}</h2>
    <p class="faint" style="font-family:var(--ui);font-size:.85rem;margin:.2rem 0 .8rem">Cliquez une fiche pour l'ouvrir et corriger le lien [[…]] manquant.</p>
    <div class="modal-list">${body}</div>`);
}
function backlinksTo(targetType, targetId){
  const target = getEntity(targetType, targetId);
  if(!target) return {};
  const targetName = entityTitle(targetType, target).toLowerCase();
  const groups = { event:[], table:[], session:[], creature:[], npc:[], pointcrawl:[], pc:[], treasure:[], spell:[] };
  const scan = (type, list)=>{
    for(const o of list){
      if(type===targetType && o.id===targetId) continue;
      const links = extractLinks(entityText(type,o));
      if(links.includes(targetName)) groups[type].push({type, id:o.id, title:entityTitle(type,o)});
    }
  };
  scan("event", db.events); scan("table", db.tables);
  scan("session", db.sessions); scan("creature", db.creatures); scan("npc", db.npcs); scan("pointcrawl", db.pointcrawls); scan("pc", db.pcs); scan("treasure", db.treasures); scan("spell", db.spells);
  return groups;
}

/* ------------------------------- CRUD ------------------------------------ */
function collectionOf(type){ return { creature:db.creatures, event:db.events, table:db.tables, session:db.sessions, npc:db.npcs, pointcrawl:db.pointcrawls, pc:db.pcs, treasure:db.treasures, hexmap:db.hexmaps, dungeonmap:db.dungeonmaps, spell:db.spells, initiative:db.initiative, wheel:db.wheel }[type]; }
function getEntity(type,id){ return collectionOf(type).find(o=>o.id===id); }
function deleteEntity(type,id){
  const c = collectionOf(type); const i = c.findIndex(o=>o.id===id);
  if(i>=0){ c.splice(i,1); deleteRemote(TAB_OF[type], id); }
}

/* Renommage : met à jour tous les liens [[Ancien nom]] → [[Nouveau nom]] dans toute la base */
function replaceLinksEverywhere(oldName, newName){
  const from = String(oldName||"").trim().toLowerCase();
  if(!from) return 0;
  let count = 0;
  const fix = s => s.replace(/\[\[([^\]]+)\]\]/g, (m, nm)=> nm.trim().toLowerCase()===from ? `[[${newName}]]` : m);
  const walk = obj => {
    if(Array.isArray(obj)){ obj.forEach(walk); return; }
    if(obj && typeof obj==="object"){
      for(const k in obj){
        if(k==="images") continue;                 // on saute les données d'images (base64)
        const v = obj[k];
        if(typeof v==="string"){ if(v.indexOf("[[")>=0){ const nv=fix(v); if(nv!==v){ obj[k]=nv; count++; } } }
        else if(v && typeof v==="object") walk(v);
      }
    }
  };
  walk(db);
  return count;
}
function maybePropagate(oldName, newName){
  if(!oldName || !newName || oldName===newName) return 0;
  return replaceLinksEverywhere(oldName, newName);
}

/* =========================================================================
   RENDU PRINCIPAL
   ========================================================================= */
function render(){
  if(initiativePollTimer && view.tab!=="initiative") stopInitiativePolling();
  if(dungeonMapsPollTimer && view.tab!=="dungeonmaps") stopDungeonMapsPolling();
  if(wheelAudioActive && view.tab!=="wheel") stopWheelTensionSound();
  // onglets actifs
  document.body.setAttribute("data-tab", view.tab);
  document.body.classList.toggle("reading-mode", readingMode);
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active", b.dataset.tab===view.tab));
  window.scrollTo({top:0});

  // Aperçu joueur sur un onglet réservé au MJ (hors PLAYER_VISIBLE_TABS, ex. Créatures, Trésor) :
  // ces onglets n'ont aucune branche de rendu "joueur" (rien à filtrer, ils n'existent tout
  // simplement pas pour un vrai compte joueur) — on affiche donc un état dédié SANS changer
  // d'onglet ni de mode, plutôt que de rediriger ailleurs. Voir togglePlayerPreview().
  if(effectiveRole()!=="gm" && !PLAYER_VISIBLE_TABS.includes(view.tab)){
    app.innerHTML = emptyState("🚫", "Cet onglet n'est pas visible aux joueurs.");
    return;
  }

  if(view.mode==="detail") return renderDetail();
  if(view.mode==="edit" || view.mode==="new") return renderForm();
  return renderList();
}

function renderList(){
  if(view.tab==="events")    return listEvents();
  if(view.tab==="tables")    return listTables();
  if(view.tab==="creatures") return listCreatures();
  if(view.tab==="spells")    return listSpells();
  if(view.tab==="sessions")  return listSessions();

  if(view.tab==="pointcrawls") return listCrawls();

}
/* =========================================================================
   INITIATIVE — timeline de combat en direct (MJ + joueurs)
   Une seule table de combat active à la fois. Chaque participant référence un
   PJ ou une créature existants (nom/portrait/PV/CA résolus en direct depuis
   db.pcs/db.creatures, jamais dupliqués) ou porte un nom libre ("custom").
   Synchro joueurs : polling léger (pas de Supabase Realtime pour cette v1 —
   un combat n'a pas besoin d'une latence inférieure à quelques secondes).
   ========================================================================= */
let initiativePollTimer = null;
function stopInitiativePolling(){ if(initiativePollTimer){ clearInterval(initiativePollTimer); initiativePollTimer=null; } }
function startInitiativePolling(){
  if(initiativePollTimer) return;
  initiativePollTimer = setInterval(async ()=>{
    if(view.tab!=="initiative"){ stopInitiativePolling(); return; }
    if(document.activeElement && document.activeElement.matches && document.activeElement.matches("[data-init-manual-input]")) return; // ne pas écraser une saisie manuelle en cours
    try{
      const { data, error } = await sb.from("initiative").select("data");
      if(error) return; // table pas encore créée côté Supabase, ou souci réseau — on retente au prochain tick
      db.initiative = (data||[]).map(r=>r.data);
      if(view.tab==="initiative") renderList();
    }catch(e){ /* silencieux, on retente au prochain tick */ }
  }, 4500);
}

/* Nom/visuel figés au moment de l'ajout au combat — jamais un lookup live pour l'identité.
   Nécessaire car les joueurs n'ont pas de lecture RLS sur "creatures" (pour ne pas leur
   spoiler les stats des monstres) : un lookup live échouerait silencieusement côté joueur
   et affichait à tort "Créature supprimée". Les stats (CA/PV/sous-titre) restent en direct
   dans initiativeEntryInfo() et n'apparaissent donc que pour un rôle qui peut les lire. */
function initiativeSnapshot(kind, entity){
  if(kind==="pc"){
    return {
      name: entity.name || "Sans nom",
      image: entity.portrait ? `portraits/${entity.portrait}` : ((entity.images&&entity.images[0]) ? entity.images[0].data : ""),
      grayscale: !!entity.portrait
    };
  }
  return {
    name: entity.name || "Sans nom",
    image: (entity.images&&entity.images[0]) ? entity.images[0].data : "",
    grayscale: false
  };
}

function initiativeEntryInfo(entry){
  if(entry.kind==="custom") return { name: entry.name || "Sans nom", sub:"", image:"", grayscale:false, icon:"⚔", ac:"", hp:"" };
  const icon = entry.kind==="pc" ? "🛡" : "🐲";
  const live = entry.kind==="pc" ? db.pcs.find(p=>p.id===entry.refId) : db.creatures.find(c=>c.id===entry.refId);
  // Migration silencieuse des entrées créées avant l'introduction du snapshot (le MJ a toujours
  // la lecture complète, donc c'est le rôle le plus sûr pour combler rétroactivement le snapshot manquant).
  if(effectiveRole()==="gm" && !entry.name && live){ Object.assign(entry, initiativeSnapshot(entry.kind, live)); saveInitiative(); }
  const name = entry.name || (live && live.name) || (entry.kind==="pc" ? "PJ supprimé" : "Créature supprimée");
  const image = entry.image || "";
  const grayscale = !!entry.grayscale;
  if(!live) return { name, sub:"", image, grayscale, icon, ac:"", hp:"" };
  const sub = entry.kind==="pc" ? [live.ancestry, live.cls].filter(Boolean).join(" · ") : (live.category || "");
  const ac = live.ac, hp = entry.kind==="pc" ? (live.hpCurrent||live.hp) : live.hp;
  return { name, sub, image, grayscale, icon, ac, hp };
}

function addInitiativeEntry(entry){
  db.initiative.push(Object.assign({ id:uid(), initiative:null, manual:false }, entry));
  saveInitiative(); renderList();
}
function addInitiativeFromPC(pcId){
  const pc = db.pcs.find(p=>p.id===pcId); if(!pc) return;
  addInitiativeEntry(Object.assign({ kind:"pc", refId:pcId }, initiativeSnapshot("pc", pc)));
}
function addInitiativeFromCreature(creatureId){
  const c = db.creatures.find(cr=>cr.id===creatureId); if(!c) return;
  addInitiativeEntry(Object.assign({ kind:"creature", refId:creatureId }, initiativeSnapshot("creature", c)));
}
function addInitiativeCustom(name){
  const n = (name||"").trim();
  if(!n) return;
  addInitiativeEntry({ kind:"custom", name:n });
}
function computeInitiativeRoll(e){
  let value = rollDice(1,20);
  if(e.kind==="pc"){ const pc = db.pcs.find(p=>p.id===e.refId); if(pc) value += ABILITY_MOD(pc.dex); }
  return value;
}
function rollInitiativeFor(id){
  const e = db.initiative.find(x=>x.id===id); if(!e) return;
  e.initiative = computeInitiativeRoll(e); e.manual = false;
  saveInitiative(); renderList();
}
function rollInitiativeAll(){
  let n = 0;
  db.initiative.forEach(e=>{ if(!e.manual){ e.initiative = computeInitiativeRoll(e); n++; } });
  saveInitiative(); renderList();
  toast(n ? `Initiative lancée pour ${n} participant(s).` : "Rien à lancer — toutes les valeurs sont figées manuellement.");
}
function setInitiativeManual(id, raw){
  const e = db.initiative.find(x=>x.id===id); if(!e) return;
  const v = raw==="" ? null : parseInt(raw,10);
  e.initiative = (v==null || isNaN(v)) ? null : v;
  e.manual = e.initiative!=null;
  saveInitiative();
}
function removeInitiativeEntry(id){ deleteEntity("initiative", id); renderList(); }
function clearInitiative(){
  confirmModal("Vider entièrement le suivi d'initiative ?", ()=>{

}

function listInitiative(){
  startInitiativePolling();
  const items = db.initiative;
  const pending = items.filter(e=>e.initiative==null);
  const ranked = items.filter(e=>e.initiative!=null).sort((a,b)=>b.initiative-a.initiative);

  const addBtns = effectiveRole()==="gm" ? `<button class="btn ghost sm" data-init-add-pc="1">+ PJ</button>
    <button class="btn ghost sm" data-init-add-creature="1">+ Créature</button>
    <button class="btn ghost sm" data-init-add-custom="1">+ Libre</button>
    <button class="btn ghost sm" data-init-roll-all="1">🎲 Lancer l'initiative</button>
    ${items.length ? `<button class="btn danger sm" data-init-clear="1">🗑 Vider le combat</button>` : ""}` : "";

  const head = `<div class="page-head">
    <div><h1>Initiative</h1><div class="sub">${items.length} participant(s)</div></div>
    ${addBtns ? `<div class="hbtns">${addBtns}</div>` : ""}
  </div>`;

  if(!items.length){
    app.innerHTML = head + emptyState("⚔", effectiveRole()==="gm" ? "Aucun combat en cours. Ajoutez des participants pour démarrer." : "Aucun combat en cours pour l'instant.");
    return;
  }

  // Compte les occurrences dupliquées (ex. plusieurs gobelins) pour les distinguer à l'affichage.
  const seen = new Map();
  const suffixFor = (e)=>{
    if(e.kind==="custom") return "";
    const key = e.kind+":"+e.refId;
    const total = items.filter(x=>x.kind===e.kind && x.refId===e.refId).length;
    if(total<=1) return "";
    const n = (seen.get(key)||0) + 1; seen.set(key, n);
    return ` (${n})`;
  };

  const cardHTML = (e, rank)=>{
    const info = initiativeEntryInfo(e);
    const suffix = suffixFor(e);
    const visual = info.image
      ? `<img class="init-portrait${info.grayscale?' portrait-gray':''}" src="${esc(info.image)}" alt="">`
      : `<div class="init-portrait init-portrait-fallback">${info.icon}</div>`;
    const stats = [info.ac?`CA ${esc(info.ac)}`:"", info.hp?`PV ${esc(info.hp)}`:""].filter(Boolean).join(" · ");
    const gmControls = effectiveRole()==="gm" ? `<button class="btn ghost sm" data-init-roll="${e.id}" title="Lancer 1d20${e.kind==='pc'?' + mod. DEX':''}">🎲</button>
      <input type="number" class="init-manual-input" data-init-manual-input="${e.id}" value="${e.initiative==null?'':e.initiative}" placeholder="—" title="Valeur manuelle">
      <button class="btn danger sm" data-init-remove="${e.id}" title="Retirer du combat">✕</button>` : "";
    return `<div class="init-card">
      <div class="init-rank">${rank!=null?rank:"—"}</div>
      ${visual}
      <div class="init-body">
        <div class="init-name">${esc(info.name)}${suffix}</div>
        ${(info.sub||stats) ? `<div class="init-sub">${[esc(info.sub),stats].filter(Boolean).join(" · ")}</div>` : ""}
      </div>
      <div class="init-value${e.initiative==null?' empty':''}">${e.initiative==null?"—":e.initiative}</div>
      ${gmControls ? `<div class="init-controls">${gmControls}</div>` : ""}
    </div>`;
  };

  const pendingHTML = pending.length ? `<div class="init-group-label">En attente de jet</div>
    <div class="init-track">${pending.map(e=>cardHTML(e,null)).join("")}</div>` : "";
  const rankedHTML = ranked.length ? `<div class="init-group-label">Ordre de passage</div>
    <div class="init-track">${ranked.map((e,i)=>cardHTML(e,i+1)).join("")}</div>` : "";

  app.innerHTML = head + pendingHTML + rankedHTML;
}

/* =========================================================================
   ROUE — roue de la fortune (bonus à gagner)
   Config MJ (liste de bonus texte) stockée comme une collection classique
   (db.wheel), MJ CRUD / joueur lecture — même modèle que hexmaps/spells.
   Le tirage est purement local à chaque client (pas d'état de tirage
   partagé, pas de synchro temps réel) : chaque joueur fait tourner la roue
   pour lui-même, tirage uniforme (Math.random) parmi les bonus définis par
   le MJ. Décision volontaire pour rester simple — voir docs/AUDIT.md.
   ========================================================================= */
function wheelConfig(){ return db.wheel[0] || null; }
function ensureWheelConfig(){
  let w = db.wheel[0];
  if(!w){ w = { id:uid(), segments:[], revealMode:"gift" }; db.wheel.push(w); }
  return w;
}
/* Un segment stocké peut être soit une chaîne brute (ancien format, sans lien), soit un objet
   {text, ref:{type,id}|null} (nouveau format — ref pointe vers l'entité d'origine quand le
   segment vient d'un préréglage, pour le bouton "Voir" sur l'écran de révélation). Les deux
   formats coexistent en base sans migration : on normalise à la lecture. */
function wheelNormSeg(s){
  if(s && typeof s === "object") return { text:(s.text||"").trim(), ref:s.ref||null };
  return { text:(s||"").trim(), ref:null };
}
function wheelSegments(){
  const w = wheelConfig();
  return (w && w.segments || []).map(wheelNormSeg).filter(s=>s.text);
}
/* Le bouton "Voir" (fiche de l'entité gagnée) ne doit jamais faire planter l'appli si l'entité a
   été supprimée depuis, et ne doit jamais donner à un joueur accès à un type d'entité qu'il ne
   verrait pas autrement dans l'appli (ex. Trésor, qui porte des champs MJ comme boon/curse) —
   on réutilise donc PLAYER_VISIBLE_TABS, la même règle qui cache déjà les onglets, plutôt que
   d'inventer un second système de permissions. */
function wheelRefViewable(ref){
  if(!ref || !ref.type || !ref.id) return false;
  if(!getEntity(ref.type, ref.id)) return false;
  if(effectiveRole()==="gm") return true;
  const tab = TAB_OF[ref.type];
  return !!tab && PLAYER_VISIBLE_TABS.includes(tab);
}
/* Choix MJ entre deux habillages de révélation, éditable via openWheelEditModal() :
   "gift" = paquet cadeau, "Joyeux anniversaire", fanfare musicale ;
   "chest" = coffre mystérieux, "Vous avez trouvé…", grincement de charnière. */
function wheelRevealMode(){
  const w = wheelConfig();
  return (w && w.revealMode) || "gift";
}

const WHEEL_PALETTE = ["var(--gold)","var(--blood)","var(--violet)","var(--gold2)","var(--blood2)","var(--violet2)"];
const WHEEL_SPIN_MS = 5400; // durée du tirage — au moins 5s de suspense demandées, source de vérité partagée avec le son
let wheelRotation = 0;   // rotation cumulée en degrés du <svg> roue — remise à 0 à chaque (re)rendu de l'onglet
let wheelSpinning = false;

/* Avec un préréglage (ex. tous les parchemins de sort), la liste de bonus peut compter des
   dizaines d'entrées — un camembert avec autant de quartiers textuels devient illisible ("un
   milliard de camemberts" — retour de Tristan) ; et reconstruire la roue à chaud juste avant de la
   faire tourner (pour piocher un sous-ensemble différent à chaque tirage) provoquait un blocage
   (transition CSS jamais déclenchée sur un <svg> tout juste recréé — retour de Tristan également).
   Au-delà de WHEEL_MAX_VISIBLE, la roue affiche donc TOUS les quartiers (tirage réellement
   équitable sur la liste complète, roue jamais reconstruite pendant un tirage — voir
   buildWheelSVG(..., blank) et spinWheel()) mais sans texte dessus, avec un effet de flou de
   mouvement pendant qu'elle tourne plus vite ; le nom gagné n'apparaît que sur l'écran de
   révélation. En dessous du seuil, les quartiers restent lisibles comme avant. */
const WHEEL_MAX_VISIBLE = 10;
/* Mode mystère (case à cocher côté MJ) : la roue affiche "?" à la place des noms tant qu'elle n'a
   pas tourné — seul l'écran de révélation montre le vrai texte gagné. Ne change que l'affichage,
   jamais le tirage (toujours équitable sur la liste réelle). */
function wheelMysteryMode(){ const w = wheelConfig(); return !!(w && w.mystery); }
function wheelDisplayTexts(segs, mystery){ return mystery ? segs.map(()=>"?") : segs.map(s=>s.text); }

/* --------- Son de tension (Web Audio API pure, aucun fichier externe) ---------
   Bruit blanc filtré ("brrrr" continu qui s'essouffle) + cliquets discrets qui
   ralentissent progressivement (roue à cliquet), tous deux calés sur WHEEL_SPIN_MS.
   Créé au clic sur "Tourner la roue" (geste utilisateur = pas de souci de politique
   autoplay), coupé proprement à la fin du tirage ou si on change d'onglet en route. */
let wheelAudioCtx = null;
let wheelAudioActive = null; // { noise, noiseGain, ticks, stopAt } de la session de son en cours, ou null
function ensureWheelAudioCtx(){
  if(!wheelAudioCtx) wheelAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(wheelAudioCtx.state==="suspended") wheelAudioCtx.resume();
  return wheelAudioCtx;
}
function startWheelTensionSound(durationMs){
  stopWheelTensionSound();
  let ctx;
  try{ ctx = ensureWheelAudioCtx(); }catch(e){ return; } // Web Audio indisponible : le tirage continue sans son
  const dur = durationMs/1000;
  const now = ctx.currentTime;
  const stopAt = now + dur;

  const bufferSize = ctx.sampleRate * 2;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
  const noise = ctx.createBufferSource();
  noise.buffer = buffer; noise.loop = true;
  const filter = ctx.createBiquadFilter();
  filter.type = "bandpass"; filter.Q.value = 5;
  filter.frequency.setValueAtTime(950, now);
  filter.frequency.exponentialRampToValueAtTime(220, stopAt);
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(0.0001, now);
  noiseGain.gain.linearRampToValueAtTime(0.1, now+0.25);
  noiseGain.gain.setValueAtTime(0.1, Math.max(now+0.26, stopAt-0.4));
  noiseGain.gain.linearRampToValueAtTime(0.0001, stopAt);
  noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(ctx.destination);
  noise.start(now); noise.stop(stopAt+0.1);

  // cliquets discrets, intervalle géométrique croissant = ralentissement type roue à cliquet
  const ticks = [];
  let t = 0.05, interval = 0.085;
  while(t < dur - 0.12){
    const at = now + t;
    const osc = ctx.createOscillator();
    osc.type = "square"; osc.frequency.setValueAtTime(680, at);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.22, at+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, at+0.045);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(at); osc.stop(at+0.06);
    ticks.push(osc);
    t += interval;
    interval *= 1.085;
  }

  wheelAudioActive = { noise, noiseGain, ticks, stopAt };
  setTimeout(()=>{ if(wheelAudioActive && wheelAudioActive.stopAt===stopAt) wheelAudioActive=null; }, durationMs+200);
}
function stopWheelTensionSound(){
  if(!wheelAudioActive || !wheelAudioCtx){ wheelAudioActive = null; return; }
  const ctx = wheelAudioCtx;
  const { noise, noiseGain, ticks } = wheelAudioActive;
  const now = ctx.currentTime;
  try{
    noiseGain.gain.cancelScheduledValues(now);
    noiseGain.gain.setValueAtTime(noiseGain.gain.value, now);
    noiseGain.gain.linearRampToValueAtTime(0.0001, now+0.06);
    noise.stop(now+0.08);
  }catch(e){ /* déjà arrêté */ }
  ticks.forEach(osc=>{ try{ osc.stop(now); }catch(e){} });
  wheelAudioActive = null;
}

/* Petite fanfare "tadaaa" (arpège montant + accord tenu) jouée à l'ouverture du cadeau,
   en plus du son de tension pendant la rotation — toujours en Web Audio pure, aucun fichier.
   Réutilise le même AudioContext que le son de tension (déjà débloqué par le clic initial). */
function playWheelFanfare(){
  let ctx;
  try{ ctx = ensureWheelAudioCtx(); }catch(e){ return; }
  const now = ctx.currentTime;
  const notes = [
    { freq:523.25, at:0,    dur:0.11 },  // do5  — "ta"
    { freq:659.25, at:0.11, dur:0.11 },  // mi5  — "da"
    { freq:783.99, at:0.22, dur:0.11 },  // sol5 — "da"
  ];
  notes.forEach(nt=>{
    const at = now+nt.at;
    const osc = ctx.createOscillator();
    osc.type = "triangle"; osc.frequency.setValueAtTime(nt.freq, at);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(0.24, at+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at+nt.dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(at); osc.stop(at+nt.dur+0.02);
  });
  // accord final tenu (do6 + sol5 + mi5) — le "DAAA" qui conclut la fanfare
  const chordAt = now+0.33;
  [ {freq:1046.5, type:"sawtooth", gain:0.26}, {freq:783.99, type:"triangle", gain:0.16}, {freq:659.25, type:"triangle", gain:0.16} ]
    .forEach(({freq,type,gain})=>{
      const osc = ctx.createOscillator();
      osc.type = type; osc.frequency.setValueAtTime(freq, chordAt);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, chordAt);
      g.gain.linearRampToValueAtTime(gain, chordAt+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, chordAt+0.9);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(chordAt); osc.stop(chordAt+0.95);
    });
}

/* Ouverture du coffre mystérieux (mode "chest") : un instant de grincement (juste un indice
   physique, très bref, jamais dominant) suivi d'un arpège ascendant scintillant + accord tenu
   avec vibrato — révélation triomphale façon "objet trouvé" (Zelda), jamais lugubre. Toujours en
   Web Audio pure. Génère une variante différente à chaque ouverture (racine/gamme/tempo/timbre/
   registre tirés au sort parmi des choix qui restent tous "brillants") plutôt qu'un unique son
   figé — beaucoup plus de variété réelle qu'une poignée de sons pré-enregistrés, et ça reste
   toujours dans la même famille sonore (jamais dissonant, jamais aussi sombre qu'avant). */
function wheelNoteFreq(semitoneFromA4){ return 440 * Math.pow(2, semitoneFromA4/12); }
const WHEEL_CHEST_ROOTS = [-9,-7,-5,-2,0,2]; // quelques toniques (do,ré,mi,sol,la,si) — choix lumineux
const WHEEL_CHEST_SCALES = [
  [0,4,7,12],    // triade majeure + octave
  [0,2,4,7,9],   // pentatonique majeure
  [0,4,7,11,12], // majeure 7 scintillante
  [0,3,7,10,12], // relative mineure, mais reste héroïque joué vite et en aigu
];
function playWheelChestOpen(){
  let ctx;
  try{ ctx = ensureWheelAudioCtx(); }catch(e){ return; }
  const now = ctx.currentTime;

  const root = WHEEL_CHEST_ROOTS[Math.floor(Math.random()*WHEEL_CHEST_ROOTS.length)];
  const scale = WHEEL_CHEST_SCALES[Math.floor(Math.random()*WHEEL_CHEST_SCALES.length)];
  const runLen = 3 + Math.floor(Math.random()*3); // 3 à 5 notes dans la montée
  const noteGap = 0.07 + Math.random()*0.03;
  const runWave = ["triangle","square","sine"][Math.floor(Math.random()*3)];
  const octaveShift = Math.random()<0.3 ? 12 : 0; // parfois un registre plus haut, pour varier

  // couvercle qui se soulève — un tout petit indice physique, très court
  const creak = ctx.createOscillator();
  creak.type = "triangle";
  const creakFilter = ctx.createBiquadFilter();
  creakFilter.type = "lowpass"; creakFilter.frequency.value = 800;
  const creakGain = ctx.createGain();
  creak.connect(creakFilter); creakFilter.connect(creakGain); creakGain.connect(ctx.destination);
  const creakBase = wheelNoteFreq(root-24+octaveShift);
  [[creakBase,0],[creakBase*1.4,0.06]].forEach(([freq,t])=>{
    const at = now+t;
    creak.frequency.setValueAtTime(freq, at);
    creakGain.gain.setValueAtTime(0.0001, at);
    creakGain.gain.linearRampToValueAtTime(0.1, at+0.015);
    creakGain.gain.exponentialRampToValueAtTime(0.02, at+0.08);
  });
  creak.start(now); creak.stop(now+0.18);

  // arpège ascendant — motif/gamme/tempo/timbre différents à chaque tirage
  const fanfareStart = now + 0.14;
  for(let i=0;i<runLen;i++){
    const deg = scale[Math.min(i, scale.length-2)]; // reste dans le corps de la gamme
    const freq = wheelNoteFreq(root + deg + octaveShift);
    const at = fanfareStart + i*noteGap;
    const osc = ctx.createOscillator();
    osc.type = runWave; osc.frequency.setValueAtTime(freq, at);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(0.26, at+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at+noteGap+0.05);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(at); osc.stop(at+noteGap+0.08);
  }

  // accord final tenu, brillant, léger vibrato — l'étincelle de la trouvaille
  const chordAt = fanfareStart + runLen*noteGap;
  const topDeg = scale[scale.length-1];
  const chordDegs = [topDeg, scale[Math.max(0,scale.length-3)], topDeg+7];
  chordDegs.forEach((deg,i)=>{
    const freq = wheelNoteFreq(root + deg + octaveShift);
    const osc = ctx.createOscillator();
    osc.type = i===chordDegs.length-1 ? "sine" : "triangle";
    osc.frequency.setValueAtTime(freq, chordAt);
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 5.5 + Math.random()*2;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = freq*0.01;
    lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, chordAt);
    g.gain.linearRampToValueAtTime(i===0?0.24:0.14, chordAt+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, chordAt+1.0);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(chordAt); lfo.start(chordAt);
    osc.stop(chordAt+1.05); lfo.stop(chordAt+1.05);
  });
}

/* Habillage du texte des secteurs : les bonus formulés en plusieurs mots (fréquent en
   Shadowdark — "Un droit de plume au sceau sacré", "104 points d'expérience"…) débordaient
   largement d'un simple texte radial sur une ligne, en particulier avec beaucoup de secteurs.
   On enveloppe donc le texte sur plusieurs lignes tangentielles, chacune contrainte à la corde
   réellement disponible à son rayon (2·r·sin(angle/2)) — la corde s'élargit avec le rayon, donc
   les lignes extérieures ont naturellement plus de place que les lignes proches du centre. Une
   seule taille de police est choisie pour l'ensemble de la roue (le pire des secteurs doit tenir),
   pour un rendu homogène. */
const WHEEL_CHAR_W = 0.6;     // largeur moyenne d'un caractère, en fraction de la taille de police (police --ui, semi-gras)
const WHEEL_MAX_LINES = 4;
const WHEEL_LABEL_BASE_R = 0.52; // fraction du rayon où démarre la 1ère ligne — plus haut/loin du centre que l'ancien 0.40
function wheelLineRadius(lineIdx, fontSize, r){ return r*WHEEL_LABEL_BASE_R + lineIdx*fontSize*1.15; }
function wheelLineBudget(lineIdx, fontSize, anglePerRad, r){
  const rr = wheelLineRadius(lineIdx, fontSize, r);
  const chord = 2*rr*Math.sin(anglePerRad/2);
  return Math.max(chord*0.8, fontSize*1.4);
}
function wheelTextWidth(text, fontSize){ return text.length*WHEEL_CHAR_W*fontSize; }
function truncateWheelText(text, budget, fontSize){
  const maxChars = Math.max(1, Math.floor(budget/(WHEEL_CHAR_W*fontSize)));
  return text.length<=maxChars ? text : text.slice(0, Math.max(1,maxChars-1))+"…";
}
/* Répartition gloutonne des mots sur des lignes de largeur croissante (une par rayon, li=0 = la
   plus proche du centre). Construite à partir de la FIN du texte : la ligne 0 (centre) reçoit les
   derniers mots, la dernière ligne (bord) reçoit les premiers — pour qu'une lecture du bord vers
   le centre restitue l'ordre naturel du texte (ex. "1d4 point d'XP" et non "d'XP point 1d4").
   Retourne overflow:true si le texte ne tient pas dans WHEEL_MAX_LINES à cette taille de police,
   auquel cas on tronque la ligne la plus externe plutôt que de laisser déborder sur le secteur voisin. */
function wrapWheelLabel(text, fontSize, anglePerRad, r){
  const words = text.split(/\s+/).filter(Boolean);
  const revWords = [...words].reverse();
  const chunkWords = []; // chunkWords[0] = mots de fin de texte (ligne la plus proche du centre)
  let cur = [];
  let li = 0;
  for(const word of revWords){
    const test = [word, ...cur]; // remet l'ordre normal des mots à l'intérieur de la ligne
    if(!cur.length || wheelTextWidth(test.join(" "), fontSize) <= wheelLineBudget(li, fontSize, anglePerRad, r)){
      cur = test;
    } else {
      chunkWords.push(cur);
      li++;
      if(li >= WHEEL_MAX_LINES){
        const budget = wheelLineBudget(li-1, fontSize, anglePerRad, r);
        const combined = [...chunkWords[chunkWords.length-1], word].join(" ");
        chunkWords[chunkWords.length-1] = [truncateWheelText(combined, budget, fontSize)];
        return { lines: chunkWords.map(c=>c.join(" ")), overflow:true };
      }
      cur = [word];
    }
  }
  if(cur.length) chunkWords.push(cur);
  const lines = chunkWords.map(c=>c.join(" "));
  return { lines, overflow:false };
}
function fitWheelFontSize(segments, anglePerRad, r){
  const candidates = [16,15,14,13,12,11,10,9,8,7];
  for(const fs of candidates){
    const fits = segments.every(seg => !wrapWheelLabel(seg, fs, anglePerRad, r).overflow);
    if(fits) return fs;
  }
  return 7; // dernier recours : la plus petite taille, quitte à tronquer la dernière ligne de certains secteurs
}

/* Secteurs = camembert SVG généré en JS (pas de dépendance). Convention d'angle :
   0° = est (droite), sens horaire — le secteur 0 démarre à -90° (haut du cadre),
   là où se trouve le pointeur fixe. */
function buildWheelSVG(segments, blank){
  const n = segments.length;
  const cx=150, cy=150, r=140;
  const anglePer = 360/n;
  const anglePerRad = anglePer*Math.PI/180;
  const pt = (angleDeg, radius)=>{ const a=angleDeg*Math.PI/180; return { x: cx+radius*Math.cos(a), y: cy+radius*Math.sin(a) }; };
  const fontSize = blank ? 0 : fitWheelFontSize(segments, anglePerRad, r);
  const parts = segments.map((seg,i)=>{
    const start = -90 + i*anglePer, end = start + anglePer, mid = start + anglePer/2;
    const p1 = pt(start,r), p2 = pt(end,r);
    const largeArc = anglePer>180 ? 1 : 0;
    const color = WHEEL_PALETTE[i % WHEEL_PALETTE.length];
    const pathEl = `<path d="M ${cx} ${cy} L ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} Z" style="fill:${color}"></path>`;
    if(blank) return pathEl; // trop de quartiers pour du texte lisible — voir commentaire plus haut
    const { lines } = wrapWheelLabel(seg, fontSize, anglePerRad, r);
    // Texte tangentiel fixe (aligné sur la tangente au rayon, mid+90°) — comme peint sur une
    // vraie roue de fête foraine : orientation propre à chaque secteur, ne se réajuste jamais
    // pour "rester lisible" une fois la roue tournée. Si un secteur atterrit en bas après un
    // tirage, son texte est à l'envers à ce moment-là, et c'est normal — voulu par Tristan.
    const textRot = mid + 90;
    const textParts = lines.map((line,li)=>{
      const tp = pt(mid, wheelLineRadius(li, fontSize, r));
      return `<text x="${tp.x.toFixed(2)}" y="${tp.y.toFixed(2)}" font-size="${fontSize}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${textRot.toFixed(2)} ${tp.x.toFixed(2)} ${tp.y.toFixed(2)})">${esc(line)}</text>`;
    }).join("");
    return pathEl + textParts;
  }).join("");
  return `<svg class="wheel-rotor${blank?' wheel-rotor-blank':''}" id="wheel-rotor" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">${parts}</svg>`;
}

// Segments actuellement affichés sur la roue — toujours la liste COMPLÈTE (au-delà de
// WHEEL_MAX_VISIBLE, juste sans texte, voir buildWheelSVG). Fixé au rendu de l'onglet et JAMAIS
// modifié pendant un tirage : le <svg> n'est plus jamais recréé au clic sur "Tourner", ce qui
// élimine la classe de bug liée au timing de la transition CSS sur un élément tout juste (re)créé
// (retour de Tristan : la roue restait bloquée "en train de tourner" sans jamais conclure).
let wheelDisplayedSegs = [];

function viewWheel(){
  wheelRotation = 0; wheelSpinning = false; // le SVG est reconstruit à chaque appel, sa rotation visuelle repart de 0
  const segments = wheelSegments();
  const mystery = wheelMysteryMode();
  const editBtn = effectiveRole()==="gm" ? `<button class="btn ghost sm" data-wheel-edit="1">✎ Modifier les bonus</button>` : "";
  const blank = segments.length > WHEEL_MAX_VISIBLE;
  const capNote = blank ? " — trop nombreux pour être affichés lisiblement, la roue tourne « à l'aveugle » (flou, plus rapide)" : "";
  const mysteryNote = mystery ? " · 🎭 mode mystère" : "";
  const head = `<div class="page-head">
    <div><h1>Roue des bonus</h1><div class="sub">${segments.length} bonus configuré(s)${capNote}${mysteryNote}</div></div>
    ${editBtn ? `<div class="hbtns">${editBtn}</div>` : ""}
  </div>`;

  if(segments.length < 2){
    app.innerHTML = head + emptyState("🎡", effectiveRole()==="gm"
      ? "Ajoute au moins deux bonus pour activer la roue."
      : "Ton MJ n'a pas encore configuré la roue.");
    return;
  }

  wheelDisplayedSegs = segments; // toujours tout le monde pour le TIRAGE — voir plus haut
  // En mode "à l'aveugle", aucun texte n'est lisible de toute façon : le nombre de quartiers
  // dessinés n'a donc plus besoin de correspondre au nombre réel de bonus. On se limite à
  // WHEEL_MAX_VISIBLE quartiers décoratifs (sinon des dizaines de micro-parts fines à l'écran)
  // — le tirage réel reste équitable sur toute la liste, juste totalement découplé de l'affichage
  // (voir spinWheel()).
  const svgHTML = blank ? buildWheelSVG(Array(WHEEL_MAX_VISIBLE).fill(""), true) : buildWheelSVG(wheelDisplayTexts(segments, mystery));
  app.innerHTML = `${head}
    <div class="wheel-stage">
      <div class="wheel-frame">
        <div class="wheel-pointer"></div>
        ${svgHTML}
        <div class="wheel-hub"></div>
      </div>
      <button class="btn wheel-spin-btn" data-wheel-spin="1">🎡 Tourner la roue</button>
    </div>`;
}

function spinWheel(){
  if(wheelSpinning) return;
  stopWheelTensionSound(); // garde-fou : coupe un éventuel reliquat sonore avant de relancer
  const displayed = wheelDisplayedSegs;
  if(displayed.length < 2) return;
  const rotor = document.getElementById("wheel-rotor");
  const btn = document.querySelector("[data-wheel-spin]");
  if(!rotor) return;
  wheelSpinning = true;
  if(btn) btn.disabled = true;
  const blank = rotor.classList.contains("wheel-rotor-blank");

  // Tirage uniformément sur toute la liste (voir wheelDisplayedSegs) — le <svg> n'est jamais
  // touché avant d'être une seule fois animé via son transform ci-dessous.
  const idx = Math.floor(Math.random()*displayed.length);
  const winnerSeg = displayed[idx];

  let delta;
  if(blank){
    // Les quartiers dessinés sont purement décoratifs en mode "à l'aveugle" (voir viewWheel()) et
    // ne correspondent plus au gagnant réel tiré ci-dessus — la position d'arrêt est donc un angle
    // au hasard, indépendant de idx/displayed.length.
    delta = Math.random()*360;
  } else {
    const n = displayed.length;
    const anglePer = 360/n;
    const segMidAngle = -90 + idx*anglePer + anglePer/2;
    delta = (-90 - segMidAngle) % 360;
    if(delta < 0) delta += 360;
  }
  // Beaucoup plus de tours en mode "à l'aveugle" (flou) pour renforcer l'effet "trop rapide pour
  // lire" — toujours dans la même durée totale (WHEEL_SPIN_MS), donc toujours au moins 5s.
  const turns = blank ? (14 + Math.floor(Math.random()*5)) : (7 + Math.floor(Math.random()*4));
  const currentMod = ((wheelRotation % 360) + 360) % 360;
  let add = delta - currentMod;
  if(add <= 0) add += 360;
  wheelRotation += add + turns*360;

  if(blank) rotor.classList.add("spinning-blur");
  rotor.style.transform = `rotate(${wheelRotation}deg)`; // la transition (durée = WHEEL_SPIN_MS) vient de la classe .wheel-rotor
  startWheelTensionSound(WHEEL_SPIN_MS);
  // Garde-fou (défense en profondeur, gardé même si la cause principale du blocage est éliminée
  // ci-dessus) : si transitionend ne se déclenche jamais pour une autre raison (onglet en
  // arrière-plan qui suspend les transitions…), l'appli ne doit jamais rester bloquée indéfiniment.
  let wheelSpinSettled = false;
  const finishWheelSpin = ()=>{
    if(wheelSpinSettled) return;
    wheelSpinSettled = true;
    wheelSpinning = false;
    if(btn) btn.disabled = false;
    rotor.classList.remove("spinning-blur"); // pour que la prochaine animation puisse rejouer depuis le début
    stopWheelTensionSound();
    showWheelReward(winnerSeg);
  };
  rotor.addEventListener("transitionend", finishWheelSpin, { once:true });
  setTimeout(finishWheelSpin, WHEEL_SPIN_MS + 600);
}

/* Révélation : boîte (cadeau ou coffre, selon wheelRevealMode()) qui s'ouvre + confettis +
   grand texte d'accroche + bonus tiré — easter egg demandé explicitement, à chaque tirage.
   "gift" : paquet cadeau, "Joyeux anniversaire", fanfare musicale.
   "chest" : coffre mystérieux, "Vous avez trouvé…", grincement de charnière rouillée. */
const WHEEL_REVEAL_TEXT = { gift:"Joyeux anniversaire", chest:"Vous avez trouvé…" };
function showWheelReward(seg){
  // Tolère un appel avec du texte brut (compat) en plus de l'objet {text,ref} normal.
  const s = seg && typeof seg === "object" ? seg : { text:seg, ref:null };
  const mode = wheelRevealMode();
  const overlay = document.getElementById("wheel-reward");
  const inner = overlay.querySelector(".wheel-reward-inner");
  const viewBtn = wheelRefViewable(s.ref)
    ? `<button type="button" class="btn ghost" data-wheel-view-ref="${esc(s.ref.type)}:${esc(s.ref.id)}">👁 Voir la fiche</button>` : "";
  inner.innerHTML = `<div class="reveal-box ${mode}" id="wheel-gift"><div class="reveal-lid"></div><div class="reveal-base"></div></div>
    <div class="wheel-reward-banner" id="wheel-banner">
      <div class="wheel-reward-happy">${esc(WHEEL_REVEAL_TEXT[mode] || WHEEL_REVEAL_TEXT.gift)}</div>
      <div class="wheel-reward-prize">${esc(s.text)}</div>
      <div class="hbtns" style="justify-content:center">
        ${viewBtn}
        <button type="button" class="btn" data-wheel-reward-close="1">✦ Fermer</button>
      </div>
    </div>
    <div class="confetti-layer" id="wheel-confetti"></div>`;
  overlay.classList.remove("hidden");
  const gift = document.getElementById("wheel-gift"), banner = document.getElementById("wheel-banner");
  setTimeout(()=>{ gift.classList.add("shake"); }, 150);
  setTimeout(()=>{
    gift.classList.remove("shake"); gift.classList.add("open");
    spawnWheelConfetti();
    banner.classList.add("show");
    if(mode==="chest") playWheelChestOpen(); else playWheelFanfare();
  }, 750);
}
function hideWheelReward(){
  const overlay = document.getElementById("wheel-reward");
  overlay.classList.add("hidden");
  overlay.querySelector(".wheel-reward-inner").innerHTML = "";
}
function spawnWheelConfetti(){
  const layer = document.getElementById("wheel-confetti");
  if(!layer) return;
  const colors = ["var(--gold)","var(--gold2)","var(--blood)","var(--blood2)","var(--violet)","var(--violet2)"];
  let html = "";
  for(let i=0;i<50;i++){
    const left = (Math.random()*100).toFixed(1);
    const delay = (Math.random()*0.5).toFixed(2);
    const dur = (2.2 + Math.random()*1.2).toFixed(2);
    const color = colors[Math.floor(Math.random()*colors.length)];
    const rot = Math.floor(Math.random()*360);
    html += `<div class="confetti-piece" style="left:${left}%; background:${color}; animation-delay:${delay}s; animation-duration:${dur}s; transform:rotate(${rot}deg)"></div>`;
  }
  layer.innerHTML = html;
}

/* --------- Édition MJ des bonus (modale, liste simple ajout/suppr) --------- */
function wheelRowHTML(seg,i){
  const s = wheelNormSeg(seg);

      <div class="field" style="flex:1 1 200px"><input type="text" class="wheel-seg-input" value="${esc(s.text)}" placeholder="Ex. Potion de soin gratuite"></div>
      ${s.ref ? `<span class="tag gold" style="flex:0 0 auto" title="Lié à une fiche existante — se délie si tu modifies le texte">🔗</span>` : ""}
      <button class="btn danger sm" data-wheel-remove-seg>✕</button>
    </div></div>`;
}
function reindexWheelSegRows(){

}
function openWheelEditModal(){
  const w = ensureWheelConfig();
  const segs = w.segments.length ? w.segments : ["",""];
  const mode = w.revealMode || "gift";
  openModal(`<div style="position:sticky; top:-1.3rem; margin:-1.3rem -1.3rem 0; padding:1.3rem 1.3rem .8rem;
        background:var(--panel2); z-index:5; border-bottom:1px solid var(--border);
        display:flex; justify-content:space-between; align-items:center; gap:.6rem">
      <h2 style="margin:0;color:var(--gold2)">Bonus de la roue</h2>
      <div style="display:flex; gap:.4rem; align-items:center; flex:0 0 auto">
        <button type="button" class="btn sm" data-wheel-save-segments="1">✓ Enregistrer</button>
        <button class="icon-btn" data-modal-close="1">✕</button>
      </div>
    </div>
    <div class="field" style="margin:.7rem 0 1rem">
      <label>Ambiance de révélation</label>
      <select id="f-wheel-mode">
        <option value="gift" ${mode==="gift"?"selected":""}>🎁 Paquet cadeau — « Joyeux anniversaire »</option>
        <option value="chest" ${mode==="chest"?"selected":""}>🗝️ Coffre mystérieux — « Vous avez trouvé… »</option>
      </select>

    <div class="form-actions" style="margin-top:1rem"><button class="btn" data-wheel-save-segments="1">✓ Enregistrer</button><button class="btn ghost" data-modal-close="1">Annuler</button></div>`);

/* Lit l'état actuel des lignes de l'éditeur en {text,ref}[] — partagé entre saveWheelSegments()
   et l'enregistrement d'un préréglage personnalisé, pour ne pas dupliquer la logique de rupture
   de lien (ref conservée seulement si le texte de la ligne n'a pas été modifié à la main). */
function wheelReadRows(){
  return [...document.querySelectorAll("#wheel-seg-wrap .wheel-seg-item")].map(row=>{
    const text = row.querySelector(".wheel-seg-input").value.trim();
    if(!text) return null;
    let ref = null;
    const refAttr = row.dataset.segRef;
    if(refAttr && text===row.dataset.segOrigText){
      const sep = refAttr.indexOf(":");
      if(sep>0) ref = { type:refAttr.slice(0,sep), id:refAttr.slice(sep+1) };
    }
    return { text, ref };
  }).filter(Boolean);
}
/* Préréglages : remplacent la liste de segments par le contenu actuel d'une collection existante
   (sorts, ou trésors filtrés par catégorie) — un simple "remplissage rapide" modifiable ensuite,
   pas un lien permanent. Chaque ligne garde une référence {type,id} vers l'entité d'origine (pour
   le bouton "Voir" à la révélation), perdue si le texte de la ligne est modifié à la main. Pas de
   préréglage "Potion" pour l'instant : les tables aléatoires de potions sont encore à retravailler
   (demande explicite de Tristan, chantier séparé). */
function applyWheelPreset(kind){
  let segs;
  if(kind==="spell") segs = db.spells.map(s=>({ text:`Parchemin de ${s.name||"sort inconnu"}`, ref:{type:"spell",id:s.id} }));
  else segs = db.treasures.filter(t=>(t.category||"trouvaille")===kind).map(t=>({ text:t.name||"Objet sans nom", ref:{type:"treasure",id:t.id} }));
  segs = segs.filter(s=>s.text);
  if(!segs.length){ toast("Aucune donnée trouvée pour ce préréglage — remplis d'abord la collection correspondante."); return; }
  const wrap = $("#wheel-seg-wrap");
  wrap.innerHTML = segs.map(wheelRowHTML).join("");
  reindexWheelSegRows();
}
function saveWheelSegments(){
  const vals = wheelReadRows();
  if(vals.length < 2){ toast("Il faut au moins deux bonus non vides."); return; }
  const w = ensureWheelConfig();
  w.segments = vals;
  const modeEl = $("#f-wheel-mode");
  w.revealMode = modeEl && modeEl.value==="chest" ? "chest" : "gift";
  const mysteryEl = $("#f-wheel-mystery");
  w.mystery = !!(mysteryEl && mysteryEl.checked);
  saveDB();
  closeModal();
  toast("Roue mise à jour.");
  if(view.tab==="wheel") viewWheel();
}

/* Préréglages personnalisés (distincts des 4 préréglages de collection ci-dessus) : le MJ
   sauvegarde la liste de segments actuellement dans l'éditeur, sous un nom choisi, pour la
   réappliquer plus tard — stockés directement sur l'enregistrement wheel (w.presets), pas besoin
   d'une table Supabase dédiée. */
function wheelSaveCurrentAsPreset(name){
  const n = (name||"").trim();
  if(!n) return;
  const vals = wheelReadRows();
  if(vals.length < 2){ toast("Remplis au moins deux bonus avant d'enregistrer un préréglage."); return; }
  const w = ensureWheelConfig();
  if(!w.presets) w.presets = [];
  w.presets.push({ id:uid(), name:n, segments:vals });
  saveDB();
  toast(`Préréglage « ${n} » enregistré.`);
  openWheelEditModal();
}
function wheelApplyCustomPreset(id){
  const w = wheelConfig();
  const preset = w && (w.presets||[]).find(p=>p.id===id);
  if(!preset){ toast("Préréglage introuvable."); return; }
  const wrap = $("#wheel-seg-wrap");
  wrap.innerHTML = preset.segments.map(wheelRowHTML).join("");
  reindexWheelSegRows();
}
function wheelDeleteCustomPreset(id){
  const w = ensureWheelConfig();
  w.presets = (w.presets||[]).filter(p=>p.id!==id);
  saveDB();
  toast("Préréglage supprimé.");
  openWheelEditModal();
}

function diceIcon(n){
  const s = 'stroke="currentColor" fill="none" stroke-width="1.3" stroke-linejoin="round"';
  const s2 = 'stroke="currentColor" stroke-width="1" fill="none"';
  let shape;
  if(n===4) shape = `<polygon points="7,1.5 12.5,12 1.5,12" ${s}/><path d="M7,1.5 L7,12 M1.5,12 L7,7 L12.5,12" ${s2}/>`;
  else if(n===6) shape = `<rect x="2" y="2" width="10" height="10" ${s}/>`;
  else if(n===8) shape = `<polygon points="7,0.8 12.8,7 7,13.2 1.2,7" ${s}/><path d="M1.2,7 L12.8,7" ${s2}/>`;
  else if(n===10) shape = `<polygon points="7,0.8 11.5,4.5 9.5,13.2 4.5,13.2 2.5,4.5" ${s}/><path d="M2.5,4.5 L11.5,4.5" ${s2}/>`;
  else if(n===12) shape = `<polygon points="7,0.8 13,5.1 10.7,12.2 3.3,12.2 1,5.1" ${s}/><path d="M7,0.8 L7,6 M13,5.1 L7,6 L1,5.1 M10.7,12.2 L7,6 M3.3,12.2 L7,6" ${s2}/>`;
  else if(n===20) shape = `<polygon points="7,0.6 13,4.3 13,9.7 7,13.4 1,9.7 1,4.3" ${s}/><path d="M7,0.6 L7,7 M13,4.3 L7,7 M13,9.7 L7,7 M7,13.4 L7,7 M1,9.7 L7,7 M1,4.3 L7,7" ${s2}/>`;
  else shape = `<circle cx="7" cy="7" r="6.2" ${s}/>`;
  return `<svg width="14" height="14" viewBox="0 0 14 14" style="vertical-align:-2px;margin-right:.3rem">${shape}</svg>`;

/* ------------------ Tables dynamiques (tirent parmi une collection existante de l'appli) ------------------
   Une table "dynamique" (t.kind==="dynamic") ne stocke pas de contenu figé dans t.rows : à la place, elle
   pointe vers une collection de l'appli (t.source, ex. "creature") et, en option, un filtre (t.sourceFilter,
   utile pour les trésors classés par catégorie). Son "d-quelque-chose" et son contenu sont recalculés en
   direct à chaque affichage/tirage à partir de ce qui existe alors dans `db` — elle grossit toute seule au
   fil de la campagne, et est vide tant que rien n'a été créé dans la collection visée. `tab` ci-dessous est
   à la fois la clé de `db` et le nom de l'onglet (creatures/npcs/treasures partagent les deux). */
const DYNAMIC_TABLE_SOURCES = {
  creature: { tab:"creatures", hasCategoryFilter:false },
  npc:      { tab:"npcs",      hasCategoryFilter:false },
  treasure: { tab:"treasures", hasCategoryFilter:true },
  spell:    { tab:"spells",    hasCategoryFilter:false }
};
function dynamicSourceItems(t){
  const meta = DYNAMIC_TABLE_SOURCES[t.source];
  if(!meta) return [];
  let list = db[meta.tab] || [];
  if(t.sourceFilter){
    list = list.filter(x => (x.category || (meta.tab==="treasures" ? "trouvaille" : "")) === t.sourceFilter);
  }
  return list;
}
function tableSize(t){ return t.kind==="dynamic" ? dynamicSourceItems(t).length : (t.rows||[]).length; }

function tableCategories(){
  const set = new Set();
  db.tables.forEach(t=>{ if(t.category && t.category.trim()) set.add(t.category.trim()); });
  return [...set].sort((a,b)=>a.localeCompare(b));
}
function tableCard(t){
  const size = tableSize(t);
  return `<div class="card" data-open="table:${t.id}">
    <div class="meta"><span class="tag table">${diceIcon(size)}d${size}</span>${t.kind==="dynamic"?`<span class="tag gold">⚡ Dynamique</span>`:""}${t.category?`<span class="tag gold">${esc(t.category)}</span>`:""}</div>
    <h3 style="margin-top:.6rem">${esc(t.title||"Sans titre")}</h3>

}

function levelNum(l){
  l = String(l||"").trim();
  let m;
  if((m = l.match(/^(\d+)\s*\/\s*(\d+)/))) return (+m[1])/(+m[2]);   // niveaux fractionnaires (1/2, 1/4…)
  if((m = l.match(/-?\d+(\.\d+)?/))) return parseFloat(m[0]);
  return -1;
}
function creatureCategories(){
  const set = new Set();
  db.creatures.forEach(c=>{ if(c.category && c.category.trim()) set.add(c.category.trim()); });
  return [...set].sort((a,b)=>a.localeCompare(b));
}
function sortCreatures(list){
  const s = creatureSort;
  const a = [...list];
  if(s==="lvlAsc")  a.sort((x,y)=>levelNum(x.level)-levelNum(y.level) || (x.name||"").localeCompare(y.name||""));
  else if(s==="lvlDesc") a.sort((x,y)=>levelNum(y.level)-levelNum(x.level) || (x.name||"").localeCompare(y.name||""));
  else a.sort((x,y)=>(x.name||"").localeCompare(y.name||""));
  return a;
}

const NPC_SPELL_CLASSES = ["priest","wizard","witch"];
function generateRandomNPC(){
  seedNpcGenTables();
  const scores = ["str","dex","con","int","wis","cha"].reduce((o,k)=>{ o[k]=rollDice(3,6); return o; },{});
  const mods = {}; Object.keys(scores).forEach(k=> mods[k]=ABILITY_MOD(scores[k]));
  const sgn = m => (m>=0?"+":"")+m;
  const hp = Math.max(1, rollDice(1,6)+mods.con);
  const ac = 10 + mods.dex;
  const nom = rollOnAppTable("Noms de personnages") || pick(NOMS_ROWS);
  const ambition = rollOnAppTable("Ambitions de PNJ") || pick(AMBITIONS_PNJ_ROWS);
  const moyen = rollOnAppTable("Moyens de PNJ") || pick(MOYENS_PNJ_ROWS);
  const weapon = rollOnAppTable("Armes de base") || pick(ARMES_BASE_ROWS);

  let spells = "";
  if(rollDice(1,6)===1){
    const spellClass = pick(NPC_SPELL_CLASSES);
    const pool = db.spells.filter(s=>s.class===spellClass && String(s.tier)==="1");
    const chosen = pickN(pool, rollDice(1,3));
    spells = chosen.map(s=>`[[${s.name}]]`).join("\n");
    if(!pool.length) spells = `(Lanceur de sorts — importe les sorts de ${spellClass==="priest"?"prêtre":spellClass==="wizard"?"magicien":"sorcière"} pour un tirage automatique.)`;
  }

  const o = {
    id: uid(), name: nom, description:"", physique:"", age:"", possessions:"",
    objectif: ambition, moyens: moyen, comportement:"",
    ac: String(ac), hp: String(hp),
    str:`${scores.str} (${sgn(mods.str)})`, dex:`${scores.dex} (${sgn(mods.dex)})`, con:`${scores.con} (${sgn(mods.con)})`,
    int:`${scores.int} (${sgn(mods.int)})`, wis:`${scores.wis} (${sgn(mods.wis)})`, cha:`${scores.cha} (${sgn(mods.cha)})`,
    weapon, spells, images:[], portrait: pickRandomPortrait()
  };
  db.npcs.push(o);
  saveDB();
  toast(`${nom} généré !`);
  view = {tab:"npcs", mode:"detail", id:o.id};
  render();
}

function renderDetail(){
  const type = TYPE_OF_TAB[view.tab];
  const o = getEntity(type, view.id);
  if(!o){ view.mode="list"; return render(); }
  if(type==="event")    return detailEvent(o);
  if(type==="table")    return detailTable(o);
  if(type==="creature") return detailCreature(o);
  if(type==="spell")    return detailSpell(o);
  if(type==="session")  return detailSession(o);
  if(type==="npc")      return detailNPC(o);
  if(type==="pointcrawl") return detailCrawl(o);
  if(type==="pc")       return detailPC(o);
  if(type==="treasure") return detailTreasure(o);
  if(type==="hexmap") return detailHexmap(o);
  // detailDungeonMap() est TOUJOURS la vue d'édition MJ (peu importe qui l'appelle) — un vrai
  // compte joueur ne l'atteint jamais (aucune carte n'est cliquable côté joueur), mais un MJ en
  // aperçu qui était déjà sur le détail d'une carte au moment de basculer le mode doit retomber sur
  // le même rendu qu'un vrai joueur : la carte ACTIVE en lecture seule, pas forcément celle ouverte.
  if(type==="dungeonmap") return effectiveRole()==="gm" ? detailDungeonMap(o) : playerDungeonMapView();
}

function detailActions(type,id){
  const reading = document.body.classList.contains("reading-mode");
  const toggleBtn = `<button class="btn ghost sm reading-toggle" data-toggle-reading="1">${reading?"👁 Quitter le mode table":"👁 Mode table de jeu"}</button>`;
  if(effectiveRole()!=="gm") return `<div class="actions-row">${toggleBtn}</div>`;
  return `<div class="actions-row">${toggleBtn}<div class="actions">
    <button class="btn ghost sm" data-edit="${type}:${id}">✎ Modifier</button>
    <button class="btn ghost sm" data-dup="${type}:${id}">⧉ Dupliquer</button>
    <button class="btn danger sm" data-del="${type}:${id}">🗑 Supprimer</button>
  </div></div>`;
}
function duplicateEntity(type,id){
  const src = getEntity(type,id); if(!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid();
  // régénère les identifiants des sous-éléments pour éviter les collisions
  (copy.entries||[]).forEach(x=>{ x.id=uid(); x.visible=false; }); // une copie ne doit jamais être visible aux joueurs à leur insu
  (copy.nodes||[]).forEach(x=>x.id=uid());
  (copy.edges||[]).forEach(x=>x.id=uid());
  (copy.images||[]).forEach(x=>x.id=uid());
  (copy.strokes||[]).forEach(x=>x.id=uid());
  if(type==="dungeonmap") copy.active = false; // une copie ne doit jamais être affichée aux joueurs à leur insu
  if(type==="pointcrawl") copy.status = ""; // une copie repart à zéro : pas "déjà visité" comme l'original
  if(type==="npc"||type==="pc") delete copy.portrait; // le portrait d'origine reste réservé à la fiche source
  if(type==="creature"||type==="npc"||type==="pc"||type==="treasure"||type==="spell"||type==="dungeonmap") copy.name = (copy.name||"Sans nom")+" (copie)";
  if(type==="creature"){ copy.manual = true; delete copy.imported; }   // un doublon créé à la main est protégé du vidage
  else copy.title = (copy.title||"Sans titre")+" (copie)";
  collectionOf(type).push(copy);
  saveDB(); view={tab:TAB_OF[type],mode:"detail",id:copy.id}; render(); toast("Dupliqué.");
}

function backlinksBlock(type,id){
  const g = backlinksTo(type,id);
  const order = [["event","Événements"],["session","Sessions"],["table","Tables"],["creature","Créatures"],["spell","Sorts"],["pc","PJ"],["npc","PNJ"],["pointcrawl","Point Crawl"],["treasure","Trésor"]];
  const parts = order.filter(([k])=>g[k]&&g[k].length).map(([k,lbl])=>`
    <div class="bl-group"><div class="lbl">${lbl}</div>
      ${g[k].map(x=>`<span class="bl-chip" data-goto="${x.type}:${x.id}">${esc(x.title||"—")}</span>`).join("")}
    </div>`).join("");
  return `<div class="backlinks"><h2>⇠ Mentionné dans</h2>${parts || `<p class="faint">Aucune autre entité ne mentionne cet élément. Utilisez <code>[[${esc(entityTitle(type,getEntity(type,id)))}]]</code> ailleurs pour créer un lien.</p>`}</div>`;
}

function fmtMod(v){
  if(v===undefined||v===null||v==="") return "—";
  const s = String(v).trim();
  if(/^[+-]/.test(s)) return s;
  const n = Number(s);
  if(!isNaN(n)) return (n>=0?"+":"")+n;
  return s;
}

/* -------------------------- Portraits (bibliothèque) --------------------- */
/* Catalogue partagé de ~300 illustrations (portraits/manifest.json), utilisable
   sur les fiches PJ et PNJ. Un même fichier ne peut être assigné qu'à une seule
   fiche à la fois : la disponibilité se calcule en direct depuis db.pcs/db.npcs
   (pas de table séparée à tenir à jour ni à faire dériver). */
async function loadPortraitsManifest(){
  if(portraitsReady) return;
  try{
    const r = await fetch("portraits/manifest.json");
    if(r.ok) PORTRAITS_MANIFEST = await r.json();
  }catch(e){ /* facultatif : l'appli fonctionne sans */ }
  portraitsReady = true;
}
function portraitOwnerLabel(file, excludeId){
  const pc = db.pcs.find(p=>p.portrait===file && p.id!==excludeId);
  if(pc) return `PJ : ${pc.name||"Sans nom"}`;
  const npc = db.npcs.find(n=>n.portrait===file && n.id!==excludeId);
  if(npc) return `PNJ : ${npc.name||"Sans nom"}`;
  return "";
}
function usedPortraitFiles(excludeId){
  const used = new Set();
  db.pcs.forEach(p=>{ if(p.portrait && p.id!==excludeId) used.add(p.portrait); });
  db.npcs.forEach(n=>{ if(n.portrait && n.id!==excludeId) used.add(n.portrait); });
  return used;
}
function availablePortraits(excludeId){
  const used = usedPortraitFiles(excludeId);
  return PORTRAITS_MANIFEST.filter(p=>!used.has(p.file));
}
function pickRandomPortrait(race){
  const pool = availablePortraits(null);
  if(!pool.length) return "";
  const byRace = race ? pool.filter(p=>p.race && p.race.toLowerCase()===String(race).toLowerCase()) : [];
  const from = byRace.length ? byRace : pool;
  return from[Math.floor(Math.random()*from.length)].file;
}

function processImage(file, cb){
  if(!file.type || !file.type.startsWith("image/")){ toast("Fichier ignoré (pas une image)."); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    const src = reader.result;
    const im = new Image();
    im.onload = ()=>{
      const max = 1000; let w = im.width, h = im.height;
      if(Math.max(w,h) <= max){ cb({id:uid(),name:file.name,data:src}); return; }
      const scale = max/Math.max(w,h); w = Math.round(w*scale); h = Math.round(h*scale);
      const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(im,0,0,w,h);
      const mime = file.type.includes("png") ? "image/png" : "image/jpeg";
      cb({id:uid(),name:file.name,data:canvas.toDataURL(mime, 0.85)});
    };
    im.onerror = ()=>toast("Image illisible.");
    im.src = src;
  };
  reader.readAsDataURL(file);
}
/* Variante de processImage() pour les cartes de donjon : plafond de résolution plus haut (une
   carte doit rester lisible — texte, portes, grille — ce que 1000px écraserait), qualité JPEG
   légèrement réduite pour compenser. Callback reçoit directement la data URL (pas de galerie
   ici, une seule image par carte), stockée telle quelle dans le jsonb Supabase comme le reste
   des images de l'appli (pas de bucket Storage séparé — voir docs/AUDIT.md). */
function processMapImage(file, cb){
  if(!file.type || !file.type.startsWith("image/")){ toast("Fichier ignoré (pas une image)."); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    const src = reader.result;
    const im = new Image();
    im.onload = ()=>{
      const max = 1800; let w = im.width, h = im.height;
      if(Math.max(w,h) <= max){ cb(src); return; }
      const scale = max/Math.max(w,h); w = Math.round(w*scale); h = Math.round(h*scale);
      const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(im,0,0,w,h);
      const mime = file.type.includes("png") ? "image/png" : "image/jpeg";
      cb(canvas.toDataURL(mime, 0.82));
    };
    im.onerror = ()=>toast("Image illisible.");
    im.src = src;
  };
  reader.readAsDataURL(file);
}
