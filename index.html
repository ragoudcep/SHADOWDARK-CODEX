  const m = getEntity("hexmap", hexmapCurrentId);
  if(m) detailHexmap(m);
}
function toggleHexPaintingOverlay(){
  hexPaintingOverlay = !hexPaintingOverlay;
  if(hexPaintingOverlay){ hexPlacingPoint = false; hexPaintingBiome = false; }
  const m = getEntity("hexmap", hexmapCurrentId);
  if(m) detailHexmap(m);
}
function setHexBiome(q,r,biome){
  const m = getEntity("hexmap", hexmapCurrentId); if(!m) return;
  const h = (m.hexes||[]).find(x=>x.q===q && x.r===r); if(!h) return;
  h.biome = biome;
  saveDB();
  detailHexmap(m);
}
function setHexOverlay(q,r,overlay){
  const m = getEntity("hexmap", hexmapCurrentId); if(!m) return;
  const h = (m.hexes||[]).find(x=>x.q===q && x.r===r); if(!h) return;
  h.overlay = overlay;
  saveDB();
  detailHexmap(m);
}
function createHexPointAt(q,r){
  const m = getEntity("hexmap", hexmapCurrentId); if(!m) return;
  if(!m.points) m.points=[];
  const p = { id:uid(), name:"Nouveau point", description:"", type:"", icon:"", hex:{q,r}, color:"", size:"medium", dmOnly:false };
  m.points.push(p);
  hexPlacingPoint = false;
  saveDB();
  detailHexmap(m);
  openHexPointModal(p.id);
}
let _hexImportTarget = null; // null = nouvelle carte, sinon id de la carte à remplacer
function importHexmapJSON(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      const hexesObj = data.hexes || {};
      const hexes = Object.values(hexesObj).filter(h=>!h.layer||h.layer==="surface")
        .map(h=>({ q:h.q, r:h.r, hexType:h.hexType||"", fogState:h.fogState||"hidden", biome:h.biome||"", overlay:h.overlay||"" }));
      const points = ((data.pointCrawl&&data.pointCrawl.nodes)||[]).map(p=>({
        id:p.id||uid(), name:p.name||"", description:p.description||"", type:p.type||"", icon:p.icon||"",
        hex:p.hex||{q:0,r:0}, color:p.color||"", size:p.size||"medium", dmOnly:!!p.dmOnly
      }));
      const settings = {
        width:(data.settings&&data.settings.width)||0, height:(data.settings&&data.settings.height)||0,
        hexSize:(data.settings&&data.settings.hexSize)||30, orientation:(data.settings&&data.settings.orientation)||"pointy"
      };
      let targetId = _hexImportTarget;
      if(targetId){
        const m = getEntity("hexmap", targetId);
        if(!m){ toast("Carte introuvable."); return; }
        m.settings=settings; m.hexes=hexes; m.points=points;
        if(!m.title) m.title = data.name || "Carte importée";
      } else {
        const m = { id:uid(), title: data.name||"Carte importée", description: data.description||"", settings, hexes, points };
        db.hexmaps.push(m); targetId = m.id;
      }
      _hexImportTarget = null;
      saveDB(); view={tab:"hexmaps", mode:"detail", id:targetId}; render();
      toast(`Import : ${hexes.length} hexagone(s), ${points.length} point(s) d'intérêt.`);
    }catch(e){ toast("Import JSON échoué : "+e.message); }
  };
  r.readAsText(file);
}

/* =========================================================================
   CARTES DE DONJON — brouillard de guerre en zones colorées activables
   Le MJ prépare plusieurs cartes (image), une seule à la fois est "active"
   (db.dungeonmaps[].active). Les joueurs ne voient jamais que la carte
   active — la policy RLS Supabase filtre déjà les cartes non actives côté
   serveur (voir outils/supabase_dungeonmaps_setup.sql), donc leur contenu
   ne transite même pas sur le réseau chez un joueur.
   Troisième mouture du brouillard (v1 : patchs rectangulaires à poignées,
   trop pénibles à manipuler finement ; v2 : calque peint au pinceau/gomme
   sur un <canvas>, correct mais toujours une manipulation fine à la souris).
   v3 (actuelle, demandée par Tristan) : chaque coup de pinceau devient une
   **entité indépendante** (`m.strokes[]`, un tracé libre + un rayon,
   coordonnées dans l'espace pixel NATUREL de l'image — pas en pourcentage,
   voir plus bas pourquoi), avec une couleur assignée automatiquement
   (`DMAP_STROKE_COLORS`, cycle par index) pour les distinguer côté MJ. Le
   flux visé : le MJ dessine ses zones à la souris en préparation (précis),
   puis en jeu — notamment au téléphone — il lui suffit de **tapoter** une
   zone pour basculer `hidden` (caché, opaque) / révélé (transparent),
   sans avoir à repeindre finement sur un petit écran.
   Rendu SVG, pas canvas : chaque zone est un <path> avec pointer-events
   natif — le navigateur fait le hit-test du tap tout seul, pas besoin de
   vérifier des pixels à la main comme il aurait fallu avec un canvas.
   viewBox = dimensions naturelles de l'image (`m.imgW`/`m.imgH`, mise en
   cache à l'upload) avec un scale UNIFORME (pas de preserveAspectRatio
   "none") : un viewBox 0-100 étiré différemment en x/y aurait rendu les
   ronds du pinceau elliptiques sur une image non carrée — en gardant le
   viewBox à l'aspect-ratio réel de l'image, un rayon reste un vrai cercle
   à l'écran quel que soit le format du plan.
   Rendu MJ : zones colorées semi-transparentes si cachées, très pâles si
   révélées (repère visuel de l'état courant), curseur "pointer".
   Rendu joueur : seules les zones encore cachées sont rendues, en noir
   opaque uni (jamais la couleur MJ), aucune interactivité dans le DOM.
   Synchro joueurs : polling léger (même modèle que l'Initiative, 4,5s).
   ========================================================================= */
let dungeonMapCurrentId = null;
let dmapTool = "toggle"; // "toggle" (bascule, défaut) | "add" (pinceau libre) | "polygon" (points cliqués) | "delete"
let dmapBrushSize = 2; // % du plus grand côté de l'image — sert uniquement à dessiner une NOUVELLE zone au pinceau
let dmapDraftStroke = null; // {points:[{x,y}]} en cours de tracé au pinceau (mode "add")
let dmapDraftPolygon = null; // {points:[{x,y}]} sommets déjà posés au clic (mode "polygon")
let dmapShowPlayerPreview = false; // affiche un second rendu en lecture seule (vue joueur) sous la vue MJ

const DMAP_STROKE_COLORS = ["#e05252","#e0a052","#d4c93f","#7fc24e","#3fc29e","#4ea3e0","#8a7ae0","#c76ee0","#e06ea8","#9aa0a6"];

let dungeonMapsPollTimer = null;
function stopDungeonMapsPolling(){ if(dungeonMapsPollTimer){ clearInterval(dungeonMapsPollTimer); dungeonMapsPollTimer=null; } }
/* Intervalle volontairement différent de celui de l'Initiative (4,5s) — ici, chaque tick
   retélécharge la ligne ENTIÈRE de la carte active (`select("data")` ramène tout le jsonb, donc
   l'image base64 du plan à chaque fois, pas seulement `strokes`/`active`), potentiellement
   plusieurs centaines de Ko, alors que l'Initiative ne transporte que du texte léger. Descendre
   trop bas ferait exploser la consommation de data mobile sur une session de plusieurs heures.
   2,5s reste un compromis raisonnable (Tristan trouvait 4,5s trop lent en jeu). Pour aller plus
   vite sans alourdir la bande passante, il faudrait séparer l'image (statique, à charger une
   fois) de l'état qui bouge vraiment (strokes/active/softness) — via une sélection PostgREST sur
   des sous-champs du jsonb plutôt que la ligne complète — non fait ici faute de pouvoir tester
   contre le vrai projet Supabase (un mauvais nom de colonne romprait silencieusement le
   rafraîchissement joueur, pire que la lenteur actuelle). */
function startDungeonMapsPolling(){
  if(dungeonMapsPollTimer) return;
  dungeonMapsPollTimer = setInterval(async ()=>{
    if(view.tab!=="dungeonmaps"){ stopDungeonMapsPolling(); return; }
    try{
      const { data, error } = await sb.from("dungeonmaps").select("data");
      if(error) return; // table pas encore créée côté Supabase, ou souci réseau — on retente au prochain tick
      db.dungeonmaps = (data||[]).map(r=>r.data);
      if(view.tab==="dungeonmaps") renderList();
    }catch(e){ /* silencieux, on retente au prochain tick */ }
  }, 2500);
}

function loadImageAsync(src){
  return new Promise((resolve,reject)=>{ const im=new Image(); im.onload=()=>resolve(im); im.onerror=reject; im.src=src; });
}

function viewDungeonMaps(){
  if(effectiveRole()!=="gm") return playerDungeonMapView();
  return listDungeonMaps();
}

function listDungeonMaps(){
  const items = db.dungeonmaps;
  app.innerHTML = pageHead("Cartes de donjon", `${items.length} carte(s)`, "Nouvelle carte") +
    (items.length ? `<div class="grid">${items.map(m=>{
      const total = (m.strokes||[]).length, hidden = (m.strokes||[]).filter(s=>s.hidden).length;
      return `<div class="card" data-open="dungeonmap:${m.id}">
        ${m.image?`<img class="thumb" src="${m.image}" alt="">`:""}
        <h3>${esc(m.name||"Sans nom")}${m.active?' <span class="tag gold">Active</span>':""}</h3>
        <div class="meta"><span class="tag">${total} zone${total>1?"s":""}</span>${total?`<span class="tag gold">${hidden} cachée${hidden>1?"s":""}</span>`:""}</div>
      </div>`;
    }).join("")}</div>`
    : emptyState("🗺️","Aucune carte de donjon pour l'instant. Prépares-en une pour tes joueurs."));
}

function playerDungeonMapView(){
  startDungeonMapsPolling();
  const m = db.dungeonmaps.find(x=>x.active);
  if(!m){ app.innerHTML = emptyState("🗺️","Ton MJ n'a pas encore affiché de carte."); return; }
  app.innerHTML = `<div class="detail"><h1>${esc(m.name||"Carte")}</h1>
    <div class="dmap-scroll">${dungeonMapFrame(m, false)}</div></div>`;
  fixDungeonMapViewBox(m);
}

function formDungeonMap(){
  const m = view.mode==="edit" ? getEntity("dungeonmap", view.id) : {name:""};
  formMapImage = m.image || "";
  app.innerHTML = `<div class="form">
    <button class="back" data-back="1">← Annuler</button>
    <h1>${view.mode==="edit"?"Modifier la":"Nouvelle"} carte de donjon</h1>
    <div class="field"><label>Nom</label><input type="text" id="f-mapname" value="${esc(m.name)}" placeholder="Le Donjon des Ombres"></div>
    <div class="field"><label>Image du plan</label>
      <div id="mapimg-wrap">${formMapImage?`<img class="thumb-lg" src="${formMapImage}" alt="">`:`<p class="faint" style="font-family:var(--ui);font-size:.85rem;margin:.2rem 0">Aucune image pour l'instant.</p>`}</div>
      <button type="button" class="btn ghost sm" id="mapimg-btn" data-add-mapimg="1">${formMapImage?"Remplacer l'image":"Choisir une image"}</button>
      ${view.mode==="edit"?`<p class="faint" style="font-family:var(--ui);font-size:.78rem;margin:.4rem 0 0">Remplacer l'image efface les zones dessinées (coordonnées liées à l'ancienne image).</p>`:""}
    </div>
    <div class="form-actions"><button class="btn" data-save="dungeonmap">✓ Enregistrer</button><button class="btn ghost" data-back="1">Annuler</button></div>
  </div>`;
}
function renderMapImagePreview(){
  const w = document.getElementById("mapimg-wrap"); if(!w) return;
  w.innerHTML = formMapImage ? `<img class="thumb-lg" src="${formMapImage}" alt="">` : `<p class="faint" style="font-family:var(--ui);font-size:.85rem;margin:.2rem 0">Aucune image pour l'instant.</p>`;
  const btn = document.getElementById("mapimg-btn");
  if(btn) btn.textContent = formMapImage ? "Remplacer l'image" : "Choisir une image";
}
async function saveDungeonMap(){
  const nameVal = $("#f-mapname").value.trim();
  if(!nameVal){ toast("Le nom est requis."); return; }
  if(!formMapImage){ toast("Une image est requise."); return; }
  const isNew = view.mode!=="edit";
  const o = isNew ? {id:uid(), active:false, strokes:[]} : getEntity("dungeonmap", view.id);
  const imageChanged = o.image !== formMapImage;
  o.name = nameVal;
  o.image = formMapImage;
  if(isNew || imageChanged){
    // Nouvelle carte (ou image remplacée) : on (re)calcule les dimensions naturelles pour le
    // viewBox SVG, et on vide les zones — leurs coordonnées étaient liées à l'ancienne image.
    const im = await loadImageAsync(formMapImage);
    o.imgW = im.naturalWidth; o.imgH = im.naturalHeight;
    o.strokes = [];
  }
  if(isNew) db.dungeonmaps.push(o);
  saveDB(); toast("Carte enregistrée."); view={tab:"dungeonmaps",mode:"detail",id:o.id}; render();
}

function activateDungeonMap(id){
  db.dungeonmaps.forEach(m=> m.active = (m.id===id));
  saveDB(); toast("Carte affichée aux joueurs.");
  const m = getEntity("dungeonmap", id); if(m) detailDungeonMap(m);
}
function setDungeonMapTool(tool){
  dmapTool = (dmapTool===tool) ? "toggle" : tool;
  dmapDraftPolygon = null; // change d'outil = abandonne un polygone en cours de pose
  const m = getEntity("dungeonmap", dungeonMapCurrentId); if(m) detailDungeonMap(m);
}
function toggleDungeonMapPlayerPreview(){
  dmapShowPlayerPreview = !dmapShowPlayerPreview;
  const m = getEntity("dungeonmap", dungeonMapCurrentId); if(m) detailDungeonMap(m);
}
function addDungeonMapPolygonVertex(m, pt){
  if(!dmapDraftPolygon) dmapDraftPolygon = { points:[] };
  // Clique près du premier sommet (à ≥3 sommets déjà posés) : ferme la forme au lieu d'ajouter
  // un sommet quasi dupliqué juste à côté — snap de fermeture au clic, en plus du bouton dédié.
  if(dmapDraftPolygon.points.length>=3){
    const first = dmapDraftPolygon.points[0];
    const snapRadius = Math.max(m.imgW||1000, m.imgH||1000) * 0.02;
    if(Math.hypot(pt.x-first.x, pt.y-first.y) <= snapRadius){ finishDungeonMapPolygon(m); return; }
  }
  dmapDraftPolygon.points.push(pt);
  detailDungeonMap(m);
}
function undoDungeonMapPolygonVertex(m){
  if(!dmapDraftPolygon) return;
  dmapDraftPolygon.points.pop();
  if(!dmapDraftPolygon.points.length) dmapDraftPolygon = null;
  detailDungeonMap(m);
}
function finishDungeonMapPolygon(m){
  if(!dmapDraftPolygon || dmapDraftPolygon.points.length<3) return;
  const color = DMAP_STROKE_COLORS[(m.strokes||[]).length % DMAP_STROKE_COLORS.length];
  m.strokes = m.strokes || [];
  m.strokes.push({ id:uid(), color, hidden:true, radius:0, shape:"polygon", points:dmapDraftPolygon.points });
  dmapDraftPolygon = null;
  saveDB();
  detailDungeonMap(m);
}
function setAllDungeonMapStrokes(hidden){
  const m = getEntity("dungeonmap", dungeonMapCurrentId); if(!m) return;
  (m.strokes||[]).forEach(s=> s.hidden = hidden);
  saveDB(); detailDungeonMap(m);
}
function toggleDungeonMapStroke(m, strokeId){
  const s = (m.strokes||[]).find(x=>x.id===strokeId); if(!s) return;
  s.hidden = !s.hidden;
  saveDB(); detailDungeonMap(m);
}
function deleteDungeonMapStroke(m, strokeId){
  m.strokes = (m.strokes||[]).filter(s=>s.id!==strokeId);
  saveDB(); detailDungeonMap(m);
}

/* Remplace l'image d'une carte existante (le MJ a retouché son fichier source) SANS repartir de
   zéro sur le travail de brouillard déjà fait — contrairement au remplacement via "✎ Modifier"
   (formDungeonMap/saveDungeonMap) qui vide volontairement m.strokes, pensé pour le cas où on
   réutilise un emplacement de carte pour un donjon totalement différent.
   Les zones sont stockées en pixels ABSOLUS de l'image (m.strokes[].points, .radius — pas en
   pourcentage : voir dungeonMapFrame(), le viewBox SVG est calé sur imgW/imgH pour éviter toute
   distorsion des ronds de pinceau sur une image non carrée). Un simple remplacement de m.image en
   gardant m.strokes intact casserait donc l'alignement dès que la nouvelle image n'a pas EXACTEMENT
   les mêmes dimensions en pixels que l'ancienne. Pour un remplacement "même cadrage, résolution
   différente" (le cas courant : réexport du fichier source retouché), on retrouve l'effet
   attendu en RÉÉCHELONNANT chaque point/rayon proportionnellement au ratio nouvelle/ancienne
   dimension — équivalent à un stockage en pourcentage, calculé au moment du remplacement plutôt
   que maintenu en continu. Si le cadrage a vraiment changé (recadrage, contenu différent), aucun
   calcul ne peut deviner la bonne position — d'où l'avertissement affiché à l'utilisateur. */
async function replaceDungeonMapImage(m, file){
  processMapImage(file, async dataUrl=>{
    const oldW = m.imgW, oldH = m.imgH;
    const im = await loadImageAsync(dataUrl);
    const newW = im.naturalWidth, newH = im.naturalHeight;
    if(oldW && oldH && (oldW!==newW || oldH!==newH)){
      const scaleX = newW/oldW, scaleY = newH/oldH;
      const scaleR = (scaleX+scaleY)/2;
      (m.strokes||[]).forEach(s=>{
        s.points = (s.points||[]).map(p=>({ x:p.x*scaleX, y:p.y*scaleY }));
        s.radius = (s.radius||0)*scaleR;
      });
    }
    m.image = dataUrl; m.imgW = newW; m.imgH = newH;
    saveDB();
    toast("Image remplacée — les zones ont été repositionnées proportionnellement.");
    detailDungeonMap(m);
  });
}

function detailDungeonMap(m){
  // Le brouillon de polygone doit survivre à un re-rendu complet (chaque sommet cliqué redessine
  // toute la vue pour afficher les boutons "Terminer"/"Annuler") — seul un vrai changement de
  // carte doit le vider, pas un re-rendu de la carte en cours.
  if(dungeonMapCurrentId !== m.id){ dmapDraftStroke = null; dmapDraftPolygon = null; dmapShowPlayerPreview = false; }
  dungeonMapCurrentId = m.id;
  const toolHelp = dmapTool==="add"
    ? "Clique-glisse (ou dessine au doigt) pour tracer une nouvelle zone au pinceau. Le mode reste actif : dessine autant de zones que nécessaire, puis re-clique le bouton pour arrêter."
    : dmapTool==="polygon"
      ? "Clique pour poser un sommet, encore et encore, puis « ✓ Terminer » pour fermer la forme (ou clique près du premier sommet). Le mode reste actif pour enchaîner plusieurs polygones."
      : dmapTool==="delete"
        ? "Tapote une zone pour la supprimer définitivement. Re-clique le bouton pour arrêter."
        : "Tapote une zone pour la cacher ou la révéler. C'est le mode par défaut, pensé pour être utilisable en jeu au téléphone.";
  const polygonActions = (dmapTool==="polygon" && dmapDraftPolygon && dmapDraftPolygon.points.length)
    ? `<button class="btn ghost sm" data-dmap-polygon-undo="1">↩ Annuler le dernier sommet</button>
       ${dmapDraftPolygon.points.length>=3?`<button class="btn sm" data-dmap-polygon-finish="1">✓ Terminer</button>`:""}`
    : "";
  app.innerHTML = `<div class="detail">
    <button class="back" data-back="1">← Cartes de donjon</button>
    <h1>${esc(m.name||"Sans nom")}</h1>
    ${detailActions("dungeonmap", m.id)}
    <div style="margin:.2rem 0 .8rem">
      <button class="btn ghost sm" data-dmap-replace-image="1">🖼 Remplacer l'image du plan</button>
      <p class="faint" style="font-family:var(--ui);font-size:.78rem;margin:.35rem 0 0">Les zones déjà dessinées sont conservées et repositionnées proportionnellement à la nouvelle image. Si le cadrage ou le format de l'image a changé (recadrage, contenu différent), elles risquent de ne plus tomber pile au bon endroit — il faudra alors les réajuster à la main.</p>
    </div>
    <div class="crawl-toolbar">
      ${m.active
        ? `<span class="tag gold">Carte actuellement affichée aux joueurs</span>`
        : `<button class="btn ghost sm" data-dmap-activate="${m.id}">👁 Définir comme carte active</button>`}
      <button class="btn ghost sm${dmapTool==="add"?' active-mode':''}" data-dmap-tool="add">➕ Pinceau</button>
      <button class="btn ghost sm${dmapTool==="polygon"?' active-mode':''}" data-dmap-tool="polygon">⬠ Polygone</button>
      <button class="btn ghost sm${dmapTool==="delete"?' active-mode':''}" data-dmap-tool="delete">🗑 Supprimer une zone</button>
      <label style="display:flex;align-items:center;gap:.4rem;font-family:var(--ui);font-size:.8rem;color:var(--muted)">
        Taille du pinceau <input type="range" id="dmap-brush-size" min="0.3" max="15" step="0.1" value="${dmapBrushSize}" style="width:110px">
      </label>
      <label style="display:flex;align-items:center;gap:.4rem;font-family:var(--ui);font-size:.8rem;color:var(--muted)">
        Adoucissement des bords <input type="range" id="dmap-softness" min="0" max="6" step="0.25" value="${m.softness||0}" style="width:110px">
      </label>
      <button class="btn ghost sm" data-dmap-reveal-all="1">👁 Tout révéler</button>
      <button class="btn ghost sm" data-dmap-hide-all="1">🌫 Tout masquer</button>
      <button class="btn ghost sm${dmapShowPlayerPreview?' active-mode':''}" data-dmap-preview-toggle="1">👁 Aperçu joueur</button>
      ${polygonActions}
    </div>
    <div class="crawl-help">${toolHelp}</div>
    <div class="dmap-scroll" id="dmap-scroll">${dungeonMapFrame(m, true, "dmap-svg")}</div>
    ${dmapShowPlayerPreview ? `
    <div class="dmap-preview-wrap">
      <h2 class="dmap-preview-title">👁 Aperçu joueur <span class="faint" style="font-weight:400">— lecture seule, aucune interaction possible</span></h2>
      <p class="crawl-help">${m.active
        ? "Exactement ce que voient les joueurs en ce moment sur cette carte."
        : "Cette carte n'est pas actuellement affichée aux joueurs — voici à quoi elle ressemblerait si tu l'activais."}</p>
      <div class="dmap-scroll dmap-preview-scroll" id="dmap-scroll-preview">${dungeonMapFrame(m, false, "dmap-svg-preview")}</div>
    </div>` : ""}
  </div>`;
  wireDungeonMapSVG(m);
  fixDungeonMapViewBox(m, "dmap-svg");
  if(dmapShowPlayerPreview) fixDungeonMapViewBox(m, "dmap-svg-preview");
}

/* viewBox aux dimensions naturelles de l'image (m.imgW/m.imgH, mises en cache à l'upload) —
   scale uniforme garanti puisque .dmap-frame est déjà à ce même ratio (dicté par <img>), donc
   pas de distorsion des ronds de pinceau.
   Brouillard "à l'envers" (demandé par Tristan) : la carte est noire PAR DÉFAUT, une zone ne
   fait qu'"éclairer" un trou dans ce noir quand elle est révélée (!s.hidden) — pas l'inverse
   (v3 précédente : tout visible par défaut, une zone cachée peignait du noir par-dessus). Plus
   sûr en pratique : une zone du plan que le MJ n'a jamais dessinée reste cachée par défaut,
   au lieu d'être visible par erreur faute d'y avoir pensé. Implémenté avec un <mask> SVG
   (technique standard, équivalent SVG du destination-out canvas de la v2) : un rectangle blanc
   plein (= le calque noir reste visible partout) percé de traits noirs à l'emplacement de
   chaque zone révélée (= trou = calque noir invisible = carte visible en dessous à cet endroit).
   Vue joueur : calque noir 100% opaque, aucun autre repère. Vue MJ : même calque mais
   semi-transparent (pour voir la carte en dessous en travaillant) + les zones colorées
   par-dessus (toutes, cachées ou révélées) pour rester tapotables quel que soit leur état. */
function dungeonMapFrame(m, isGM, svgId){
  if(!m.image) return `<p class="faint" style="font-family:var(--ui);padding:1rem">Pas d'image pour cette carte.</p>`;
  svgId = svgId || "dmap-svg";
  // id du mask/filter dérivés de svgId (pas juste "dmap-mask"/"dmap-soften" fixes) : l'aperçu
  // joueur affiche un second <svg> sur la même page à côté de la vue MJ — des id dupliqués
  // seraient invalides (HTML) et la résolution de `url(#id)` deviendrait imprévisible d'un
  // navigateur à l'autre entre les deux instances.
  const maskId = svgId+"-mask", filterId = svgId+"-soften";
  const w = m.imgW||1000, h = m.imgH||1000;
  // stroke-linecap/linejoin explicites : sans ça ce <path> retombe sur les défauts SVG (bouts
  // plats, jointures en angle vif) au lieu des bouts/jointures arrondis de .dmap-stroke — le trou
  // percé dans le brouillard avait alors des allures de rectangle anguleux au lieu de suivre la
  // forme ronde/organique réelle du tracé (signalé par Tristan, capture à l'appui : le MJ voyait
  // un tracé bien rond, les joueurs une fenêtre carrée).
  const revealHoles = (m.strokes||[]).filter(s=>!s.hidden).map(s=>{
    const { d, filled } = strokeGeometry(s);
    return `<path d="${d}" fill="${filled?'#000':'none'}" stroke="#000" stroke-width="${s.radius*2}" stroke-linecap="round" stroke-linejoin="round"></path>`;
  }).join("");
  // Adoucissement des bords (réglable par carte, m.softness — % du plus grand côté de l'image) :
  // flou gaussien appliqué au CONTENU du masque (fond blanc + trous), pas aux zones colorées MJ
  // ni au trait — celles-ci doivent rester nettes pour bien voir où tapoter. Le même m.softness
  // pilote systématiquement le rendu MJ (semi-transparent) ET joueur/aperçu (opaque), même s'il
  // s'agit de deux instances <mask>/<filter> distinctes (id namespacés par svgId) sur la page —
  // toutes deux dérivées du même réglage stocké sur la carte. stdDeviation à 0 = aucun flou.
  const softnessPx = ((m.softness||0)/100) * Math.max(w, h);
  const darkness = `<filter id="${filterId}" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="${softnessPx.toFixed(2)}"></feGaussianBlur>
    </filter>
    <mask id="${maskId}">
      <g filter="url(#${filterId})">
        <rect x="0" y="0" width="${w}" height="${h}" fill="#fff"></rect>
        ${revealHoles}
      </g>
    </mask>
    <rect x="0" y="0" width="${w}" height="${h}" fill="#000" mask="url(#${maskId})" class="dmap-darkness${isGM?' dmap-darkness-gm':''}"></rect>`;
  const strokes = isGM ? (m.strokes||[]).map(s=>{
    const { d, filled } = strokeGeometry(s);
    const cls = s.hidden ? "dmap-stroke dmap-stroke-hidden" : "dmap-stroke dmap-stroke-revealed";
    return `<g data-dmap-stroke="${s.id}">
      <path class="dmap-stroke dmap-stroke-hit" d="${d}" stroke-width="${Math.max(s.radius*2, 24)}"></path>
      <path class="${cls}" d="${d}" fill="${filled?s.color:'none'}" stroke="${s.color}" stroke-width="${s.radius*2}"></path>
    </g>`;
  }).join("") : "";
  let brushDraft = "";
  if(isGM && dmapDraftStroke){
    const closeLoop = isLoopStroke(dmapDraftStroke.points, dmapBrushRadiusPx(m));
    brushDraft = `<path class="dmap-stroke dmap-stroke-draft${closeLoop?'':' dmap-stroke-draft-open'}" d="${pathDFromPoints(dmapDraftStroke.points, closeLoop)}" stroke-width="${dmapBrushRadiusPx(m)*2}"></path>`;
  }
  const polygonDraft = (isGM && dmapDraftPolygon && dmapDraftPolygon.points.length) ? dungeonMapPolygonDraftSVG(dmapDraftPolygon.points, Math.max(w,h)) : "";
  return `<div class="dmap-frame">
    <img class="dmap-img" src="${m.image}" alt="">
    <svg class="dmap-overlay${isGM?` dmap-overlay-gm dmap-tool-${dmapTool}`:''}" id="${svgId}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${darkness}${strokes}${brushDraft}${polygonDraft}</svg>
  </div>`;
}
/* Aperçu du polygone en cours de pose : segments droits entre sommets déjà cliqués (pas encore
   fermé sur lui-même — la fermeture n'apparaît qu'au clic sur "Terminer"), plus un petit disque à
   chaque sommet pour bien voir où ils sont posés. */
function dungeonMapPolygonDraftSVG(points, maxDim){
  const r = Math.max(2, maxDim*0.006); // rayon des sommets proportionnel à l'image, pas une taille fixe qui serait minuscule sur une grande carte
  const line = "M" + points.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" L");
  const dots = points.map(p=>`<circle class="dmap-polygon-vertex" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}"></circle>`).join("");
  return `<path class="dmap-polygon-draft" d="${line}"></path>${dots}`;
}
/* Corrige le viewBox depuis les VRAIES dimensions de l'image une fois chargée (immédiat si déjà
   en cache navigateur, sinon au "load"), plutôt que de bloquer le rendu en attendant de connaître
   ces dimensions à l'avance. Remplace un précédent essai qui gardait la vue sur "Chargement…"
   tant que m.imgW/imgH manquaient : ça bouclait à l'infini côté joueur, puisque chaque tick de
   polling (4,5s) écrase db.dungeonmaps avec les données fraîches du serveur — sans droits
   d'écriture, la correction en mémoire du joueur ne survivait jamais jusqu'au tick suivant, donc
   la carte restait bloquée sur "Chargement…" en permanence (rapporté par Tristan comme "le
   rafraîchissement ne se fait plus"). Cette version-ci ne bloque jamais le rendu : la carte
   s'affiche tout de suite avec le meilleur viewBox connu, puis se corrige sans re-render bloquant
   dès que l'image est prête. Seul le MJ persiste la correction (RLS interdit l'écriture aux
   joueurs) — sans conséquence : à la prochaine ouverture par le MJ, la carte se répare pour de
   bon et n'a plus jamais besoin de ce correctif. */
function fixDungeonMapViewBox(m, svgId){
  const svg = document.getElementById(svgId || "dmap-svg");
  const img = svg ? svg.previousElementSibling : null;
  if(!svg || !img || !(img instanceof HTMLImageElement)) return;
  const apply = ()=>{
    if(!img.naturalWidth || !img.naturalHeight) return;
    if(m.imgW===img.naturalWidth && m.imgH===img.naturalHeight) return; // déjà juste, rien à faire
    svg.setAttribute("viewBox", `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
    m.imgW = img.naturalWidth; m.imgH = img.naturalHeight;
    if(effectiveRole()==="gm") saveDB();
  };
  if(img.complete) apply(); else img.addEventListener("load", apply, { once:true });
}
/* Lisse le tracé par des courbes de Bézier quadratiques passant par le milieu de chaque paire
   de points consécutifs (technique standard pour du dessin à main levée) — une simple polyligne
   "L x,y L x,y…" produit des angles vifs à chaque point échantillonné, visibles comme des
   facettes/biseaux dès que le tracé n'est pas parfaitement rectiligne (signalé par Tristan après
   test réel : le pourtour du trou de brouillard avait un aspect "biseauté" au lieu d'être rond).
   Chemin fermé ("Z" final) UNIQUEMENT si `closeLoop` est vrai : fermer ET remplir (`fill`, en plus
   du `stroke`) comble bien l'intérieur d'une boucle — un pinceau qui fait le tour d'une pièce
   plus grande que lui ne peignait sinon qu'un anneau creux au centre (confirmé par Tristan,
   capture à l'appui). Mais fermer un tracé OUVERT (un arc, une ligne qui ne boucle pas) ajoute un
   segment droit du dernier point vers le premier, et le remplissage comble alors toute la zone
   entre l'arc et cette "corde" — un vrai polygone plein à la place d'un simple trait, très
   surprenant pour un geste qui n'était pas censé boucler (remonté par Tristan : "mon point de
   départ va rejoindre mon point d'arrivée avec un segment qui va tout remplir"). D'où
   `isLoopStroke()` ci-dessous : ne fermer/remplir que si le tracé revient effectivement près de
   son point de départ, sinon garder un vrai trait ouvert (fill:none côté appelant). */
function pathDFromPoints(points, closeLoop){
  if(!points || !points.length) return "";
  // Un seul point (tap sans glisser) : "M x,y" seul ne trace aucun segment, donc rien ne serait
  // rendu (ni visible, ni tapotable) malgré le stroke-linecap:round — on double le point en
  // "M x,y L x,y" pour forcer un segment de longueur nulle, qui lui affiche bien un point rond.
  // Toujours fermé quel que soit `closeLoop` : un point seul n'a pas de sens "ouvert".
  if(points.length===1){ const p=points[0]; return `M${p.x.toFixed(1)},${p.y.toFixed(1)} L${p.x.toFixed(1)},${p.y.toFixed(1)} Z`; }
  if(points.length===2){ const d = `M${points[0].x.toFixed(1)},${points[0].y.toFixed(1)} L${points[1].x.toFixed(1)},${points[1].y.toFixed(1)}`; return closeLoop ? d+" Z" : d; }
  let d = `M${points[0].x.toFixed(1)},${points[0].y.toFixed(1)}`;
  for(let i=1;i<points.length-1;i++){
    const midX = (points[i].x+points[i+1].x)/2, midY = (points[i].y+points[i+1].y)/2;
    d += ` Q${points[i].x.toFixed(1)},${points[i].y.toFixed(1)} ${midX.toFixed(1)},${midY.toFixed(1)}`;
  }
  const last = points[points.length-1];
  d += ` L${last.x.toFixed(1)},${last.y.toFixed(1)}`;
  if(closeLoop) d += " Z";
  return d;
}
/* Un tracé "boucle" si son point d'arrivée revient près de son point de départ (à 1,5 rayon de
   pinceau près) — sert à décider s'il faut fermer+remplir (vraie boucle, on comble l'intérieur)
   ou laisser un trait ouvert (arc/ligne, pas de "corde" surprenante entre le début et la fin). */
function isLoopStroke(points, radius){
  if(!points || points.length<3) return false;
  const first = points[0], last = points[points.length-1];
  return Math.hypot(last.x-first.x, last.y-first.y) <= radius*1.5;
}
/* Chemin polygone : sommets reliés par des lignes DROITES (pas de lissage — un polygone doit
   rester précis), toujours fermé et rempli par construction (un polygone n'a pas d'ambiguïté
   "boucle ou pas", contrairement à un tracé au pinceau). */
function polygonPathD(points){
  if(!points || points.length<2) return "";
  return "M" + points.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" L") + " Z";
}
/* Chemin + décision de remplissage d'une zone, quel que soit son type (pinceau ou polygone) —
   point d'entrée unique utilisé par tous les rendus (trou de masque, zone colorée, aperçu). */
function strokeGeometry(s){
  if(s.shape==="polygon") return { d: polygonPathD(s.points), filled: true };
  const isDot = s.points && s.points.length===1;
  const closeLoop = isDot || isLoopStroke(s.points, s.radius);
  return { d: pathDFromPoints(s.points, closeLoop), filled: closeLoop };
}
function dmapBrushRadiusPx(m){ return (dmapBrushSize/100) * Math.max(m.imgW||1000, m.imgH||1000); }
/* Conversion écran → coordonnées SVG via la matrice de transformation native (getScreenCTM),
   PAS un calcul manuel à base de getBoundingClientRect()/viewBox — cette dernière approche
   est fragile dès qu'il y a le moindre écart d'arrondi entre la boîte CSS réelle et le ratio
   du viewBox (preserveAspectRatio="meet" centre alors le contenu avec une marge que
   getBoundingClientRect ne reflète pas), ce qui décalait le tracé par rapport au curseur.
   getScreenCTM().inverse() gère ça correctement quel que soit le viewBox/scale/transform. */
function svgPtFromEvent(svg, m, ev){
  const ctm = svg.getScreenCTM();
  if(!ctm) return { x:0, y:0 };
  const pt = svg.createSVGPoint();
  pt.x = ev.clientX; pt.y = ev.clientY;
  const svgPt = pt.matrixTransform(ctm.inverse());
  return { x: svgPt.x, y: svgPt.y };
}

function wireDungeonMapSVG(m){
  const svg = document.getElementById("dmap-svg"); if(!svg) return;
  const sizeInput = document.getElementById("dmap-brush-size");
  if(sizeInput) sizeInput.addEventListener("input", e=>{ dmapBrushSize = +e.target.value; });
  const softInput = document.getElementById("dmap-softness");
  if(softInput){
    // "input" (pendant le glissé du curseur) : retouche juste l'attribut du flou pour un aperçu
    // fluide, sans re-rendu complet — sur les DEUX <filter> si l'aperçu joueur est affiché à côté
    // (id namespacés par carte : dmap-svg-soften pour la vue MJ, dmap-svg-preview-soften pour
    // l'aperçu), pour que les deux calques réagissent ensemble au glissé. "change" (relâché) :
    // persiste, une seule fois.
    softInput.addEventListener("input", e=>{
      const std = (+e.target.value/100)*Math.max(m.imgW||1000, m.imgH||1000);
      ["dmap-svg-soften","dmap-svg-preview-soften"].forEach(id=>{
        const blur = document.querySelector(`#${id} feGaussianBlur`);
        if(blur) blur.setAttribute("stdDeviation", std);
      });
    });
    softInput.addEventListener("change", e=>{ m.softness = +e.target.value; saveDB(); });
  }

  svg.addEventListener("click", e=>{
    if(dmapTool==="add") return; // en mode "pinceau", géré par le drag pointerdown/up ci-dessous
    if(dmapTool==="polygon"){ addDungeonMapPolygonVertex(m, svgPtFromEvent(svg, m, e)); return; }
    const g = e.target.closest("[data-dmap-stroke]"); if(!g) return;
    const id = g.dataset.dmapStroke;
    if(dmapTool==="delete") deleteDungeonMapStroke(m, id);
    else toggleDungeonMapStroke(m, id);
  });

  svg.addEventListener("pointerdown", e=>{
    if(dmapTool!=="add") return;
    e.preventDefault();
    startDrawDungeonStroke(m, svg, e);
  });
}

function startDrawDungeonStroke(m, svg, e){
  const pt = svgPtFromEvent(svg, m, e);
  dmapDraftStroke = { points:[pt] };
  const pathEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
  pathEl.setAttribute("class", "dmap-stroke dmap-stroke-draft dmap-stroke-draft-open");
  pathEl.setAttribute("stroke-width", dmapBrushRadiusPx(m)*2);
  pathEl.setAttribute("d", pathDFromPoints(dmapDraftStroke.points, false));
  svg.appendChild(pathEl);
  // Indépendant du rayon du pinceau : un grand pinceau ne doit pas pour autant échantillonner
  // grossièrement (c'était le cas avec rayon/4, d'où les tracés peu fidèles/à facettes
  // remontés par Tristan). Un pas fixe, petit par rapport à l'image, suffit à rester fluide.
  const minStep = Math.max(3, Math.max(m.imgW||1000, m.imgH||1000) * 0.004);
  // L'aperçu en direct reflète déjà si le tracé va se refermer/remplir (boucle) ou rester un
  // simple trait ouvert (arc/ligne) — le MJ voit le résultat final avant même de relâcher.
  const repaint = ()=>{
    const closeLoop = isLoopStroke(dmapDraftStroke.points, dmapBrushRadiusPx(m));
    pathEl.setAttribute("d", pathDFromPoints(dmapDraftStroke.points, closeLoop));
    pathEl.classList.toggle("dmap-stroke-draft-open", !closeLoop);
  };
  const move = ev=>{
    const p = svgPtFromEvent(svg, m, ev);
    const last = dmapDraftStroke.points[dmapDraftStroke.points.length-1];
    if(Math.hypot(p.x-last.x, p.y-last.y) < minStep) return;
    dmapDraftStroke.points.push(p);
    repaint();
  };
  const up = ()=>{
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    pathEl.remove();
    const points = dmapDraftStroke.points; dmapDraftStroke = null;
    const color = DMAP_STROKE_COLORS[(m.strokes||[]).length % DMAP_STROKE_COLORS.length];
    m.strokes = m.strokes || [];
    m.strokes.push({ id:uid(), color, hidden:true, radius:dmapBrushRadiusPx(m), points });
    saveDB();
    detailDungeonMap(m);
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
}

/* =========================================================================
   RECHERCHE GLOBALE
   ========================================================================= */
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  const dp = [];
  for(let i=0;i<=m;i++) dp.push(new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  }
  return dp[m][n];
}
function fuzzyFind(hay, q){
  if(q.length<3) return null;
  const words = hay.split(/\W+/).filter(Boolean);
  const threshold = q.length<=4?1:(q.length<=8?2:3);
  let best=null;
  for(const w of words){
    if(Math.abs(w.length-q.length) > threshold) continue;
    const d = levenshtein(w,q);
    if(d>0 && d<=threshold && (!best || d<best.d)) best = {d, word:w};
  }
  if(!best) return null;
  return {index: hay.indexOf(best.word)};
}
function runSearch(q){
  const box = $("#search-results");
  q = q.trim().toLowerCase();
  if(!q){ box.classList.remove("open"); box.innerHTML=""; return; }
  const results = [];
  const push = (type, o)=>{
    const hay = entityText(type,o).toLowerCase();
    let idx = hay.indexOf(q), fuzzy = false;
    if(idx<0 && !q.includes(" ")){
      const f = fuzzyFind(hay,q);
      if(f){ idx = f.index; fuzzy = true; }
    }
    if(idx>=0) results.push({type,id:o.id,title:entityTitle(type,o),snippet:snippet(entityText(type,o),q),fuzzy});
  };
  db.creatures.forEach(o=>push("creature",o));
  db.events.forEach(o=>push("event",o));
  db.tables.forEach(o=>push("table",o));
  db.sessions.forEach(o=>push("session",o));
  db.npcs.forEach(o=>push("npc",o));
  db.pointcrawls.forEach(o=>push("pointcrawl",o));
  db.pcs.forEach(o=>push("pc",o));
  db.treasures.forEach(o=>push("treasure",o));
  db.spells.forEach(o=>push("spell",o));
  results.sort((a,b)=>(a.fuzzy===b.fuzzy)?0:(a.fuzzy?1:-1));
  if(!results.length){ box.innerHTML = `<div class="sr-empty">Aucun résultat pour « ${esc(q)} »</div>`; box.classList.add("open"); return; }
  box.innerHTML = results.slice(0,25).map(r=>`
    <div class="sr-item" data-goto="${r.type}:${r.id}">
      <span class="tag ${r.type}">${TYPE_LABEL[r.type]}</span>
      <b style="margin-left:.4rem">${esc(r.title||"—")}</b>${r.fuzzy?' <span class="faint" style="font-size:.72rem">(≈ approximatif)</span>':''}
      <div class="faint" style="font-size:.78rem;margin-top:.15rem">${esc(r.snippet)}</div>
    </div>`).join("");
  box.classList.add("open");
}
function snippet(text,q){
  const t = String(text||"").replace(/\s+/g," ");
  const i = t.toLowerCase().indexOf(q);
  if(i<0) return t.slice(0,80);
  const start = Math.max(0,i-30);
  return (start>0?"…":"") + t.slice(start, i+q.length+40) + "…";
}

/* =========================================================================
   IMPORT / EXPORT
   ========================================================================= */
function exportJSON(){
  const blob = new Blob([JSON.stringify(db,null,2)], {type:"application/json"});
  downloadBlob(blob, `grimoire-shadowdark-${new Date().toISOString().slice(0,10)}.json`);
  toast("Données exportées. Le fichier est téléchargé sur votre appareil, généralement dans votre dossier Téléchargements.");
}
const DB_COLS = ["sessions","events","creatures","tables","npcs","pointcrawls","pcs","treasures","hexmaps","spells","initiative","wheel","dungeonmaps"];
function countItems(d){ return DB_COLS.reduce((n,c)=>n+((d[c]||[]).length),0); }
function mergeDB(data){
  let added = 0;
  DB_COLS.forEach(col=>{
    if(!db[col]) db[col] = [];
    const seen = new Set(db[col].map(o=>o.id));
    (data[col]||[]).forEach(o=>{ if(o && o.id && !seen.has(o.id)){ db[col].push(o); seen.add(o.id); added++; } });
  });
  return added;
}
function importJSON(file){
  const r = new FileReader();
  r.onload = ()=>{
    let data;
    try{ data = JSON.parse(r.result); if(!data || typeof data!=="object") throw 0; }
    catch(e){ toast("Fichier JSON invalide."); return; }
    _importData = data;
    openModal(`<h2 style="margin:.1rem 0 .5rem;color:var(--gold2)">Importer des données</h2>
      <p style="font-family:var(--ui);font-size:.9rem;line-height:1.5;color:var(--muted);margin:0 0 1rem">
        Le fichier contient <b>${countItems(data)}</b> élément(s).<br>
        <b style="color:var(--green)">Fusionner</b> : ajoute uniquement les éléments absents (sans toucher aux tiens).<br>
        <b style="color:var(--blood2)">Remplacer tout</b> : efface la base actuelle et la remplace.</p>
      <div class="form-actions" style="margin-top:0">
        <button class="btn" data-import-merge="1">➕ Fusionner</button>
        <button class="btn danger" data-import-replace="1">⟳ Remplacer tout</button>
        <button class="btn ghost" data-modal-close="1">Annuler</button>
      </div>`);
  };
  r.onerror = ()=>toast("Lecture du fichier impossible.");
  r.readAsText(file);
}
function downloadBlob(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

/* ---- Import XML des créatures (format libre & tolérant, avec gestion des doublons) ---- */
let _xmlPending = null;
function importXML(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const doc = new DOMParser().parseFromString(r.result, "application/xml");
      if(doc.querySelector("parsererror")) throw new Error("XML mal formé");
      const nodes = doc.getElementsByTagName("creature").length ? [...doc.getElementsByTagName("creature")]
        : [...doc.documentElement.children].filter(n=>/creature|monster|stat/i.test(n.tagName));
      if(!nodes.length) throw new Error("Aucune balise <creature> trouvée");
      _xmlPending = nodes.map(parseCreatureNode).filter(c=>c.name);
      const existing = new Set(db.creatures.map(c=>(c.name||"").toLowerCase()));
      const dupes = _xmlPending.filter(c=>existing.has((c.name||"").toLowerCase())).length;
      openModal(`<h2 style="margin:.1rem 0 .5rem;color:var(--gold2)">Importer ${_xmlPending.length} créature(s)</h2>

function applyXMLImport(mode){
  if(!_xmlPending) return;
  let added=0, replaced=0, skipped=0;
  const byName = {}; db.creatures.forEach(c=>{ byName[(c.name||"").toLowerCase()] = c; });
  _xmlPending.forEach(c=>{
    const key = (c.name||"").toLowerCase();
    const exist = byName[key];
    if(exist && mode!=="all"){
      if(mode==="replace"){
        const id=exist.id, imgs=exist.images;
        Object.keys(exist).forEach(k=>delete exist[k]);
        Object.assign(exist, c); exist.id=id; exist.imported=true;
        if((!c.images||!c.images.length) && imgs && imgs.length) exist.images=imgs;
        replaced++;
      } else skipped++;                       // mode "skip"
    } else {
      c.id=uid(); c.imported=true; db.creatures.push(c); byName[key]=c; added++;
    }
  });
  _xmlPending=null; saveDB(); view={tab:"creatures",mode:"list",id:null}; render();
  toast(`Import : ${added} ajoutée(s), ${replaced} remplacée(s), ${skipped} ignorée(s).`);
}

function parseCreatureNode(node){
  const get = (sel)=>{ const el = node.querySelector(sel); return el ? el.textContent.trim() : ""; };
  const attrOr = (sel, attr, fallbackSel)=>{
    const el = node.querySelector(sel);
    if(el && el.getAttribute(attr)!=null) return el.getAttribute(attr).trim();
    return fallbackSel!=null ? get(fallbackSel) : "";
  };
  const c = {
    name: get("name") || node.getAttribute("name") || "",
    category: get("category") || get("categorie") || "",
    desc: get("description") || get("desc") || "",
    ac: get("ac") || get("armorclass") || attrOr("stats","ac"),
    hp: get("hp") || get("hitpoints") || attrOr("stats","hp"),
    level: get("level") || attrOr("stats","level"),
    alignment: (get("alignment")||"chaos").toLowerCase(),
    abilities: get("abilities") || get("special") || get("immunities") || "",
    attacks: []
  };
  // Caractéristiques : soit <stats str=".."/>, soit balises individuelles <str>..</str>
  const statsEl = node.querySelector("stats") || node.querySelector("abilities-scores");
  const keys = {str:["str","strength"],dex:["dex","dexterity"],con:["con","constitution"],int:["int","intelligence"],wis:["wis","sag","wisdom","sagesse"],cha:["cha","charisma","charisme"]};
  Object.entries(keys).forEach(([k,aliases])=>{
    let v="";
    if(statsEl){ for(const a of aliases){ if(statsEl.getAttribute(a)!=null){ v=statsEl.getAttribute(a); break; } } }
    if(!v){ for(const a of aliases){ const el=node.querySelector(a); if(el){ v=el.textContent.trim(); break; } } }
    c[k]=v;
  });
  // normaliser alignement
  if(/cha|chaos/.test(c.alignment)) c.alignment="chaos";
  else if(/loy|law/.test(c.alignment)) c.alignment="loyal";
  else if(/neut/.test(c.alignment)) c.alignment="neutre";
  // Attaques
  node.querySelectorAll("attack").forEach(a=>{
    const nm = a.getAttribute("name") || (a.querySelector("name")?.textContent) || a.textContent.trim();
    c.attacks.push({
      name: (nm||"").trim(),
      bonus: a.getAttribute("bonus") || a.querySelector("bonus")?.textContent?.trim() || "",
      damage: a.getAttribute("damage") || a.querySelector("damage")?.textContent?.trim() || "",
      range: normRange(a.getAttribute("range") || a.querySelector("range")?.textContent?.trim() || "close")
    });
  });
  return c;
}
function normRange(r){
  r=(r||"").toLowerCase();
  if(/far|long|lointain/.test(r)) return "far";
  if(/near|inter|proche|moyen/.test(r)) return "near";
  return "close";
}

/* ---- Import / export XML génériques (PNJ, Trésor, Tables, Point Crawl) ----
   Chaque type ne gère que ses champs texte simples ; les images (PNJ/Trésor) et
   les nœuds/liens du point crawl (liés à des événements existants) ne sont pas
   couverts par ce format — ils restent à gérer depuis les fiches elles-mêmes. */
const XML_TYPES = {
  npc: { tag:"npc", tagAlt:/npc|pnj/i, label:"PNJ", col:"npcs", nameField:"name",
    fields:["name","description","physique","age","possessions","objectif","moyens","comportement","ac","hp","str","dex","con","int","wis","cha","weapon","spells"] },

    fields:["name","category","description","bonus","boon","curse","personality"] },
  table: { tag:"table", tagAlt:/table/i, label:"table", col:"tables", nameField:"title",
    fields:["title","context"], rowsField:"rows" },
  pointcrawl: { tag:"pointcrawl", tagAlt:/pointcrawl|crawl/i, label:"point crawl", col:"pointcrawls", nameField:"title",
    fields:["title","description"] },
  spell: { tag:"spell", tagAlt:/spell|sort/i, label:"sort", col:"spells", nameField:"name",

function parseGenericNode(node, cfg){
  const get = sel => {
    const el = node.querySelector(sel);
    if(el) return el.textContent.trim();
    const a = node.getAttribute(sel);
    return a!=null ? a.trim() : "";
  };
  const o = {};
  cfg.fields.forEach(f=> o[f]=get(f));
  if(cfg.rowsField){
    o[cfg.rowsField] = [...node.querySelectorAll("row")].map(r=>r.textContent.trim()).filter(Boolean);
  }
  return o;
}

function importXMLGeneric(typeKey, file){
  const cfg = XML_TYPES[typeKey];
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const doc = new DOMParser().parseFromString(r.result, "application/xml");
      if(doc.querySelector("parsererror")) throw new Error("XML mal formé");
      const nodes = doc.getElementsByTagName(cfg.tag).length ? [...doc.getElementsByTagName(cfg.tag)]
        : [...doc.documentElement.children].filter(n=>cfg.tagAlt.test(n.tagName));
      if(!nodes.length) throw new Error(`Aucune balise <${cfg.tag}> trouvée`);
      const items = nodes.map(n=>parseGenericNode(n,cfg)).filter(o=>o[cfg.nameField]);
      const existing = new Set(db[cfg.col].map(o=>(o[cfg.nameField]||"").toLowerCase()));
      const dupes = items.filter(o=>existing.has((o[cfg.nameField]||"").toLowerCase())).length;
      _xmlPendingGeneric = { typeKey, items };
      openModal(`<h2 style="margin:.1rem 0 .5rem;color:var(--gold2)">Importer ${items.length} ${esc(cfg.label)}(s)</h2>
        <p style="font-family:var(--ui);font-size:.9rem;line-height:1.55;color:var(--muted);margin:0 0 1rem">
          ${dupes>0 ? `<b style="color:var(--gold2)">${dupes}</b> portent un nom déjà présent (doublons potentiels).<br>` : `Aucun doublon détecté.<br>`}
          <b style="color:var(--green)">Ignorer les doublons</b> : n'ajoute que les nouveaux.<br>
          <b style="color:var(--gold2)">Remplacer les doublons</b> : met à jour les fiches existantes, ajoute les nouveaux.<br>
          <b>Tout ajouter</b> : ajoute tout, même en double.</p>
        <div class="form-actions" style="margin-top:0;flex-wrap:wrap">
          <button class="btn" data-xmlg-skip="1">⏭ Ignorer les doublons</button>
          <button class="btn ghost" data-xmlg-replace="1">♻ Remplacer les doublons</button>
          <button class="btn ghost" data-xmlg-all="1">➕ Tout ajouter</button>
          <button class="btn ghost" data-modal-close="1">Annuler</button>
        </div>`);
    }catch(e){ toast("Import XML échoué : "+e.message); }
  };
  r.readAsText(file);
}

function applyXMLImportGeneric(mode){

/* Un lien [[Nom]]/résultat de recherche/puce "mentionné dans" peut techniquement pointer vers un
   type d'entité dont l'onglet n'est pas accessible au rôle courant (ex. un lien vers un Point Crawl
   MJ écrit dans une note de session, par ailleurs visible aux joueurs) — findByName()/renderText()
   ne filtrent pas par rôle à la résolution du lien, seulement au clic, ici. Signalé par Tristan
   (2026-08-10) en testant le mode aperçu : cliquer dessus ne doit PROVOQUER AUCUNE navigation (pas
   de page "ce n'est pas accessible" — juste rester exactement où on était), avec seulement un petit
   signal (toast) pour que le clic ne semble pas simplement ignoré. */
function goto(type,id){
  const tab = TAB_OF[type];
  if(effectiveRole()!=="gm" && !PLAYER_VISIBLE_TABS.includes(tab)){
    toast("Ce contenu n'est pas accessible.");
    return;
  }
  editReturnTo = null;
  view = { tab, mode:"detail", id };
  $("#search").value=""; $("#search-results").classList.remove("open");
  render();
}

// Onglets

  editReturnTo = null;

  document.body.classList.remove("nav-mobile-open");
});

  else if(e.target.matches("[data-table-filter]")){ tableCatFilter = e.target.value; renderList(); }

    if(srcWrap) srcWrap.classList.toggle("hidden", !dyn);

    if(filterWrap) filterWrap.classList.toggle("hidden", e.target.value!=="treasure");
  }
});

// Clics globaux dans l'app (délégation)
app.addEventListener("click", e=>{
  const t = e.target;
  const closest = (a)=>t.closest(`[${a}]`);
  let el;
  if((el=closest("data-toggle-group"))){ const k=el.dataset.toggleGroup; expandedGroups.has(k)?expandedGroups.delete(k):expandedGroups.add(k); renderList(); return; }
  if((el=closest("data-toggle-all"))){ const keys=(el.dataset.toggleAllKeys||"").split("|").filter(Boolean); if(el.dataset.toggleAll==="open") keys.forEach(k=>expandedGroups.add(k)); else keys.forEach(k=>expandedGroups.delete(k)); renderList(); return; }
  if((el=closest("data-toggle-reading"))){ readingMode=!readingMode; render(); return; }
  if((el=closest("data-open"))){ const [ty,id]=el.dataset.open.split(":"); goto(ty,id); return; }
  if((el=closest("data-goto"))){ const [ty,id]=el.dataset.goto.split(":"); goto(ty,id); return; }
  if((el=t.closest("[data-create]"))){ toast(`« ${el.dataset.create} » n'existe pas encore — créez cette entité pour activer le lien.`); return; }
  if(closest("data-back")){
    if(editReturnTo){ view={tab:editReturnTo.tab, mode:"detail", id:editReturnTo.id}; editReturnTo=null; }
    else{ view.mode="list"; view.id=null; }
    render(); return;
  }
  if((el=closest("data-new"))){ editReturnTo=null; view.mode="new"; view.id=null; render(); return; }
  if((el=closest("data-edit"))){ editReturnTo=null; const [ty,id]=el.dataset.edit.split(":"); view={tab:TAB_OF[ty],mode:"edit",id}; render(); return; }
  if((el=closest("data-dup"))){ const [ty,id]=el.dataset.dup.split(":"); duplicateEntity(ty,id); return; }
  if((el=closest("data-del"))){
    const [ty,id]=el.dataset.del.split(":");
    confirmModal("Supprimer définitivement cet élément ?", ()=>{ deleteEntity(ty,id); view.mode="list"; view.id=null; render(); toast("Supprimé."); });
    return;
  }
  if((el=closest("data-save"))){
    const ty = el.dataset.save;
    if(ty==="event") saveEvent(); else if(ty==="table") saveTable();
    else if(ty==="creature") saveCreature(); else if(ty==="session") saveSession();
    else if(ty==="npc") saveNPC(); else if(ty==="pointcrawl") saveCrawl();
    else if(ty==="pc") savePC(); else if(ty==="treasure") saveTreasure();
    else if(ty==="spell") saveSpell();
    else if(ty==="hexmap") saveHexmap();
    else if(ty==="dungeonmap") saveDungeonMap();
    return;
  }
  // Répéteurs & lancer — talents PJ
  if(closest("data-add-talent")){ $("#talents-wrap").insertAdjacentHTML("beforeend", talentInput({})); return; }
  if((el=t.closest("[data-remove-talent]"))){ el.closest("[data-talentitem]").remove(); return; }
  if((el=closest("data-roll-talents"))){ rollTalents(el.dataset.rollTalents); return; }
  if(closest("data-gen-pc")){ generateRandomPC(); return; }
  if(closest("data-gen-npc")){ generateRandomNPC(); return; }
  // Barre d'outils du point crawl
  if(closest("data-crawl-add")){ const c=getEntity("pointcrawl",crawlState.id); if(c) openPickEventModal(c); return; }
  if(closest("data-crawl-new")){ const c=getEntity("pointcrawl",crawlState.id); if(c) openNewEventModal(c); return; }
  if(closest("data-crawl-link")){ toggleLinkMode(); return; }
  if(closest("data-crawl-print")){ printCrawl(crawlState.id); return; }
  if(closest("data-print-pcs")){ openPrintPCsModal(); return; }
  if(closest("data-print-creature-cards")){ openPrintCreatureCardsModal(); return; }
  if(closest("data-print-npc-cards")){ openPrintNPCCardsModal(); return; }
  if((el=closest("data-print-pc"))){ printPCs([el.dataset.printPc]); return; }
  // Hexcrawl
  if((el=t.closest("[data-hexq]"))){
    if(effectiveRole()==="gm"){
      if(hexPlacingPoint) createHexPointAt(+el.dataset.hexq, +el.dataset.hexr);
      else if(hexPaintingBiome) setHexBiome(+el.dataset.hexq, +el.dataset.hexr, hexPaintBiomeValue);
      else if(hexPaintingOverlay) setHexOverlay(+el.dataset.hexq, +el.dataset.hexr, hexPaintOverlayValue);
      else toggleHexFog(+el.dataset.hexq, +el.dataset.hexr);
    }

let lastTableRoll = null; // { tableTitle, text } — dernier tirage, pour l'ajout aux notes de session
function rollTable(id){
  const t = getEntity("table",id); if(!t) return;
  const isDynamic = t.kind==="dynamic";
  const items = isDynamic ? dynamicSourceItems(t) : null;
  const count = isDynamic ? items.length : t.rows.length;
  if(!count) return;
  const idx = Math.floor(Math.random()*count);
  document.querySelectorAll("#table-body tr").forEach(tr=>tr.classList.toggle("rolled", +tr.dataset.rowidx===idx));
  const plain = isDynamic ? (items[idx].name||items[idx].title||"Sans nom") : (firstLine(t.rows[idx])||"(vide)");
  const linked = isDynamic ? `[[${plain}]]` : plain; // lien cliquable une fois collé dans les notes de session
  const out = $("#roll-out"); out.textContent = `→ ${idx+1} : ${plain}`;
  const tr = document.querySelector(`#table-body tr[data-rowidx="${idx}"]`);
  if(tr) tr.scrollIntoView({block:"nearest",behavior:"smooth"});
  lastTableRoll = `${t.title||"Table"} → ${idx+1} : ${linked}`;
  const addBtn = $("#roll-add-session"); if(addBtn) addBtn.classList.remove("hidden");
}

}

/* =========================================================================
   AUTOCOMPLÉTION DES LIENS [[…]]
   Déclencheurs : taper "[[" (mode brackets) ou Ctrl+Espace sur un mot (mode word).
   ========================================================================= */
let ac = { open:false, field:null, mode:null, from:0, to:0, items:[], sel:0 };
const AC_EXCLUDE = new Set(["search","pick-search"]);

function acEntities(){
  const out = [];
  const add = (type,list)=> (list||[]).forEach(o=>{ const nm=entityTitle(type,o); if(nm) out.push({type, name:nm}); });
  add("creature",db.creatures); add("event",db.events); add("table",db.tables);
  add("session",db.sessions); add("pc",db.pcs); add("npc",db.npcs); add("pointcrawl",db.pointcrawls);
  return out;
}

function isLinkField(f){ return f && f.matches && f.matches("textarea, input[type=text]") && !AC_EXCLUDE.has(f.id); }

function openAC(field, query, from, to, mode){
  const q = query.toLowerCase();
  const items = acEntities().filter(it=>it.name.toLowerCase().includes(q))
    .sort((a,b)=>{ const as=a.name.toLowerCase().startsWith(q)?0:1, bs=b.name.toLowerCase().startsWith(q)?0:1; return as-bs || a.name.localeCompare(b.name); });
  if(mode==="word" && !items.length){ closeAC(); toast("Aucune entité ne correspond à ce mot."); return; }
  ac = { open:true, field, mode, from, to, query, items:items.slice(0,8), sel:0 };
  renderAC(); positionAC(field, to);
}
function renderAC(){
  const pop = $("#ac-pop");
  const title = `<div class="ac-title">🔗 Lier une entité</div>`;
  if(!ac.items.length){ pop.innerHTML = title + `<div class="ac-empty">Aucune entité — continuez à taper</div>`; }
  else pop.innerHTML = title + ac.items.map((it,i)=>
      `<div class="aci ${i===ac.sel?"sel":""}" data-ac="${i}"><span class="tag ${it.type}">${TYPE_LABEL[it.type]}</span><span class="nm">${esc(it.name)}</span></div>`
    ).join("") + `<div class="ac-hint">↑↓ naviguer · ⏎/Tab insérer · Échap fermer</div>`;
  pop.classList.add("open");
}
function positionAC(field, caretPos){
  const c = getCaretCoordinates(field, caretPos);
  const r = field.getBoundingClientRect();
  const pop = $("#ac-pop");
  let left = r.left + c.left - field.scrollLeft;
  let top = r.top + c.top - field.scrollTop + c.height + 3;
  left = Math.max(6, Math.min(left, window.innerWidth - 340));
  if(top > window.innerHeight - 150) top = Math.max(6, top - c.height - pop.offsetHeight - 8);
  pop.style.left = left + "px"; pop.style.top = top + "px";
}
function moveAC(delta){ if(!ac.items.length) return; ac.sel = (ac.sel + delta + ac.items.length) % ac.items.length; renderAC(); }
function acceptAC(){
  if(!ac.open || !ac.items.length){ closeAC(); return; }
  const it = ac.items[ac.sel], f = ac.field, v = f.value, insert = `[[${it.name}]]`;
  f.value = v.slice(0, ac.from) + insert + v.slice(ac.to);
  const caret = ac.from + insert.length;
  f.focus(); f.setSelectionRange(caret, caret);
  closeAC();
}
function closeAC(){ ac.open = false; $("#ac-pop").classList.remove("open"); }

function onFieldInput(e){
  const f = e.target;
  if(!isLinkField(f)) return;
  const pos = f.selectionStart;
  const before = f.value.slice(0, pos);
  const m = before.match(/\[\[([^\[\]\n]*)$/);   // "[[" non fermé avant le curseur
  if(m) openAC(f, m[1], m.index, pos, "brackets");
  else if(ac.open && ac.mode==="brackets") closeAC();
}
function acWordTrigger(f){
  const pos = f.selectionStart;
  const before = f.value.slice(0, pos);
  const m = before.match(/([\wÀ-ÿ'’\-]+)$/);
  openAC(f, m ? m[1] : "", m ? pos - m[1].length : pos, pos, "word");
}
function onFieldKeydown(e){
  const f = e.target;
  if(isLinkField(f) && e.ctrlKey && (e.code==="Space" || e.key===" ")){ e.preventDefault(); acWordTrigger(f); return; }
  if(!ac.open) return;
  if(e.key==="ArrowDown"){ e.preventDefault(); moveAC(1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); moveAC(-1); }
  else if(e.key==="Enter" || e.key==="Tab"){ e.preventDefault(); acceptAC(); }
  else if(e.key==="Escape"){ e.preventDefault(); closeAC(); }
}

document.addEventListener("input", onFieldInput);
document.addEventListener("keydown", onFieldKeydown, true);
document.addEventListener("scroll", ()=>{ if(ac.open) closeAC(); }, true);
document.addEventListener("mousedown", e=>{ if(ac.open && !e.target.closest("#ac-pop") && e.target!==ac.field) closeAC(); });
$("#ac-pop").addEventListener("mousedown", e=>{ const it=e.target.closest("[data-ac]"); if(it){ e.preventDefault(); ac.sel=+it.dataset.ac; acceptAC(); } });

/* Coordonnées du curseur dans un textarea/input (technique du "miroir") */
function getCaretCoordinates(element, position){
  const isInput = element.nodeName === "INPUT";
  const div = document.createElement("div");
  const computed = getComputedStyle(element);
  const s = div.style;
  s.position = "absolute"; s.visibility = "hidden"; s.whiteSpace = "pre-wrap";
  if(!isInput) s.wordWrap = "break-word"; else { s.whiteSpace = "pre"; s.overflow = "hidden"; }
  ["boxSizing","width","height","overflowX","overflowY","borderTopWidth","borderRightWidth","borderBottomWidth","borderLeftWidth",
   "paddingTop","paddingRight","paddingBottom","paddingLeft","fontStyle","fontVariant","fontWeight","fontStretch","fontSize",
   "lineHeight","fontFamily","textAlign","textTransform","textIndent","letterSpacing","wordSpacing","tabSize"]
    .forEach(p=>{ s[p] = computed[p]; });
  document.body.appendChild(div);
  div.textContent = element.value.substring(0, position);
  if(isInput) div.textContent = div.textContent.replace(/\s/g, " ");
  const span = document.createElement("span");
  span.textContent = element.value.substring(position) || ".";
  div.appendChild(span);
  const coords = { top: span.offsetTop + parseInt(computed.borderTopWidth), left: span.offsetLeft + parseInt(computed.borderLeftWidth), height: parseInt(computed.lineHeight) || parseInt(computed.fontSize) };
  document.body.removeChild(div);
  return coords;
}

/* Ajoute les tables par défaut manquantes (dédoublonnage par titre, insensible à la casse) — n'écrase jamais
   le contenu d'une table existante. Complète seulement la `category` d'une table déjà présente si elle n'en
   a pas encore (ex : tables ajoutées avant l'introduction du champ catégorie), sans toucher au reste. */
function seedShadowdarkDefaultTables(){
  const byTitle = new Map(db.tables.map(t=>[(t.title||"").trim().toLowerCase(), t]));
  let added = 0, categorized = 0;
  const seedOne = (tpl, isDynamic) => {
    const existing = byTitle.get(tpl.title.toLowerCase());
    if(existing){
      if(!existing.category && tpl.category){ existing.category = tpl.category; categorized++; }
      return;
    }
    const o = { id:uid(), title:tpl.title, category:tpl.category||"", context:tpl.context };
    if(isDynamic){ o.kind="dynamic"; o.source=tpl.source; o.sourceFilter=tpl.sourceFilter||""; o.rows=[]; }
    else { o.kind="static"; o.rows=[...tpl.rows]; }
    db.tables.push(o);
    byTitle.set(tpl.title.toLowerCase(), o);
    added++;
  };
  SHADOWDARK_DEFAULT_TABLES.forEach(tpl=>seedOne(tpl,false));
  SHADOWDARK_DEFAULT_DYNAMIC_TABLES.forEach(tpl=>seedOne(tpl,true));
  return { added, categorized };
}

const authScreen = $("#auth-screen");
const authError = $("#auth-error");
const appHeader = document.getElementById("app-header");

function showAuthScreen(msg){
  appHeader.classList.add("hidden");
  app.innerHTML = "";
  authScreen.classList.remove("hidden");
  if(msg){ authError.textContent = msg; authError.classList.remove("hidden"); }
  else{ authError.classList.add("hidden"); authError.textContent = ""; }
}
function hideAuthScreen(){
  authScreen.classList.add("hidden");
  appHeader.classList.remove("hidden");
}

/* Rôle de l'utilisateur connecté : "gm" (accès complet) ou "player" (lecture seule, carnet de route uniquement).
   Valeur par défaut prudente tant que non déterminé : on ne considère jamais quelqu'un "gm" par erreur. */
let myRole = "player";
async function fetchMyRole(){
  try{
    const { data:{ user } } = await sb.auth.getUser();
    if(!user) return "player";
    const { data, error } = await sb.from("profiles").select("role").eq("id", user.id).maybeSingle();
    if(error || !data) return "player";
    return data.role==="gm" ? "gm" : "player";
  }catch(e){ console.error(e); return "player"; }
}

/* Mode aperçu joueur global (bouton dans le header) : simulation d'affichage pour le MJ, ne change
   jamais le vrai rôle de session/Supabase — myRole reste "gm", seul l'AFFICHAGE bascule. Tout le
   reste du code (rendu de listes/détails, boutons créer/éditer, filtres de contenu comme la carte
   de donjon active ou les entrées de carnet de route visibles) teste déjà le rôle exclusivement via
   des comparaisons "gm"/"player" — en centralisant ces comparaisons sur effectiveRole() plutôt que
   sur myRole directement, ce même mode aperçu couvre automatiquement TOUS ces endroits d'un coup,
   sans avoir à dupliquer la logique de filtrage à la main pour chaque onglet. Voir togglePlayerPreview(). */
let previewAsPlayer = false;
function effectiveRole(){ return previewAsPlayer ? "player" : myRole; }

/* Cache les onglets et actions réservés au MJ pour un compte joueur */
function applyRoleUI(){
  document.querySelectorAll("#tabs button[data-tab]").forEach(b=>{
    b.classList.toggle("hidden", effectiveRole()!=="gm" && !PLAYER_VISIBLE_TABS.includes(b.dataset.tab));
  });
  const exp = document.getElementById("btn-export"), imp = document.getElementById("btn-import"), bl = document.getElementById("btn-broken-links");
  if(exp) exp.classList.toggle("hidden", effectiveRole()!=="gm");
  if(imp) imp.classList.toggle("hidden", effectiveRole()!=="gm");
  if(bl) bl.classList.toggle("hidden", effectiveRole()!=="gm");
  const searchWrap = document.getElementById("search-wrap");
  if(searchWrap) searchWrap.classList.toggle("hidden", effectiveRole()!=="gm");
  // Le bouton d'aperçu lui-même doit rester visible pour le vrai MJ même PENDANT l'aperçu (pour
  // pouvoir en sortir) — il teste donc le vrai myRole, jamais effectiveRole().
  const pbtn = document.getElementById("btn-player-preview");
  if(pbtn){ pbtn.classList.toggle("hidden", myRole!=="gm"); pbtn.classList.toggle("active-mode", previewAsPlayer); }
}

/* Bascule le mode aperçu joueur global : simulation d'affichage uniquement, ne touche jamais à
   myRole ni à la session Supabase. Ne change JAMAIS d'onglet — que ce soit à l'activation ou à la
   désactivation — pour un aller-retour instantané (Tristan a signalé qu'un saut automatique vers
   "Carnet de route" à chaque activation était pénible : il fallait ensuite renaviguer manuellement
   vers l'onglet sur lequel il travaillait). Deux garde-fous seulement, gérés ailleurs :
   - un onglet réservé au MJ (hors PLAYER_VISIBLE_TABS) affiche un état "non visible aux joueurs" à
     la place de son contenu réel pendant l'aperçu, sans jamais rediriger vers un autre onglet
     (voir la garde dans render()) ;
   - un formulaire de création/édition en cours ne doit jamais être exposé tel quel en aperçu (les
     données non enregistrées seraient de toute façon perdues au premier re-rendu) : on retombe sur
     la liste du MÊME onglet, dans un sens comme dans l'autre. */
function togglePlayerPreview(){
  if(myRole!=="gm") return; // jamais utilisable par un vrai compte joueur, même en théorie
  previewAsPlayer = !previewAsPlayer;
  if(view.mode==="edit" || view.mode==="new") view = { tab:view.tab, mode:"list", id:null };
  applyRoleUI();
  const banner = document.getElementById("preview-banner");
  if(banner) banner.classList.toggle("hidden", !previewAsPlayer);
  document.body.classList.toggle("preview-active", previewAsPlayer);
  syncPreviewBannerHeight();
  render();
}
/* Cale --preview-banner-h sur la hauteur réellement rendue du bandeau (le texte peut passer sur
   deux lignes sur un écran étroit) — sert au décalage du header en CSS (voir ci-dessus). Appelé au
   basculement du mode et au redimensionnement de la fenêtre tant qu'il reste actif (rotation d'un
   téléphone, par ex.). */
function syncPreviewBannerHeight(){
  const banner = document.getElementById("preview-banner");
  if(!banner || banner.classList.contains("hidden")) return;
  document.documentElement.style.setProperty("--preview-banner-h", banner.getBoundingClientRect().height+"px");
}
window.addEventListener("resize", ()=>{ if(previewAsPlayer) syncPreviewBannerHeight(); });
window.addEventListener("orientationchange", ()=>{ if(previewAsPlayer) setTimeout(syncPreviewBannerHeight, 50); });

async function startApp(){
  hideAuthScreen();
  app.innerHTML = `<div class="empty"><span class="big">⏳</span>Chargement de la campagne…</div>`;
  try{
    myRole = await fetchMyRole();
    db = await fetchRemoteDB();
    loadPortraitsManifest(); // en parallèle, pas bloquant
    if(effectiveRole()==="gm" && countItems(db)===0){
      const legacy = loadLegacyLocalDB();
      if(legacy && countItems(legacy)>0){
        db = legacy;
        await saveDB();
        toast(`Données locales migrées vers la base de données (${countItems(db)} élément(s)).`);
      } else {
        seedIfEmpty();
      }
    }
    if(effectiveRole()==="gm"){
      const { added, categorized } = seedShadowdarkDefaultTables();
      if(added>0 || categorized>0){
        await saveDB();
        const parts = [];
        if(added>0) parts.push(`${added} table(s) aléatoire(s) du livre de base ajoutée(s)`);
        if(categorized>0) parts.push(`${categorized} catégorisée(s)`);
        toast(parts.join(" · ")+".");
      }
    }
  }catch(e){
    console.error(e);
    app.innerHTML = `<div class="empty"><span class="big">⚠</span>Impossible de charger les données depuis la base. Vérifiez votre connexion, puis rechargez la page.</div>`;
    return;
  }
  applyRoleUI();
  if(effectiveRole()!=="gm") view = { tab:"sessions", mode:"list", id:null };
  render();
}

async function initApp(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await startApp(); }
  else{ showAuthScreen(); }
}

$("#auth-submit").addEventListener("click", async ()=>{
  const email = $("#auth-email").value.trim();
  const password = $("#auth-password").value;
  if(!email || !password){ authError.textContent = "Email et mot de passe requis."; authError.classList.remove("hidden"); return; }
  const btn = $("#auth-submit");
  btn.disabled = true; btn.textContent = "Connexion…";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = "✓ Se connecter";
  if(error){ authError.textContent = "Connexion impossible : "+error.message; authError.classList.remove("hidden"); return; }
  await startApp();
});
$("#auth-password").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#auth-submit").click(); });
document.getElementById("btn-logout").addEventListener("click", async ()=>{ await sb.auth.signOut(); location.reload(); });
document.getElementById("btn-player-preview").addEventListener("click", togglePlayerPreview);
document.getElementById("btn-exit-preview").addEventListener("click", togglePlayerPreview);

// Marge d'onglets repliable (tapoter pour ouvrir/fermer)
// Desktop/tablette (≥641px) : colonne fixe, ouverte par défaut, état mémorisé.
// Mobile (≤640px) : tiroir par-dessus le contenu, fermé par défaut, jamais mémorisé.
const NAV_COLLAPSED_KEY = "sdcodex_nav_collapsed";
const navMobileQuery = window.matchMedia("(max-width:640px)");
if(!navMobileQuery.matches && localStorage.getItem(NAV_COLLAPSED_KEY)==="1") document.body.classList.add("nav-collapsed");
document.getElementById("btn-nav-toggle").addEventListener("click", ()=>{
  if(navMobileQuery.matches){
    document.body.classList.toggle("nav-mobile-open");
  } else {
    const collapsed = document.body.classList.toggle("nav-collapsed");
    localStorage.setItem(NAV_COLLAPSED_KEY, collapsed ? "1" : "0");
  }
});
document.getElementById("nav-backdrop").addEventListener("click", ()=>{
  document.body.classList.remove("nav-mobile-open");
});

(function(){
  const field = document.getElementById("starfield");
  const n = 70;
  for(let i=0;i<n;i++){
    const s = document.createElement("span");
    s.className = "star";
    const size = (Math.random()*1.6+0.6).toFixed(2);
    s.style.width = size+"px"; s.style.height = size+"px";
    s.style.left = (Math.random()*100).toFixed(2)+"%";
    s.style.top = (Math.random()*100).toFixed(2)+"%";
    s.style.setProperty("--lo", (Math.random()*.25+.05).toFixed(2));
    s.style.setProperty("--hi", (Math.random()*.4+.55).toFixed(2));
    s.style.animationDuration = (Math.random()*4+2).toFixed(2)+"s";
    s.style.animationDelay = (Math.random()*6).toFixed(2)+"s";
    field.appendChild(s);
  }
})();
initApp();
</script>
