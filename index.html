    ${items.length ? `<button class="btn danger sm" data-init-clear="1">🗑 Vider le combat</button>` : ""}` : "";

  const head = `<div class="page-head">
    <div><h1>Initiative</h1><div class="sub">${items.length} participant(s)</div></div>
    ${addBtns ? `<div class="hbtns">${addBtns}</div>` : ""}
  </div>`;

  if(!items.length){
    app.innerHTML = head + emptyState("⚔", myRole==="gm" ? "Aucun combat en cours. Ajoutez des participants pour démarrer." : "Aucun combat en cours pour l'instant.");
    return;
  }

  // Compte les occurrences dupliquées (ex. plusieurs gobelins) pour les distinguer à l'affichage.
  const seen = new Map();
  const suffixFor = (e)=>{
    if(e.kind==="custom") return "";
    const key = e.kind+":"+e.refId;
    const total = items.filter(x=>x.kind===e.kind && x.refId===e.refId).length;
    if(total<=1) return "";
    const n = (seen.get(key)||0) + 1; seen.set(key, n);
    return ` (${n})`;
  };

  const cardHTML = (e, rank)=>{
    const info = initiativeEntryInfo(e);
    const suffix = suffixFor(e);
    const visual = info.image
      ? `<img class="init-portrait${info.grayscale?' portrait-gray':''}" src="${esc(info.image)}" alt="">`
      : `<div class="init-portrait init-portrait-fallback">${info.icon}</div>`;
    const stats = [info.ac?`CA ${esc(info.ac)}`:"", info.hp?`PV ${esc(info.hp)}`:""].filter(Boolean).join(" · ");
    const gmControls = myRole==="gm" ? `<button class="btn ghost sm" data-init-roll="${e.id}" title="Lancer 1d20${e.kind==='pc'?' + mod. DEX':''}">🎲</button>
      <input type="number" class="init-manual-input" data-init-manual-input="${e.id}" value="${e.initiative==null?'':e.initiative}" placeholder="—" title="Valeur manuelle">
      <button class="btn danger sm" data-init-remove="${e.id}" title="Retirer du combat">✕</button>` : "";
    return `<div class="init-card">
      <div class="init-rank">${rank!=null?rank:"—"}</div>
      ${visual}
      <div class="init-body">
        <div class="init-name">${esc(info.name)}${suffix}</div>
        ${(info.sub||stats) ? `<div class="init-sub">${[esc(info.sub),stats].filter(Boolean).join(" · ")}</div>` : ""}
      </div>
      <div class="init-value${e.initiative==null?' empty':''}">${e.initiative==null?"—":e.initiative}</div>
      ${gmControls ? `<div class="init-controls">${gmControls}</div>` : ""}
    </div>`;
  };

  const pendingHTML = pending.length ? `<div class="init-group-label">En attente de jet</div>
    <div class="init-track">${pending.map(e=>cardHTML(e,null)).join("")}</div>` : "";
  const rankedHTML = ranked.length ? `<div class="init-group-label">Ordre de passage</div>
    <div class="init-track">${ranked.map((e,i)=>cardHTML(e,i+1)).join("")}</div>` : "";

  app.innerHTML = head + pendingHTML + rankedHTML;
}

/* =========================================================================
   ROUE — roue de la fortune (bonus à gagner)
   Config MJ (liste de bonus texte) stockée comme une collection classique
   (db.wheel), MJ CRUD / joueur lecture — même modèle que hexmaps/spells.
   Le tirage est purement local à chaque client (pas d'état de tirage
   partagé, pas de synchro temps réel) : chaque joueur fait tourner la roue
   pour lui-même, tirage uniforme (Math.random) parmi les bonus définis par
   le MJ. Décision volontaire pour rester simple — voir docs/AUDIT.md.
   ========================================================================= */
function wheelConfig(){ return db.wheel[0] || null; }
function ensureWheelConfig(){
  let w = db.wheel[0];
  if(!w){ w = { id:uid(), segments:[], revealMode:"gift" }; db.wheel.push(w); }
  return w;
}
function wheelSegments(){
  const w = wheelConfig();
  return (w && w.segments || []).filter(s=>s && s.trim());
}
/* Prépare le terrain pour un futur choix MJ entre plusieurs habillages de révélation
   ("gift" = cadeau + "Joyeux anniversaire" actuel, "chest" = coffre au trésor sans le
   texte anniversaire, à venir dans un chantier séparé) — pas de bascule MJ pour l'instant,
   seule "gift" est implémentée dans showWheelReward(). */
function wheelRevealMode(){
  const w = wheelConfig();
  return (w && w.revealMode) || "gift";
}

const WHEEL_PALETTE = ["var(--gold)","var(--blood)","var(--violet)","var(--gold2)","var(--blood2)","var(--violet2)"];
const WHEEL_SPIN_MS = 5400; // durée du tirage — au moins 5s de suspense demandées, source de vérité partagée avec le son
let wheelRotation = 0;   // rotation cumulée en degrés du <svg> roue — remise à 0 à chaque (re)rendu de l'onglet
let wheelSpinning = false;

/* --------- Son de tension (Web Audio API pure, aucun fichier externe) ---------
   Bruit blanc filtré ("brrrr" continu qui s'essouffle) + cliquets discrets qui
   ralentissent progressivement (roue à cliquet), tous deux calés sur WHEEL_SPIN_MS.
   Créé au clic sur "Tourner la roue" (geste utilisateur = pas de souci de politique
   autoplay), coupé proprement à la fin du tirage ou si on change d'onglet en route. */
let wheelAudioCtx = null;
let wheelAudioActive = null; // { noise, noiseGain, ticks, stopAt } de la session de son en cours, ou null
function ensureWheelAudioCtx(){
  if(!wheelAudioCtx) wheelAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(wheelAudioCtx.state==="suspended") wheelAudioCtx.resume();
  return wheelAudioCtx;
}
function startWheelTensionSound(durationMs){
  stopWheelTensionSound();
  let ctx;
  try{ ctx = ensureWheelAudioCtx(); }catch(e){ return; } // Web Audio indisponible : le tirage continue sans son
  const dur = durationMs/1000;
  const now = ctx.currentTime;
  const stopAt = now + dur;

  const bufferSize = ctx.sampleRate * 2;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = Math.random()*2-1;
  const noise = ctx.createBufferSource();
  noise.buffer = buffer; noise.loop = true;
  const filter = ctx.createBiquadFilter();
  filter.type = "bandpass"; filter.Q.value = 5;
  filter.frequency.setValueAtTime(950, now);
  filter.frequency.exponentialRampToValueAtTime(220, stopAt);
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(0.0001, now);
  noiseGain.gain.linearRampToValueAtTime(0.1, now+0.25);
  noiseGain.gain.setValueAtTime(0.1, Math.max(now+0.26, stopAt-0.4));
  noiseGain.gain.linearRampToValueAtTime(0.0001, stopAt);
  noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(ctx.destination);
  noise.start(now); noise.stop(stopAt+0.1);

  // cliquets discrets, intervalle géométrique croissant = ralentissement type roue à cliquet
  const ticks = [];
  let t = 0.05, interval = 0.085;
  while(t < dur - 0.12){
    const at = now + t;
    const osc = ctx.createOscillator();
    osc.type = "square"; osc.frequency.setValueAtTime(680, at);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.22, at+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, at+0.045);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(at); osc.stop(at+0.06);
    ticks.push(osc);
    t += interval;
    interval *= 1.085;
  }

  wheelAudioActive = { noise, noiseGain, ticks, stopAt };
  setTimeout(()=>{ if(wheelAudioActive && wheelAudioActive.stopAt===stopAt) wheelAudioActive=null; }, durationMs+200);
}
function stopWheelTensionSound(){
  if(!wheelAudioActive || !wheelAudioCtx){ wheelAudioActive = null; return; }
  const ctx = wheelAudioCtx;
  const { noise, noiseGain, ticks } = wheelAudioActive;
  const now = ctx.currentTime;
  try{
    noiseGain.gain.cancelScheduledValues(now);
    noiseGain.gain.setValueAtTime(noiseGain.gain.value, now);
    noiseGain.gain.linearRampToValueAtTime(0.0001, now+0.06);
    noise.stop(now+0.08);
  }catch(e){ /* déjà arrêté */ }
  ticks.forEach(osc=>{ try{ osc.stop(now); }catch(e){} });
  wheelAudioActive = null;
}

/* Petite fanfare "tadaaa" (arpège montant + accord tenu) jouée à l'ouverture du cadeau,
   en plus du son de tension pendant la rotation — toujours en Web Audio pure, aucun fichier.
   Réutilise le même AudioContext que le son de tension (déjà débloqué par le clic initial). */
function playWheelFanfare(){
  let ctx;
  try{ ctx = ensureWheelAudioCtx(); }catch(e){ return; }
  const now = ctx.currentTime;
  const notes = [
    { freq:523.25, at:0,    dur:0.11 },  // do5  — "ta"
    { freq:659.25, at:0.11, dur:0.11 },  // mi5  — "da"
    { freq:783.99, at:0.22, dur:0.11 },  // sol5 — "da"
  ];
  notes.forEach(nt=>{
    const at = now+nt.at;
    const osc = ctx.createOscillator();
    osc.type = "triangle"; osc.frequency.setValueAtTime(nt.freq, at);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(0.24, at+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at+nt.dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(at); osc.stop(at+nt.dur+0.02);
  });
  // accord final tenu (do6 + sol5 + mi5) — le "DAAA" qui conclut la fanfare
  const chordAt = now+0.33;
  [ {freq:1046.5, type:"sawtooth", gain:0.26}, {freq:783.99, type:"triangle", gain:0.16}, {freq:659.25, type:"triangle", gain:0.16} ]
    .forEach(({freq,type,gain})=>{
      const osc = ctx.createOscillator();
      osc.type = type; osc.frequency.setValueAtTime(freq, chordAt);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, chordAt);
      g.gain.linearRampToValueAtTime(gain, chordAt+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, chordAt+0.9);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(chordAt); osc.stop(chordAt+0.95);
    });
}

/* Habillage du texte des secteurs : les bonus formulés en plusieurs mots (fréquent en
   Shadowdark — "Un droit de plume au sceau sacré", "104 points d'expérience"…) débordaient
   largement d'un simple texte radial sur une ligne, en particulier avec beaucoup de secteurs.
   On enveloppe donc le texte sur plusieurs lignes tangentielles, chacune contrainte à la corde
   réellement disponible à son rayon (2·r·sin(angle/2)) — la corde s'élargit avec le rayon, donc
   les lignes extérieures ont naturellement plus de place que les lignes proches du centre. Une
   seule taille de police est choisie pour l'ensemble de la roue (le pire des secteurs doit tenir),
   pour un rendu homogène. */
const WHEEL_CHAR_W = 0.6;     // largeur moyenne d'un caractère, en fraction de la taille de police (police --ui, semi-gras)
const WHEEL_MAX_LINES = 4;
const WHEEL_LABEL_BASE_R = 0.52; // fraction du rayon où démarre la 1ère ligne — plus haut/loin du centre que l'ancien 0.40
const WHEEL_LABEL_DAMPING = 0.55; // atténue l'inclinaison du texte (1 = suit le rayon exactement, illisible près de 3h/9h)
function wheelLineRadius(lineIdx, fontSize, r){ return r*WHEEL_LABEL_BASE_R + lineIdx*fontSize*1.15; }
function wheelLineBudget(lineIdx, fontSize, anglePerRad, r){
  const rr = wheelLineRadius(lineIdx, fontSize, r);
  const chord = 2*rr*Math.sin(anglePerRad/2);
  return Math.max(chord*0.8, fontSize*1.4);
}
function wheelTextWidth(text, fontSize){ return text.length*WHEEL_CHAR_W*fontSize; }
function truncateWheelText(text, budget, fontSize){
  const maxChars = Math.max(1, Math.floor(budget/(WHEEL_CHAR_W*fontSize)));
  return text.length<=maxChars ? text : text.slice(0, Math.max(1,maxChars-1))+"…";
}
/* Répartition gloutonne des mots sur des lignes de largeur croissante (une par rayon).
   Retourne overflow:true si le texte ne tient pas dans WHEEL_MAX_LINES à cette taille de police,
   auquel cas on tronque la dernière ligne autorisée plutôt que de laisser déborder sur le secteur voisin. */
function wrapWheelLabel(text, fontSize, anglePerRad, r){
  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = "";
  let li = 0;
  for(const word of words){
    const test = cur ? cur+" "+word : word;
    if(!cur || wheelTextWidth(test, fontSize) <= wheelLineBudget(li, fontSize, anglePerRad, r)){
      cur = test;
    } else {
      lines.push(cur);
      li++;
      if(li >= WHEEL_MAX_LINES){
        const budget = wheelLineBudget(li-1, fontSize, anglePerRad, r);
        lines[lines.length-1] = truncateWheelText(lines[lines.length-1]+" "+word, budget, fontSize);
        return { lines, overflow:true };
      }
      cur = word;
    }
  }
  if(cur) lines.push(cur);
  return { lines, overflow:false };
}
function fitWheelFontSize(segments, anglePerRad, r){
  const candidates = [16,15,14,13,12,11,10,9,8,7];
  for(const fs of candidates){
    const fits = segments.every(seg => !wrapWheelLabel(seg, fs, anglePerRad, r).overflow);
    if(fits) return fs;
  }
  return 7; // dernier recours : la plus petite taille, quitte à tronquer la dernière ligne de certains secteurs
}

/* Secteurs = camembert SVG généré en JS (pas de dépendance). Convention d'angle :
   0° = est (droite), sens horaire — le secteur 0 démarre à -90° (haut du cadre),
   là où se trouve le pointeur fixe. */
function buildWheelSVG(segments){
  const n = segments.length;
  const cx=150, cy=150, r=140;
  const anglePer = 360/n;
  const anglePerRad = anglePer*Math.PI/180;
  const pt = (angleDeg, radius)=>{ const a=angleDeg*Math.PI/180; return { x: cx+radius*Math.cos(a), y: cy+radius*Math.sin(a) }; };
  const fontSize = fitWheelFontSize(segments, anglePerRad, r);
  const parts = segments.map((seg,i)=>{
    const start = -90 + i*anglePer, end = start + anglePer, mid = start + anglePer/2;
    const p1 = pt(start,r), p2 = pt(end,r);
    const largeArc = anglePer>180 ? 1 : 0;
    const color = WHEEL_PALETTE[i % WHEEL_PALETTE.length];
    const { lines } = wrapWheelLabel(seg, fontSize, anglePerRad, r);
    // Texte tangentiel (aligné sur la tangente au rayon, mid+90°), avec deux garde-fous :
    // 1) normalisation dans [-90°,90°] pour ne JAMAIS afficher de texte à l'envers (180°) ;
    // 2) atténuation (WHEEL_LABEL_DAMPING) de l'inclinaison — sans ça, les secteurs proches
    //    de 3h/9h se retrouvent inclinés à ±90° (quasi vertical, illisible même si "à l'endroit").
    let n = ((mid + 90) % 360 + 360) % 360; // 0..360
    if(n > 180) n -= 360;                    // -180..180
    if(n > 90) n -= 180; else if(n < -90) n += 180; // -90..90, jamais à l'envers
    const textRot = n * WHEEL_LABEL_DAMPING;
    const textParts = lines.map((line,li)=>{
      const tp = pt(mid, wheelLineRadius(li, fontSize, r));
      return `<text x="${tp.x.toFixed(2)}" y="${tp.y.toFixed(2)}" font-size="${fontSize}" text-anchor="middle" dominant-baseline="middle" transform="rotate(${textRot.toFixed(2)} ${tp.x.toFixed(2)} ${tp.y.toFixed(2)})">${esc(line)}</text>`;
    }).join("");
    return `<path d="M ${cx} ${cy} L ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} Z" style="fill:${color}"></path>${textParts}`;
  }).join("");
  return `<svg class="wheel-rotor" id="wheel-rotor" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">${parts}</svg>`;
}

function viewWheel(){
  wheelRotation = 0; wheelSpinning = false; // le SVG est reconstruit à chaque appel, sa rotation visuelle repart de 0
  const segments = wheelSegments();
  const editBtn = myRole==="gm" ? `<button class="btn ghost sm" data-wheel-edit="1">✎ Modifier les bonus</button>` : "";
  const head = `<div class="page-head">
    <div><h1>Roue des bonus</h1><div class="sub">${segments.length} bonus configuré(s)</div></div>
    ${editBtn ? `<div class="hbtns">${editBtn}</div>` : ""}
  </div>`;

  if(segments.length < 2){
    app.innerHTML = head + emptyState("🎡", myRole==="gm"
      ? "Ajoute au moins deux bonus pour activer la roue."
      : "Ton MJ n'a pas encore configuré la roue.");
    return;
  }

  app.innerHTML = `${head}
    <div class="wheel-stage">
      <div class="wheel-frame">
        <div class="wheel-pointer"></div>
        ${buildWheelSVG(segments)}
        <div class="wheel-hub"></div>
      </div>
      <button class="btn wheel-spin-btn" data-wheel-spin="1">🎡 Tourner la roue</button>
    </div>`;
}

function spinWheel(){
  if(wheelSpinning) return;
  stopWheelTensionSound(); // garde-fou : coupe un éventuel reliquat sonore avant de relancer
  const segments = wheelSegments();
  if(segments.length < 2) return;
  const rotor = document.getElementById("wheel-rotor");
  const btn = document.querySelector("[data-wheel-spin]");
  if(!rotor) return;
  wheelSpinning = true;
  if(btn) btn.disabled = true;

  const n = segments.length;
  const anglePer = 360/n;
  const idx = Math.floor(Math.random()*n);
  const segMidAngle = -90 + idx*anglePer + anglePer/2;
  let delta = (-90 - segMidAngle) % 360;
  if(delta < 0) delta += 360;
  const turns = 7 + Math.floor(Math.random()*4); // 7 à 10 tours complets avant l'arrêt, pour le suspense
  const currentMod = ((wheelRotation % 360) + 360) % 360;
  let add = delta - currentMod;
  if(add <= 0) add += 360;
  wheelRotation += add + turns*360;

  rotor.style.transform = `rotate(${wheelRotation}deg)`; // la transition (durée = WHEEL_SPIN_MS) vient de la classe .wheel-rotor
  startWheelTensionSound(WHEEL_SPIN_MS);
  rotor.addEventListener("transitionend", ()=>{
    wheelSpinning = false;
    if(btn) btn.disabled = false;
    stopWheelTensionSound();
    showWheelReward(segments[idx]);
  }, { once:true });
}

/* Révélation : boîte cadeau qui s'ouvre + confettis + bannière "Joyeux anniversaire",
   en plus du texte du bonus tiré — easter egg demandé explicitement, à chaque tirage. */
function showWheelReward(text){
  const overlay = document.getElementById("wheel-reward");
  const inner = overlay.querySelector(".wheel-reward-inner");
  inner.innerHTML = `<div class="gift-box" id="wheel-gift"><div class="gift-lid"></div><div class="gift-base"></div></div>
    <div class="wheel-reward-banner" id="wheel-banner">
      <div class="wheel-reward-happy">Joyeux anniversaire</div>
      <div class="wheel-reward-prize">${esc(text)}</div>
      <button type="button" class="btn" data-wheel-reward-close="1">✦ Fermer</button>
    </div>
    <div class="confetti-layer" id="wheel-confetti"></div>`;
  overlay.classList.remove("hidden");
  const gift = document.getElementById("wheel-gift"), banner = document.getElementById("wheel-banner");
  setTimeout(()=>{ gift.classList.add("shake"); }, 150);
  setTimeout(()=>{
    gift.classList.remove("shake"); gift.classList.add("open");
    spawnWheelConfetti();
    banner.classList.add("show");
    playWheelFanfare();
  }, 750);
}
function hideWheelReward(){
  const overlay = document.getElementById("wheel-reward");
  overlay.classList.add("hidden");
  overlay.querySelector(".wheel-reward-inner").innerHTML = "";
}
function spawnWheelConfetti(){
  const layer = document.getElementById("wheel-confetti");
  if(!layer) return;
  const colors = ["var(--gold)","var(--gold2)","var(--blood)","var(--blood2)","var(--violet)","var(--violet2)"];
  let html = "";
  for(let i=0;i<50;i++){
    const left = (Math.random()*100).toFixed(1);
    const delay = (Math.random()*0.5).toFixed(2);
    const dur = (2.2 + Math.random()*1.2).toFixed(2);
    const color = colors[Math.floor(Math.random()*colors.length)];
    const rot = Math.floor(Math.random()*360);
    html += `<div class="confetti-piece" style="left:${left}%; background:${color}; animation-delay:${delay}s; animation-duration:${dur}s; transform:rotate(${rot}deg)"></div>`;
  }
  layer.innerHTML = html;
}

/* --------- Édition MJ des bonus (modale, liste simple ajout/suppr) --------- */
function wheelRowHTML(val,i){
  return `<div class="repeat-item wheel-seg-item" data-wheelrowitem>
    <div class="rrow">
      <div class="field" style="flex:0 0 2.5rem"><label>#${i+1}</label></div>
      <div class="field" style="flex:1 1 200px"><input type="text" class="wheel-seg-input" value="${esc(val)}" placeholder="Ex. Potion de soin gratuite"></div>
      <button class="btn danger sm" data-wheel-remove-seg>✕</button>
    </div></div>`;
}
function reindexWheelSegRows(){
  document.querySelectorAll("#wheel-seg-wrap .wheel-seg-item").forEach((el,i)=>{ el.querySelector("label").textContent = "#"+(i+1); });
}
function openWheelEditModal(){
  const w = ensureWheelConfig();
  const segs = w.segments.length ? w.segments : ["",""];
  openModal(`<div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0;color:var(--gold2)">Bonus de la roue</h2>
      <button class="icon-btn" data-modal-close="1">✕</button></div>
    <p class="wheel-seg-hint">Un bonus par ligne, texte court conseillé. Tirage à chances égales entre toutes les lignes non vides.</p>
    <div id="wheel-seg-wrap">${segs.map(wheelRowHTML).join("")}</div>
    <button class="btn ghost sm" data-wheel-add-seg="1">+ Ajouter un bonus</button>
    <div class="form-actions" style="margin-top:1rem"><button class="btn" data-wheel-save-segments="1">✓ Enregistrer</button><button class="btn ghost" data-modal-close="1">Annuler</button></div>`);
}
function saveWheelSegments(){
  const vals = [...document.querySelectorAll(".wheel-seg-input")].map(i=>i.value.trim()).filter(Boolean);
  if(vals.length < 2){ toast("Il faut au moins deux bonus non vides."); return; }
  const w = ensureWheelConfig();
  w.segments = vals;
  saveDB();
  closeModal();
  toast("Roue mise à jour.");
  if(view.tab==="wheel") viewWheel();
}

function pageHead(title, sub, newLabel, extra){
  return `<div class="page-head">
    <div><h1>${esc(title)}</h1><div class="sub">${esc(sub)}</div></div>
    ${myRole==="gm" ? `<div class="hbtns">${extra||""}<button class="btn" data-new="1">✦ ${esc(newLabel)}</button></div>` : ""}
  </div>`;
}
function emptyState(icon, msg){ return `<div class="empty"><span class="big">${icon}</span>${esc(msg)}</div>`; }

function eventThemes(){
  const set = new Set();
  db.events.forEach(e=>{ if(e.theme && e.theme.trim()) set.add(e.theme.trim()); });
  return [...set].sort((a,b)=>a.localeCompare(b));
}
// Suggestions de thèmes = thèmes existants + titres des point crawls (chaque plan est une catégorie)
function themeSuggestions(){
  const set = new Set(eventThemes());
  db.pointcrawls.forEach(c=>{ if(c.title && c.title.trim()) set.add(c.title.trim()); });
  return [...set].sort((a,b)=>a.localeCompare(b));
}
function eventCard(e){
  const desc = firstLine(e.description);
  return `<div class="card" data-open="event:${e.id}">
    <h3 style="margin-top:.2rem">${esc(e.title||"Sans titre")}</h3>
    ${desc?`<p>${esc(desc)}</p>`:""}
  </div>`;
}
function eventGrid(list){
  return `<div class="grid" style="margin-bottom:1.4rem">${list.map(eventCard).join("")}</div>`;
}
function listEvents(){
  const items = db.events;
  const themes = eventThemes();
  const head = pageHead("Événements", `${items.length} module(s) d'événement`, "Nouvel événement");

  if(!items.length){ app.innerHTML = head + emptyState("📖","Aucun événement. Créez votre premier module."); return; }

  // Filtre par thème (visible seulement dès qu'au moins un thème existe)
  const filter = themes.length ? `<div style="margin-bottom:1.1rem">
      <label style="font-family:var(--ui);font-size:.8rem;color:var(--muted);margin-right:.5rem">Thème :</label>
      <select data-event-filter style="width:auto;display:inline-block;min-width:160px">
        <option value="">Tous (regroupés)</option>
        ${themes.map(t=>`<option value="${esc(t)}" ${eventThemeFilter===t?"selected":""}>${esc(t)}</option>`).join("")}
        <option value="__none__" ${eventThemeFilter==="__none__"?"selected":""}>(Sans thème)</option>
      </select></div>` : "";

  let body;
  if(!themes.length){
    body = eventGrid(items); // aucun thème encore : liste simple
  } else if(eventThemeFilter){
    const filtered = eventThemeFilter==="__none__"
      ? items.filter(e=>!e.theme || !e.theme.trim())
      : items.filter(e=>(e.theme||"").trim()===eventThemeFilter);
    body = filtered.length ? eventGrid(filtered) : `<p class="faint" style="font-family:var(--ui)">Aucun événement pour ce thème.</p>`;
  } else {
    // Vue regroupée : une section par thème, puis « Sans thème »
    const sections = [];
    const allKeys = [];
    themes.forEach(t=>{
      const list = items.filter(e=>(e.theme||"").trim()===t);
      const key = "events:"+t; allKeys.push(key); const closed = !expandedGroups.has(key);
      sections.push(`<h2 class="group-head${closed?' collapsed':''}" data-toggle-group="${esc(key)}">${esc(t)} <span class="faint">(${list.length})</span><span class="grp-arrow">▾</span></h2><div class="group-body${closed?' collapsed':''}">${eventGrid(list)}</div>`);
    });
    const noTheme = items.filter(e=>!e.theme || !e.theme.trim());
    if(noTheme.length){ const key="events:__none__"; allKeys.push(key); const closed = !expandedGroups.has(key);
      sections.push(`<h2 class="group-head${closed?' collapsed':''}" data-toggle-group="${esc(key)}">Sans thème <span class="faint">(${noTheme.length})</span><span class="grp-arrow">▾</span></h2><div class="group-body${closed?' collapsed':''}">${eventGrid(noTheme)}</div>`); }
    const allOpen = allKeys.length && allKeys.every(k=>expandedGroups.has(k));
    sections.unshift(`<div style="margin-bottom:.8rem"><button class="btn ghost sm" data-toggle-all="${allOpen?'close':'open'}" data-toggle-all-keys="${esc(allKeys.join('|'))}">${allOpen?'⊟ Tout fermer':'⊞ Tout ouvrir'}</button></div>`);
    body = sections.join("");
  }
  app.innerHTML = head + filter + body;
}

function diceIcon(n){
  const s = 'stroke="currentColor" fill="none" stroke-width="1.3" stroke-linejoin="round"';
  const s2 = 'stroke="currentColor" stroke-width="1" fill="none"';
  let shape;
  if(n===4) shape = `<polygon points="7,1.5 12.5,12 1.5,12" ${s}/><path d="M7,1.5 L7,12 M1.5,12 L7,7 L12.5,12" ${s2}/>`;
  else if(n===6) shape = `<rect x="2" y="2" width="10" height="10" ${s}/>`;
  else if(n===8) shape = `<polygon points="7,0.8 12.8,7 7,13.2 1.2,7" ${s}/><path d="M1.2,7 L12.8,7" ${s2}/>`;
  else if(n===10) shape = `<polygon points="7,0.8 11.5,4.5 9.5,13.2 4.5,13.2 2.5,4.5" ${s}/><path d="M2.5,4.5 L11.5,4.5" ${s2}/>`;
  else if(n===12) shape = `<polygon points="7,0.8 13,5.1 10.7,12.2 3.3,12.2 1,5.1" ${s}/><path d="M7,0.8 L7,6 M13,5.1 L7,6 L1,5.1 M10.7,12.2 L7,6 M3.3,12.2 L7,6" ${s2}/>`;
  else if(n===20) shape = `<polygon points="7,0.6 13,4.3 13,9.7 7,13.4 1,9.7 1,4.3" ${s}/><path d="M7,0.6 L7,7 M13,4.3 L7,7 M13,9.7 L7,7 M7,13.4 L7,7 M1,9.7 L7,7 M1,4.3 L7,7" ${s2}/>`;
  else shape = `<circle cx="7" cy="7" r="6.2" ${s}/>`;
  return `<svg width="14" height="14" viewBox="0 0 14 14" style="vertical-align:-2px;margin-right:.3rem">${shape}</svg>`;
}
/* ------------------ Tables dynamiques (tirent parmi une collection existante de l'appli) ------------------
   Une table "dynamique" (t.kind==="dynamic") ne stocke pas de contenu figé dans t.rows : à la place, elle
   pointe vers une collection de l'appli (t.source, ex. "creature") et, en option, un filtre (t.sourceFilter,
   utile pour les trésors classés par catégorie). Son "d-quelque-chose" et son contenu sont recalculés en
   direct à chaque affichage/tirage à partir de ce qui existe alors dans `db` — elle grossit toute seule au
   fil de la campagne, et est vide tant que rien n'a été créé dans la collection visée. `tab` ci-dessous est
   à la fois la clé de `db` et le nom de l'onglet (creatures/npcs/treasures partagent les deux). */
const DYNAMIC_TABLE_SOURCES = {
  creature: { tab:"creatures", hasCategoryFilter:false },
  npc:      { tab:"npcs",      hasCategoryFilter:false },
  treasure: { tab:"treasures", hasCategoryFilter:true },
  spell:    { tab:"spells",    hasCategoryFilter:false }
};
function dynamicSourceItems(t){
  const meta = DYNAMIC_TABLE_SOURCES[t.source];
  if(!meta) return [];
  let list = db[meta.tab] || [];
  if(t.sourceFilter){
    list = list.filter(x => (x.category || (meta.tab==="treasures" ? "trouvaille" : "")) === t.sourceFilter);
  }
  return list;
}
function tableSize(t){ return t.kind==="dynamic" ? dynamicSourceItems(t).length : (t.rows||[]).length; }

function tableCategories(){
  const set = new Set();
  db.tables.forEach(t=>{ if(t.category && t.category.trim()) set.add(t.category.trim()); });
  return [...set].sort((a,b)=>a.localeCompare(b));
}
function tableCard(t){
  const size = tableSize(t);
  return `<div class="card" data-open="table:${t.id}">
    <div class="meta"><span class="tag table">${diceIcon(size)}d${size}</span>${t.kind==="dynamic"?`<span class="tag gold">⚡ Dynamique</span>`:""}${t.category?`<span class="tag gold">${esc(t.category)}</span>`:""}</div>
    <h3 style="margin-top:.6rem">${esc(t.title||"Sans titre")}</h3>
    <p>${esc(t.context||"Pas de contexte")}</p>
  </div>`;
}
function tableGrid(list){ return `<div class="grid" style="margin-bottom:1.4rem">${list.map(tableCard).join("")}</div>`; }
function listTables(){
  const items = db.tables;
  const cats = tableCategories();
  const head = pageHead("Tables aléatoires", `${items.length} table(s)`, "Nouvelle table", xmlToolbarHTML("table"));

      <label style="font-family:var(--ui);font-size:.8rem;color:var(--muted);margin-right:.5rem">Catégorie :</label>
      <select data-table-filter style="width:auto;display:inline-block;min-width:180px">
        <option value="">Toutes (regroupées)</option>
        ${cats.map(t=>`<option value="${esc(t)}" ${tableCatFilter===t?"selected":""}>${esc(t)}</option>`).join("")}
        <option value="__none__" ${tableCatFilter==="__none__"?"selected":""}>(Sans catégorie)</option>
      </select></div>` : "";

  let body;
  if(!cats.length){
    body = tableGrid(items); // aucune catégorie encore : liste simple
  } else if(tableCatFilter){
    const filtered = tableCatFilter==="__none__"
      ? items.filter(t=>!t.category || !t.category.trim())
      : items.filter(t=>(t.category||"").trim()===tableCatFilter);
    body = filtered.length ? tableGrid(filtered) : `<p class="faint" style="font-family:var(--ui)">Aucune table dans cette catégorie.</p>`;
  } else {
    const sections = []; const allKeys = [];
    cats.forEach(t=>{
      const list = items.filter(x=>(x.category||"").trim()===t);
      const key = "tables:"+t; allKeys.push(key); const closed = !expandedGroups.has(key);
      sections.push(`<h2 class="group-head${closed?' collapsed':''}" data-toggle-group="${esc(key)}">${esc(t)} <span class="faint">(${list.length})</span><span class="grp-arrow">▾</span></h2><div class="group-body${closed?' collapsed':''}">${tableGrid(list)}</div>`);
    });
    const noCat = items.filter(t=>!t.category || !t.category.trim());
    if(noCat.length){ const key="tables:__none__"; allKeys.push(key); const closed = !expandedGroups.has(key);
      sections.push(`<h2 class="group-head${closed?' collapsed':''}" data-toggle-group="${esc(key)}">Sans catégorie <span class="faint">(${noCat.length})</span><span class="grp-arrow">▾</span></h2><div class="group-body${closed?' collapsed':''}">${tableGrid(noCat)}</div>`); }
    const allOpen = allKeys.length && allKeys.every(k=>expandedGroups.has(k));
    sections.unshift(`<div style="margin-bottom:.8rem"><button class="btn ghost sm" data-toggle-all="${allOpen?'close':'open'}" data-toggle-all-keys="${esc(allKeys.join('|'))}">${allOpen?'⊟ Tout fermer':'⊞ Tout ouvrir'}</button></div>`);
    body = sections.join("");
  }
  app.innerHTML = head + filter + body;
}

function levelNum(l){
  l = String(l||"").trim();
  let m;
  if((m = l.match(/^(\d+)\s*\/\s*(\d+)/))) return (+m[1])/(+m[2]);   // niveaux fractionnaires (1/2, 1/4…)
  if((m = l.match(/-?\d+(\.\d+)?/))) return parseFloat(m[0]);
  return -1;
}
function creatureCategories(){
  const set = new Set();
  db.creatures.forEach(c=>{ if(c.category && c.category.trim()) set.add(c.category.trim()); });
  return [...set].sort((a,b)=>a.localeCompare(b));
}
function sortCreatures(list){
  const s = creatureSort;
  const a = [...list];
  if(s==="lvlAsc")  a.sort((x,y)=>levelNum(x.level)-levelNum(y.level) || (x.name||"").localeCompare(y.name||""));
  else if(s==="lvlDesc") a.sort((x,y)=>levelNum(y.level)-levelNum(x.level) || (x.name||"").localeCompare(y.name||""));
  else a.sort((x,y)=>(x.name||"").localeCompare(y.name||""));
  return a;
}

}

function seedNpcGenTables(){
  seedCharGenTables(); // garantit la table "Noms de personnages"
  const ensure = (title, context, rows)=>{
    if(db.tables.some(t=>(t.title||"").trim()===title)) return;
    db.tables.push({id:uid(), title, context, rows});
  };
  ensure("Ambitions de PNJ", "Ce que veut un PNJ, à la volée (maison, non issue du livre).", AMBITIONS_PNJ_ROWS);
  ensure("Moyens de PNJ", "Comment le PNJ compte parvenir à son ambition (maison, non issue du livre).", MOYENS_PNJ_ROWS);
  ensure("Armes de base", "Armes courantes et dégâts approximatifs (maison — le Quickstart ne détaille pas l'équipement).", ARMES_BASE_ROWS);
}
const NPC_SPELL_CLASSES = ["priest","wizard","witch"];
function generateRandomNPC(){
  seedNpcGenTables();
  const scores = ["str","dex","con","int","wis","cha"].reduce((o,k)=>{ o[k]=rollDice(3,6); return o; },{});
  const mods = {}; Object.keys(scores).forEach(k=> mods[k]=ABILITY_MOD(scores[k]));
  const sgn = m => (m>=0?"+":"")+m;
  const hp = Math.max(1, rollDice(1,6)+mods.con);
  const ac = 10 + mods.dex;
  const nom = rollOnAppTable("Noms de personnages") || pick(NOMS_ROWS);
  const ambition = rollOnAppTable("Ambitions de PNJ") || pick(AMBITIONS_PNJ_ROWS);
  const moyen = rollOnAppTable("Moyens de PNJ") || pick(MOYENS_PNJ_ROWS);
  const weapon = rollOnAppTable("Armes de base") || pick(ARMES_BASE_ROWS);

  let spells = "";
  if(rollDice(1,6)===1){
    const spellClass = pick(NPC_SPELL_CLASSES);
    const pool = db.spells.filter(s=>s.class===spellClass && String(s.tier)==="1");
    const chosen = pickN(pool, rollDice(1,3));
    spells = chosen.map(s=>`[[${s.name}]]`).join("\n");
    if(!pool.length) spells = `(Lanceur de sorts — importe les sorts de ${spellClass==="priest"?"prêtre":spellClass==="wizard"?"magicien":"sorcière"} pour un tirage automatique.)`;
  }

  const o = {
    id: uid(), name: nom, description:"", physique:"", age:"", possessions:"",
    objectif: ambition, moyens: moyen, comportement:"",
    ac: String(ac), hp: String(hp),
    str:`${scores.str} (${sgn(mods.str)})`, dex:`${scores.dex} (${sgn(mods.dex)})`, con:`${scores.con} (${sgn(mods.con)})`,
    int:`${scores.int} (${sgn(mods.int)})`, wis:`${scores.wis} (${sgn(mods.wis)})`, cha:`${scores.cha} (${sgn(mods.cha)})`,
    weapon, spells, images:[], portrait: pickRandomPortrait()
  };
  db.npcs.push(o);
  saveDB();
  toast(`${nom} généré !`);
  view = {tab:"npcs", mode:"detail", id:o.id};
  render();
}

const firstLine = t => String(t||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean)[0] || "";
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
const truncate = (s,n)=>{ s=String(s||"").replace(/\s+/g," ").trim(); return s.length>n?s.slice(0,n)+"…":s; };

/* ------------------------------- DÉTAILS --------------------------------- */
function renderDetail(){
  const type = TYPE_OF_TAB[view.tab];
  const o = getEntity(type, view.id);

function duplicateEntity(type,id){
  const src = getEntity(type,id); if(!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid();
  // régénère les identifiants des sous-éléments pour éviter les collisions
  (copy.entries||[]).forEach(x=>x.id=uid());
  (copy.nodes||[]).forEach(x=>x.id=uid());
  (copy.edges||[]).forEach(x=>x.id=uid());
  (copy.images||[]).forEach(x=>x.id=uid());
  if(type==="npc"||type==="pc") delete copy.portrait; // le portrait d'origine reste réservé à la fiche source
  if(type==="creature"||type==="npc"||type==="pc"||type==="treasure"||type==="spell") copy.name = (copy.name||"Sans nom")+" (copie)";
  if(type==="creature"){ copy.manual = true; delete copy.imported; }   // un doublon créé à la main est protégé du vidage
  else copy.title = (copy.title||"Sans titre")+" (copie)";
  collectionOf(type).push(copy);
  saveDB(); view={tab:TAB_OF[type],mode:"detail",id:copy.id}; render(); toast("Dupliqué.");
}

function backlinksBlock(type,id){
  const g = backlinksTo(type,id);

  const parts = order.filter(([k])=>g[k]&&g[k].length).map(([k,lbl])=>`
    <div class="bl-group"><div class="lbl">${lbl}</div>
      ${g[k].map(x=>`<span class="bl-chip" data-goto="${x.type}:${x.id}">${esc(x.title||"—")}</span>`).join("")}
    </div>`).join("");
  return `<div class="backlinks"><h2>⇠ Mentionné dans</h2>${parts || `<p class="faint">Aucune autre entité ne mentionne cet élément. Utilisez <code>[[${esc(entityTitle(type,getEntity(type,id)))}]]</code> ailleurs pour créer un lien.</p>`}</div>`;
}

function fmtMod(v){
  if(v===undefined||v===null||v==="") return "—";
  const s = String(v).trim();
  if(/^[+-]/.test(s)) return s;
  const n = Number(s);
  if(!isNaN(n)) return (n>=0?"+":"")+n;
  return s;
}

/* -------------------------- Portraits (bibliothèque) --------------------- */
/* Catalogue partagé de ~300 illustrations (portraits/manifest.json), utilisable
   sur les fiches PJ et PNJ. Un même fichier ne peut être assigné qu'à une seule
   fiche à la fois : la disponibilité se calcule en direct depuis db.pcs/db.npcs
   (pas de table séparée à tenir à jour ni à faire dériver). */
async function loadPortraitsManifest(){
  if(portraitsReady) return;
  try{
    const r = await fetch("portraits/manifest.json");
    if(r.ok) PORTRAITS_MANIFEST = await r.json();
  }catch(e){ /* facultatif : l'appli fonctionne sans */ }
  portraitsReady = true;
}
function portraitOwnerLabel(file, excludeId){
  const pc = db.pcs.find(p=>p.portrait===file && p.id!==excludeId);
  if(pc) return `PJ : ${pc.name||"Sans nom"}`;
  const npc = db.npcs.find(n=>n.portrait===file && n.id!==excludeId);
  if(npc) return `PNJ : ${npc.name||"Sans nom"}`;
  return "";
}
function usedPortraitFiles(excludeId){
  const used = new Set();
  db.pcs.forEach(p=>{ if(p.portrait && p.id!==excludeId) used.add(p.portrait); });
  db.npcs.forEach(n=>{ if(n.portrait && n.id!==excludeId) used.add(n.portrait); });
  return used;
}
function availablePortraits(excludeId){
  const used = usedPortraitFiles(excludeId);
  return PORTRAITS_MANIFEST.filter(p=>!used.has(p.file));
}
function pickRandomPortrait(race){
  const pool = availablePortraits(null);
  if(!pool.length) return "";
  const byRace = race ? pool.filter(p=>p.race && p.race.toLowerCase()===String(race).toLowerCase()) : [];
  const from = byRace.length ? byRace : pool;
  return from[Math.floor(Math.random()*from.length)].file;
}
function portraitPickWidgetHTML(current){
  return `${current ? `<img class="portrait-current" src="portraits/${esc(current)}" alt="">` : `<div class="portrait-current empty">Aucun</div>`}
    <div class="portrait-pick-actions">

      ${current ? `<button type="button" class="btn ghost sm" data-clear-portrait="1">✕ Retirer</button>` : ""}

function processImage(file, cb){
  if(!file.type || !file.type.startsWith("image/")){ toast("Fichier ignoré (pas une image)."); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    const src = reader.result;
    const im = new Image();
    im.onload = ()=>{
      const max = 1000; let w = im.width, h = im.height;
      if(Math.max(w,h) <= max){ cb({id:uid(),name:file.name,data:src}); return; }
      const scale = max/Math.max(w,h); w = Math.round(w*scale); h = Math.round(h*scale);
      const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(im,0,0,w,h);
      const mime = file.type.includes("png") ? "image/png" : "image/jpeg";
      cb({id:uid(),name:file.name,data:canvas.toDataURL(mime, 0.85)});
    };
    im.onerror = ()=>toast("Image illisible.");
    im.src = src;
  };
  reader.readAsDataURL(file);
}

function updateAllEdges(c){
  const canvas = document.getElementById("crawl-canvas"); if(!canvas) return;
  const center = id=>{ const el = canvas.querySelector(`.crawl-node[data-node="${id}"]`); return el ? {x:el.offsetLeft+el.offsetWidth/2, y:el.offsetTop+el.offsetHeight/2} : null; };
  (c.edges||[]).forEach(e=>{
    const a = center(e.from), b = center(e.to);
    const line = canvas.querySelector(`line[data-edge="${e.id}"]`);
    if(line && a && b){ line.setAttribute("x1",a.x); line.setAttribute("y1",a.y); line.setAttribute("x2",b.x); line.setAttribute("y2",b.y); }
    const t = canvas.querySelector(`text[data-edgelabel="${e.id}"]`);
    if(t && a && b){ t.setAttribute("x",(a.x+b.x)/2); t.setAttribute("y",(a.y+b.y)/2 - 6); t.setAttribute("text-anchor","middle"); }
  });
}

function startNodeInteraction(e, c, nodeId){
  e.preventDefault();
  if(crawlState.linkMode){ handleLinkClick(c, nodeId); return; }
  const node = (c.nodes||[]).find(n=>n.id===nodeId); if(!node) return;
  const nodeEl = document.querySelector(`.crawl-node[data-node="${nodeId}"]`);
  const startX = e.clientX, startY = e.clientY, ox = node.x||0, oy = node.y||0; let moved = false;
  const move = ev=>{
    const dx = ev.clientX-startX, dy = ev.clientY-startY;
    if(Math.abs(dx)>3 || Math.abs(dy)>3) moved = true;
    node.x = Math.max(0, ox+dx); node.y = Math.max(0, oy+dy);
    if(nodeEl){ nodeEl.style.left = node.x+"px"; nodeEl.style.top = node.y+"px"; }
    updateAllEdges(c);
  };
  const up = ()=>{
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    if(moved) saveDB(); else openNodeInfo(c, node);
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
}

function handleLinkClick(c, nodeId){
  if(!crawlState.linkFrom){ crawlState.linkFrom = nodeId; drawCrawl(c); return; }
  if(crawlState.linkFrom === nodeId){ crawlState.linkFrom = null; drawCrawl(c); return; }
  const exists = (c.edges||[]).some(e=>(e.from===crawlState.linkFrom&&e.to===nodeId)||(e.from===nodeId&&e.to===crawlState.linkFrom));
  if(!exists){ (c.edges||(c.edges=[])).push({id:uid(), from:crawlState.linkFrom, to:nodeId, label:""}); saveDB(); }
  crawlState.linkFrom = null; drawCrawl(c);
}

function onEdgeClick(c, edgeId){
  const e = (c.edges||[]).find(x=>x.id===edgeId); if(!e) return;
  if(crawlState.linkMode){
    confirmModal("Supprimer ce segment ?", ()=>{ c.edges = c.edges.filter(x=>x.id!==edgeId); saveDB(); drawCrawl(c); });
    return;
  }
  promptModal("Étiquette du segment (ex : « porte verrouillée », « escalier nord ») :", e.label||"", (label)=>{
    e.label = (label||"").trim(); saveDB(); drawCrawl(c);
  });
}

function toggleLinkMode(){
  crawlState.linkMode = !crawlState.linkMode; crawlState.linkFrom = null;
  const c = getEntity("pointcrawl", crawlState.id); if(!c) return;
  const btn = $("#link-toggle");
  if(btn){ btn.classList.toggle("active-mode", crawlState.linkMode); btn.textContent = crawlState.linkMode ? "✓ Liaison active" : "🔗 Mode liaison"; }
  setCrawlHelp(); drawCrawl(c);
}

function openNodeInfo(c, node){
  const ev = getEntity("event", node.eventId);
  if(!ev){
    confirmModal("Cet événement n'existe plus. Retirer ce point du plan ?", ()=>removeNode(c, node.id));
    return;
  }
  openModal(`<div style="display:flex;justify-content:space-between;align-items:center;gap:1rem">
      <h2 style="margin:0;color:var(--gold2)">${esc(ev.title)}</h2>
      <button class="icon-btn" data-modal-close="1">✕</button></div>
    ${eventSectionsHTML(ev, {short:true})}
    <div class="form-actions">
      <button class="btn" data-goto-event="${ev.id}">📖 Ouvrir la fiche complète</button>
      <button class="btn ghost" data-edit-event="${ev.id}">✎ Modifier</button>
      <button class="btn danger" data-remove-node="${node.id}">Retirer du plan</button>
      <button class="btn ghost" data-modal-close="1">Fermer</button>
    </div>`);
}

function removeNode(c, nodeId){
  c.nodes = (c.nodes||[]).filter(n=>n.id!==nodeId);
  c.edges = (c.edges||[]).filter(e=>e.from!==nodeId && e.to!==nodeId);
  saveDB(); drawCrawl(c);
}

function addNodeForEvent(c, eventId, silent){
  const i = (c.nodes||[]).length;
  const x = 40 + (i%5)*190, y = 40 + Math.floor(i/5)*140;
  (c.nodes||(c.nodes=[])).push({id:uid(), eventId, x, y});
  const ev = getEntity("event", eventId);          // classer automatiquement sous le thème du plan
  if(ev && c.title) ev.theme = c.title;
  saveDB(); drawCrawl(c);
  if(!silent) toast(c.title ? `Point ajouté et classé sous « ${c.title} ».` : "Point ajouté au plan.");
}

/* Fenêtres modales génériques */
function openModal(html){ const m=$("#modal"); m.querySelector(".modal-box").innerHTML = html; m.classList.remove("hidden"); }
function closeModal(){ _modalCb = null; $("#modal").classList.add("hidden"); $("#modal").querySelector(".modal-box").innerHTML=""; }

/* Confirmation / saisie internes (remplacent confirm()/prompt(), bloqués dans le sandbox des artefacts) */
let _modalCb = null;
let _importData = null;
function confirmModal(message, onYes){
  _modalCb = onYes;
  openModal(`<p style="font-family:var(--ui);font-size:.95rem;margin:.2rem 0 1.1rem;line-height:1.5">${esc(message)}</p>
    <div class="form-actions" style="margin-top:0">
      <button class="btn danger" data-modal-yes="1">Confirmer</button>
      <button class="btn ghost" data-modal-close="1">Annuler</button>
    </div>`);
}
function promptModal(message, defVal, onOk){
  _modalCb = onOk;
  openModal(`<p style="font-family:var(--ui);font-size:.95rem;margin:.2rem 0 .6rem;line-height:1.5">${esc(message)}</p>
    <input type="text" id="modal-prompt-input" value="${esc(defVal||"")}" autocomplete="off">
    <div class="form-actions">
      <button class="btn" data-modal-ok="1">Valider</button>
      <button class="btn ghost" data-modal-close="1">Annuler</button>
    </div>`);
  setTimeout(()=>{ const i=$("#modal-prompt-input"); if(i){ i.focus(); i.select();
    i.addEventListener("keydown", ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); const cb=_modalCb; const v=i.value; closeModal(); if(cb) cb(v); } });
  } }, 30);
}

/* ---- Export PDF d'un point crawl (schéma numéroté + événements numérotés) ---- */
function stripLinks(text){ return String(text||"").replace(/\[\[([^\]]+)\]\]/g, "$1"); }
/* Rendu texte pour le PDF : échappe le HTML puis met en valeur les renvois [[Nom]] (gras + souligné) */
function renderTextPrint(text){
  return esc(String(text||"")).replace(/\[\[([^\]]+)\]\]/g, (m, nm)=>`<span class="pp-link">${nm.trim()}</span>`);
}
function printSection(label, text){
  const lines = String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return "";   // on masque les sections vides pour un rendu épuré
  return `<div class="pp-sec"><h4>${label}</h4><ul>${lines.map(l=>`<li>${renderTextPrint(l)}</li>`).join("")}</ul></div>`;
}

/* ---- Annexes du PDF de point crawl : résout les [[liens]] cités dans les événements
   du plan vers leurs créatures / trésors / tables, et imprime leur fiche complète. ---- */
function printCreatureBlock(c){
  const stats = [["FOR",c.str],["DEX",c.dex],["CON",c.con],["INT",c.int],["SAG",c.wis],["CHA",c.cha]]
    .filter(([,v])=>v).map(([l,v])=>`${l} ${esc(v)}`).join(" · ");
  const attacks = (c.attacks||[]).filter(a=>a.name||a.damage)
    .map(a=>`${esc(a.name||"Attaque")}${a.bonus?" "+esc(a.bonus):""} (${esc(a.damage||"?")}${a.range?", "+esc(rangeLabel(a.range)):""})`).join(" ; ");
  return `<div class="pp-event">
    <h3><span>${esc(c.name||"Sans nom")}</span>${c.category?`<span class="pp-theme">${esc(c.category)}</span>`:""}</h3>
    <div class="pp-sec"><ul><li>CA ${esc(c.ac||"?")} · PV ${esc(c.hp||"?")} · Niv. ${esc(c.level||"?")}${c.alignment?" · "+esc(cap(c.alignment)):""}${stats?" · "+stats:""}</li></ul></div>
    ${attacks?`<div class="pp-sec"><h4>Attaques</h4><ul><li>${attacks}</li></ul></div>`:""}
    ${printSection("Capacités & immunités", c.abilities)}
    ${c.desc?`<div class="pp-sec"><ul><li>${renderTextPrint(c.desc)}</li></ul></div>`:""}
  </div>`;
}
function printTreasureBlock(t){
  return `<div class="pp-event">
    <h3><span>${esc(t.name||"Sans nom")}</span><span class="pp-theme">${esc(treasureCatLabel(t.category))}</span></h3>
    ${printSection("Description", t.description)}
    ${printSection("Bonus", t.bonus)}
    ${printSection("Atout", t.boon)}
    ${printSection("Malédiction", t.curse)}
    ${printSection("Personnalité", t.personality)}
  </div>`;
}
function printTableBlock(t){
  // Pour une table dynamique, imprime un instantané de son contenu actuel (elle n'a pas de rows stockées).
  const rowsArr = t.kind==="dynamic" ? dynamicSourceItems(t).map(x=>x.name||x.title||"Sans nom") : (t.rows||[]);
  const rows = rowsArr.map((r,i)=>`<li>${i+1}. ${renderTextPrint(r)}</li>`).join("");
  return `<div class="pp-event">
    <h3><span>${esc(t.title||"Sans titre")}</span></h3>
    ${t.context?`<div class="pp-sec"><h4>Contexte</h4><ul><li>${renderTextPrint(t.context)}</li></ul></div>`:""}
    ${rows?`<div class="pp-sec"><h4>Résultats (d${rowsArr.length})</h4><ul>${rows}</ul></div>`:""}
  </div>`;
}
function buildPrintAppendix(nodes){
  const names = new Set();
  nodes.forEach(n=>{
    const ev = getEntity("event", n.eventId); if(!ev) return;
    [ev.description, ev.traps, ev.secrets].forEach(t=> extractLinks(t).forEach(nm=>names.add(nm)));
  });
  const creatures=[], treasures=[], tables=[], seen=new Set();
  names.forEach(nm=>{
    const hit = findByName(nm); if(!hit || seen.has(hit.type+":"+hit.id)) return;
    seen.add(hit.type+":"+hit.id);
    if(hit.type==="creature") creatures.push(getEntity("creature",hit.id));
    else if(hit.type==="treasure") treasures.push(getEntity("treasure",hit.id));
    else if(hit.type==="table") tables.push(getEntity("table",hit.id));
  });
  creatures.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  treasures.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  tables.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
  let html = "";
  if(creatures.length) html += `<section class="pp-events pp-appendix"><h2>Annexe — Créatures rencontrées (${creatures.length})</h2>${creatures.map(printCreatureBlock).join("")}</section>`;
  if(treasures.length) html += `<section class="pp-events pp-appendix"><h2>Annexe — Trésors & reliques (${treasures.length})</h2>${treasures.map(printTreasureBlock).join("")}</section>`;
  if(tables.length) html += `<section class="pp-events pp-appendix"><h2>Annexe — Tables aléatoires (${tables.length})</h2>${tables.map(printTableBlock).join("")}</section>`;
  return html;
}
function crawlDiagramSVG(c){
  const NW = 152, NH = 44, pad = 28, nodes = c.nodes||[];
  if(!nodes.length) return "";
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  nodes.forEach(n=>{ const x=n.x||0, y=n.y||0; minX=Math.min(minX,x); minY=Math.min(minY,y); maxX=Math.max(maxX,x+NW); maxY=Math.max(maxY,y+NH); });
  const ox=minX-pad, oy=minY-pad, w=(maxX-minX)+pad*2, h=(maxY-minY)+pad*2;
  const byId = id=>nodes.find(n=>n.id===id);
  const cx = n=>(n.x||0)+NW/2, cy = n=>(n.y||0)+NH/2;
  const edges = (c.edges||[]).map(e=>{
    const a=byId(e.from), b=byId(e.to); if(!a||!b) return "";
    const mx=(cx(a)+cx(b))/2, my=(cy(a)+cy(b))/2;
    return `<line x1="${cx(a)}" y1="${cy(a)}" x2="${cx(b)}" y2="${cy(b)}"/>${e.label?`<text class="elbl" x="${mx}" y="${my-4}" text-anchor="middle">${esc(e.label)}</text>`:""}`;
  }).join("");
  const boxes = nodes.map((n,i)=>{
    const ev=getEntity("event",n.eventId), title=ev?ev.title:"(événement supprimé)", x=n.x||0, y=n.y||0;
    return `<g class="pnode">
      <rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="7"/>
      <circle class="numc" cx="${x+16}" cy="${y+16}" r="11"/>
      <text class="numt" x="${x+16}" y="${y+20.5}" text-anchor="middle">${i+1}</text>
      <text class="ptitle" x="${x+32}" y="${y+29}">${esc(truncate(title,17))}</text>
    </g>`;
  }).join("");
  return `<svg viewBox="${ox} ${oy} ${w} ${h}" class="pp-svg" xmlns="http://www.w3.org/2000/svg">${edges}${boxes}</svg>`;
}
function printCrawl(id){
  const c = getEntity("pointcrawl", id); if(!c) return;
  const nodes = c.nodes||[];
  if(!nodes.length){ toast("Ajoutez au moins un point avant d'imprimer."); return; }
  const events = nodes.map((n,i)=>{
    const ev=getEntity("event",n.eventId);
    if(!ev) return `<div class="pp-event"><h3><span class="pp-num">${i+1}</span> <span>(événement supprimé)</span></h3></div>`;
    return `<div class="pp-event">
      <h3><span class="pp-num">${i+1}</span> <span>${esc(ev.title)}</span>${ev.theme?`<span class="pp-theme">${esc(ev.theme)}</span>`:""}</h3>
      ${printSection("Description & ambiance", ev.description)}
      ${printSection("Pièges — conditions & conséquences", ev.traps)}
      ${printSection("Secrets à découvrir", ev.secrets)}
    </div>`;
  }).join("");
  $("#print-area").innerHTML = `
    <section class="pp-map">
      <h1>${esc(c.title||"Point Crawl")}</h1>
      ${c.description?`<p class="pp-desc">${renderTextPrint(c.description)}</p>`:""}
      ${crawlDiagramSVG(c)}
    </section>
    <section class="pp-events"><h2>Événements du plan (${nodes.length})</h2>${events}</section>
    ${buildPrintAppendix(nodes)}`;
  document.fonts.load('30pt "JSL Blackletter"').catch(()=>{}).then(()=> window.print());
}

/* ---- Impression de fiches PJ (une par page A4, inspirée de la fiche perso vierge) ---- */
function pcInfoExtract(info, label){
  const m = String(info||"").match(new RegExp("^\\s*"+label+"\\s*:\\s*(.*)$","im"));
  return m ? m[1].trim() : "";
}
function pcInfoRest(info){
  const skipRe = /^\s*(Titre|Langues|Divinité|Trait d'ascendance.*|Armes autorisées|Armures autorisées|Capacités de classe|Jet de talent.*|PJ généré automatiquement.*)\s*:?/i;
  return String(info||"").split(/\r?\n/).filter(l=>!skipRe.test(l)).join("\n").trim();
}
function printInventoryList(p){
  const filled = String(p.inventory||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const slots = Math.max(parseInt(p.invSlots)||0, 10, filled.length);
  const items = []; for(let i=0;i<slots;i++) items.push(filled[i] ? esc(filled[i]) : "");
  return `<div class="pp-sec pp-pc-inv"><h4>Inventaire${p.invSlots?` — ${esc(p.invSlots)} emplacements (10 ou Force, la plus haute valeur)`:""}</h4>
    <div class="pp-pc-currency">PO ______&nbsp;&nbsp;&nbsp; PA ______&nbsp;&nbsp;&nbsp; PC ______</div>
    <ol class="pp-inv-list">${items.map(t=>`<li>${t}</li>`).join("")}</ol></div>`;
}
function printPCSheet(p){
  const ab = [["FOR","str"],["DEX","dex"],["CON","con"],["INT","int"],["SAG","wis"],["CHA","cha"]];
  const titre = pcInfoExtract(p.info,"Titre");
  const langues = pcInfoExtract(p.info,"Langues");
  const divinite = pcInfoExtract(p.info,"Divinité");
  const notes = pcInfoRest(p.info);
  const talentsRows = (p.talents||[]).filter(t=>t.roll||t.text);
  const sub = [p.ancestry,p.cls,p.level?`Niveau ${p.level}`:"",titre,p.alignment?cap(p.alignment):""].filter(Boolean).join(" · ");
  const talentsText = talentsRows.length ? `<table class="pp-tal"><tbody>${talentsRows.map(t=>`<tr><td>${esc(t.roll)}</td><td>${renderTextPrint(t.text)}</td></tr>`).join("")}</tbody></table>` : "";
  return `<section class="pp-pcsheet">
    <h1>${esc(p.name||"Sans nom")}</h1>
    <p class="pp-desc">${esc(sub||"—")}${langues?` · Langues : ${esc(langues)}`:""}${divinite?` · Divinité : ${esc(divinite)}`:""}</p>
    <div class="pp-pcstats">
      <div class="pp-pcbox"><label>PV</label><div class="v">${esc(p.hpCurrent||"—")}/${esc(p.hp||"—")}</div></div>
      <div class="pp-pcbox"><label>CA</label><div class="v">${esc(p.ac||"—")}</div></div>
      ${ab.map(([lbl,k])=>`<div class="pp-pcbox"><label>${lbl}</label><div class="v">${esc(p[k]||"—")}</div></div>`).join("")}
    </div>
    ${printSection("Compétences", p.skills)}
    ${p.spells&&p.spells.trim() ? printSection("Sortilèges", p.spells) : ""}
    ${talentsText ? `<div class="pp-sec"><h4>Talents — 2d6</h4>${talentsText}</div>` : ""}
    ${printInventoryList(p)}
    ${notes ? printSection("Notes", notes) : ""}
  </section>`;
}

const ABILITY_MOD = (score)=>{
  const n = parseInt(score)||10;
  if(n<=3) return -4; if(n<=5) return -3; if(n<=7) return -2; if(n<=9) return -1;
  if(n<=11) return 0; if(n<=13) return 1; if(n<=15) return 2; if(n<=17) return 3; return 4;
};

function titleFor(cls, alignment, level){
  const t = TITRES[cls]; if(!t) return "";
  const arr = t[alignment]||t.neutre;
  const lvl = parseInt(level)||1;
  const idx = lvl>=9?4: lvl>=7?3: lvl>=5?2: lvl>=3?1: 0;
  return arr[idx]||"";
}

function seedCharGenTables(){
  const ensure = (title, context, rows)=>{
    if(db.tables.some(t=>(t.title||"").trim()===title)) return;
    db.tables.push({id:uid(), title, context, rows});
  };
  ensure("Origines", "Votre passé et vos expériences antérieures (d20) — création de personnage, Quickstart p.14.", ORIGINES_ROWS);
  ensure("Ascendances", "L'héritage ancestral et culturel de votre personnage (d6) — création de personnage, Quickstart p.16-17.", ASCENDANCE_ROWS);
  ensure("Langues courantes", "Langue supplémentaire connue en plus de la langue commune (d9) — Quickstart p.29.", LANGUES_COURANTES);
  ensure("Langues rares", "Langues rares, réservées à certaines classes/origines (d4) — Quickstart p.29.", LANGUES_RARES);
  ensure("Divinités", "Dieux que peut servir un PJ, notamment les prêtres (d7) — Quickstart p.30-31.", DIVINITES_ROWS);
  ensure("Noms de personnages", "Banque de noms pour un tirage rapide (maison, non issue du livre).", NOMS_ROWS);
}
function rollDice(n,sides){ let t=0; for(let i=0;i<n;i++) t+=1+Math.floor(Math.random()*sides); return t; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pickN(arr,n){ const a=arr.slice(); const out=[]; while(out.length<n && a.length){ out.push(a.splice(Math.floor(Math.random()*a.length),1)[0]); } return out; }
function rollOnAppTable(title){
  const t = db.tables.find(x=>(x.title||"").trim()===title);
  if(!t || !(t.rows&&t.rows.length)) return "";
  return pick(t.rows);
}
function generateRandomPC(){
  seedCharGenTables();
  const cls = pick(Object.keys(CLASSES_DATA));
  const cd = CLASSES_DATA[cls];
  const alignment = pick(["loyal","neutre","chaos"]);
  const ancestryName = pick(Object.keys(ASCENDANCES));
  const asc = ASCENDANCES[ancestryName];

  const rollSet = ()=> ["str","dex","con","int","wis","cha"].reduce((o,k)=>{ o[k]=rollDice(3,6); return o; },{});
  let scores = rollSet();
  if(!Object.values(scores).some(v=>v>=14)) scores = rollSet(); // règle p.15 : relance si aucune caractéristique ≥ 14
  const mods = {}; Object.keys(scores).forEach(k=> mods[k]=ABILITY_MOD(scores[k]));

  let hp;
  if(asc.robust){
    hp = Math.max(1, Math.max(rollDice(1,cd.hitDie), rollDice(1,cd.hitDie)) + mods.con) + 2;
  } else {
    hp = Math.max(1, rollDice(1,cd.hitDie) + mods.con);
  }

  const level = "1";
  const title = titleFor(cls, alignment, level);

  const rollTalent = ()=>{
    const total = rollDice(2,6);
    const row = cd.talents.find(t=>rangeContains(t.roll,total));
    return { total, text: row?row.text:"" };
  };
  const talentRolls = [rollTalent()];
  if(ancestryName==="Humain") talentRolls.push(rollTalent()); // Ambitieux : jet de talent supplémentaire

  let languages = asc.languages.slice();
  if(asc.extraLanguage) languages.push(pick(LANGUES_COURANTES));
  if(cd.extraCommonLanguages) languages.push(...pickN(LANGUES_COURANTES, cd.extraCommonLanguages));
  if(cd.extraRareLanguages) languages.push(...pickN(LANGUES_RARES, cd.extraRareLanguages));
  languages = [...new Set(languages)];

  const origine = rollOnAppTable("Origines") || pick(ORIGINES_ROWS);
  const nom = rollOnAppTable("Noms de personnages") || pick(NOMS_ROWS);

  let deity = "";
  if(cls==="Prêtre"){
    const candidates = DIVINITES.filter(d=>d.align===alignment);
    deity = (candidates.length ? pick(candidates) : pick(DIVINITES)).name;
  }

  let traitText = asc.trait;
  if(ancestryName==="Elfe"){
    traitText = cd.spellClass
      ? "Yeux perçants — bonus de +1 aux tests d'incantation."
      : "Yeux perçants — bonus de +1 aux jets d'attaque avec des armes à distance.";
  }

  let spellLines = [];
  if(cd.spellClass){
    const pool = db.spells.filter(s=>s.class===cd.spellClass && String(s.tier)==="1");
    const chosen = pickN(pool, cd.spellsKnownLvl1);
    spellLines = chosen.map(s=>`[[${s.name}]]`);
    if(cls==="Prêtre") spellLines.unshift("[[Renvoi des morts-vivants]] (bonus, ne compte pas dans les sorts connus)");
    if(!pool.length) spellLines.push(`(Importe d'abord les sorts de ${cls==="Prêtre"?"prêtre":"magicien"} dans l'onglet Sorts pour un tirage automatique.)`);
  }

  const gold = rollDice(2,6)*5;
  const ac = 10 + mods.dex;
  const sgn = m => (m>=0?"+":"")+m;
  // Équipement p.13 : emplacements = le plus élevé entre 10 et la caractéristique de Force ;
  // + bonus de Constitution (s'il est positif) pour un Guerrier (talent Bête de somme).
  const invSlots = Math.max(10, scores.str) + (cls==="Guerrier" && mods.con>0 ? mods.con : 0);

  const o = {
    id: uid(), name: nom, ancestry: ancestryName, cls: cls, level: level, alignment: alignment,
    ac: String(ac), hp: String(hp), hpCurrent: String(hp),
    str: `${scores.str} (${sgn(mods.str)})`, dex: `${scores.dex} (${sgn(mods.dex)})`, con: `${scores.con} (${sgn(mods.con)})`,
    int: `${scores.int} (${sgn(mods.int)})`, wis: `${scores.wis} (${sgn(mods.wis)})`, cha: `${scores.cha} (${sgn(mods.cha)})`,
    skills: [origine, cls==="Voleur" ? "Formé (avantage) : Grimper ; Se mouvoir en silence et se cacher ; Adopter des déguisements ; Repérer/désamorcer des pièges ; Tâches délicates (crochetage, pickpocket)." : ""].filter(Boolean).join("\n"),
    spells: spellLines.join("\n"),
    invSlots: String(invSlots),
    inventory: `${gold} po pour acheter votre équipement de départ (armes/armure autorisées par la classe — l'appli ne connaît pas encore les prix, à compléter manuellement).`,
    info: [
      `Titre : ${title}`,
      `Langues : ${languages.join(", ")}`,
      deity ? `Divinité : ${deity}` : "",
      `Trait d'ascendance (${ancestryName}) : ${traitText}`,
      `Armes autorisées : ${cd.weapons}`,
      `Armures autorisées : ${cd.armor}`,
      `Capacités de classe : ${cd.feature}`,
      ...talentRolls.map((r,i)=>`Jet de talent ${talentRolls.length>1?(i+1)+" ":""}(2d6=${r.total}) : ${r.text||"—"}`),
      `PJ généré automatiquement (règles de création, Quickstart p.12-31).`
    ].filter(Boolean).join("\n"),
    talents: cd.talents.map(t=>({roll:t.roll, text:t.text})),
    images: [],
    portrait: pickRandomPortrait(ancestryName)
  };

  db.pcs.push(o);
  saveDB();
  toast(`${nom} (${ancestryName} ${cls}) généré !`);
  view = {tab:"pcs", mode:"detail", id:o.id};
  render();
}

function listPCs(){
  const items = db.pcs;
  const genBtn = myRole==="gm" ? `<button class="btn ghost sm" data-gen-pc="1">🎲 Générer un PJ aléatoire</button>
    <button class="btn ghost sm" data-print-pcs="1">🖨 Imprimer des fiches</button>` : "";
  app.innerHTML = pageHead("Personnages-joueurs (PJ)", `${items.length} PJ`, "Nouveau PJ", genBtn) +
    (items.length ? `<div class="grid">${items.map(p=>`
      <div class="card" data-open="pc:${p.id}">
        ${p.portrait?`<img class="thumb portrait-gray" src="portraits/${esc(p.portrait)}" alt="">`:(p.images&&p.images.length)?`<img class="thumb" src="${p.images[0].data}" alt="">`:""}
        <h3>${esc(p.name||"Sans nom")}</h3>
        <p>${esc([p.ancestry,p.cls].filter(Boolean).join(" · ")||"—")}</p>
        <div class="meta"><span class="tag gold">Niv. ${esc(p.level||'?')}</span><span class="tag">CA ${esc(p.ac||'?')}</span><span class="tag">PV ${esc(p.hpCurrent||'?')}/${esc(p.hp||'?')}</span></div>
      </div>`).join("")}</div>`
    : emptyState("🛡","Aucun personnage-joueur. Créez la fiche de vos aventuriers."));
}

function rollTalents(id){
  const p = getEntity("pc",id); if(!p) return;
  const total = (1+Math.floor(Math.random()*6)) + (1+Math.floor(Math.random()*6));
  let matched = null;
  document.querySelectorAll("#talents-body tr").forEach(tr=>{
    const inRange = rangeContains(tr.dataset.rollRange, total);
    tr.classList.toggle("rolled", inRange);
    if(inRange) matched = tr;
  });
  const out = $("#talent-roll-out");
  out.textContent = `→ 2d6 = ${total} : ${matched ? matched.children[1].textContent.trim() : "aucune ligne correspondante"}`;
  if(matched) matched.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function rangeContains(range, n){
  range = String(range||"").trim(); if(!range) return false;
  let m;
  if((m = range.match(/^(\d+)\s*[-–]\s*(\d+)$/))){ const a=+m[1], b=+m[2]; return n>=Math.min(a,b) && n<=Math.max(a,b); }
  if((m = range.match(/^(\d+)\s*\+$/))) return n >= +m[1];
  if(/^\d+$/.test(range)) return n === +range;
  return false;
}

   sort — donc affichée comme rappel calculé (DD = 10 + rang×2), pas suivie

const SPELL_CLASSES = [["priest","Prêtre"],["wizard","Magicien"],["seer","Augure"],["witch","Sorcier"]];

function spellCastDC(tier){ return 10 + (parseInt(tier)||1)*2; }
function sortSpellList(list){ return [...list].sort((a,b)=>(parseInt(a.tier)||0)-(parseInt(b.tier)||0) || (a.name||"").localeCompare(b.name||"")); }
function spellCard(s){

/* Coordonnées "offset" (colonne q, ligne r) — grille rectangulaire, lignes impaires décalées d'un demi-hexagone */
function hexCenter(q,r,size){ return { x: size*Math.sqrt(3)*(q+0.5*(r&1)), y: size*1.5*r }; }
function hexCorners(cx,cy,size){
  const pts=[];
  for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i-30); pts.push((cx+size*Math.cos(a)).toFixed(1)+","+(cy+size*Math.sin(a)).toFixed(1)); }
  return pts.join(" ");
}

function buildHexPoints(m, isGM){
  const size = (m.settings&&m.settings.hexSize)||30;
  const pts = m.points||[];
  const byQR = {}; (m.hexes||[]).forEach(h=>{ byQR[h.q+","+h.r]=h; });
  return pts.filter(p=>{
    if(!p.hex) return false;
    if(p.dmOnly && !isGM) return false;
    if(!isGM){ const h=byQR[p.hex.q+","+p.hex.r]; if(!h || h.fogState==="hidden") return false; }
    return true;
  }).map(p=>{
    const c = hexCenter(p.hex.q, p.hex.r, size);
    const r = Math.max(14, size*0.38);
    const hiddenFromPlayers = isGM && p.dmOnly;
    const iconEl = p.icon
      ? `<use href="#${esc(p.icon)}" x="${(c.x-r).toFixed(1)}" y="${(c.y-r).toFixed(1)}" width="${(r*2).toFixed(1)}" height="${(r*2).toFixed(1)}" class="hexpoint-icon-svg"></use>`
      : `<text x="${c.x.toFixed(1)}" y="${(c.y+r*0.35).toFixed(1)}" text-anchor="middle" class="hexpoint-icon" style="font-size:${(r*1.7).toFixed(1)}px">!</text>`;
    return `<g class="hexpoint${hiddenFromPlayers?' hexpoint-dmonly':''}" data-point-id="${esc(p.id)}"><title>${esc(p.name||"")}${hiddenFromPlayers?" (MJ uniquement)":""}</title>
      ${iconEl}
      ${hiddenFromPlayers?`<circle cx="${c.x}" cy="${c.y}" r="${(r*1.15).toFixed(1)}" class="hexpoint-ring"></circle>`:""}
    </g>`;
  }).join("");
}
/* Fond biome (5 tuiles pleines) + overlay foundation_*.png (contour dessiné, transparent autour) empilés sur
   la boîte englobante de l'hexagone. Les deux images sont en orientation "flat-top" (plus larges que hautes)
   alors que la grille de l'app est "pointy-top" (sommet en haut/bas) : la rotation de 90° corrige ça sans
   toucher aux maths de la grille. */
function hexBiomeImageSVG(href, c, size){
  const boxW = size*Math.sqrt(3), boxH = size*2;
  const x = (c.x - boxH/2).toFixed(1), y = (c.y - boxW/2).toFixed(1);
  const w = boxH.toFixed(1), h = boxW.toFixed(1);
  const rot = `rotate(90 ${c.x.toFixed(1)} ${c.y.toFixed(1)})`;
  return { x, y, w, h, rot,
    tag:(cls)=>`<image href="${esc(href)}" x="${x}" y="${y}" width="${w}" height="${h}" transform="${rot}" class="${cls}"></image>` };
}
function hexTerrainLayerSVG(h, c, size){
  const pts = hexCorners(c.x, c.y, size-1);
  if(!h.biome && !h.overlay){
    const info = terrainInfo(h.hexType);
    return `<polygon points="${pts}" fill="${info.color}"></polygon><text x="${c.x.toFixed(1)}" y="${(c.y+5).toFixed(1)}" text-anchor="middle" class="hex-icon">${info.icon}</text>`;
  }
  let out = `<polygon points="${pts}" fill="${HEX_NEUTRAL_FILL}"></polygon>`;
  if(h.biome) out += hexBiomeImageSVG(h.biome+".png", c, size).tag("hex-biome-img");
  if(h.overlay) out += hexBiomeImageSVG(h.overlay, c, size).tag("hex-overlay-img");
  return out;
}
function buildHexSVG(m){
  const size = (m.settings&&m.settings.hexSize)||30;
  const hexes = (m.hexes||[]);
  const isGM = myRole==="gm";
  const centers = hexes.map(h=>({h, c:hexCenter(h.q,h.r,size)}));
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  centers.forEach(({c})=>{ minX=Math.min(minX,c.x-size); maxX=Math.max(maxX,c.x+size); minY=Math.min(minY,c.y-size); maxY=Math.max(maxY,c.y+size); });
  const pad=12, vbx=(minX-pad).toFixed(1), vby=(minY-pad).toFixed(1), vbw=((maxX-minX)+pad*2).toFixed(1), vbh=((maxY-minY)+pad*2).toFixed(1);
  const cells = centers.map(({h,c})=>{
    const pts = hexCorners(c.x,c.y,size-1);
    const revealed = h.fogState!=="hidden";
    const showTerrain = isGM || revealed;
    const terrainLayer = showTerrain ? hexTerrainLayerSVG(h,c,size) : `<polygon points="${pts}" fill="#15130f"></polygon>`;
    return `<g class="hexcell${isGM?' hex-editable':''}" data-hexq="${h.q}" data-hexr="${h.r}">
      ${terrainLayer}
      ${!revealed?`<polygon points="${pts}" class="${isGM?'hex-fog-gm':'hex-fog'}"></polygon>`:""}
    </g>`;
  }).join("");
  return `<svg viewBox="${vbx} ${vby} ${vbw} ${vbh}" id="hex-svg" xmlns="http://www.w3.org/2000/svg">${cells}<g id="hex-points-layer"${hexPointsVisible?"":' style="display:none"'}>${buildHexPoints(m,isGM)}</g></svg>`;
}

/* =========================================================================
   RECHERCHE GLOBALE
   ========================================================================= */
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  const dp = [];
  for(let i=0;i<=m;i++) dp.push(new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  }
  return dp[m][n];
}
function fuzzyFind(hay, q){
  if(q.length<3) return null;
  const words = hay.split(/\W+/).filter(Boolean);
  const threshold = q.length<=4?1:(q.length<=8?2:3);
  let best=null;
  for(const w of words){
    if(Math.abs(w.length-q.length) > threshold) continue;
    const d = levenshtein(w,q);
    if(d>0 && d<=threshold && (!best || d<best.d)) best = {d, word:w};
  }
  if(!best) return null;
  return {index: hay.indexOf(best.word)};
}
function runSearch(q){
  const box = $("#search-results");
  q = q.trim().toLowerCase();
  if(!q){ box.classList.remove("open"); box.innerHTML=""; return; }
  const results = [];
  const push = (type, o)=>{
    const hay = entityText(type,o).toLowerCase();
    let idx = hay.indexOf(q), fuzzy = false;
    if(idx<0 && !q.includes(" ")){
      const f = fuzzyFind(hay,q);
      if(f){ idx = f.index; fuzzy = true; }
    }
    if(idx>=0) results.push({type,id:o.id,title:entityTitle(type,o),snippet:snippet(entityText(type,o),q),fuzzy});
  };
  db.creatures.forEach(o=>push("creature",o));
  db.events.forEach(o=>push("event",o));
  db.tables.forEach(o=>push("table",o));
  db.sessions.forEach(o=>push("session",o));
  db.npcs.forEach(o=>push("npc",o));
  db.pointcrawls.forEach(o=>push("pointcrawl",o));
  db.pcs.forEach(o=>push("pc",o));
  db.treasures.forEach(o=>push("treasure",o));
  db.spells.forEach(o=>push("spell",o));
  results.sort((a,b)=>(a.fuzzy===b.fuzzy)?0:(a.fuzzy?1:-1));
  if(!results.length){ box.innerHTML = `<div class="sr-empty">Aucun résultat pour « ${esc(q)} »</div>`; box.classList.add("open"); return; }
  box.innerHTML = results.slice(0,25).map(r=>`
    <div class="sr-item" data-goto="${r.type}:${r.id}">
      <span class="tag ${r.type}">${TYPE_LABEL[r.type]}</span>
      <b style="margin-left:.4rem">${esc(r.title||"—")}</b>${r.fuzzy?' <span class="faint" style="font-size:.72rem">(≈ approximatif)</span>':''}
      <div class="faint" style="font-size:.78rem;margin-top:.15rem">${esc(r.snippet)}</div>
    </div>`).join("");
  box.classList.add("open");
}
function snippet(text,q){
  const t = String(text||"").replace(/\s+/g," ");
  const i = t.toLowerCase().indexOf(q);
  if(i<0) return t.slice(0,80);
  const start = Math.max(0,i-30);
  return (start>0?"…":"") + t.slice(start, i+q.length+40) + "…";
}

let _xmlPending = null;
function importXML(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const doc = new DOMParser().parseFromString(r.result, "application/xml");
      if(doc.querySelector("parsererror")) throw new Error("XML mal formé");

      if(!nodes.length) throw new Error("Aucune balise <creature> trouvée");
      _xmlPending = nodes.map(parseCreatureNode).filter(c=>c.name);
      const existing = new Set(db.creatures.map(c=>(c.name||"").toLowerCase()));
      const dupes = _xmlPending.filter(c=>existing.has((c.name||"").toLowerCase())).length;

          ${dupes>0 ? `<b style="color:var(--gold2)">${dupes}</b> portent un nom déjà présent (doublons potentiels).<br>` : `Aucun doublon détecté.<br>`}
          <b style="color:var(--green)">Ignorer les doublons</b> : n'ajoute que les nouvelles.<br>

function applyXMLImport(mode){
  if(!_xmlPending) return;
  let added=0, replaced=0, skipped=0;
  const byName = {}; db.creatures.forEach(c=>{ byName[(c.name||"").toLowerCase()] = c; });
  _xmlPending.forEach(c=>{
    const key = (c.name||"").toLowerCase();
    const exist = byName[key];
    if(exist && mode!=="all"){
      if(mode==="replace"){
        const id=exist.id, imgs=exist.images;
        Object.keys(exist).forEach(k=>delete exist[k]);
        Object.assign(exist, c); exist.id=id; exist.imported=true;
        if((!c.images||!c.images.length) && imgs && imgs.length) exist.images=imgs;
        replaced++;
      } else skipped++;                       // mode "skip"
    } else {
      c.id=uid(); c.imported=true; db.creatures.push(c); byName[key]=c; added++;
    }
  });
  _xmlPending=null; saveDB(); view={tab:"creatures",mode:"list",id:null}; render();
  toast(`Import : ${added} ajoutée(s), ${replaced} remplacée(s), ${skipped} ignorée(s).`);

function parseCreatureNode(node){
  const get = (sel)=>{ const el = node.querySelector(sel); return el ? el.textContent.trim() : ""; };
  const attrOr = (sel, attr, fallbackSel)=>{
    const el = node.querySelector(sel);
    if(el && el.getAttribute(attr)!=null) return el.getAttribute(attr).trim();
    return fallbackSel!=null ? get(fallbackSel) : "";
  };
  const c = {
    name: get("name") || node.getAttribute("name") || "",
    category: get("category") || get("categorie") || "",
    desc: get("description") || get("desc") || "",
    ac: get("ac") || get("armorclass") || attrOr("stats","ac"),
    hp: get("hp") || get("hitpoints") || attrOr("stats","hp"),
    level: get("level") || attrOr("stats","level"),
    alignment: (get("alignment")||"chaos").toLowerCase(),
    abilities: get("abilities") || get("special") || get("immunities") || "",
    attacks: []
  };
  // Caractéristiques : soit <stats str=".."/>, soit balises individuelles <str>..</str>
  const statsEl = node.querySelector("stats") || node.querySelector("abilities-scores");
  const keys = {str:["str","strength"],dex:["dex","dexterity"],con:["con","constitution"],int:["int","intelligence"],wis:["wis","sag","wisdom","sagesse"],cha:["cha","charisma","charisme"]};
  Object.entries(keys).forEach(([k,aliases])=>{
    let v="";
    if(statsEl){ for(const a of aliases){ if(statsEl.getAttribute(a)!=null){ v=statsEl.getAttribute(a); break; } } }
    if(!v){ for(const a of aliases){ const el=node.querySelector(a); if(el){ v=el.textContent.trim(); break; } } }
    c[k]=v;
  });
  // normaliser alignement
  if(/cha|chaos/.test(c.alignment)) c.alignment="chaos";
  else if(/loy|law/.test(c.alignment)) c.alignment="loyal";
  else if(/neut/.test(c.alignment)) c.alignment="neutre";
  // Attaques
  node.querySelectorAll("attack").forEach(a=>{
    const nm = a.getAttribute("name") || (a.querySelector("name")?.textContent) || a.textContent.trim();
    c.attacks.push({
      name: (nm||"").trim(),
      bonus: a.getAttribute("bonus") || a.querySelector("bonus")?.textContent?.trim() || "",
      damage: a.getAttribute("damage") || a.querySelector("damage")?.textContent?.trim() || "",
      range: normRange(a.getAttribute("range") || a.querySelector("range")?.textContent?.trim() || "close")
    });
  });
  return c;
}
function normRange(r){
  r=(r||"").toLowerCase();
  if(/far|long|lointain/.test(r)) return "far";
  if(/near|inter|proche|moyen/.test(r)) return "near";
  return "close";
}

function parseGenericNode(node, cfg){
  const get = sel => {

    const a = node.getAttribute(sel);
    return a!=null ? a.trim() : "";
  };
