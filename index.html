<body>

<style>
  :root{
    --bg:#080809; --bg2:#0f0f10; --panel:#161516; --panel2:#1d1c1e;
    --border:#2c2a2c; --border2:#403d40;
    --text:#e4e1da; --muted:#9c9698; --faint:#655f62;
    --gold:#c1913f; --gold2:#e0b968; --blood:#7c2a35; --blood2:#a8474f;
    --violet:#7a6690; --violet2:#a08fb5;
    --link:#9c9fdb; --link-bad:#b6636b; --green:#6fae6a;
    --radius:10px; --shadow:0 8px 28px rgba(0,0,0,.55);
    --font: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --display: "IM Fell English SC", var(--font);
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --blackletter: "JSL Blackletter", var(--font);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    position:relative;
    background:
      radial-gradient(1000px 550px at 50% -8%, #201530 0%, transparent 58%),
      radial-gradient(900px 500px at 92% 6%, #180f22 0%, transparent 55%),
      radial-gradient(1100px 700px at -8% 100%, #0d0a14 0%, transparent 60%),
      radial-gradient(1500px 950px at 50% 45%, transparent 45%, rgba(0,0,0,.65) 100%),
      linear-gradient(160deg, #140c1f 0%, #0a0710 55%, #060508 100%);
    color:var(--text); font-family:var(--font); line-height:1.5;
    min-height:100vh;
  }
  #starfield{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
  #starfield .star{position:absolute; border-radius:50%; background:#fff; animation-name:star-twinkle; animation-timing-function:ease-in-out; animation-iteration-count:infinite}
  @keyframes star-twinkle{ 0%,100%{opacity:var(--lo)} 50%{opacity:var(--hi)} }
  a{color:var(--link); text-decoration:none}
  a:hover{color:var(--violet2); text-decoration:underline}
  button{font-family:var(--ui); cursor:pointer}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg, #0c0c0d 0%, #0c0c0df5 100%);
    border-bottom:1px solid var(--border);
    box-shadow:0 1px 0 rgba(193,145,63,.18);
    backdrop-filter:blur(6px);
  }
  .bar{
    max-width:1100px; margin:0 auto; padding:.7rem 1rem;
    display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:.6rem; font-weight:400; letter-spacing:.5px; font-family:var(--display)}
  .brand>span:not(.rune){font-size:1.35rem; text-transform:uppercase; letter-spacing:1px}
  .brand .rune{
    font-size:1.4rem; color:var(--gold2);
    filter:drop-shadow(0 0 9px rgba(193,145,63,.5));
  }
  .brand small{display:block; font-size:.62rem; color:var(--faint); font-family:var(--ui); letter-spacing:2.5px; text-transform:uppercase; font-weight:600}
  .search{position:relative; flex:1 1 260px; min-width:180px}
  .search input{
    width:100%; padding:.55rem .8rem; border-radius:20px;
    background:var(--panel); border:1px solid var(--border2); color:var(--text);
    font-family:var(--ui); font-size:.9rem; outline:none;
  }
  .search input:focus{border-color:var(--gold)}
  .search .mag{position:absolute; left:.75rem; top:50%; transform:translateY(-50%); color:var(--faint)}
  .search-results{
    position:absolute; top:110%; left:0; right:0; background:var(--panel2);
    border:1px solid var(--border2); border-radius:var(--radius); box-shadow:var(--shadow);
    max-height:60vh; overflow:auto; z-index:60; display:none;
  }
  .search-results.open{display:block}
  .sr-item{padding:.5rem .8rem; border-bottom:1px solid var(--border); cursor:pointer; font-family:var(--ui); font-size:.88rem}
  .sr-item:last-child{border-bottom:none}
  .sr-item:hover{background:var(--panel)}
  .sr-item .tag{font-size:.65rem}
  .sr-empty{padding:.8rem; color:var(--faint); font-family:var(--ui); font-size:.85rem}
  .hbtns{display:flex; gap:.4rem}
  .icon-btn{
    background:var(--panel); border:1px solid var(--border2); color:var(--muted);
    border-radius:8px; padding:.45rem .6rem; font-size:.8rem;
  }
  .icon-btn:hover{color:var(--gold2); border-color:var(--gold)}

  /* ---------- Tabs ---------- */
  nav.tabs{max-width:1100px; margin:0 auto; padding:0 1rem; display:flex; gap:.15rem; overflow-x:auto;
    scrollbar-width:thin; scrollbar-color:var(--border2) transparent}
  nav.tabs::-webkit-scrollbar{height:6px}
  nav.tabs::-webkit-scrollbar-track{background:transparent}
  nav.tabs::-webkit-scrollbar-thumb{background:var(--border2); border-radius:4px}
  nav.tabs::-webkit-scrollbar-thumb:hover{background:var(--gold)}
  nav.tabs button{
    background:transparent; border:none; color:var(--muted); font-size:.82rem; font-weight:600;
    padding:.7rem 1.1rem; border-bottom:2px solid transparent; white-space:nowrap;
    text-transform:uppercase; letter-spacing:.6px; border-right:1px solid var(--border);
  }
  nav.tabs button:last-child{border-right:none}
  nav.tabs button:hover{color:var(--text)}
  nav.tabs button.active{color:var(--gold2); border-bottom-color:var(--gold); text-shadow:0 0 10px rgba(193,145,63,.35)}

  /* ---------- Layout ---------- */
  main{max-width:1100px; margin:0 auto; padding:1.2rem 1rem 4rem; overflow-x:clip}
  .card h3, .card p, .prose, .bullets li, .sb-line, .detail h1, .group-head, table.tbl td{ overflow-wrap:anywhere; }
  .page-head{display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem; flex-wrap:wrap}
  .page-head h1{font-size:1.9rem; margin:0; color:var(--gold2); font-weight:400; font-family:var(--display); letter-spacing:.5px}
  .page-head .sub{color:var(--faint); font-family:var(--ui); font-size:.8rem}

  .btn{
    background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#241a07; border:none;
    padding:.55rem .9rem; border-radius:8px; font-weight:700; font-size:.85rem;
    box-shadow:0 2px 0 #6e4f1c, 0 3px 10px rgba(0,0,0,.35);
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--panel); color:var(--text); border:1px solid var(--border2); box-shadow:none}
  .btn.ghost:hover{border-color:var(--gold)}
  .btn.danger{background:var(--panel); color:var(--blood2); border:1px solid #5a2f2f; box-shadow:none}
  .btn.danger:hover{background:#2a1a1a}
  .btn.sm{padding:.35rem .6rem; font-size:.75rem}

  /* ---------- Cards grid ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:.9rem}
  .card{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--border); border-radius:var(--radius); padding:1rem;
    cursor:pointer; transition:border-color .15s, transform .1s;
    position:relative; overflow:hidden;
  }
  .card:hover{border-color:var(--gold); transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,.5), 0 0 0 1px rgba(193,145,63,.18)}
  .card h3{margin:.1rem 0 .35rem; font-size:1.08rem; color:var(--text)}
  .card p{margin:0; color:var(--muted); font-family:var(--ui); font-size:.82rem;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
  .card .meta{margin-top:.6rem; display:flex; gap:.4rem; flex-wrap:wrap}
  .tag{
    font-family:var(--ui); font-size:.68rem; font-weight:700; letter-spacing:.4px;
    padding:.15rem .5rem; border-radius:20px; text-transform:uppercase;
    background:var(--panel); border:1px solid var(--border2); color:var(--muted);
  }
  .tag.creature{color:#ff9d68; border-color:#8a4a2c; background:rgba(255,157,104,.13)}
  .tag.event{color:#c9a3f7; border-color:#6a4a8f; background:rgba(201,163,247,.13)}
  .tag.table{color:#5fe6d8; border-color:#2e7a70; background:rgba(95,230,216,.12)}
  .tag.session{color:#9fc4ff; border-color:#3e5c9e; background:rgba(159,196,255,.13)}
  .tag.chaos{color:#ff6b6b; border-color:#8f3a3a; background:rgba(255,107,107,.13)}
  .tag.loyal{color:#6fe06a; border-color:#3a7a37; background:rgba(111,224,106,.13)}
  .tag.neutre{color:var(--muted)}
  .tag.gold{color:#ffcf6e; border-color:#8a6a2a; background:rgba(255,207,110,.13)}

  .group-head{font-family:var(--display); font-size:1.25rem; color:var(--gold2); font-weight:400; letter-spacing:.3px;
    margin:.2rem 0 .8rem; padding-bottom:.4rem; border-bottom:1px solid var(--border); cursor:pointer;
    display:flex; align-items:center; gap:.5rem; user-select:none}
  .group-head:hover{color:var(--gold)}
  .group-head .grp-arrow{margin-left:auto; font-size:.8rem; transition:transform .15s; color:var(--faint)}
  .group-head.collapsed .grp-arrow{transform:rotate(-90deg)}
  .group-body.collapsed{display:none}
  .group-head .faint{font-weight:400; font-size:.82rem; color:var(--muted); opacity:.85}

  .empty{
    text-align:center; padding:3rem 1rem; color:var(--faint); font-family:var(--ui);
    border:1px dashed var(--border2); border-radius:var(--radius);
  }
  .empty .big{font-size:2.4rem; display:block; margin-bottom:.5rem; opacity:.6}

  /* ---------- Detail ---------- */
  .detail{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--border);
    border-radius:var(--radius); padding:1.4rem; box-shadow:var(--shadow)}
  .back{background:none; border:none; color:var(--muted); font-family:var(--ui); font-size:.85rem; padding:.2rem 0; margin-bottom:.8rem}
  .back:hover{color:var(--gold2)}
  .detail h1{margin:.1rem 0 .2rem; color:var(--gold2); font-family:var(--display); font-size:2rem; font-weight:700; letter-spacing:.5px; text-transform:uppercase}
  .detail .actions-row{display:flex; gap:.5rem; margin:1rem 0; flex-wrap:wrap; align-items:center}
  .detail .actions{display:flex; gap:.5rem; flex-wrap:wrap}
  body.reading-mode .actions{display:none}
  body.reading-mode .detail{font-size:1.18em; max-width:760px; margin:0 auto}
  body.reading-mode .detail h1{font-size:2.6rem}
  body.reading-mode .reading-toggle{background:var(--gold); color:#241a07; border-color:var(--gold)}
  .section{margin-top:1.3rem}
  .section > h2{
    font-size:.8rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--gold);
    font-family:var(--ui); font-weight:700; margin:0 0 .5rem; padding-bottom:.35rem;
    border-bottom:1px solid var(--border); display:flex; align-items:center; gap:.5rem;
  }
  .section > h2::after{content:""; flex:1 1 auto; height:1px; background:linear-gradient(90deg,var(--border2),transparent)}
  .bullets{margin:0; padding-left:1.2rem}
  .bullets li{margin:.25rem 0}
  .prose{white-space:pre-wrap}
  .muted{color:var(--muted)}
  .faint{color:var(--faint)}

  /* stat block */
  .statblock{border:1px solid var(--border2); border-radius:var(--radius); padding:1rem; background:#150f1c;
    background-image:linear-gradient(180deg, rgba(193,145,63,.07), transparent 30%);
    box-shadow:inset 0 0 0 1px rgba(193,145,63,.08)}
  .sb-top{display:flex; gap:1rem; flex-wrap:wrap; align-items:baseline}
  .sb-line{display:flex; gap:1.5rem; flex-wrap:wrap; margin:.6rem 0; font-family:var(--ui); font-size:.9rem}
  .sb-line b{color:var(--gold2)}
  .abilities-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:.4rem; margin:.8rem 0; text-align:center}
  .ab{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:.4rem .2rem}
  .ab .n{font-family:var(--ui); font-size:.62rem; letter-spacing:1px; color:var(--faint); text-transform:uppercase}
  .ab .v{font-size:1.2rem; font-weight:700; color:var(--text)}
  .attack-row{padding:.4rem 0; border-top:1px dashed var(--border); font-family:var(--ui); font-size:.88rem}
  .attack-row:first-child{border-top:none}
  hr.rule{border:none; border-top:1px solid var(--border); margin:.8rem 0}

  /* backlinks */
  .backlinks{margin-top:1.4rem; padding-top:1rem; border-top:1px solid var(--border)}
  .backlinks h2{font-size:.8rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--gold); font-family:var(--ui)}
  .bl-group{margin:.6rem 0}
  .bl-group .lbl{font-family:var(--ui); font-size:.72rem; color:var(--faint); text-transform:uppercase; letter-spacing:1px}
  .bl-chip{display:inline-block; margin:.25rem .3rem .1rem 0; padding:.3rem .6rem; border-radius:8px;
    background:var(--panel); border:1px solid var(--border2); font-family:var(--ui); font-size:.83rem; cursor:pointer}
  .bl-chip:hover{border-color:var(--gold)}

  /* wiki links in prose */
  a.wl{color:var(--link); border-bottom:1px dotted var(--link); cursor:pointer}
  a.wl.bad{color:var(--link-bad); border-bottom-style:dashed}
  a.wl.creature{color:#e39b7b; border-color:#e39b7b}
  a.wl.event{color:var(--violet2); border-color:var(--violet2)}
  a.wl.table{color:#7fc9c1; border-color:#7fc9c1}
  a.wl.session{color:#9db4e0; border-color:#9db4e0}

  /* ---------- Forms ---------- */
  .form{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--border);
    border-radius:var(--radius); padding:1.4rem; box-shadow:var(--shadow)}
  .form h1{margin-top:0; color:var(--gold2); font-family:var(--display); font-weight:400; font-size:1.7rem}
  .field{margin-bottom:1rem}
  .field label{display:block; font-family:var(--ui); font-size:.78rem; font-weight:600; letter-spacing:.5px;
    color:var(--muted); margin-bottom:.35rem; text-transform:uppercase}
  .field .hint{font-weight:400; text-transform:none; color:var(--faint); letter-spacing:0}
  input[type=text], input[type=number], input[type=date], input[type=email], input[type=password], textarea, select{
    width:100%; padding:.6rem .7rem; background:var(--bg2); border:1px solid var(--border2);
    border-radius:8px; color:var(--text); font-family:var(--ui); font-size:.9rem; outline:none;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--gold)}
  textarea{resize:vertical; min-height:90px; line-height:1.5}
  .row{display:flex; gap:.8rem; flex-wrap:wrap}
  .row > .field{flex:1 1 120px; margin-bottom:0}
  .subgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(80px,1fr)); gap:.6rem}
  .repeat-item{background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:.7rem; margin-bottom:.6rem}
  .repeat-item .rrow{display:flex; gap:.5rem; flex-wrap:wrap; align-items:flex-end}
  .form-actions{display:flex; gap:.6rem; margin-top:1.4rem; flex-wrap:wrap}
  .link-help{font-family:var(--ui); font-size:.75rem; color:var(--faint); background:var(--bg2);
    border:1px solid var(--border); border-radius:8px; padding:.5rem .7rem; margin-top:.4rem}
  .link-help code{color:var(--gold2); font-family:ui-monospace,monospace}

  /* dice result */
  .roll-result{margin:.6rem 0; font-family:var(--ui); color:var(--gold2); font-weight:700}
  tr.rolled{background:rgba(216,162,74,.14)}
  table.tbl{width:100%; border-collapse:collapse; font-family:var(--ui); font-size:.9rem}
  table.tbl th, table.tbl td{padding:.5rem .6rem; text-align:left; border-bottom:1px solid var(--border); vertical-align:top}
  table.tbl th{color:var(--gold); font-size:.72rem; text-transform:uppercase; letter-spacing:1px}
  table.tbl td.idx{width:2.5rem; color:var(--faint); font-variant-numeric:tabular-nums; text-align:right}

  /* images */
  .tag.npc{color:#ffd98f; border-color:#8a6a2a; background:rgba(255,217,143,.13)}
  a.wl.npc{color:#ffd98f; border-color:#ffd98f}
  .tag.pointcrawl{color:#6fd0f5; border-color:#2a6a8a; background:rgba(111,208,245,.13)}
  a.wl.pointcrawl{color:#6fd0f5; border-color:#6fd0f5}
  .tag.pc{color:#7ef096; border-color:#2f7a45; background:rgba(126,240,150,.13)}
  a.wl.pc{color:#7ef096; border-color:#7ef096}
  .tag.trouvaille{color:#b8d8a8; border-color:#4a6a3a; background:rgba(184,216,168,.12)}
  .tag.relique{color:#c9a3f7; border-color:#6a4a8f; background:rgba(201,163,247,.13)}
  .tag.regalia{color:#ffcf6e; border-color:#8a6a2a; background:rgba(255,207,110,.13)}
  a.wl.treasure{color:#e0c06a; border-color:#e0c06a}

  /* point crawl */
  .crawl-toolbar{display:flex; gap:.5rem; flex-wrap:wrap; margin:.6rem 0 .2rem}
  .btn.ghost.active-mode{background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#2a1e08; border-color:var(--gold)}
  .crawl-help{font-family:var(--ui); font-size:.78rem; color:var(--faint); margin:.2rem 0 .7rem; line-height:1.4}
  .crawl-map-scroll{overflow:auto; border:1px solid var(--border2); border-radius:var(--radius); max-height:66vh;
    background:radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1px) 0 0/24px 24px, var(--bg2)}
  .crawl-canvas{position:relative; width:1400px; height:900px}
  #hex-svg{ width:100%; height:auto; display:block; min-width:900px; }
  .hexcell polygon{ stroke:#1a1510; stroke-width:1; }
  .hex-editable{ cursor:pointer; }
  .hex-editable:hover polygon:first-child{ filter:brightness(1.3); }
  .hex-icon{ font-size:14px; pointer-events:none; user-select:none; }
  .hex-fog{ fill:#0c0a08; }
  .hex-fog-gm{ fill:#0c0a08; opacity:.55; pointer-events:none; }
  .hexpoint{ cursor:pointer; }
  .hexpoint circle{ stroke:#1a1510; stroke-width:1.5; }
  .crawl-canvas > svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
  .crawl-canvas > svg line{stroke:var(--border2); stroke-width:3; pointer-events:stroke; cursor:pointer}
  .crawl-canvas > svg line:hover{stroke:var(--gold)}
  .crawl-canvas > svg text{fill:var(--muted); font-family:var(--ui); font-size:12px; pointer-events:none; paint-order:stroke; stroke:var(--bg2); stroke-width:4px}
  .crawl-node{position:absolute; min-width:96px; max-width:180px; background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--border2); border-radius:10px; padding:.5rem .6rem; cursor:grab; user-select:none;
    font-family:var(--ui); font-size:.83rem; box-shadow:0 3px 10px rgba(0,0,0,.45); touch-action:none; z-index:1}
  .crawl-node:hover{border-color:var(--gold)}
  .crawl-node:active{cursor:grabbing}
  .crawl-node.linkmode{cursor:pointer}
  .crawl-node.linkfrom{border-color:var(--gold2); box-shadow:0 0 0 2px var(--gold), 0 3px 10px rgba(0,0,0,.45)}
  .crawl-node.missing{opacity:.65; border-style:dashed}
  .crawl-node .nt{display:inline-flex; align-items:center; justify-content:center; width:1.5em; height:1.5em; flex:0 0 auto;
    border-radius:50%; background:var(--gold); color:#2a1e08; font-weight:700; font-size:.75rem; margin-right:.4rem; vertical-align:middle}

  /* modal */
  #modal{position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; align-items:center; justify-content:center; z-index:150; padding:1rem}
  #modal .modal-box{background:var(--panel2); border:1px solid var(--border2); border-radius:var(--radius);
    box-shadow:var(--shadow); max-width:580px; width:100%; max-height:86vh; overflow:auto; padding:1.3rem}
  .modal-list{max-height:52vh; overflow:auto; margin-top:.6rem}
  .modal-list .mli{padding:.55rem .7rem; border:1px solid var(--border); border-radius:8px; margin-bottom:.4rem; cursor:pointer; font-family:var(--ui); font-size:.88rem}
  .modal-list .mli:hover{border-color:var(--gold); background:var(--panel)}

  /* autocomplétion des liens [[…]] */
  #ac-pop{position:fixed; z-index:300; background:var(--panel2); border:2px solid var(--gold); border-radius:8px;
    box-shadow:0 0 0 3px rgba(193,145,63,.18), var(--shadow); min-width:230px; max-width:340px; max-height:270px; overflow:auto; display:none; font-family:var(--ui)}
  #ac-pop.open{display:block}
  #ac-pop .ac-title{padding:.4rem .6rem; font-size:.68rem; text-transform:uppercase; letter-spacing:.6px; color:var(--gold2); border-bottom:1px solid var(--border); background:rgba(193,145,63,.08)}
  #ac-pop .aci{padding:.55rem .6rem; cursor:pointer; font-size:.92rem; display:flex; align-items:center; gap:.5rem; border-bottom:1px solid var(--border)}
  #ac-pop .aci:last-of-type{border-bottom:none}
  #ac-pop .aci.sel, #ac-pop .aci:hover{background:var(--panel)}
  #ac-pop .aci .nm{color:var(--text)}
  #ac-pop .ac-empty{padding:.55rem .6rem; color:var(--faint); font-size:.82rem}
  #ac-pop .ac-hint{padding:.35rem .6rem; font-size:.68rem; color:var(--faint); border-top:1px solid var(--border); position:sticky; bottom:0; background:var(--panel2)}
  .card .thumb{width:calc(100% + 2rem); height:130px; object-fit:cover; margin:-1rem -1rem .7rem; display:block; border-bottom:1px solid var(--border)}
  .gallery{display:flex; flex-wrap:wrap; gap:.6rem; margin-top:.3rem}
  .gallery .gimg{width:120px; height:120px; object-fit:cover; border-radius:8px; border:1px solid var(--border2); cursor:zoom-in; transition:transform .1s}
  .gallery .gimg:hover{transform:scale(1.04); border-color:var(--gold)}
  .img-thumb{position:relative; display:inline-block; margin:.3rem .3rem 0 0}
  .img-thumb img{width:92px; height:92px; object-fit:cover; border-radius:8px; border:1px solid var(--border2)}
  .img-del{position:absolute; top:-7px; right:-7px; background:var(--blood); color:#fff; border:none;
    border-radius:50%; width:22px; height:22px; cursor:pointer; font-size:.75rem; line-height:1; box-shadow:0 1px 4px rgba(0,0,0,.5)}
  #lightbox{position:fixed; inset:0; background:rgba(0,0,0,.88); display:flex; align-items:center; justify-content:center;
    z-index:200; padding:2rem; cursor:zoom-out}
  #lightbox img{max-width:100%; max-height:100%; border-radius:8px; box-shadow:var(--shadow)}

  /* toast */
  #toast{position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel2); border:1px solid var(--gold); color:var(--text); padding:.7rem 1.1rem;
    border-radius:10px; font-family:var(--ui); font-size:.85rem; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:.25s; z-index:100}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  .session-entry{border-left:2px solid var(--border2); padding:.2rem 0 .2rem 1rem; margin:.9rem 0}
  .session-entry .etitle{font-family:var(--ui); font-weight:700; color:var(--gold2); font-size:.9rem}

  @media (max-width:640px){
    .brand small{display:none}
    .abilities-grid{grid-template-columns:repeat(3,1fr)}
    main{padding:1rem .7rem 4rem}
    .bar{gap:.5rem; padding:.6rem .7rem}
    /* recherche sur sa propre ligne, pleine largeur */
    .search{flex:1 1 100%; order:3}
    /* onglets : passage à la ligne, tous visibles, en pastilles (fini le défilement horizontal) */
    nav.tabs{flex-wrap:wrap; overflow:visible; gap:.4rem; padding:0 .5rem .5rem}
    nav.tabs button{flex:1 1 auto; font-size:.85rem; font-weight:600; padding:.65rem .8rem; min-height:44px;
      border-bottom:none; border-right:none; border-radius:10px; background:var(--panel); border:1px solid var(--border)}
    nav.tabs button.active{background:var(--panel2); color:var(--gold2); border-color:var(--gold)}
    /* cartes en une colonne */
    .grid{grid-template-columns:1fr; gap:.7rem}
    .card p{-webkit-line-clamp:2}
    /* détails / formulaires moins d'air perdu */
    .detail, .form{padding:1rem}
    .page-head h1{font-size:1.3rem}
    .detail h1{font-size:1.4rem}
    /* plan du point crawl : hauteur raisonnable, boutons pleine largeur */
    .crawl-map-scroll{max-height:56vh}
    .crawl-toolbar{gap:.4rem}
    .crawl-toolbar .btn{flex:1 1 40%}
    /* modales presque plein écran */
    #modal{padding:.5rem}
    #modal .modal-box{padding:1rem}
    /* pied de champs & lignes de stats plus compacts */
    .sb-line{gap:.9rem}
  }
  .hidden{display:none !important}
  body[data-tab="sessions"] main{
    --panel:#1a1421; --panel2:#231b2c; --border:#382c48; --border2:#4d3d63;
  }
  body[data-tab="tables"] main{
    --panel:#122220; --panel2:#1a2e2b; --border:#2a4a45; --border2:#3d6a62;
  }
  body[data-tab="pointcrawls"] main{
    --panel:#131b20; --panel2:#1a252d; --border:#293b47; --border2:#385061;
  }
  body[data-tab="creatures"] main{
    --panel:#201713; --panel2:#2d201a; --border:#473329; --border2:#614638;
  }
  body[data-tab="pcs"] main{
    --panel:#132017; --panel2:#1a2d20; --border:#294733; --border2:#386146;
  }
  body[data-tab="npcs"] main{
    --panel:#201d13; --panel2:#2d291a; --border:#474029; --border2:#615738;
  }
  body[data-tab="pcs"] main .card h3{font-size:1.3rem; text-transform:uppercase; letter-spacing:.5px}
  body[data-tab="events"] main .tag.event, body[data-tab="events"] main .tag.gold{
    color:#e8d9a8; border-color:#a68a4a; background:rgba(214,181,110,.22);
  }
  body[data-tab="events"] main .grid .card{
    background:linear-gradient(180deg,#8a7248,#6f5a37); border-color:#a3854f; color:#f0e2ba;
  }
  body[data-tab="events"] main .grid .card:hover{border-color:#d4b876; box-shadow:0 10px 26px rgba(0,0,0,.5), 0 0 0 1px rgba(212,184,118,.35)}
  body[data-tab="events"] main .grid .card h3{color:#fbeec4; text-align:center}
  body[data-tab="events"] main .grid .card p{color:#d8c393; text-align:center; font-size:.78rem; opacity:.85}
  #auth-screen{position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; background:var(--bg); padding:1rem}
  #auth-screen .form{width:100%; max-width:380px}

  /* ---------- Impression PDF d'un point crawl (fond blanc, économe en encre) ---------- */
  #print-area{display:none}
  @media print{
    @page{ size:A4 portrait; margin:14mm; }
    @page mapland{ size:A4 landscape; margin:11mm; }
    header, main, #toast, #modal, #lightbox, #ac-pop{ display:none !important; }
    html, body{ background:#fff !important; }
    #print-area{ display:block !important; color:#241f18; font-family:var(--font);
      -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    #print-area h1{ width:100%; font-family:var(--blackletter); font-size:30pt; font-weight:normal; color:#4a3a1a; margin:0 0 5pt; text-wrap:balance; text-transform:uppercase; letter-spacing:1pt; text-align:center; }
    #print-area .pp-desc{ width:100%; font-family:var(--ui); color:#555; font-size:10pt; margin:0 0 10pt; text-align:center; }
    #print-area .pp-map{ page:mapland; break-after:page; height:186mm; display:flex; flex-direction:column; align-items:center;
      border:2.5pt solid #201b12; box-shadow:5pt 5pt 0 rgba(0,0,0,.32); padding:9mm; }
    #print-area .pp-svg{ width:100%; flex:1 1 auto; min-height:0; display:block; margin:0 auto; }
    #print-area .pp-svg line{ stroke:#8a744a; stroke-width:2; }
    #print-area .pp-svg .elbl{ fill:#6a5a3a; font-family:var(--ui); font-size:11px; }
    #print-area .pp-svg rect{ fill:#fff; stroke:#3a332a; stroke-width:1.4; }
    #print-area .pp-svg .numc{ fill:#b8892f; }
    #print-area .pp-svg .numt{ fill:#fff; font-family:var(--ui); font-weight:700; font-size:13px; }
    #print-area .pp-svg .ptitle{ fill:#2a241c; font-family:var(--font); font-size:13px; }
    #print-area h2{ font-size:15pt; color:#4a3a1a; border-bottom:1.5pt solid #cbb27f; padding-bottom:3pt; margin:0 0 11pt; text-transform:uppercase; letter-spacing:.5pt; }
    #print-area .pp-event{ break-inside:avoid; margin:0 0 11pt; padding-bottom:8pt; border-bottom:1px solid #e4dbc6; }
    #print-area .pp-event:last-child{ border-bottom:none; }
    #print-area .pp-event h3{ font-size:13pt; color:#2a241c; margin:0 0 5pt; display:flex; align-items:center; gap:7pt; flex-wrap:wrap; text-transform:uppercase; letter-spacing:.4pt; }
    #print-area .pp-num{ display:inline-flex; align-items:center; justify-content:center; width:1.7em; height:1.7em;
      border-radius:50%; background:#b8892f; color:#fff; font-family:var(--ui); font-size:10pt; font-weight:700; flex:0 0 auto; }
    #print-area .pp-theme{ font-family:var(--ui); font-size:8pt; color:#8a7748; border:1px solid #d8c79a; border-radius:10px; padding:1pt 6pt; font-weight:600; }
    #print-area .pp-sec{ margin:3pt 0; }
    #print-area .pp-sec h4{ font-family:var(--ui); font-size:8pt; text-transform:uppercase; letter-spacing:.5pt; color:#9a7b3a; margin:5pt 0 2pt; }
    #print-area .pp-sec ul{ margin:0; padding-left:15pt; }
    #print-area .pp-sec li{ font-size:10.5pt; margin:1pt 0; line-height:1.35; }
    #print-area .pp-link{ font-weight:700; text-decoration:underline; text-decoration-thickness:.5pt; text-underline-offset:1.5pt; }
    #print-area .pp-appendix{ break-before:page; }
  }
</style>

<script>
"use strict";
/* ==========================================================================
   GRIMOIRE — Gestionnaire de campagne Shadowdark
   Persistance via Supabase (compte unique). Sans dépendance ni build.
   Huit entités : sessions, événements, tables, créatures, PNJ, point crawls, PJ, trésors.
   Liens inter-entités via la syntaxe [[Nom]] + rétroliens (backlinks).
   ========================================================================== */

/* ----------------------------- Stockage (Supabase) ------------------------ */
const SUPABASE_URL = "https://fvwzkjwnzjivxvgvbocq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ2d3pranduemppdnh2Z3Zib2NxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NzExNTAsImV4cCI6MjEwMTQ0NzE1MH0.djxNfJNOzVW2kWQIKHNnZxR3HBLq-dgOb3qsDDCuvhI";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STORE_KEY = "grimoire_shadowdark_v1"; // ancien cache localStorage — conservé en lecture seule, uniquement pour la migration initiale
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id" + Date.now() + Math.random().toString(36).slice(2));

const emptyDB = () => ({ sessions:[], events:[], creatures:[], tables:[], npcs:[], pointcrawls:[], pcs:[], treasures:[], roadbook:[], hexmaps:[] });

/* Lit l'ancien contenu localStorage (avant migration vers Supabase). Ne sert qu'une fois, au premier login. */
function loadLegacyLocalDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    return Object.assign(emptyDB(), d);
  }catch(e){ return null; }
}

/* Charge les 8 tables depuis Supabase (une ligne par entité, colonne `data` en jsonb) */
async function fetchRemoteDB(){
  const out = emptyDB();
  for(const col of DB_COLS){
    const { data, error } = await sb.from(col).select("data");
    if(error) throw error;
    out[col] = (data||[]).map(r=>r.data);
  }
  return out;
}

let storageOK = true;
/* Pousse tout le contenu actuel de `db` vers Supabase (upsert — n'efface jamais rien).
   Les suppressions sont gérées explicitement via deleteRemote()/wipeRemoteTable(). */
async function saveDB(){
  try{
    for(const col of DB_COLS){
      if(!db[col].length) continue;
      const rows = db[col].map(o=>({ id:o.id, data:o, updated_at:new Date().toISOString() }));
      const { error } = await sb.from(col).upsert(rows);
      if(error) throw error;
    }
    storageOK = true;
  }catch(e){
    console.error(e);
    if(storageOK){ storageOK = false;
      toast("Connexion à la base de données impossible : la dernière modification n'a peut-être pas été synchronisée.");
    }
  }
}

async function deleteRemote(col, id){
  try{ const { error } = await sb.from(col).delete().eq("id", id); if(error) throw error; }
  catch(e){ console.error(e); toast("Erreur de synchronisation lors de la suppression."); }
}

async function wipeRemoteTable(col){
  const { error } = await sb.from(col).delete().not("id","is",null);
  if(error) throw error;
}

let db = emptyDB();

/* --------------------------- État de navigation -------------------------- */
let view = { tab:"sessions", mode:"list", id:null }; // mode: list | detail | edit | new
let formImages = []; // état temporaire des images pendant l'édition d'une créature / PNJ
let crawlState = { id:null, linkMode:false, linkFrom:null }; // état de l'éditeur de point crawl
let editReturnTo = null; // {tab,id} — si défini, où revenir après l'édition d'un événement ouvert depuis un point crawl
let eventThemeFilter = "";
let expandedGroups = new Set(); // groupes repliés par défaut ; contient les clés explicitement dépliées
let creatureSort = "name";      // tri des créatures : name | lvlAsc | lvlDesc
let creatureCatFilter = "";     // filtre de catégorie ("" = toutes/regroupées, "__none__" = sans catégorie)
let readingMode = false; // "mode table de jeu" : masque les contrôles GM, agrandit le texte des fiches

const TYPE_LABEL = { creature:"Créature", event:"Événement", table:"Table", session:"Session", npc:"PNJ", pointcrawl:"Point Crawl", pc:"PJ", treasure:"Trésor", roadbook:"Carnet de route", hexmap:"Hexcrawl" };
const TABS = ["sessions","tables","events","pointcrawls","creatures","pcs","npcs","treasures","roadbook","hexmaps"];
const TYPE_OF_TAB = { sessions:"session", tables:"table", events:"event", creatures:"creature", npcs:"npc", pointcrawls:"pointcrawl", pcs:"pc", treasures:"treasure", roadbook:"roadbook", hexmaps:"hexmap" };
const TREASURE_CATS = [["trouvaille","Trouvaille"],["relique","Relique"],["regalia","Régalia"]];
function treasureCatLabel(k){ const f=TREASURE_CATS.find(c=>c[0]===k); return f?f[1]:(k||"Trésor"); }

/* ------------------------------ Utilitaires ------------------------------ */
const $ = s => document.querySelector(s);
const app = $("#app");

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* Résout un nom [[...]] vers une entité (insensible à la casse) */
function findByName(name){
  const n = name.trim().toLowerCase();
  for(const c of db.creatures) if((c.name||"").toLowerCase()===n) return {type:"creature", id:c.id};
  for(const e of db.events)    if((e.title||"").toLowerCase()===n) return {type:"event", id:e.id};
  for(const t of db.tables)    if((t.title||"").toLowerCase()===n) return {type:"table", id:t.id};
  for(const s of db.sessions)  if((s.title||"").toLowerCase()===n) return {type:"session", id:s.id};
  for(const p of db.npcs)      if((p.name||"").toLowerCase()===n) return {type:"npc", id:p.id};
  for(const pc of db.pointcrawls) if((pc.title||"").toLowerCase()===n) return {type:"pointcrawl", id:pc.id};
  for(const pj of db.pcs)         if((pj.name||"").toLowerCase()===n) return {type:"pc", id:pj.id};
  for(const tr of db.treasures)   if((tr.name||"").toLowerCase()===n) return {type:"treasure", id:tr.id};
  return null;
}
const TAB_OF = { creature:"creatures", event:"events", table:"tables", session:"sessions", npc:"npcs", pointcrawl:"pointcrawls", pc:"pcs", treasure:"treasures", roadbook:"roadbook", hexmap:"hexmaps" };

/* Rend un texte libre : échappe le HTML puis transforme [[Nom]] en lien cliquable */
function renderText(text){
  if(!text) return "";
  let html = esc(text);
  html = html.replace(/\[\[([^\]]+)\]\]/g, (m, raw)=>{
    const name = raw.trim();
    const hit = findByName(name);
    if(hit){
      return `<a class="wl ${hit.type}" data-goto="${hit.type}:${hit.id}">${esc(name)}</a>`;
    }
    return `<a class="wl bad" title="Aucune entité nommée « ${esc(name)} »" data-create="${esc(name)}">${esc(name)}</a>`;
  });
  return html;
}

/* Transforme un texte multi-lignes en liste à puces (ignore les lignes vides) */
function renderBullets(text){
  const lines = String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return `<p class="faint">— (vide)</p>`;
  return `<ul class="bullets">${lines.map(l=>`<li>${renderText(l)}</li>`).join("")}</ul>`;
}
/* Section à puces rendue seulement si elle contient quelque chose (sinon rien) */
function bulletSection(label, text){
  const has = String(text||"").split(/\r?\n/).some(l=>l.trim());
  return has ? `<div class="section"><h2>${label}</h2>${renderBullets(text)}</div>` : "";
}
function eventSectionsHTML(e, opts){
  const secs = bulletSection((opts&&opts.short?"① Description":"① Description & ambiance"), e.description)
    + bulletSection((opts&&opts.short?"② Pièges":"② Pièges — conditions & conséquences"), e.traps)
    + bulletSection("③ Secrets à découvrir", e.secrets);
  return secs.trim() ? secs : `<p class="faint" style="font-family:var(--ui)">Aucun détail renseigné pour l'instant.</p>`;
}

/* Concatène tout le texte cherchable/liable d'une entité */
function entityText(type, o){
  if(type==="creature") return [o.name,o.category,o.desc,o.abilities,(o.attacks||[]).map(a=>a.name+" "+a.damage).join(" ")].join(" \n ");
  if(type==="event")    return [o.title,o.theme,o.description,o.traps,o.secrets].join(" \n ");
  if(type==="table")    return [o.title,o.context,(o.rows||[]).join(" \n ")].join(" \n ");
  if(type==="session")  return [o.title,(o.entries||[]).map(e=>e.label+" "+e.notes).join(" \n ")].join(" \n ");
  if(type==="npc")      return [o.name,o.description,o.physique,o.age,o.possessions,o.objectif,o.moyens,o.comportement].join(" \n ");
  if(type==="pointcrawl") return [o.title,o.description,(o.nodes||[]).map(nd=>{const ev=getEntity("event",nd.eventId);return ev?ev.title:"";}).join(" ")].join(" \n ");
  if(type==="pc")       return [o.name,o.ancestry,o.cls,o.info,o.skills,o.spells,o.inventory,(o.talents||[]).map(t=>t.text).join(" ")].join(" \n ");
  if(type==="treasure") return [o.name,treasureCatLabel(o.category),o.description].join(" \n ");
  return "";
}
function entityTitle(type,o){ return (type==="creature"||type==="npc"||type==="pc"||type==="treasure") ? o.name : o.title; }

/* Extrait les noms référencés en [[...]] dans un texte */
function extractLinks(text){
  const out = []; const re = /\[\[([^\]]+)\]\]/g; let m;
  while((m=re.exec(text||""))) out.push(m[1].trim().toLowerCase());
  return out;
}

/* Calcule les rétroliens vers une entité cible : qui la mentionne en [[...]] ? */
function findBrokenLinks(){
  const results = [];
  const collections = [["event",db.events],["table",db.tables],["session",db.sessions],["creature",db.creatures],["npc",db.npcs],["pointcrawl",db.pointcrawls],["pc",db.pcs],["treasure",db.treasures]];
  for(const [type,list] of collections){
    for(const o of list){
      const links = extractLinks(entityText(type,o));
      const bad = [...new Set(links)].filter(n=>n && !findByName(n));
      if(bad.length) results.push({type, id:o.id, title:entityTitle(type,o)||"Sans titre", names:bad});
    }
  }
  return results;
}
function openBrokenLinksModal(){
  const results = findBrokenLinks();
  const count = results.reduce((n,r)=>n+r.names.length,0);
  const body = results.length ? results.map(r=>`
    <div class="mli" data-goto="${r.type}:${r.id}">
      <div style="font-weight:700;color:var(--gold2)">${esc(r.title)} <span class="faint" style="font-weight:400">(${TYPE_LABEL[r.type]})</span></div>
      <div style="margin-top:.3rem;display:flex;gap:.3rem;flex-wrap:wrap">${r.names.map(n=>`<span class="tag" style="color:var(--link-bad);border-color:#5a2f2f">[[${esc(n)}]]</span>`).join("")}</div>
    </div>`).join("") : `<p class="faint" style="font-family:var(--ui)">Aucun lien cassé — tout est bien référencé.</p>`;
  openModal(`<h2 style="margin-top:0;color:var(--gold2)">⚠ Liens cassés${count?` (${count})`:""}</h2>
    <p class="faint" style="font-family:var(--ui);font-size:.85rem;margin:.2rem 0 .8rem">Cliquez une fiche pour l'ouvrir et corriger le lien [[…]] manquant.</p>
    <div class="modal-list">${body}</div>`);
}
function backlinksTo(targetType, targetId){
  const target = getEntity(targetType, targetId);
  if(!target) return {};
  const targetName = entityTitle(targetType, target).toLowerCase();
  const groups = { event:[], table:[], session:[], creature:[], npc:[], pointcrawl:[], pc:[], treasure:[] };
  const scan = (type, list)=>{
    for(const o of list){
      if(type===targetType && o.id===targetId) continue;
      const links = extractLinks(entityText(type,o));
      if(links.includes(targetName)) groups[type].push({type, id:o.id, title:entityTitle(type,o)});
    }
  };
  scan("event", db.events); scan("table", db.tables);
  scan("session", db.sessions); scan("creature", db.creatures); scan("npc", db.npcs); scan("pointcrawl", db.pointcrawls); scan("pc", db.pcs); scan("treasure", db.treasures);
  return groups;
}

function collectionOf(type){ return { creature:db.creatures, event:db.events, table:db.tables, session:db.sessions, npc:db.npcs, pointcrawl:db.pointcrawls, pc:db.pcs, treasure:db.treasures, roadbook:db.roadbook, hexmap:db.hexmaps }[type]; }
function getEntity(type,id){ return collectionOf(type).find(o=>o.id===id); }
function deleteEntity(type,id){
  const c = collectionOf(type); const i = c.findIndex(o=>o.id===id);
  if(i>=0){ c.splice(i,1); deleteRemote(TAB_OF[type], id); }
}

/* Renommage : met à jour tous les liens [[Ancien nom]] → [[Nouveau nom]] dans toute la base */
function replaceLinksEverywhere(oldName, newName){
  const from = String(oldName||"").trim().toLowerCase();
  if(!from) return 0;
  let count = 0;
  const fix = s => s.replace(/\[\[([^\]]+)\]\]/g, (m, nm)=> nm.trim().toLowerCase()===from ? `[[${newName}]]` : m);
  const walk = obj => {
    if(Array.isArray(obj)){ obj.forEach(walk); return; }
    if(obj && typeof obj==="object"){
      for(const k in obj){
        if(k==="images") continue;                 // on saute les données d'images (base64)
        const v = obj[k];
        if(typeof v==="string"){ if(v.indexOf("[[")>=0){ const nv=fix(v); if(nv!==v){ obj[k]=nv; count++; } } }
        else if(v && typeof v==="object") walk(v);
      }
    }
  };
  walk(db);
  return count;
}
function maybePropagate(oldName, newName){
  if(!oldName || !newName || oldName===newName) return 0;
  return replaceLinksEverywhere(oldName, newName);
}

  let shape;
  if(n===4) shape = `<polygon points="7,1.5 12.5,12 1.5,12" ${s}/><path d="M7,1.5 L7,12 M1.5,12 L7,7 L12.5,12" ${s2}/>`;
  else if(n===6) shape = `<rect x="2" y="2" width="10" height="10" ${s}/>`;
  else if(n===8) shape = `<polygon points="7,0.8 12.8,7 7,13.2 1.2,7" ${s}/><path d="M1.2,7 L12.8,7" ${s2}/>`;
  else if(n===10) shape = `<polygon points="7,0.8 11.5,4.5 9.5,13.2 4.5,13.2 2.5,4.5" ${s}/><path d="M2.5,4.5 L11.5,4.5" ${s2}/>`;

function levelNum(l){
  l = String(l||"").trim();
  let m;
  if((m = l.match(/^(\d+)\s*\/\s*(\d+)/))) return (+m[1])/(+m[2]);   // niveaux fractionnaires (1/2, 1/4…)
  if((m = l.match(/-?\d+(\.\d+)?/))) return parseFloat(m[0]);
  return -1;
}

  return a;
}

function detailActions(type,id){
  const reading = document.body.classList.contains("reading-mode");
  const toggleBtn = `<button class="btn ghost sm reading-toggle" data-toggle-reading="1">${reading?"👁 Quitter le mode table":"👁 Mode table de jeu"}</button>`;
  if(myRole!=="gm") return `<div class="actions-row">${toggleBtn}</div>`;
  return `<div class="actions-row">${toggleBtn}<div class="actions">
    <button class="btn ghost sm" data-edit="${type}:${id}">✎ Modifier</button>

    <button class="btn danger sm" data-del="${type}:${id}">🗑 Supprimer</button>
  </div></div>`;
}
function duplicateEntity(type,id){
  const src = getEntity(type,id); if(!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid();
  // régénère les identifiants des sous-éléments pour éviter les collisions
  (copy.entries||[]).forEach(x=>x.id=uid());
  (copy.nodes||[]).forEach(x=>x.id=uid());
  (copy.edges||[]).forEach(x=>x.id=uid());
  (copy.images||[]).forEach(x=>x.id=uid());
  if(type==="creature"||type==="npc"||type==="pc"||type==="treasure") copy.name = (copy.name||"Sans nom")+" (copie)";
  if(type==="creature"){ copy.manual = true; delete copy.imported; }   // un doublon créé à la main est protégé du vidage
  else copy.title = (copy.title||"Sans titre")+" (copie)";
  collectionOf(type).push(copy);
  saveDB(); view={tab:TAB_OF[type],mode:"detail",id:copy.id}; render(); toast("Dupliqué.");
}

function fmtMod(v){
  if(v===undefined||v===null||v==="") return "—";
  const s = String(v).trim();
  if(/^[+-]/.test(s)) return s;
  const n = Number(s);
  if(!isNaN(n)) return (n>=0?"+":"")+n;
  return s;
}

function processImage(file, cb){
  if(!file.type || !file.type.startsWith("image/")){ toast("Fichier ignoré (pas une image)."); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    const src = reader.result;
    const im = new Image();
    im.onload = ()=>{
      const max = 1000; let w = im.width, h = im.height;
      if(Math.max(w,h) <= max){ cb({id:uid(),name:file.name,data:src}); return; }
      const scale = max/Math.max(w,h); w = Math.round(w*scale); h = Math.round(h*scale);
      const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(im,0,0,w,h);
      const mime = file.type.includes("png") ? "image/png" : "image/jpeg";
      cb({id:uid(),name:file.name,data:canvas.toDataURL(mime, 0.85)});
    };
    im.onerror = ()=>toast("Image illisible.");
    im.src = src;
  };
  reader.readAsDataURL(file);
}

function setCrawlHelp(){

  h.innerHTML = crawlState.linkMode
    ? `<b style="color:var(--gold2)">Mode liaison actif :</b> cliquez un premier point puis un second pour les relier • cliquez un segment pour le supprimer • re-cliquez le bouton pour terminer.`

function drawCrawl(c){
  const canvas = document.getElementById("crawl-canvas"); if(!canvas) return;
  const nodesHtml = (c.nodes||[]).map((n,i)=>{
    const ev = getEntity("event", n.eventId);
    const title = ev ? ev.title : "(événement supprimé)";
    const cls = `crawl-node ${ev?"":"missing"} ${crawlState.linkMode?"linkmode":""} ${crawlState.linkFrom===n.id?"linkfrom":""}`;
    return `<div class="${cls}" data-node="${n.id}" style="left:${n.x||0}px;top:${n.y||0}px"><span class="nt">${i+1}</span>${esc(truncate(title,40))}</div>`;
  }).join("");
  const edgesHtml = (c.edges||[]).map(e=>
    `<line data-edge="${e.id}" x1="0" y1="0" x2="0" y2="0"></line>${e.label?`<text data-edgelabel="${e.id}">${esc(e.label)}</text>`:""}`
  ).join("");
  canvas.innerHTML = `<svg>${edgesHtml}</svg>${nodesHtml}`;
  updateAllEdges(c);
}

function updateAllEdges(c){
  const canvas = document.getElementById("crawl-canvas"); if(!canvas) return;
  const center = id=>{ const el = canvas.querySelector(`.crawl-node[data-node="${id}"]`); return el ? {x:el.offsetLeft+el.offsetWidth/2, y:el.offsetTop+el.offsetHeight/2} : null; };
  (c.edges||[]).forEach(e=>{
    const a = center(e.from), b = center(e.to);
    const line = canvas.querySelector(`line[data-edge="${e.id}"]`);
    if(line && a && b){ line.setAttribute("x1",a.x); line.setAttribute("y1",a.y); line.setAttribute("x2",b.x); line.setAttribute("y2",b.y); }
    const t = canvas.querySelector(`text[data-edgelabel="${e.id}"]`);
    if(t && a && b){ t.setAttribute("x",(a.x+b.x)/2); t.setAttribute("y",(a.y+b.y)/2 - 6); t.setAttribute("text-anchor","middle"); }
  });
}

function startNodeInteraction(e, c, nodeId){
  e.preventDefault();
  if(crawlState.linkMode){ handleLinkClick(c, nodeId); return; }
  const node = (c.nodes||[]).find(n=>n.id===nodeId); if(!node) return;
  const nodeEl = document.querySelector(`.crawl-node[data-node="${nodeId}"]`);
  const startX = e.clientX, startY = e.clientY, ox = node.x||0, oy = node.y||0; let moved = false;
  const move = ev=>{
    const dx = ev.clientX-startX, dy = ev.clientY-startY;
    if(Math.abs(dx)>3 || Math.abs(dy)>3) moved = true;
    node.x = Math.max(0, ox+dx); node.y = Math.max(0, oy+dy);
    if(nodeEl){ nodeEl.style.left = node.x+"px"; nodeEl.style.top = node.y+"px"; }
    updateAllEdges(c);
  };
  const up = ()=>{
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    if(moved) saveDB(); else openNodeInfo(c, node);
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
}

function handleLinkClick(c, nodeId){
  if(!crawlState.linkFrom){ crawlState.linkFrom = nodeId; drawCrawl(c); return; }
  if(crawlState.linkFrom === nodeId){ crawlState.linkFrom = null; drawCrawl(c); return; }
  const exists = (c.edges||[]).some(e=>(e.from===crawlState.linkFrom&&e.to===nodeId)||(e.from===nodeId&&e.to===crawlState.linkFrom));
  if(!exists){ (c.edges||(c.edges=[])).push({id:uid(), from:crawlState.linkFrom, to:nodeId, label:""}); saveDB(); }
  crawlState.linkFrom = null; drawCrawl(c);
}

function onEdgeClick(c, edgeId){
  const e = (c.edges||[]).find(x=>x.id===edgeId); if(!e) return;
  if(crawlState.linkMode){
    confirmModal("Supprimer ce segment ?", ()=>{ c.edges = c.edges.filter(x=>x.id!==edgeId); saveDB(); drawCrawl(c); });
    return;
  }
  promptModal("Étiquette du segment (ex : « porte verrouillée », « escalier nord ») :", e.label||"", (label)=>{
    e.label = (label||"").trim(); saveDB(); drawCrawl(c);
  });
}

function toggleLinkMode(){

  const c = getEntity("pointcrawl", crawlState.id); if(!c) return;

function removeNode(c, nodeId){
  c.nodes = (c.nodes||[]).filter(n=>n.id!==nodeId);
  c.edges = (c.edges||[]).filter(e=>e.from!==nodeId && e.to!==nodeId);
  saveDB(); drawCrawl(c);

function addNodeForEvent(c, eventId, silent){

/* Fenêtres modales génériques */
function openModal(html){ const m=$("#modal"); m.querySelector(".modal-box").innerHTML = html; m.classList.remove("hidden"); }

/* Confirmation / saisie internes (remplacent confirm()/prompt(), bloqués dans le sandbox des artefacts) */
let _modalCb = null;
let _importData = null;
function confirmModal(message, onYes){
  _modalCb = onYes;
  openModal(`<p style="font-family:var(--ui);font-size:.95rem;margin:.2rem 0 1.1rem;line-height:1.5">${esc(message)}</p>
    <div class="form-actions" style="margin-top:0">
      <button class="btn danger" data-modal-yes="1">Confirmer</button>
      <button class="btn ghost" data-modal-close="1">Annuler</button>
    </div>`);
}
function promptModal(message, defVal, onOk){
  _modalCb = onOk;
  openModal(`<p style="font-family:var(--ui);font-size:.95rem;margin:.2rem 0 .6rem;line-height:1.5">${esc(message)}</p>
    <input type="text" id="modal-prompt-input" value="${esc(defVal||"")}" autocomplete="off">
    <div class="form-actions">
      <button class="btn" data-modal-ok="1">Valider</button>
      <button class="btn ghost" data-modal-close="1">Annuler</button>
    </div>`);
  setTimeout(()=>{ const i=$("#modal-prompt-input"); if(i){ i.focus(); i.select();
    i.addEventListener("keydown", ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); const cb=_modalCb; const v=i.value; closeModal(); if(cb) cb(v); } });
  } }, 30);
}

/* ---- Export PDF d'un point crawl (schéma numéroté + événements numérotés) ---- */
function stripLinks(text){ return String(text||"").replace(/\[\[([^\]]+)\]\]/g, "$1"); }
/* Rendu texte pour le PDF : échappe le HTML puis met en valeur les renvois [[Nom]] (gras + souligné) */
function renderTextPrint(text){
  return esc(String(text||"")).replace(/\[\[([^\]]+)\]\]/g, (m, nm)=>`<span class="pp-link">${nm.trim()}</span>`);
}
function printSection(label, text){
  const lines = String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return "";   // on masque les sections vides pour un rendu épuré
  return `<div class="pp-sec"><h4>${label}</h4><ul>${lines.map(l=>`<li>${renderTextPrint(l)}</li>`).join("")}</ul></div>`;
}

   du plan vers leurs créatures / trésors / tables, et imprime leur fiche complète. ---- */
function printCreatureBlock(c){
  const stats = [["FOR",c.str],["DEX",c.dex],["CON",c.con],["INT",c.int],["SAG",c.wis],["CHA",c.cha]]
    .filter(([,v])=>v).map(([l,v])=>`${l} ${esc(v)}`).join(" · ");
  const attacks = (c.attacks||[]).filter(a=>a.name||a.damage)
    .map(a=>`${esc(a.name||"Attaque")}${a.bonus?" "+esc(a.bonus):""} (${esc(a.damage||"?")}${a.range?", "+esc(rangeLabel(a.range)):""})`).join(" ; ");
  return `<div class="pp-event">
    <h3><span>${esc(c.name||"Sans nom")}</span>${c.category?`<span class="pp-theme">${esc(c.category)}</span>`:""}</h3>
    <div class="pp-sec"><ul><li>CA ${esc(c.ac||"?")} · PV ${esc(c.hp||"?")} · Niv. ${esc(c.level||"?")}${c.alignment?" · "+esc(cap(c.alignment)):""}${stats?" · "+stats:""}</li></ul></div>
    ${attacks?`<div class="pp-sec"><h4>Attaques</h4><ul><li>${attacks}</li></ul></div>`:""}
    ${printSection("Capacités & immunités", c.abilities)}
    ${c.desc?`<div class="pp-sec"><ul><li>${renderTextPrint(c.desc)}</li></ul></div>`:""}
  </div>`;
}
function printTreasureBlock(t){
  return `<div class="pp-event">
    <h3><span>${esc(t.name||"Sans nom")}</span><span class="pp-theme">${esc(treasureCatLabel(t.category))}</span></h3>
    ${printSection("Description & effets", t.description)}
  </div>`;
}
function printTableBlock(t){
  const rows = (t.rows||[]).map((r,i)=>`<li>${i+1}. ${renderTextPrint(r)}</li>`).join("");
  return `<div class="pp-event">
    <h3><span>${esc(t.title||"Sans titre")}</span></h3>
    ${t.context?`<div class="pp-sec"><h4>Contexte</h4><ul><li>${renderTextPrint(t.context)}</li></ul></div>`:""}
    ${rows?`<div class="pp-sec"><h4>Résultats (d${(t.rows||[]).length})</h4><ul>${rows}</ul></div>`:""}
  </div>`;
}
function buildPrintAppendix(nodes){
  const names = new Set();
  nodes.forEach(n=>{
    const ev = getEntity("event", n.eventId); if(!ev) return;
    [ev.description, ev.traps, ev.secrets].forEach(t=> extractLinks(t).forEach(nm=>names.add(nm)));
  });
  const creatures=[], treasures=[], tables=[], seen=new Set();
  names.forEach(nm=>{
    const hit = findByName(nm); if(!hit || seen.has(hit.type+":"+hit.id)) return;
    seen.add(hit.type+":"+hit.id);
    if(hit.type==="creature") creatures.push(getEntity("creature",hit.id));
    else if(hit.type==="treasure") treasures.push(getEntity("treasure",hit.id));
    else if(hit.type==="table") tables.push(getEntity("table",hit.id));
  });
  creatures.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  treasures.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  tables.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
  let html = "";
  if(creatures.length) html += `<section class="pp-events pp-appendix"><h2>Annexe — Créatures rencontrées (${creatures.length})</h2>${creatures.map(printCreatureBlock).join("")}</section>`;
  if(treasures.length) html += `<section class="pp-events pp-appendix"><h2>Annexe — Trésors & reliques (${treasures.length})</h2>${treasures.map(printTreasureBlock).join("")}</section>`;
  if(tables.length) html += `<section class="pp-events pp-appendix"><h2>Annexe — Tables aléatoires (${tables.length})</h2>${tables.map(printTableBlock).join("")}</section>`;
  return html;
}
function crawlDiagramSVG(c){
  const NW = 152, NH = 44, pad = 28, nodes = c.nodes||[];
  if(!nodes.length) return "";
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  nodes.forEach(n=>{ const x=n.x||0, y=n.y||0; minX=Math.min(minX,x); minY=Math.min(minY,y); maxX=Math.max(maxX,x+NW); maxY=Math.max(maxY,y+NH); });
  const ox=minX-pad, oy=minY-pad, w=(maxX-minX)+pad*2, h=(maxY-minY)+pad*2;
  const byId = id=>nodes.find(n=>n.id===id);
  const cx = n=>(n.x||0)+NW/2, cy = n=>(n.y||0)+NH/2;
  const edges = (c.edges||[]).map(e=>{
    const a=byId(e.from), b=byId(e.to); if(!a||!b) return "";
    const mx=(cx(a)+cx(b))/2, my=(cy(a)+cy(b))/2;
    return `<line x1="${cx(a)}" y1="${cy(a)}" x2="${cx(b)}" y2="${cy(b)}"/>${e.label?`<text class="elbl" x="${mx}" y="${my-4}" text-anchor="middle">${esc(e.label)}</text>`:""}`;
  }).join("");
  const boxes = nodes.map((n,i)=>{
    const ev=getEntity("event",n.eventId), title=ev?ev.title:"(événement supprimé)", x=n.x||0, y=n.y||0;
    return `<g class="pnode">
      <rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="7"/>
      <circle class="numc" cx="${x+16}" cy="${y+16}" r="11"/>
      <text class="numt" x="${x+16}" y="${y+20.5}" text-anchor="middle">${i+1}</text>
      <text class="ptitle" x="${x+32}" y="${y+29}">${esc(truncate(title,17))}</text>
    </g>`;
  }).join("");
  return `<svg viewBox="${ox} ${oy} ${w} ${h}" class="pp-svg" xmlns="http://www.w3.org/2000/svg">${edges}${boxes}</svg>`;
}
function printCrawl(id){
  const c = getEntity("pointcrawl", id); if(!c) return;
  const nodes = c.nodes||[];
  if(!nodes.length){ toast("Ajoutez au moins un point avant d'imprimer."); return; }
  const events = nodes.map((n,i)=>{
    const ev=getEntity("event",n.eventId);
    if(!ev) return `<div class="pp-event"><h3><span class="pp-num">${i+1}</span> <span>(événement supprimé)</span></h3></div>`;
    return `<div class="pp-event">
      <h3><span class="pp-num">${i+1}</span> <span>${esc(ev.title)}</span>${ev.theme?`<span class="pp-theme">${esc(ev.theme)}</span>`:""}</h3>
      ${printSection("Description & ambiance", ev.description)}
      ${printSection("Pièges — conditions & conséquences", ev.traps)}
      ${printSection("Secrets à découvrir", ev.secrets)}
    </div>`;
  }).join("");
  $("#print-area").innerHTML = `
    <section class="pp-map">
      <h1>${esc(c.title||"Point Crawl")}</h1>
      ${c.description?`<p class="pp-desc">${renderTextPrint(c.description)}</p>`:""}
      ${crawlDiagramSVG(c)}
    </section>
    <section class="pp-events"><h2>Événements du plan (${nodes.length})</h2>${events}</section>
    ${buildPrintAppendix(nodes)}`;
  document.fonts.load('30pt "JSL Blackletter"').catch(()=>{}).then(()=> window.print());
}

function rollTalents(id){
  const p = getEntity("pc",id); if(!p) return;
  const total = (1+Math.floor(Math.random()*6)) + (1+Math.floor(Math.random()*6));
  let matched = null;
  document.querySelectorAll("#talents-body tr").forEach(tr=>{
    const inRange = rangeContains(tr.dataset.rollRange, total);
    tr.classList.toggle("rolled", inRange);
    if(inRange) matched = tr;
  });
  const out = $("#talent-roll-out");
  out.textContent = `→ 2d6 = ${total} : ${matched ? matched.children[1].textContent.trim() : "aucune ligne correspondante"}`;
  if(matched) matched.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function rangeContains(range, n){
  range = String(range||"").trim(); if(!range) return false;
  let m;
  if((m = range.match(/^(\d+)\s*[-–]\s*(\d+)$/))){ const a=+m[1], b=+m[2]; return n>=Math.min(a,b) && n<=Math.max(a,b); }
  if((m = range.match(/^(\d+)\s*\+$/))) return n >= +m[1];
  if(/^\d+$/.test(range)) return n === +range;
  return false;
}

   Format source : export JSON d'un éditeur hexcrawl externe (coordonnées
   axiales q,r). Le MJ voit tout ; les joueurs ne voient que les hexagones
   dont fogState !== "hidden".
   ========================================================================= */
const HEX_TERRAIN = {
  plains:{color:"#c9b56a",icon:"🌾"}, grassland:{color:"#8fb35a",icon:"🌿"},
  forest:{color:"#3f7a3f",icon:"🌲"}, "dense-forest":{color:"#2a5c2a",icon:"🌳"},
  "mushroom-forest":{color:"#8a5a9a",icon:"🍄"},
  hill:{color:"#a8895a",icon:"⛰"}, mountain:{color:"#8a8a8a",icon:"🏔"}, "mountain-peak":{color:"#e8e8e8",icon:"🗻"},
  ocean:{color:"#2a5a8a",icon:"🌊"}, sea:{color:"#3a6a9a",icon:"🌊"}, lake:{color:"#4a8ab8",icon:"💧"},
  marsh:{color:"#5a7a5a",icon:"🪷"}, bog:{color:"#4a5a3a",icon:"🪵"}, swamp:{color:"#465a3f",icon:"🐊"},
  canyon:{color:"#b0693f",icon:"🪨"}
};
function terrainInfo(t){ return HEX_TERRAIN[t] || {color:"#6b6455", icon:"?"}; }
function hexCenter(q,r,size){ return { x: size*Math.sqrt(3)*(q+r/2), y: size*1.5*r }; }
function hexCorners(cx,cy,size){
  const pts=[];
  for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i-30); pts.push((cx+size*Math.cos(a)).toFixed(1)+","+(cy+size*Math.sin(a)).toFixed(1)); }
  return pts.join(" ");
}

function buildHexPoints(m, isGM){
  const size = (m.settings&&m.settings.hexSize)||30;
  const pts = m.points||[];
  const byQR = {}; (m.hexes||[]).forEach(h=>{ byQR[h.q+","+h.r]=h; });
  return pts.filter(p=>{
    if(!p.hex) return false;
    if(p.dmOnly && !isGM) return false;
    if(!isGM){ const h=byQR[p.hex.q+","+p.hex.r]; if(!h || h.fogState==="hidden") return false; }
    return true;
  }).map(p=>{
    const c = hexCenter(p.hex.q, p.hex.r, size);
    return `<g class="hexpoint" data-point-id="${esc(p.id)}"><title>${esc(p.name||"")}</title>
      <circle cx="${c.x}" cy="${c.y}" r="${(size*0.28).toFixed(1)}" fill="${esc(p.color||'#c8a24a')}" stroke="#1a1510" stroke-width="1.5"></circle>
    </g>`;
  }).join("");
}
function buildHexSVG(m){
  const size = (m.settings&&m.settings.hexSize)||30;
  const hexes = (m.hexes||[]);
  const isGM = myRole==="gm";
  const centers = hexes.map(h=>({h, c:hexCenter(h.q,h.r,size)}));
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  centers.forEach(({c})=>{ minX=Math.min(minX,c.x-size); maxX=Math.max(maxX,c.x+size); minY=Math.min(minY,c.y-size); maxY=Math.max(maxY,c.y+size); });
  const pad=12, vbx=(minX-pad).toFixed(1), vby=(minY-pad).toFixed(1), vbw=((maxX-minX)+pad*2).toFixed(1), vbh=((maxY-minY)+pad*2).toFixed(1);
  const cells = centers.map(({h,c})=>{
    const info = terrainInfo(h.hexType);
    const pts = hexCorners(c.x,c.y,size-1);
    const revealed = h.fogState!=="hidden";
    const showTerrain = isGM || revealed;
    return `<g class="hexcell${isGM?' hex-editable':''}" data-hexq="${h.q}" data-hexr="${h.r}">
      <polygon points="${pts}" fill="${showTerrain?info.color:'#15130f'}"></polygon>
      ${showTerrain?`<text x="${c.x.toFixed(1)}" y="${(c.y+5).toFixed(1)}" text-anchor="middle" class="hex-icon">${info.icon}</text>`:""}
      ${!revealed?`<polygon points="${pts}" class="${isGM?'hex-fog-gm':'hex-fog'}"></polygon>`:""}
    </g>`;
  }).join("");
  return `<svg viewBox="${vbx} ${vby} ${vbw} ${vbh}" id="hex-svg" xmlns="http://www.w3.org/2000/svg">${cells}${buildHexPoints(m,isGM)}</svg>`;
}

/* =========================================================================
   RECHERCHE GLOBALE
   ========================================================================= */
function levenshtein(a,b){
  const m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  const dp = [];
  for(let i=0;i<=m;i++) dp.push(new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  }
  return dp[m][n];
}
function fuzzyFind(hay, q){
  if(q.length<3) return null;
  const words = hay.split(/\W+/).filter(Boolean);
  const threshold = q.length<=4?1:(q.length<=8?2:3);
  let best=null;
  for(const w of words){
    if(Math.abs(w.length-q.length) > threshold) continue;
    const d = levenshtein(w,q);
    if(d>0 && d<=threshold && (!best || d<best.d)) best = {d, word:w};
  }
  if(!best) return null;
  return {index: hay.indexOf(best.word)};
}
function runSearch(q){
  const box = $("#search-results");
  q = q.trim().toLowerCase();
  if(!q){ box.classList.remove("open"); box.innerHTML=""; return; }
  const results = [];
  const push = (type, o)=>{
    const hay = entityText(type,o).toLowerCase();
    let idx = hay.indexOf(q), fuzzy = false;
    if(idx<0 && !q.includes(" ")){
      const f = fuzzyFind(hay,q);
      if(f){ idx = f.index; fuzzy = true; }
    }
    if(idx>=0) results.push({type,id:o.id,title:entityTitle(type,o),snippet:snippet(entityText(type,o),q),fuzzy});
  };
  db.creatures.forEach(o=>push("creature",o));
  db.events.forEach(o=>push("event",o));
  db.tables.forEach(o=>push("table",o));
  db.sessions.forEach(o=>push("session",o));
  db.npcs.forEach(o=>push("npc",o));
  db.pointcrawls.forEach(o=>push("pointcrawl",o));
  db.pcs.forEach(o=>push("pc",o));
  db.treasures.forEach(o=>push("treasure",o));
  results.sort((a,b)=>(a.fuzzy===b.fuzzy)?0:(a.fuzzy?1:-1));
  if(!results.length){ box.innerHTML = `<div class="sr-empty">Aucun résultat pour « ${esc(q)} »</div>`; box.classList.add("open"); return; }
  box.innerHTML = results.slice(0,25).map(r=>`
    <div class="sr-item" data-goto="${r.type}:${r.id}">
      <span class="tag ${r.type}">${TYPE_LABEL[r.type]}</span>
      <b style="margin-left:.4rem">${esc(r.title||"—")}</b>${r.fuzzy?' <span class="faint" style="font-size:.72rem">(≈ approximatif)</span>':''}
      <div class="faint" style="font-size:.78rem;margin-top:.15rem">${esc(r.snippet)}</div>
    </div>`).join("");
  box.classList.add("open");
}
function snippet(text,q){
  const t = String(text||"").replace(/\s+/g," ");
  const i = t.toLowerCase().indexOf(q);
  if(i<0) return t.slice(0,80);
  const start = Math.max(0,i-30);
  return (start>0?"…":"") + t.slice(start, i+q.length+40) + "…";
}

function mergeDB(data){

    const seen = new Set(db[col].map(o=>o.id));
    (data[col]||[]).forEach(o=>{ if(o && o.id && !seen.has(o.id)){ db[col].push(o); seen.add(o.id); added++; } });

  return added;
}

let _xmlPending = null;
function importXML(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const doc = new DOMParser().parseFromString(r.result, "application/xml");
      if(doc.querySelector("parsererror")) throw new Error("XML mal formé");
      const nodes = doc.getElementsByTagName("creature").length ? [...doc.getElementsByTagName("creature")]
        : [...doc.documentElement.children].filter(n=>/creature|monster|stat/i.test(n.tagName));
      if(!nodes.length) throw new Error("Aucune balise <creature> trouvée");
      _xmlPending = nodes.map(parseCreatureNode).filter(c=>c.name);
      const existing = new Set(db.creatures.map(c=>(c.name||"").toLowerCase()));
      const dupes = _xmlPending.filter(c=>existing.has((c.name||"").toLowerCase())).length;
      openModal(`<h2 style="margin:.1rem 0 .5rem;color:var(--gold2)">Importer ${_xmlPending.length} créature(s)</h2>
        <p style="font-family:var(--ui);font-size:.9rem;line-height:1.55;color:var(--muted);margin:0 0 1rem">
          ${dupes>0 ? `<b style="color:var(--gold2)">${dupes}</b> portent un nom déjà présent (doublons potentiels).<br>` : `Aucun doublon détecté.<br>`}
          <b style="color:var(--green)">Ignorer les doublons</b> : n'ajoute que les nouvelles.<br>
          <b style="color:var(--gold2)">Remplacer les doublons</b> : met à jour les fiches existantes (par nom), ajoute les nouvelles.<br>
          <b>Tout ajouter</b> : ajoute tout, même en double.</p>
        <div class="form-actions" style="margin-top:0;flex-wrap:wrap">
          <button class="btn" data-xml-skip="1">⏭ Ignorer les doublons</button>
          <button class="btn ghost" data-xml-replace="1">♻ Remplacer les doublons</button>
          <button class="btn ghost" data-xml-all="1">➕ Tout ajouter</button>
          <button class="btn ghost" data-modal-close="1">Annuler</button>
        </div>`);
    }catch(e){ toast("Import XML échoué : "+e.message); }
  };
  r.readAsText(file);
}
function applyXMLImport(mode){
  if(!_xmlPending) return;
  let added=0, replaced=0, skipped=0;
  const byName = {}; db.creatures.forEach(c=>{ byName[(c.name||"").toLowerCase()] = c; });
  _xmlPending.forEach(c=>{
    const key = (c.name||"").toLowerCase();
    const exist = byName[key];
    if(exist && mode!=="all"){
      if(mode==="replace"){
        const id=exist.id, imgs=exist.images;
        Object.keys(exist).forEach(k=>delete exist[k]);
        Object.assign(exist, c); exist.id=id; exist.imported=true;
        if((!c.images||!c.images.length) && imgs && imgs.length) exist.images=imgs;
        replaced++;
      } else skipped++;                       // mode "skip"
    } else {
      c.id=uid(); c.imported=true; db.creatures.push(c); byName[key]=c; added++;
    }
  });
  _xmlPending=null; saveDB(); view={tab:"creatures",mode:"list",id:null}; render();
  toast(`Import : ${added} ajoutée(s), ${replaced} remplacée(s), ${skipped} ignorée(s).`);
}

function parseCreatureNode(node){
  const get = (sel)=>{ const el = node.querySelector(sel); return el ? el.textContent.trim() : ""; };
  const attrOr = (sel, attr, fallbackSel)=>{
    const el = node.querySelector(sel);
    if(el && el.getAttribute(attr)!=null) return el.getAttribute(attr).trim();
    return fallbackSel!=null ? get(fallbackSel) : "";
  };
  const c = {
    name: get("name") || node.getAttribute("name") || "",
    category: get("category") || get("categorie") || "",
    desc: get("description") || get("desc") || "",
    ac: get("ac") || get("armorclass") || attrOr("stats","ac"),
    hp: get("hp") || get("hitpoints") || attrOr("stats","hp"),
    level: get("level") || attrOr("stats","level"),
    alignment: (get("alignment")||"chaos").toLowerCase(),
    abilities: get("abilities") || get("special") || get("immunities") || "",
    attacks: []
  };
  // Caractéristiques : soit <stats str=".."/>, soit balises individuelles <str>..</str>
  const statsEl = node.querySelector("stats") || node.querySelector("abilities-scores");
  const keys = {str:["str","strength"],dex:["dex","dexterity"],con:["con","constitution"],int:["int","intelligence"],wis:["wis","sag","wisdom","sagesse"],cha:["cha","charisma","charisme"]};
  Object.entries(keys).forEach(([k,aliases])=>{
    let v="";
    if(statsEl){ for(const a of aliases){ if(statsEl.getAttribute(a)!=null){ v=statsEl.getAttribute(a); break; } } }
    if(!v){ for(const a of aliases){ const el=node.querySelector(a); if(el){ v=el.textContent.trim(); break; } } }
    c[k]=v;
  });
  // normaliser alignement
  if(/cha|chaos/.test(c.alignment)) c.alignment="chaos";
  else if(/loy|law/.test(c.alignment)) c.alignment="loyal";
  else if(/neut/.test(c.alignment)) c.alignment="neutre";
  // Attaques
  node.querySelectorAll("attack").forEach(a=>{
    const nm = a.getAttribute("name") || (a.querySelector("name")?.textContent) || a.textContent.trim();
    c.attacks.push({
      name: (nm||"").trim(),
      bonus: a.getAttribute("bonus") || a.querySelector("bonus")?.textContent?.trim() || "",
      damage: a.getAttribute("damage") || a.querySelector("damage")?.textContent?.trim() || "",
      range: normRange(a.getAttribute("range") || a.querySelector("range")?.textContent?.trim() || "close")
    });
  });
  return c;
}
function normRange(r){
  r=(r||"").toLowerCase();
  if(/far|long|lointain/.test(r)) return "far";
  if(/near|inter|proche|moyen/.test(r)) return "near";
  return "close";
}

/* ---- Import / export XML génériques (PNJ, Trésor, Tables, Point Crawl) ----
   Chaque type ne gère que ses champs texte simples ; les images (PNJ/Trésor) et
   les nœuds/liens du point crawl (liés à des événements existants) ne sont pas
   couverts par ce format — ils restent à gérer depuis les fiches elles-mêmes. */
const XML_TYPES = {
  npc: { tag:"npc", tagAlt:/npc|pnj/i, label:"PNJ", col:"npcs", nameField:"name",
    fields:["name","description","physique","age","possessions","objectif","moyens","comportement"] },
  treasure: { tag:"treasure", tagAlt:/treasure|tresor|objet/i, label:"objet", col:"treasures", nameField:"name",
    fields:["name","category","description"] },
  table: { tag:"table", tagAlt:/table/i, label:"table", col:"tables", nameField:"title",
    fields:["title","context"], rowsField:"rows" },
  pointcrawl: { tag:"pointcrawl", tagAlt:/pointcrawl|crawl/i, label:"point crawl", col:"pointcrawls", nameField:"title",
    fields:["title","description"] }
};
let _xmlImportTarget = "creature";
let _xmlPendingGeneric = null;

function xmlToolbarHTML(typeKey){
  return `<button class="btn ghost sm" data-import-xml-type="${typeKey}">⭱ Import XML</button>
    <button class="btn ghost sm" data-export-xml-type="${typeKey}">⭳ Export XML</button>
    <button class="btn ghost sm" data-xml-sample-type="${typeKey}">📄 Modèle XML</button>`;
}

function parseGenericNode(node, cfg){
  const get = sel => {
    const el = node.querySelector(sel);
    if(el) return el.textContent.trim();
    const a = node.getAttribute(sel);
    return a!=null ? a.trim() : "";
  };
  const o = {};
  cfg.fields.forEach(f=> o[f]=get(f));
  if(cfg.rowsField){
    o[cfg.rowsField] = [...node.querySelectorAll("row")].map(r=>r.textContent.trim()).filter(Boolean);
  }
  return o;
}

function importXMLGeneric(typeKey, file){
  const cfg = XML_TYPES[typeKey];
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const doc = new DOMParser().parseFromString(r.result, "application/xml");
      if(doc.querySelector("parsererror")) throw new Error("XML mal formé");
      const nodes = doc.getElementsByTagName(cfg.tag).length ? [...doc.getElementsByTagName(cfg.tag)]
        : [...doc.documentElement.children].filter(n=>cfg.tagAlt.test(n.tagName));
      if(!nodes.length) throw new Error(`Aucune balise <${cfg.tag}> trouvée`);
      const items = nodes.map(n=>parseGenericNode(n,cfg)).filter(o=>o[cfg.nameField]);
      const existing = new Set(db[cfg.col].map(o=>(o[cfg.nameField]||"").toLowerCase()));
      const dupes = items.filter(o=>existing.has((o[cfg.nameField]||"").toLowerCase())).length;
      _xmlPendingGeneric = { typeKey, items };
      openModal(`<h2 style="margin:.1rem 0 .5rem;color:var(--gold2)">Importer ${items.length} ${esc(cfg.label)}(s)</h2>
        <p style="font-family:var(--ui);font-size:.9rem;line-height:1.55;color:var(--muted);margin:0 0 1rem">
          ${dupes>0 ? `<b style="color:var(--gold2)">${dupes}</b> portent un nom déjà présent (doublons potentiels).<br>` : `Aucun doublon détecté.<br>`}
          <b style="color:var(--green)">Ignorer les doublons</b> : n'ajoute que les nouveaux.<br>
          <b style="color:var(--gold2)">Remplacer les doublons</b> : met à jour les fiches existantes, ajoute les nouveaux.<br>
          <b>Tout ajouter</b> : ajoute tout, même en double.</p>
        <div class="form-actions" style="margin-top:0;flex-wrap:wrap">
          <button class="btn" data-xmlg-skip="1">⏭ Ignorer les doublons</button>
          <button class="btn ghost" data-xmlg-replace="1">♻ Remplacer les doublons</button>
          <button class="btn ghost" data-xmlg-all="1">➕ Tout ajouter</button>
          <button class="btn ghost" data-modal-close="1">Annuler</button>
        </div>`);
    }catch(e){ toast("Import XML échoué : "+e.message); }
  };
  r.readAsText(file);
}

function applyXMLImportGeneric(mode){
  if(!_xmlPendingGeneric) return;
  const { typeKey, items } = _xmlPendingGeneric;
  const cfg = XML_TYPES[typeKey];
  let added=0, replaced=0, skipped=0;
  const byKey = {}; db[cfg.col].forEach(o=>{ byKey[(o[cfg.nameField]||"").toLowerCase()] = o; });
  items.forEach(o=>{
    const key = (o[cfg.nameField]||"").toLowerCase();
    const exist = byKey[key];
    if(exist && mode!=="all"){
      if(mode==="replace"){ const id=exist.id; Object.assign(exist, o); exist.id=id; replaced++; }
      else skipped++;
    } else {
      o.id = uid(); db[cfg.col].push(o); byKey[key]=o; added++;
    }
  });
  _xmlPendingGeneric = null; saveDB(); view={tab:cfg.col, mode:"list", id:null}; render();
  toast(`Import : ${added} ajouté(s), ${replaced} remplacé(s), ${skipped} ignoré(s).`);
}

function exportEntityXMLGeneric(typeKey){
  const cfg = XML_TYPES[typeKey];
  const items = db[cfg.col];
  if(!items.length){ toast("Rien à exporter pour l'instant."); return; }
  const body = items.map(o=>{
    const inner = cfg.fields.map(f=>`    <${f}>${esc(o[f]||"")}</${f}>`).join("\n");
    const rows = cfg.rowsField ? `\n    <rows>\n${(o[cfg.rowsField]||[]).map(row=>`      <row>${esc(row)}</row>`).join("\n")}\n    </rows>` : "";
    return `  <${cfg.tag}>\n${inner}${rows}\n  </${cfg.tag}>`;
  }).join("\n\n");
  const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<${cfg.col}>\n${body}\n</${cfg.col}>`;
  downloadBlob(new Blob([xml],{type:"application/xml"}), `export-${cfg.col}-shadowdark.xml`);
  toast(`Export XML : ${items.length} ${cfg.label}(s).`);
}

function xmlSampleGeneric(typeKey){
  const cfg = XML_TYPES[typeKey];
  const sampleFields = cfg.fields.map(f=>`    <${f}>Exemple</${f}>`).join("\n");
  const sampleRows = cfg.rowsField ? `\n    <rows>\n      <row>Résultat 1</row>\n      <row>Résultat 2</row>\n    </rows>` : "";
  const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<!-- Modèle d'import ${cfg.label} — Codex Shadowdark. -->\n<${cfg.col}>\n  <${cfg.tag}>\n${sampleFields}${sampleRows}\n  </${cfg.tag}>\n</${cfg.col}>`;
  downloadBlob(new Blob([xml],{type:"application/xml"}), `modele-${cfg.col}-shadowdark.xml`);
  toast("Modèle XML téléchargé.");
}

    const [ty,id]=el.dataset.del.split(":");

  }
  if((el=closest("data-save"))){
    const ty = el.dataset.save;
    if(ty==="event") saveEvent(); else if(ty==="table") saveTable();
    else if(ty==="creature") saveCreature(); else if(ty==="session") saveSession();
    else if(ty==="npc") saveNPC(); else if(ty==="pointcrawl") saveCrawl();
    else if(ty==="pc") savePC(); else if(ty==="treasure") saveTreasure();
    else if(ty==="roadbook") saveRoadbook();

  }

  if(closest("data-crawl-add")){ const c=getEntity("pointcrawl",crawlState.id); if(c) openPickEventModal(c); return; }
  if(closest("data-crawl-new")){ const c=getEntity("pointcrawl",crawlState.id); if(c) openNewEventModal(c); return; }
  if(closest("data-crawl-link")){ toggleLinkMode(); return; }

  // Hexcrawl
  if((el=t.closest("[data-hexq]"))){ if(myRole==="gm") toggleHexFog(+el.dataset.hexq, +el.dataset.hexr); return; }
  if((el=t.closest("[data-point-id]"))){ openHexPointModal(el.dataset.pointId); return; }

  if(closest("data-hex-hide-all")){ revealAllHexes(false); return; }
  if(closest("data-hex-import")){ _hexImportTarget = hexmapCurrentId; $("#file-hexjson").click(); return; }
  if(closest("data-hex-import-new")){ _hexImportTarget = null; $("#file-hexjson").click(); return; }

  if(closest("data-add-img")){ $("#file-img").click(); return; }

function applyRowCount(){
  const n = Math.max(1, Math.min(100, parseInt($("#row-count").value)||1));
  const w = $("#rows-wrap");
  const current = [...w.querySelectorAll(".row-input")].map(i=>i.value);
  const rows = [];
  for(let i=0;i<n;i++) rows.push(current[i]!=null?current[i]:"");
  w.innerHTML = rows.map((r,i)=>rowInput(r,i)).join("");
}
let lastTableRoll = null; // { tableTitle, text } — dernier tirage, pour l'ajout aux notes de session
function rollTable(id){
  const t = getEntity("table",id); if(!t||!t.rows.length) return;
  const idx = Math.floor(Math.random()*t.rows.length);
  document.querySelectorAll("#table-body tr").forEach(tr=>tr.classList.toggle("rolled", +tr.dataset.rowidx===idx));
  const text = `${t.title||"Table"} → ${idx+1} : ${firstLine(t.rows[idx])||"(vide)"}`;
  const out = $("#roll-out"); out.textContent = `→ ${idx+1} : ${firstLine(t.rows[idx])||"(vide)"}`;
  const tr = document.querySelector(`#table-body tr[data-rowidx="${idx}"]`);
  if(tr) tr.scrollIntoView({block:"nearest",behavior:"smooth"});
  lastTableRoll = text;
  const addBtn = $("#roll-add-session"); if(addBtn) addBtn.classList.remove("hidden");
}
function currentSession(){
  if(!db.sessions.length) return null;
  return [...db.sessions].sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];
}
function addRollToCurrentSession(text){
  const s = currentSession();
  if(!s){ toast("Aucune session existante — créez-en une d'abord."); return; }
  if(!s.entries || !s.entries.length) s.entries = [{id:uid(), label:"Notes", notes:""}];
  const last = s.entries[s.entries.length-1];
  last.notes = (last.notes ? last.notes+"\n" : "") + text;
  saveDB(); toast(`Ajouté aux notes de « ${s.title||"session"} ».`);
}
