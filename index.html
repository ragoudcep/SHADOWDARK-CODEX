<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grimoire — Gestionnaire de campagne Shadowdark</title>
</head>
<body>
<style>
  :root{
    --bg:#0e0d13; --bg2:#16141d; --panel:#1c1a26; --panel2:#242130;
    --border:#332e44; --border2:#463f5e;
    --text:#e8e3d5; --muted:#a49bb3; --faint:#6f6785;
    --gold:#d8a24a; --gold2:#f0c674; --blood:#b5433a; --blood2:#d95a4f;
    --link:#7fb2e6; --link-bad:#c86a6a; --green:#6fae6a;
    --radius:10px; --shadow:0 6px 24px rgba(0,0,0,.45);
    --font: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --blackletter: "JSL Blackletter", var(--font);
  }
  @font-face{ font-family:"JSL Blackletter"; src:url("jsl_blackletter/JBLACK.TTF") format("truetype"); font-weight:normal; font-style:normal; font-display:swap; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, #201a2e 0%, transparent 60%),
      radial-gradient(1000px 500px at -10% 110%, #1a1424 0%, transparent 55%),
      var(--bg);
    color:var(--text); font-family:var(--font); line-height:1.5;
    min-height:100vh;
  }
  a{color:var(--link); text-decoration:none}
  a:hover{text-decoration:underline}
  button{font-family:var(--ui); cursor:pointer}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(180deg, #14121b 0%, #14121bf5 100%);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(6px);
  }
  .bar{
    max-width:1100px; margin:0 auto; padding:.7rem 1rem;
    display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:.55rem; font-weight:700; letter-spacing:.5px}
  .brand .rune{
    font-size:1.5rem; color:var(--gold2);
    filter:drop-shadow(0 0 8px rgba(216,162,74,.4));
  }
  .brand small{display:block; font-size:.62rem; color:var(--faint); font-family:var(--ui); letter-spacing:2px; text-transform:uppercase}
  .search{position:relative; flex:1 1 260px; min-width:180px}
  .search input{
    width:100%; padding:.55rem .8rem .55rem 2.1rem; border-radius:20px;
    background:var(--panel); border:1px solid var(--border2); color:var(--text);
    font-family:var(--ui); font-size:.9rem; outline:none;
  }
  .search input:focus{border-color:var(--gold)}
  .search .mag{position:absolute; left:.75rem; top:50%; transform:translateY(-50%); color:var(--faint)}
  .search-results{
    position:absolute; top:110%; left:0; right:0; background:var(--panel2);
    border:1px solid var(--border2); border-radius:var(--radius); box-shadow:var(--shadow);
    max-height:60vh; overflow:auto; z-index:60; display:none;
  }
  .search-results.open{display:block}
  .sr-item{padding:.5rem .8rem; border-bottom:1px solid var(--border); cursor:pointer; font-family:var(--ui); font-size:.88rem}
  .sr-item:last-child{border-bottom:none}
  .sr-item:hover{background:var(--panel)}
  .sr-item .tag{font-size:.65rem}
  .sr-empty{padding:.8rem; color:var(--faint); font-family:var(--ui); font-size:.85rem}
  .hbtns{display:flex; gap:.4rem}
  .icon-btn{
    background:var(--panel); border:1px solid var(--border2); color:var(--muted);
    border-radius:8px; padding:.45rem .6rem; font-size:.8rem;
  }
  .icon-btn:hover{color:var(--gold2); border-color:var(--gold)}

  /* ---------- Tabs ---------- */
  nav.tabs{max-width:1100px; margin:0 auto; padding:0 1rem; display:flex; gap:.25rem; overflow-x:auto}
  nav.tabs button{
    background:transparent; border:none; color:var(--muted); font-size:.9rem; font-weight:600;
    padding:.7rem .95rem; border-bottom:2px solid transparent; white-space:nowrap;
  }
  nav.tabs button .ic{margin-right:.35rem}
  nav.tabs button:hover{color:var(--text)}
  nav.tabs button.active{color:var(--gold2); border-bottom-color:var(--gold)}

  /* ---------- Layout ---------- */
  main{max-width:1100px; margin:0 auto; padding:1.2rem 1rem 4rem; overflow-x:clip}
  .card h3, .card p, .prose, .bullets li, .sb-line, .detail h1, .group-head, table.tbl td{ overflow-wrap:anywhere; }
  .page-head{display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1rem; flex-wrap:wrap}
  .page-head h1{font-size:1.5rem; margin:0; color:var(--gold2); font-weight:700}
  .page-head .sub{color:var(--faint); font-family:var(--ui); font-size:.8rem}

  .btn{
    background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#2a1e08; border:none;
    padding:.55rem .9rem; border-radius:8px; font-weight:700; font-size:.85rem;
    box-shadow:0 2px 0 #8a6620;
  }
  .btn:hover{filter:brightness(1.06)}
  .btn.ghost{background:var(--panel); color:var(--text); border:1px solid var(--border2); box-shadow:none}
  .btn.ghost:hover{border-color:var(--gold)}
  .btn.danger{background:var(--panel); color:var(--blood2); border:1px solid #5a2f2f; box-shadow:none}
  .btn.danger:hover{background:#2a1a1a}
  .btn.sm{padding:.35rem .6rem; font-size:.75rem}

  /* ---------- Cards grid ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:.9rem}
  .card{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--border); border-radius:var(--radius); padding:1rem;
    cursor:pointer; transition:border-color .15s, transform .1s;
    position:relative; overflow:hidden;
  }
  .card:hover{border-color:var(--gold); transform:translateY(-2px)}
  .card h3{margin:.1rem 0 .35rem; font-size:1.08rem; color:var(--text)}
  .card p{margin:0; color:var(--muted); font-family:var(--ui); font-size:.82rem;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
  .card .meta{margin-top:.6rem; display:flex; gap:.4rem; flex-wrap:wrap}
  .tag{
    font-family:var(--ui); font-size:.68rem; font-weight:700; letter-spacing:.4px;
    padding:.15rem .5rem; border-radius:20px; text-transform:uppercase;
    background:var(--panel); border:1px solid var(--border2); color:var(--muted);
  }
  .tag.creature{color:#e39b7b; border-color:#5a3b30}
  .tag.event{color:#c79ae0; border-color:#4a3a5c}
  .tag.table{color:#7fc9c1; border-color:#33534f}
  .tag.session{color:#9db4e0; border-color:#37425c}
  .tag.chaos{color:var(--blood2); border-color:#5a2f2f}
  .tag.loyal{color:#6fae6a; border-color:#345234}
  .tag.neutre{color:var(--muted)}
  .tag.gold{color:var(--gold2); border-color:#5a4620}

  .group-head{font-family:var(--ui); font-size:.95rem; color:var(--gold2); font-weight:700; letter-spacing:.3px;
    margin:.2rem 0 .8rem; padding-bottom:.4rem; border-bottom:1px solid var(--border)}
  .group-head .faint{font-weight:400; font-size:.82rem}

  .empty{
    text-align:center; padding:3rem 1rem; color:var(--faint); font-family:var(--ui);
    border:1px dashed var(--border2); border-radius:var(--radius);
  }
  .empty .big{font-size:2.4rem; display:block; margin-bottom:.5rem; opacity:.6}

  /* ---------- Detail ---------- */
  .detail{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--border);
    border-radius:var(--radius); padding:1.4rem; box-shadow:var(--shadow)}
  .back{background:none; border:none; color:var(--muted); font-family:var(--ui); font-size:.85rem; padding:.2rem 0; margin-bottom:.8rem}
  .back:hover{color:var(--gold2)}
  .detail h1{margin:.1rem 0 .2rem; color:var(--gold2)}
  .detail .actions{display:flex; gap:.5rem; margin:1rem 0; flex-wrap:wrap}
  .section{margin-top:1.3rem}
  .section > h2{
    font-size:.8rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--gold);
    font-family:var(--ui); font-weight:700; margin:0 0 .5rem; padding-bottom:.35rem;
    border-bottom:1px solid var(--border);
  }
  .bullets{margin:0; padding-left:1.2rem}
  .bullets li{margin:.25rem 0}
  .prose{white-space:pre-wrap}
  .muted{color:var(--muted)}
  .faint{color:var(--faint)}

  /* stat block */
  .statblock{border:1px solid var(--border2); border-radius:var(--radius); padding:1rem; background:#141019;
    background-image:linear-gradient(180deg, rgba(216,162,74,.05), transparent 30%)}
  .sb-top{display:flex; gap:1rem; flex-wrap:wrap; align-items:baseline}
  .sb-line{display:flex; gap:1.5rem; flex-wrap:wrap; margin:.6rem 0; font-family:var(--ui); font-size:.9rem}
  .sb-line b{color:var(--gold2)}
  .abilities-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:.4rem; margin:.8rem 0; text-align:center}
  .ab{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:.4rem .2rem}
  .ab .n{font-family:var(--ui); font-size:.62rem; letter-spacing:1px; color:var(--faint); text-transform:uppercase}
  .ab .v{font-size:1.2rem; font-weight:700; color:var(--text)}
  .attack-row{padding:.4rem 0; border-top:1px dashed var(--border); font-family:var(--ui); font-size:.88rem}
  .attack-row:first-child{border-top:none}
  hr.rule{border:none; border-top:1px solid var(--border); margin:.8rem 0}

  /* backlinks */
  .backlinks{margin-top:1.4rem; padding-top:1rem; border-top:1px solid var(--border)}
  .backlinks h2{font-size:.8rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--gold); font-family:var(--ui)}
  .bl-group{margin:.6rem 0}
  .bl-group .lbl{font-family:var(--ui); font-size:.72rem; color:var(--faint); text-transform:uppercase; letter-spacing:1px}
  .bl-chip{display:inline-block; margin:.25rem .3rem .1rem 0; padding:.3rem .6rem; border-radius:8px;
    background:var(--panel); border:1px solid var(--border2); font-family:var(--ui); font-size:.83rem; cursor:pointer}
  .bl-chip:hover{border-color:var(--gold)}

  /* wiki links in prose */
  a.wl{color:var(--link); border-bottom:1px dotted var(--link); cursor:pointer}
  a.wl.bad{color:var(--link-bad); border-bottom-style:dashed}
  a.wl.creature{color:#e39b7b; border-color:#e39b7b}
  a.wl.event{color:#c79ae0; border-color:#c79ae0}
  a.wl.table{color:#7fc9c1; border-color:#7fc9c1}
  a.wl.session{color:#9db4e0; border-color:#9db4e0}

  /* ---------- Forms ---------- */
  .form{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--border);
    border-radius:var(--radius); padding:1.4rem; box-shadow:var(--shadow)}
  .form h1{margin-top:0; color:var(--gold2)}
  .field{margin-bottom:1rem}
  .field label{display:block; font-family:var(--ui); font-size:.78rem; font-weight:600; letter-spacing:.5px;
    color:var(--muted); margin-bottom:.35rem; text-transform:uppercase}
  .field .hint{font-weight:400; text-transform:none; color:var(--faint); letter-spacing:0}
  input[type=text], input[type=number], input[type=date], textarea, select{
    width:100%; padding:.6rem .7rem; background:var(--bg2); border:1px solid var(--border2);
    border-radius:8px; color:var(--text); font-family:var(--ui); font-size:.9rem; outline:none;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--gold)}
  textarea{resize:vertical; min-height:90px; line-height:1.5}
  .row{display:flex; gap:.8rem; flex-wrap:wrap}
  .row > .field{flex:1 1 120px; margin-bottom:0}
  .subgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(80px,1fr)); gap:.6rem}
  .repeat-item{background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:.7rem; margin-bottom:.6rem}
  .repeat-item .rrow{display:flex; gap:.5rem; flex-wrap:wrap; align-items:flex-end}
  .form-actions{display:flex; gap:.6rem; margin-top:1.4rem; flex-wrap:wrap}
  .link-help{font-family:var(--ui); font-size:.75rem; color:var(--faint); background:var(--bg2);
    border:1px solid var(--border); border-radius:8px; padding:.5rem .7rem; margin-top:.4rem}
  .link-help code{color:var(--gold2); font-family:ui-monospace,monospace}

  /* dice result */
  .roll-result{margin:.6rem 0; font-family:var(--ui); color:var(--gold2); font-weight:700}
  tr.rolled{background:rgba(216,162,74,.14)}
  table.tbl{width:100%; border-collapse:collapse; font-family:var(--ui); font-size:.9rem}
  table.tbl th, table.tbl td{padding:.5rem .6rem; text-align:left; border-bottom:1px solid var(--border); vertical-align:top}
  table.tbl th{color:var(--gold); font-size:.72rem; text-transform:uppercase; letter-spacing:1px}
  table.tbl td.idx{width:2.5rem; color:var(--faint); font-variant-numeric:tabular-nums; text-align:right}

  /* images */
  .tag.npc{color:#e0c48a; border-color:#5a4c2a}
  a.wl.npc{color:#e0c48a; border-color:#e0c48a}
  .tag.pointcrawl{color:#89c0d8; border-color:#2a4a5a}
  a.wl.pointcrawl{color:#89c0d8; border-color:#89c0d8}
  .tag.pc{color:#8fce9b; border-color:#2f5a3a}
  a.wl.pc{color:#8fce9b; border-color:#8fce9b}
  .tag.trouvaille{color:#a7c0a0; border-color:#3a4a34}
  .tag.relique{color:#c79ae0; border-color:#4a3a5c}
  .tag.regalia{color:var(--gold2); border-color:#5a4620}
  a.wl.treasure{color:#e0c06a; border-color:#e0c06a}

  /* point crawl */
  .crawl-toolbar{display:flex; gap:.5rem; flex-wrap:wrap; margin:.6rem 0 .2rem}
  .btn.ghost.active-mode{background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#2a1e08; border-color:var(--gold)}
  .crawl-help{font-family:var(--ui); font-size:.78rem; color:var(--faint); margin:.2rem 0 .7rem; line-height:1.4}
  .crawl-map-scroll{overflow:auto; border:1px solid var(--border2); border-radius:var(--radius); max-height:66vh;
    background:radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1px) 0 0/24px 24px, var(--bg2)}
  .crawl-canvas{position:relative; width:1400px; height:900px}
  .crawl-canvas > svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
  .crawl-canvas > svg line{stroke:var(--border2); stroke-width:3; pointer-events:stroke; cursor:pointer}
  .crawl-canvas > svg line:hover{stroke:var(--gold)}
  .crawl-canvas > svg text{fill:var(--muted); font-family:var(--ui); font-size:12px; pointer-events:none; paint-order:stroke; stroke:var(--bg2); stroke-width:4px}
  .crawl-node{position:absolute; min-width:96px; max-width:180px; background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--border2); border-radius:10px; padding:.5rem .6rem; cursor:grab; user-select:none;
    font-family:var(--ui); font-size:.83rem; box-shadow:0 3px 10px rgba(0,0,0,.45); touch-action:none; z-index:1}
  .crawl-node:hover{border-color:var(--gold)}
  .crawl-node:active{cursor:grabbing}
  .crawl-node.linkmode{cursor:pointer}
  .crawl-node.linkfrom{border-color:var(--gold2); box-shadow:0 0 0 2px var(--gold), 0 3px 10px rgba(0,0,0,.45)}
  .crawl-node.missing{opacity:.65; border-style:dashed}
  .crawl-node .nt{display:inline-flex; align-items:center; justify-content:center; width:1.5em; height:1.5em; flex:0 0 auto;
    border-radius:50%; background:var(--gold); color:#2a1e08; font-weight:700; font-size:.75rem; margin-right:.4rem; vertical-align:middle}

  /* modal */
  #modal{position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; align-items:center; justify-content:center; z-index:150; padding:1rem}
  #modal .modal-box{background:var(--panel2); border:1px solid var(--border2); border-radius:var(--radius);
    box-shadow:var(--shadow); max-width:580px; width:100%; max-height:86vh; overflow:auto; padding:1.3rem}
  .modal-list{max-height:52vh; overflow:auto; margin-top:.6rem}
  .modal-list .mli{padding:.55rem .7rem; border:1px solid var(--border); border-radius:8px; margin-bottom:.4rem; cursor:pointer; font-family:var(--ui); font-size:.88rem}
  .modal-list .mli:hover{border-color:var(--gold); background:var(--panel)}

  /* autocomplétion des liens [[…]] */
  #ac-pop{position:fixed; z-index:300; background:var(--panel2); border:1px solid var(--gold); border-radius:8px;
    box-shadow:var(--shadow); min-width:210px; max-width:330px; max-height:250px; overflow:auto; display:none; font-family:var(--ui)}
  #ac-pop.open{display:block}
  #ac-pop .aci{padding:.42rem .6rem; cursor:pointer; font-size:.85rem; display:flex; align-items:center; gap:.45rem; border-bottom:1px solid var(--border)}
  #ac-pop .aci:last-of-type{border-bottom:none}
  #ac-pop .aci.sel, #ac-pop .aci:hover{background:var(--panel)}
  #ac-pop .aci .nm{color:var(--text)}
  #ac-pop .ac-empty{padding:.55rem .6rem; color:var(--faint); font-size:.82rem}
  #ac-pop .ac-hint{padding:.35rem .6rem; font-size:.68rem; color:var(--faint); border-top:1px solid var(--border); position:sticky; bottom:0; background:var(--panel2)}
  .card .thumb{width:calc(100% + 2rem); height:130px; object-fit:cover; margin:-1rem -1rem .7rem; display:block; border-bottom:1px solid var(--border)}
  .gallery{display:flex; flex-wrap:wrap; gap:.6rem; margin-top:.3rem}
  .gallery .gimg{width:120px; height:120px; object-fit:cover; border-radius:8px; border:1px solid var(--border2); cursor:zoom-in; transition:transform .1s}
  .gallery .gimg:hover{transform:scale(1.04); border-color:var(--gold)}
  .img-thumb{position:relative; display:inline-block; margin:.3rem .3rem 0 0}
  .img-thumb img{width:92px; height:92px; object-fit:cover; border-radius:8px; border:1px solid var(--border2)}
  .img-del{position:absolute; top:-7px; right:-7px; background:var(--blood); color:#fff; border:none;
    border-radius:50%; width:22px; height:22px; cursor:pointer; font-size:.75rem; line-height:1; box-shadow:0 1px 4px rgba(0,0,0,.5)}
  #lightbox{position:fixed; inset:0; background:rgba(0,0,0,.88); display:flex; align-items:center; justify-content:center;
    z-index:200; padding:2rem; cursor:zoom-out}
  #lightbox img{max-width:100%; max-height:100%; border-radius:8px; box-shadow:var(--shadow)}

  /* toast */
  #toast{position:fixed; bottom:1.2rem; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel2); border:1px solid var(--gold); color:var(--text); padding:.7rem 1.1rem;
    border-radius:10px; font-family:var(--ui); font-size:.85rem; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:.25s; z-index:100}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  .session-entry{border-left:2px solid var(--border2); padding:.2rem 0 .2rem 1rem; margin:.9rem 0}
  .session-entry .etitle{font-family:var(--ui); font-weight:700; color:var(--gold2); font-size:.9rem}

  @media (max-width:640px){
    .brand small{display:none}
    .abilities-grid{grid-template-columns:repeat(3,1fr)}
    main{padding:1rem .7rem 4rem}
    .bar{gap:.5rem; padding:.6rem .7rem}
    /* recherche sur sa propre ligne, pleine largeur */
    .search{flex:1 1 100%; order:3}
    /* onglets : passage à la ligne, tous visibles, en pastilles (fini le défilement horizontal) */
    nav.tabs{flex-wrap:wrap; overflow:visible; gap:.4rem; padding:0 .5rem .5rem}
    nav.tabs button{flex:1 1 auto; font-size:.95rem; font-weight:600; padding:.65rem .8rem; min-height:44px;
      border-bottom:none; border-radius:10px; background:var(--panel); border:1px solid var(--border)}
    nav.tabs button .ic{margin-right:.35rem; font-size:1.05rem}
    nav.tabs button.active{background:var(--panel2); color:var(--gold2); border-color:var(--gold)}
    /* cartes en une colonne */
    .grid{grid-template-columns:1fr; gap:.7rem}
    .card p{-webkit-line-clamp:2}
    /* détails / formulaires moins d'air perdu */
    .detail, .form{padding:1rem}
    .page-head h1{font-size:1.3rem}
    .detail h1{font-size:1.4rem}
    /* plan du point crawl : hauteur raisonnable, boutons pleine largeur */
    .crawl-map-scroll{max-height:56vh}
    .crawl-toolbar{gap:.4rem}
    .crawl-toolbar .btn{flex:1 1 40%}
    /* modales presque plein écran */
    #modal{padding:.5rem}
    #modal .modal-box{padding:1rem}
    /* pied de champs & lignes de stats plus compacts */
    .sb-line{gap:.9rem}
  }
  .hidden{display:none !important}

  /* ---------- Impression PDF d'un point crawl (fond blanc, économe en encre) ---------- */
  #print-area{display:none}
  @media print{
    @page{ size:A4 portrait; margin:14mm; }
    @page mapland{ size:A4 landscape; margin:11mm; }
    header, main, #toast, #modal, #lightbox, #ac-pop{ display:none !important; }
    html, body{ background:#fff !important; }
    #print-area{ display:block !important; color:#241f18; font-family:var(--font);
      -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    #print-area h1{ font-family:var(--blackletter); font-size:30pt; font-weight:normal; color:#4a3a1a; margin:0 0 5pt; text-wrap:balance; }
    #print-area .pp-desc{ font-family:var(--ui); color:#555; font-size:10pt; margin:0 0 10pt; }
    #print-area .pp-map{ page:mapland; break-after:page; height:186mm; display:flex; flex-direction:column; }

<script>
"use strict";
/* ==========================================================================
   GRIMOIRE — Gestionnaire de campagne Shadowdark
   Application 100% locale, sans dépendance. Persistance via localStorage.
   Quatre entités : sessions, événements, créatures (stat blocs), tables.
   Liens inter-entités via la syntaxe [[Nom]] + rétroliens (backlinks).
   ========================================================================== */

/* ----------------------------- Stockage ---------------------------------- */
const STORE_KEY = "grimoire_shadowdark_v1";
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id" + Date.now() + Math.random().toString(36).slice(2));

const emptyDB = () => ({ sessions:[], events:[], creatures:[], tables:[], npcs:[], pointcrawls:[], pcs:[], treasures:[] });

function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return emptyDB();
    const d = JSON.parse(raw);
    return Object.assign(emptyDB(), d);
  }catch(e){ console.error(e); return emptyDB(); }
}
let storageOK = true;
function saveDB(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(db)); storageOK = true; }
  catch(e){
    if(storageOK){ storageOK = false;
      toast("Stockage local indisponible ici : les données ne seront pas conservées après fermeture. Utilisez « Export » pour les sauvegarder.");
    }
  }
}
let db = loadDB();

/* --------------------------- État de navigation -------------------------- */
let view = { tab:"sessions", mode:"list", id:null }; // mode: list | detail | edit | new
let formImages = []; // état temporaire des images pendant l'édition d'une créature / PNJ
let crawlState = { id:null, linkMode:false, linkFrom:null }; // état de l'éditeur de point crawl
let eventThemeFilter = ""; // filtre de thème dans l'onglet Événements ("" = tous, "__none__" = sans thème)
let creatureSort = "name";      // tri des créatures : name | lvlAsc | lvlDesc
let creatureCatFilter = "";     // filtre de catégorie ("" = toutes/regroupées, "__none__" = sans catégorie)

const TYPE_LABEL = { creature:"Créature", event:"Événement", table:"Table", session:"Session", npc:"PNJ", pointcrawl:"Point Crawl", pc:"PJ", treasure:"Trésor" };
const TABS = ["sessions","tables","events","pointcrawls","creatures","pcs","npcs","treasures"];
const TYPE_OF_TAB = { sessions:"session", tables:"table", events:"event", creatures:"creature", npcs:"npc", pointcrawls:"pointcrawl", pcs:"pc", treasures:"treasure" };
const TREASURE_CATS = [["trouvaille","Trouvaille"],["relique","Relique"],["regalia","Régalia"]];
function treasureCatLabel(k){ const f=TREASURE_CATS.find(c=>c[0]===k); return f?f[1]:(k||"Trésor"); }

/* ------------------------------ Utilitaires ------------------------------ */
const $ = s => document.querySelector(s);
const app = $("#app");

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* Résout un nom [[...]] vers une entité (insensible à la casse) */
function findByName(name){
  const n = name.trim().toLowerCase();
  for(const c of db.creatures) if((c.name||"").toLowerCase()===n) return {type:"creature", id:c.id};
  for(const e of db.events)    if((e.title||"").toLowerCase()===n) return {type:"event", id:e.id};
  for(const t of db.tables)    if((t.title||"").toLowerCase()===n) return {type:"table", id:t.id};
  for(const s of db.sessions)  if((s.title||"").toLowerCase()===n) return {type:"session", id:s.id};
  for(const p of db.npcs)      if((p.name||"").toLowerCase()===n) return {type:"npc", id:p.id};
  for(const pc of db.pointcrawls) if((pc.title||"").toLowerCase()===n) return {type:"pointcrawl", id:pc.id};
  for(const pj of db.pcs)         if((pj.name||"").toLowerCase()===n) return {type:"pc", id:pj.id};
  for(const tr of db.treasures)   if((tr.name||"").toLowerCase()===n) return {type:"treasure", id:tr.id};
  return null;
}
const TAB_OF = { creature:"creatures", event:"events", table:"tables", session:"sessions", npc:"npcs", pointcrawl:"pointcrawls", pc:"pcs", treasure:"treasures" };

/* Rend un texte libre : échappe le HTML puis transforme [[Nom]] en lien cliquable */
function renderText(text){
  if(!text) return "";
  let html = esc(text);
  html = html.replace(/\[\[([^\]]+)\]\]/g, (m, raw)=>{
    const name = raw.trim();
    const hit = findByName(name);
    if(hit){
      return `<a class="wl ${hit.type}" data-goto="${hit.type}:${hit.id}">${esc(name)}</a>`;
    }
    return `<a class="wl bad" title="Aucune entité nommée « ${esc(name)} »" data-create="${esc(name)}">${esc(name)}</a>`;
  });
  return html;
}

/* Transforme un texte multi-lignes en liste à puces (ignore les lignes vides) */
function renderBullets(text){
  const lines = String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return `<p class="faint">— (vide)</p>`;
  return `<ul class="bullets">${lines.map(l=>`<li>${renderText(l)}</li>`).join("")}</ul>`;
}
/* Section à puces rendue seulement si elle contient quelque chose (sinon rien) */
function bulletSection(label, text){
  const has = String(text||"").split(/\r?\n/).some(l=>l.trim());
  return has ? `<div class="section"><h2>${label}</h2>${renderBullets(text)}</div>` : "";
}
function eventSectionsHTML(e, opts){
  const secs = bulletSection((opts&&opts.short?"① Description":"① Description & ambiance"), e.description)
    + bulletSection((opts&&opts.short?"② Pièges":"② Pièges — conditions & conséquences"), e.traps)
    + bulletSection("③ Secrets à découvrir", e.secrets)
    + bulletSection("④ Informations accessibles", e.info);
  return secs.trim() ? secs : `<p class="faint" style="font-family:var(--ui)">Aucun détail renseigné pour l'instant.</p>`;
}

/* Concatène tout le texte cherchable/liable d'une entité */
function entityText(type, o){
  if(type==="creature") return [o.name,o.category,o.desc,o.abilities,(o.attacks||[]).map(a=>a.name+" "+a.damage).join(" ")].join(" \n ");
  if(type==="event")    return [o.title,o.theme,o.description,o.traps,o.secrets,o.info].join(" \n ");
  if(type==="table")    return [o.title,o.context,(o.rows||[]).join(" \n ")].join(" \n ");
  if(type==="session")  return [o.title,(o.entries||[]).map(e=>e.label+" "+e.notes).join(" \n ")].join(" \n ");
  if(type==="npc")      return [o.name,o.description,o.physique,o.age,o.possessions,o.objectif,o.moyens,o.comportement].join(" \n ");
  if(type==="pointcrawl") return [o.title,o.description,(o.nodes||[]).map(nd=>{const ev=getEntity("event",nd.eventId);return ev?ev.title:"";}).join(" ")].join(" \n ");
  if(type==="pc")       return [o.name,o.ancestry,o.cls,o.info,o.skills,o.spells,o.inventory,(o.talents||[]).map(t=>t.text).join(" ")].join(" \n ");
  if(type==="treasure") return [o.name,treasureCatLabel(o.category),o.description].join(" \n ");
  return "";
}
function entityTitle(type,o){ return (type==="creature"||type==="npc"||type==="pc"||type==="treasure") ? o.name : o.title; }

/* Extrait les noms référencés en [[...]] dans un texte */
function extractLinks(text){
  const out = []; const re = /\[\[([^\]]+)\]\]/g; let m;
  while((m=re.exec(text||""))) out.push(m[1].trim().toLowerCase());
  return out;
}

/* Calcule les rétroliens vers une entité cible : qui la mentionne en [[...]] ? */
function backlinksTo(targetType, targetId){
  const target = getEntity(targetType, targetId);
  if(!target) return {};
  const targetName = entityTitle(targetType, target).toLowerCase();
  const groups = { event:[], table:[], session:[], creature:[], npc:[], pointcrawl:[], pc:[], treasure:[] };
  const scan = (type, list)=>{
    for(const o of list){
      if(type===targetType && o.id===targetId) continue;
      const links = extractLinks(entityText(type,o));
      if(links.includes(targetName)) groups[type].push({type, id:o.id, title:entityTitle(type,o)});
    }
  };
  scan("event", db.events); scan("table", db.tables);
  scan("session", db.sessions); scan("creature", db.creatures); scan("npc", db.npcs); scan("pointcrawl", db.pointcrawls); scan("pc", db.pcs); scan("treasure", db.treasures);
  return groups;
}

/* ------------------------------- CRUD ------------------------------------ */
function collectionOf(type){ return { creature:db.creatures, event:db.events, table:db.tables, session:db.sessions, npc:db.npcs, pointcrawl:db.pointcrawls, pc:db.pcs, treasure:db.treasures }[type]; }
function getEntity(type,id){ return collectionOf(type).find(o=>o.id===id); }
function deleteEntity(type,id){
  const c = collectionOf(type); const i = c.findIndex(o=>o.id===id);
  if(i>=0){ c.splice(i,1); saveDB(); }
}

/* Renommage : met à jour tous les liens [[Ancien nom]] → [[Nouveau nom]] dans toute la base */
function replaceLinksEverywhere(oldName, newName){
  const from = String(oldName||"").trim().toLowerCase();
  if(!from) return 0;
  let count = 0;
  const fix = s => s.replace(/\[\[([^\]]+)\]\]/g, (m, nm)=> nm.trim().toLowerCase()===from ? `[[${newName}]]` : m);
  const walk = obj => {
    if(Array.isArray(obj)){ obj.forEach(walk); return; }
    if(obj && typeof obj==="object"){
      for(const k in obj){
        if(k==="images") continue;                 // on saute les données d'images (base64)
        const v = obj[k];
        if(typeof v==="string"){ if(v.indexOf("[[")>=0){ const nv=fix(v); if(nv!==v){ obj[k]=nv; count++; } } }
        else if(v && typeof v==="object") walk(v);
      }
    }
  };
  walk(db);
  return count;
}
function maybePropagate(oldName, newName){
  if(!oldName || !newName || oldName===newName) return 0;
  return replaceLinksEverywhere(oldName, newName);
}

/* =========================================================================
   RENDU PRINCIPAL
   ========================================================================= */
function render(){
  // onglets actifs
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("active", b.dataset.tab===view.tab));
  window.scrollTo({top:0});

  if(view.mode==="detail") return renderDetail();
  if(view.mode==="edit" || view.mode==="new") return renderForm();
  return renderList();
}

/* ------------------------------- LISTES ---------------------------------- */
function renderList(){
  if(view.tab==="events")    return listEvents();
  if(view.tab==="tables")    return listTables();
  if(view.tab==="creatures") return listCreatures();
  if(view.tab==="sessions")  return listSessions();
  if(view.tab==="npcs")      return listNPCs();
  if(view.tab==="pointcrawls") return listCrawls();
  if(view.tab==="pcs")       return listPCs();
  if(view.tab==="treasures") return listTreasures();
}

function pageHead(title, sub, newLabel){
  return `<div class="page-head">
    <div><h1>${esc(title)}</h1><div class="sub">${esc(sub)}</div></div>
    <button class="btn" data-new="1">✦ ${esc(newLabel)}</button>
  </div>`;
}
function emptyState(icon, msg){ return `<div class="empty"><span class="big">${icon}</span>${esc(msg)}</div>`; }

function eventThemes(){
  const set = new Set();
  db.events.forEach(e=>{ if(e.theme && e.theme.trim()) set.add(e.theme.trim()); });
  return [...set].sort((a,b)=>a.localeCompare(b));
}
// Suggestions de thèmes = thèmes existants + titres des point crawls (chaque plan est une catégorie)
function themeSuggestions(){
  const set = new Set(eventThemes());
  db.pointcrawls.forEach(c=>{ if(c.title && c.title.trim()) set.add(c.title.trim()); });
  return [...set].sort((a,b)=>a.localeCompare(b));
}
function eventCard(e){
  return `<div class="card" data-open="event:${e.id}">
    <div class="meta"><span class="tag event">Événement</span>${e.theme?`<span class="tag gold">${esc(e.theme)}</span>`:""}</div>
    <h3 style="margin-top:.5rem">${esc(e.title||"Sans titre")}</h3>
    <p>${esc(firstLine(e.description)||"Pas de description")}</p>
  </div>`;
}
function eventGrid(list){
  return `<div class="grid" style="margin-bottom:1.4rem">${list.map(eventCard).join("")}</div>`;
}
function listEvents(){
  const items = db.events;
  const themes = eventThemes();
  const head = pageHead("Événements", `${items.length} module(s) d'événement`, "Nouvel événement");

  if(!items.length){ app.innerHTML = head + emptyState("📖","Aucun événement. Créez votre premier module."); return; }

  // Filtre par thème (visible seulement dès qu'au moins un thème existe)
  const filter = themes.length ? `<div style="margin-bottom:1.1rem">
      <label style="font-family:var(--ui);font-size:.8rem;color:var(--muted);margin-right:.5rem">Thème :</label>
      <select data-event-filter style="width:auto;display:inline-block;min-width:160px">
        <option value="">Tous (regroupés)</option>
        ${themes.map(t=>`<option value="${esc(t)}" ${eventThemeFilter===t?"selected":""}>${esc(t)}</option>`).join("")}
        <option value="__none__" ${eventThemeFilter==="__none__"?"selected":""}>(Sans thème)</option>
      </select></div>` : "";

  let body;
  if(!themes.length){
    body = eventGrid(items); // aucun thème encore : liste simple
  } else if(eventThemeFilter){
    const filtered = eventThemeFilter==="__none__"
      ? items.filter(e=>!e.theme || !e.theme.trim())
      : items.filter(e=>(e.theme||"").trim()===eventThemeFilter);
    body = filtered.length ? eventGrid(filtered) : `<p class="faint" style="font-family:var(--ui)">Aucun événement pour ce thème.</p>`;
  } else {
    // Vue regroupée : une section par thème, puis « Sans thème »
    const sections = [];
    themes.forEach(t=>{
      const list = items.filter(e=>(e.theme||"").trim()===t);
      sections.push(`<h2 class="group-head">${esc(t)} <span class="faint">(${list.length})</span></h2>${eventGrid(list)}`);
    });
    const noTheme = items.filter(e=>!e.theme || !e.theme.trim());
    if(noTheme.length) sections.push(`<h2 class="group-head">Sans thème <span class="faint">(${noTheme.length})</span></h2>${eventGrid(noTheme)}`);
    body = sections.join("");
  }
  app.innerHTML = head + filter + body;
}

function listTables(){
  const items = db.tables;
  app.innerHTML = pageHead("Tables aléatoires", `${items.length} table(s)`, "Nouvelle table") +
    (items.length ? `<div class="grid">${items.map(t=>`
      <div class="card" data-open="table:${t.id}">
        <span class="tag table">Table · d${(t.rows||[]).length||0}</span>
        <h3>${esc(t.title||"Sans titre")}</h3>
        <p>${esc(t.context||"Pas de contexte")}</p>
      </div>`).join("")}</div>`
    : emptyState("🎲","Aucune table. Créez une table aléatoire."));
}

function levelNum(l){
  l = String(l||"").trim();
  let m;
  if((m = l.match(/^(\d+)\s*\/\s*(\d+)/))) return (+m[1])/(+m[2]);   // niveaux fractionnaires (1/2, 1/4…)
  if((m = l.match(/-?\d+(\.\d+)?/))) return parseFloat(m[0]);
  return -1;
}
function creatureCategories(){
  const set = new Set();
  db.creatures.forEach(c=>{ if(c.category && c.category.trim()) set.add(c.category.trim()); });
  return [...set].sort((a,b)=>a.localeCompare(b));
}
function sortCreatures(list){
  const s = creatureSort;
  const a = [...list];
  if(s==="lvlAsc")  a.sort((x,y)=>levelNum(x.level)-levelNum(y.level) || (x.name||"").localeCompare(y.name||""));
  else if(s==="lvlDesc") a.sort((x,y)=>levelNum(y.level)-levelNum(x.level) || (x.name||"").localeCompare(y.name||""));
  else a.sort((x,y)=>(x.name||"").localeCompare(y.name||""));
  return a;
}
function creatureCard(c){
  return `<div class="card" data-open="creature:${c.id}">
    ${(c.images&&c.images.length)?`<img class="thumb" src="${c.images[0].data}" alt="">`:""}
    <div class="meta"><span class="tag creature">Créature</span>
      <span class="tag ${c.alignment||'neutre'}">${esc(cap(c.alignment)||'—')}</span>
      <span class="tag gold">Niv. ${esc(c.level||'?')}</span>
      ${c.category?`<span class="tag">${esc(c.category)}</span>`:""}</div>
    <h3 style="margin-top:.6rem">${esc(c.name||"Sans nom")}</h3>
    ${c.desc?`<p>${esc(c.desc)}</p>`:""}
    <div class="meta"><span class="tag">CA ${esc(c.ac||'?')}</span><span class="tag">PV ${esc(c.hp||'?')}</span></div>
  </div>`;
}
function creatureGrid(list){ return `<div class="grid" style="margin-bottom:1.4rem">${sortCreatures(list).map(creatureCard).join("")}</div>`; }
function listCreatures(){
  const items = db.creatures;
  const cats = creatureCategories();
  const bar = `<div class="page-head">
      <div><h1>Créatures</h1><div class="sub">${items.length} créature(s)</div></div>
      <div class="hbtns">
        <button class="btn ghost" data-import-xml="1">⭱ Import XML</button>
        <button class="btn ghost" data-xml-sample="1">⭳ Modèle XML</button>
        <button class="btn danger" data-purge="1">🗑 Vider</button>
        <button class="btn" data-new="1">✦ Nouvelle créature</button>
      </div>
    </div>`;
  if(!items.length){ app.innerHTML = bar + emptyState("🐲","Aucune créature. Créez-en une ou importez un fichier XML."); return; }

  const sortSel = `<label style="font-family:var(--ui);font-size:.8rem;color:var(--muted);margin-right:.4rem">Trier :</label>
    <select data-crea-sort style="width:auto;display:inline-block;min-width:130px;margin-right:1rem">
      <option value="name" ${creatureSort==="name"?"selected":""}>Nom (A→Z)</option>
      <option value="lvlAsc" ${creatureSort==="lvlAsc"?"selected":""}>Niveau ↑</option>
      <option value="lvlDesc" ${creatureSort==="lvlDesc"?"selected":""}>Niveau ↓</option>
    </select>`;
  const catSel = cats.length ? `<label style="font-family:var(--ui);font-size:.8rem;color:var(--muted);margin-right:.4rem">Catégorie :</label>
    <select data-crea-filter style="width:auto;display:inline-block;min-width:150px">
      <option value="">Toutes (regroupées)</option>
      ${cats.map(t=>`<option value="${esc(t)}" ${creatureCatFilter===t?"selected":""}>${esc(t)}</option>`).join("")}
      <option value="__none__" ${creatureCatFilter==="__none__"?"selected":""}>(Sans catégorie)</option>
    </select>` : "";

function renderDetail(){
  const type = TYPE_OF_TAB[view.tab];
  const o = getEntity(type, view.id);
  if(!o){ view.mode="list"; return render(); }
  if(type==="event")    return detailEvent(o);
  if(type==="table")    return detailTable(o);
  if(type==="creature") return detailCreature(o);
  if(type==="session")  return detailSession(o);
  if(type==="npc")      return detailNPC(o);
  if(type==="pointcrawl") return detailCrawl(o);
  if(type==="pc")       return detailPC(o);
  if(type==="treasure") return detailTreasure(o);
}

function detailActions(type,id){
  return `<div class="actions">
    <button class="btn ghost sm" data-edit="${type}:${id}">✎ Modifier</button>
    <button class="btn ghost sm" data-dup="${type}:${id}">⧉ Dupliquer</button>
    <button class="btn danger sm" data-del="${type}:${id}">🗑 Supprimer</button>
  </div>`;
}
function duplicateEntity(type,id){
  const src = getEntity(type,id); if(!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid();
  // régénère les identifiants des sous-éléments pour éviter les collisions
  (copy.entries||[]).forEach(x=>x.id=uid());
  (copy.nodes||[]).forEach(x=>x.id=uid());
  (copy.edges||[]).forEach(x=>x.id=uid());
  (copy.images||[]).forEach(x=>x.id=uid());
  if(type==="creature"||type==="npc"||type==="pc"||type==="treasure") copy.name = (copy.name||"Sans nom")+" (copie)";
  if(type==="creature"){ copy.manual = true; delete copy.imported; }   // un doublon créé à la main est protégé du vidage
  else copy.title = (copy.title||"Sans titre")+" (copie)";
  collectionOf(type).push(copy);
  saveDB(); view={tab:TAB_OF[type],mode:"detail",id:copy.id}; render(); toast("Dupliqué.");
}

function backlinksBlock(type,id){
  const g = backlinksTo(type,id);
  const order = [["event","Événements"],["session","Sessions"],["table","Tables"],["creature","Créatures"],["pc","PJ"],["npc","PNJ"],["pointcrawl","Point Crawl"],["treasure","Trésor"]];
  const parts = order.filter(([k])=>g[k]&&g[k].length).map(([k,lbl])=>`
    <div class="bl-group"><div class="lbl">${lbl}</div>
      ${g[k].map(x=>`<span class="bl-chip" data-goto="${x.type}:${x.id}">${esc(x.title||"—")}</span>`).join("")}
    </div>`).join("");
  return `<div class="backlinks"><h2>⇠ Mentionné dans</h2>${parts || `<p class="faint">Aucune autre entité ne mentionne cet élément. Utilisez <code>[[${esc(entityTitle(type,getEntity(type,id)))}]]</code> ailleurs pour créer un lien.</p>`}</div>`;
}

function fmtMod(v){
  if(v===undefined||v===null||v==="") return "—";
  const s = String(v).trim();
  if(/^[+-]/.test(s)) return s;
  const n = Number(s);
  if(!isNaN(n)) return (n>=0?"+":"")+n;
  return s;
}

  if(!formImages.length){ w.innerHTML = `<p class="faint" style="font-family:var(--ui);font-size:.85rem;margin:.2rem 0">Aucune image pour l'instant.</p>`; return; }
  w.innerHTML = formImages.map((img,i)=>`<div class="img-thumb"><img src="${img.data}" alt="${esc(img.name||'')}">
    <button class="img-del" data-remove-img="${i}" title="Retirer">✕</button></div>`).join("");

function processImage(file, cb){
  if(!file.type || !file.type.startsWith("image/")){ toast("Fichier ignoré (pas une image)."); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    const src = reader.result;
    const im = new Image();
    im.onload = ()=>{
      const max = 1000; let w = im.width, h = im.height;
      if(Math.max(w,h) <= max){ cb({id:uid(),name:file.name,data:src}); return; }
      const scale = max/Math.max(w,h); w = Math.round(w*scale); h = Math.round(h*scale);
      const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(im,0,0,w,h);
      const mime = file.type.includes("png") ? "image/png" : "image/jpeg";
      cb({id:uid(),name:file.name,data:canvas.toDataURL(mime, 0.85)});
    };
    im.onerror = ()=>toast("Image illisible.");
    im.src = src;
  };
  reader.readAsDataURL(file);
}

function drawCrawl(c){
  const canvas = document.getElementById("crawl-canvas"); if(!canvas) return;
  const nodesHtml = (c.nodes||[]).map((n,i)=>{
    const ev = getEntity("event", n.eventId);
    const title = ev ? ev.title : "(événement supprimé)";
    const cls = `crawl-node ${ev?"":"missing"} ${crawlState.linkMode?"linkmode":""} ${crawlState.linkFrom===n.id?"linkfrom":""}`;
    return `<div class="${cls}" data-node="${n.id}" style="left:${n.x||0}px;top:${n.y||0}px"><span class="nt">${i+1}</span>${esc(truncate(title,40))}</div>`;
  }).join("");
  const edgesHtml = (c.edges||[]).map(e=>
    `<line data-edge="${e.id}" x1="0" y1="0" x2="0" y2="0"></line>${e.label?`<text data-edgelabel="${e.id}">${esc(e.label)}</text>`:""}`
  ).join("");
  canvas.innerHTML = `<svg>${edgesHtml}</svg>${nodesHtml}`;
  updateAllEdges(c);
}

function updateAllEdges(c){
  const canvas = document.getElementById("crawl-canvas"); if(!canvas) return;
  const center = id=>{ const el = canvas.querySelector(`.crawl-node[data-node="${id}"]`); return el ? {x:el.offsetLeft+el.offsetWidth/2, y:el.offsetTop+el.offsetHeight/2} : null; };
  (c.edges||[]).forEach(e=>{
    const a = center(e.from), b = center(e.to);
    const line = canvas.querySelector(`line[data-edge="${e.id}"]`);
    if(line && a && b){ line.setAttribute("x1",a.x); line.setAttribute("y1",a.y); line.setAttribute("x2",b.x); line.setAttribute("y2",b.y); }
    const t = canvas.querySelector(`text[data-edgelabel="${e.id}"]`);
    if(t && a && b){ t.setAttribute("x",(a.x+b.x)/2); t.setAttribute("y",(a.y+b.y)/2 - 6); t.setAttribute("text-anchor","middle"); }
  });
}

function startNodeInteraction(e, c, nodeId){
  e.preventDefault();
  if(crawlState.linkMode){ handleLinkClick(c, nodeId); return; }
  const node = (c.nodes||[]).find(n=>n.id===nodeId); if(!node) return;
  const nodeEl = document.querySelector(`.crawl-node[data-node="${nodeId}"]`);
  const startX = e.clientX, startY = e.clientY, ox = node.x||0, oy = node.y||0; let moved = false;
  const move = ev=>{
    const dx = ev.clientX-startX, dy = ev.clientY-startY;
    if(Math.abs(dx)>3 || Math.abs(dy)>3) moved = true;
    node.x = Math.max(0, ox+dx); node.y = Math.max(0, oy+dy);
    if(nodeEl){ nodeEl.style.left = node.x+"px"; nodeEl.style.top = node.y+"px"; }
    updateAllEdges(c);
  };
  const up = ()=>{
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    if(moved) saveDB(); else openNodeInfo(c, node);
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
}

function handleLinkClick(c, nodeId){
  if(!crawlState.linkFrom){ crawlState.linkFrom = nodeId; drawCrawl(c); return; }
  if(crawlState.linkFrom === nodeId){ crawlState.linkFrom = null; drawCrawl(c); return; }
  const exists = (c.edges||[]).some(e=>(e.from===crawlState.linkFrom&&e.to===nodeId)||(e.from===nodeId&&e.to===crawlState.linkFrom));
  if(!exists){ (c.edges||(c.edges=[])).push({id:uid(), from:crawlState.linkFrom, to:nodeId, label:""}); saveDB(); }
  crawlState.linkFrom = null; drawCrawl(c);
}

function onEdgeClick(c, edgeId){
  const e = (c.edges||[]).find(x=>x.id===edgeId); if(!e) return;
  if(crawlState.linkMode){
    confirmModal("Supprimer ce segment ?", ()=>{ c.edges = c.edges.filter(x=>x.id!==edgeId); saveDB(); drawCrawl(c); });
    return;
  }
  promptModal("Étiquette du segment (ex : « porte verrouillée », « escalier nord ») :", e.label||"", (label)=>{
    e.label = (label||"").trim(); saveDB(); drawCrawl(c);
  });
}

function removeNode(c, nodeId){
  c.nodes = (c.nodes||[]).filter(n=>n.id!==nodeId);
  c.edges = (c.edges||[]).filter(e=>e.from!==nodeId && e.to!==nodeId);

/* ---- Export PDF d'un point crawl (schéma numéroté + événements numérotés) ---- */
function stripLinks(text){ return String(text||"").replace(/\[\[([^\]]+)\]\]/g, "$1"); }
/* Rendu texte pour le PDF : échappe le HTML puis met en valeur les renvois [[Nom]] (gras + souligné) */
function renderTextPrint(text){
  return esc(String(text||"")).replace(/\[\[([^\]]+)\]\]/g, (m, nm)=>`<span class="pp-link">${nm.trim()}</span>`);
}
function printSection(label, text){
  const lines = String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return "";   // on masque les sections vides pour un rendu épuré
  return `<div class="pp-sec"><h4>${label}</h4><ul>${lines.map(l=>`<li>${renderTextPrint(l)}</li>`).join("")}</ul></div>`;
}
function crawlDiagramSVG(c){
  const NW = 152, NH = 44, pad = 28, nodes = c.nodes||[];
  if(!nodes.length) return "";
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  nodes.forEach(n=>{ const x=n.x||0, y=n.y||0; minX=Math.min(minX,x); minY=Math.min(minY,y); maxX=Math.max(maxX,x+NW); maxY=Math.max(maxY,y+NH); });
  const ox=minX-pad, oy=minY-pad, w=(maxX-minX)+pad*2, h=(maxY-minY)+pad*2;
  const byId = id=>nodes.find(n=>n.id===id);
  const cx = n=>(n.x||0)+NW/2, cy = n=>(n.y||0)+NH/2;
  const edges = (c.edges||[]).map(e=>{
    const a=byId(e.from), b=byId(e.to); if(!a||!b) return "";
    const mx=(cx(a)+cx(b))/2, my=(cy(a)+cy(b))/2;
    return `<line x1="${cx(a)}" y1="${cy(a)}" x2="${cx(b)}" y2="${cy(b)}"/>${e.label?`<text class="elbl" x="${mx}" y="${my-4}" text-anchor="middle">${esc(e.label)}</text>`:""}`;
  }).join("");
  const boxes = nodes.map((n,i)=>{
    const ev=getEntity("event",n.eventId), title=ev?ev.title:"(événement supprimé)", x=n.x||0, y=n.y||0;
    return `<g class="pnode">
      <rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="7"/>
      <circle class="numc" cx="${x+16}" cy="${y+16}" r="11"/>
      <text class="numt" x="${x+16}" y="${y+20.5}" text-anchor="middle">${i+1}</text>
      <text class="ptitle" x="${x+32}" y="${y+29}">${esc(truncate(title,17))}</text>
    </g>`;
  }).join("");
  return `<svg viewBox="${ox} ${oy} ${w} ${h}" class="pp-svg" xmlns="http://www.w3.org/2000/svg">${edges}${boxes}</svg>`;
}
function printCrawl(id){
  const c = getEntity("pointcrawl", id); if(!c) return;
  const nodes = c.nodes||[];
  if(!nodes.length){ toast("Ajoutez au moins un point avant d'imprimer."); return; }
  const events = nodes.map((n,i)=>{
    const ev=getEntity("event",n.eventId);
    if(!ev) return `<div class="pp-event"><h3><span class="pp-num">${i+1}</span> <span>(événement supprimé)</span></h3></div>`;
    return `<div class="pp-event">
      <h3><span class="pp-num">${i+1}</span> <span>${esc(ev.title)}</span>${ev.theme?`<span class="pp-theme">${esc(ev.theme)}</span>`:""}</h3>
      ${printSection("Description & ambiance", ev.description)}
      ${printSection("Pièges — conditions & conséquences", ev.traps)}
      ${printSection("Secrets à découvrir", ev.secrets)}
      ${printSection("Informations accessibles", ev.info)}
    </div>`;
  }).join("");
  $("#print-area").innerHTML = `
    <section class="pp-map">
      <h1>${esc(c.title||"Point Crawl")}</h1>
      ${c.description?`<p class="pp-desc">${renderTextPrint(c.description)}</p>`:""}
      ${crawlDiagramSVG(c)}
    </section>
    <section class="pp-events"><h2>Événements du plan (${nodes.length})</h2>${events}</section>`;
  window.print();
}

function rollTalents(id){
  const p = getEntity("pc",id); if(!p) return;
  const total = (1+Math.floor(Math.random()*6)) + (1+Math.floor(Math.random()*6));
  let matched = null;
  document.querySelectorAll("#talents-body tr").forEach(tr=>{
    const inRange = rangeContains(tr.dataset.rollRange, total);
    tr.classList.toggle("rolled", inRange);
    if(inRange) matched = tr;
  });
  const out = $("#talent-roll-out");
  out.textContent = `→ 2d6 = ${total} : ${matched ? matched.children[1].textContent.trim() : "aucune ligne correspondante"}`;
  if(matched) matched.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function rangeContains(range, n){
  range = String(range||"").trim(); if(!range) return false;
  let m;
  if((m = range.match(/^(\d+)\s*[-–]\s*(\d+)$/))){ const a=+m[1], b=+m[2]; return n>=Math.min(a,b) && n<=Math.max(a,b); }
  if((m = range.match(/^(\d+)\s*\+$/))) return n >= +m[1];
  if(/^\d+$/.test(range)) return n === +range;
  return false;
}

function runSearch(q){
  const box = $("#search-results");
  q = q.trim().toLowerCase();
  if(!q){ box.classList.remove("open"); box.innerHTML=""; return; }
  const results = [];
  const push = (type, o)=>{
    const hay = entityText(type,o).toLowerCase();
    const idx = hay.indexOf(q);
    if(idx>=0) results.push({type,id:o.id,title:entityTitle(type,o),snippet:snippet(entityText(type,o),q)});
  };
  db.creatures.forEach(o=>push("creature",o));
  db.events.forEach(o=>push("event",o));
  db.tables.forEach(o=>push("table",o));
  db.sessions.forEach(o=>push("session",o));
  db.npcs.forEach(o=>push("npc",o));
  db.pointcrawls.forEach(o=>push("pointcrawl",o));
  db.pcs.forEach(o=>push("pc",o));
  db.treasures.forEach(o=>push("treasure",o));
  if(!results.length){ box.innerHTML = `<div class="sr-empty">Aucun résultat pour « ${esc(q)} »</div>`; box.classList.add("open"); return; }
  box.innerHTML = results.slice(0,25).map(r=>`
    <div class="sr-item" data-goto="${r.type}:${r.id}">
      <span class="tag ${r.type}">${TYPE_LABEL[r.type]}</span>
      <b style="margin-left:.4rem">${esc(r.title||"—")}</b>
      <div class="faint" style="font-size:.78rem;margin-top:.15rem">${esc(r.snippet)}</div>
    </div>`).join("");
  box.classList.add("open");
}
function snippet(text,q){
  const t = String(text||"").replace(/\s+/g," ");
  const i = t.toLowerCase().indexOf(q);
  if(i<0) return t.slice(0,80);
  const start = Math.max(0,i-30);
  return (start>0?"…":"") + t.slice(start, i+q.length+40) + "…";
}

const DB_COLS = ["sessions","events","creatures","tables","npcs","pointcrawls","pcs","treasures"];
function countItems(d){ return DB_COLS.reduce((n,c)=>n+((d[c]||[]).length),0); }
function mergeDB(data){
  let added = 0;
  DB_COLS.forEach(col=>{
    if(!db[col]) db[col] = [];
    const seen = new Set(db[col].map(o=>o.id));
    (data[col]||[]).forEach(o=>{ if(o && o.id && !seen.has(o.id)){ db[col].push(o); seen.add(o.id); added++; } });
  });
  return added;
}
function importJSON(file){
  const r = new FileReader();
  r.onload = ()=>{
    let data;

    catch(e){ toast("Fichier JSON invalide."); return; }

      <div class="form-actions" style="margin-top:0">

      </div>`);

  r.readAsText(file);
}
function downloadBlob(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

/* ---- Import XML des créatures (format libre & tolérant, avec gestion des doublons) ---- */
let _xmlPending = null;
function importXML(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const doc = new DOMParser().parseFromString(r.result, "application/xml");
      if(doc.querySelector("parsererror")) throw new Error("XML mal formé");
      const nodes = doc.getElementsByTagName("creature").length ? [...doc.getElementsByTagName("creature")]
        : [...doc.documentElement.children].filter(n=>/creature|monster|stat/i.test(n.tagName));
      if(!nodes.length) throw new Error("Aucune balise <creature> trouvée");
      _xmlPending = nodes.map(parseCreatureNode).filter(c=>c.name);
      const existing = new Set(db.creatures.map(c=>(c.name||"").toLowerCase()));
      const dupes = _xmlPending.filter(c=>existing.has((c.name||"").toLowerCase())).length;
      openModal(`<h2 style="margin:.1rem 0 .5rem;color:var(--gold2)">Importer ${_xmlPending.length} créature(s)</h2>
        <p style="font-family:var(--ui);font-size:.9rem;line-height:1.55;color:var(--muted);margin:0 0 1rem">
          ${dupes>0 ? `<b style="color:var(--gold2)">${dupes}</b> portent un nom déjà présent (doublons potentiels).<br>` : `Aucun doublon détecté.<br>`}
          <b style="color:var(--green)">Ignorer les doublons</b> : n'ajoute que les nouvelles.<br>
          <b style="color:var(--gold2)">Remplacer les doublons</b> : met à jour les fiches existantes (par nom), ajoute les nouvelles.<br>
          <b>Tout ajouter</b> : ajoute tout, même en double.</p>
        <div class="form-actions" style="margin-top:0;flex-wrap:wrap">
          <button class="btn" data-xml-skip="1">⏭ Ignorer les doublons</button>
          <button class="btn ghost" data-xml-replace="1">♻ Remplacer les doublons</button>
          <button class="btn ghost" data-xml-all="1">➕ Tout ajouter</button>
          <button class="btn ghost" data-modal-close="1">Annuler</button>
        </div>`);
    }catch(e){ toast("Import XML échoué : "+e.message); }
  };
  r.readAsText(file);
}
function applyXMLImport(mode){
  if(!_xmlPending) return;
  let added=0, replaced=0, skipped=0;
  const byName = {}; db.creatures.forEach(c=>{ byName[(c.name||"").toLowerCase()] = c; });
  _xmlPending.forEach(c=>{
    const key = (c.name||"").toLowerCase();
    const exist = byName[key];
    if(exist && mode!=="all"){
      if(mode==="replace"){
        const id=exist.id, imgs=exist.images;
        Object.keys(exist).forEach(k=>delete exist[k]);
        Object.assign(exist, c); exist.id=id; exist.imported=true;
        if((!c.images||!c.images.length) && imgs && imgs.length) exist.images=imgs;
        replaced++;
      } else skipped++;                       // mode "skip"
    } else {
      c.id=uid(); c.imported=true; db.creatures.push(c); byName[key]=c; added++;
    }
  });
  _xmlPending=null; saveDB(); view={tab:"creatures",mode:"list",id:null}; render();
  toast(`Import : ${added} ajoutée(s), ${replaced} remplacée(s), ${skipped} ignorée(s).`);
}
function openPurgeModal(){
  const manual = db.creatures.filter(c=>c.manual).length;
  const other = db.creatures.length - manual;
  openModal(`<h2 style="margin:.1rem 0 .5rem;color:var(--blood2)">Vider les créatures</h2>
    <p style="font-family:var(--ui);font-size:.9rem;line-height:1.55;color:var(--muted);margin:0 0 .9rem">

function purgeCreatures(all){

}
function parseCreatureNode(node){
  const get = (sel)=>{ const el = node.querySelector(sel); return el ? el.textContent.trim() : ""; };
  const attrOr = (sel, attr, fallbackSel)=>{
    const el = node.querySelector(sel);
    if(el && el.getAttribute(attr)!=null) return el.getAttribute(attr).trim();
    return fallbackSel!=null ? get(fallbackSel) : "";
  };
  const c = {
    name: get("name") || node.getAttribute("name") || "",
    category: get("category") || get("categorie") || "",
    desc: get("description") || get("desc") || "",
    ac: get("ac") || get("armorclass") || attrOr("stats","ac"),
    hp: get("hp") || get("hitpoints") || attrOr("stats","hp"),
    level: get("level") || attrOr("stats","level"),
    alignment: (get("alignment")||"chaos").toLowerCase(),
    abilities: get("abilities") || get("special") || get("immunities") || "",
    attacks: []
  };
  // Caractéristiques : soit <stats str=".."/>, soit balises individuelles <str>..</str>
  const statsEl = node.querySelector("stats") || node.querySelector("abilities-scores");
  const keys = {str:["str","strength"],dex:["dex","dexterity"],con:["con","constitution"],int:["int","intelligence"],wis:["wis","sag","wisdom","sagesse"],cha:["cha","charisma","charisme"]};
  Object.entries(keys).forEach(([k,aliases])=>{
    let v="";
    if(statsEl){ for(const a of aliases){ if(statsEl.getAttribute(a)!=null){ v=statsEl.getAttribute(a); break; } } }
    if(!v){ for(const a of aliases){ const el=node.querySelector(a); if(el){ v=el.textContent.trim(); break; } } }
    c[k]=v;
  });
  // normaliser alignement
  if(/cha|chaos/.test(c.alignment)) c.alignment="chaos";
  else if(/loy|law/.test(c.alignment)) c.alignment="loyal";
  else if(/neut/.test(c.alignment)) c.alignment="neutre";
  // Attaques
  node.querySelectorAll("attack").forEach(a=>{
    const nm = a.getAttribute("name") || (a.querySelector("name")?.textContent) || a.textContent.trim();
    c.attacks.push({
      name: (nm||"").trim(),
      bonus: a.getAttribute("bonus") || a.querySelector("bonus")?.textContent?.trim() || "",
      damage: a.getAttribute("damage") || a.querySelector("damage")?.textContent?.trim() || "",
      range: normRange(a.getAttribute("range") || a.querySelector("range")?.textContent?.trim() || "close")
    });
  });
  return c;
}
function normRange(r){
  r=(r||"").toLowerCase();
  if(/far|long|lointain/.test(r)) return "far";
  if(/near|inter|proche|moyen/.test(r)) return "near";
  return "close";
}

function rollTable(id){
  const t = getEntity("table",id); if(!t||!t.rows.length) return;
  const idx = Math.floor(Math.random()*t.rows.length);
  document.querySelectorAll("#table-body tr").forEach(tr=>tr.classList.toggle("rolled", +tr.dataset.rowidx===idx));
  const out = $("#roll-out"); out.textContent = `→ ${idx+1} : ${firstLine(t.rows[idx])||"(vide)"}`;
  const tr = document.querySelector(`#table-body tr[data-rowidx="${idx}"]`);
  if(tr) tr.scrollIntoView({block:"nearest",behavior:"smooth"});
}

/* =========================================================================

   Déclencheurs : taper "[[" (mode brackets) ou Ctrl+Espace sur un mot (mode word).

let ac = { open:false, field:null, mode:null, from:0, to:0, items:[], sel:0 };
const AC_EXCLUDE = new Set(["search","pick-search"]);

function acEntities(){
  const out = [];
  const add = (type,list)=> (list||[]).forEach(o=>{ const nm=entityTitle(type,o); if(nm) out.push({type, name:nm}); });
  add("creature",db.creatures); add("event",db.events); add("table",db.tables);
  add("session",db.sessions); add("pc",db.pcs); add("npc",db.npcs); add("pointcrawl",db.pointcrawls);
  return out;
}

function isLinkField(f){ return f && f.matches && f.matches("textarea, input[type=text]") && !AC_EXCLUDE.has(f.id); }

function openAC(field, query, from, to, mode){
  const q = query.toLowerCase();
  const items = acEntities().filter(it=>it.name.toLowerCase().includes(q))
    .sort((a,b)=>{ const as=a.name.toLowerCase().startsWith(q)?0:1, bs=b.name.toLowerCase().startsWith(q)?0:1; return as-bs || a.name.localeCompare(b.name); });
  if(mode==="word" && !items.length){ closeAC(); toast("Aucune entité ne correspond à ce mot."); return; }
  ac = { open:true, field, mode, from, to, query, items:items.slice(0,8), sel:0 };
  renderAC(); positionAC(field, to);
}
function renderAC(){
  const pop = $("#ac-pop");
  if(!ac.items.length){ pop.innerHTML = `<div class="ac-empty">Aucune entité — continuez à taper</div>`; }
  else pop.innerHTML = ac.items.map((it,i)=>
      `<div class="aci ${i===ac.sel?"sel":""}" data-ac="${i}"><span class="tag ${it.type}">${TYPE_LABEL[it.type]}</span><span class="nm">${esc(it.name)}</span></div>`
    ).join("") + `<div class="ac-hint">↑↓ naviguer · ⏎/Tab insérer · Échap fermer</div>`;
  pop.classList.add("open");
}
function positionAC(field, caretPos){
  const c = getCaretCoordinates(field, caretPos);
  const r = field.getBoundingClientRect();
  const pop = $("#ac-pop");
  let left = r.left + c.left - field.scrollLeft;
  let top = r.top + c.top - field.scrollTop + c.height + 3;
  left = Math.max(6, Math.min(left, window.innerWidth - 340));
  if(top > window.innerHeight - 150) top = Math.max(6, top - c.height - pop.offsetHeight - 8);
  pop.style.left = left + "px"; pop.style.top = top + "px";
}
function moveAC(delta){ if(!ac.items.length) return; ac.sel = (ac.sel + delta + ac.items.length) % ac.items.length; renderAC(); }
function acceptAC(){
  if(!ac.open || !ac.items.length){ closeAC(); return; }
  const it = ac.items[ac.sel], f = ac.field, v = f.value, insert = `[[${it.name}]]`;
  f.value = v.slice(0, ac.from) + insert + v.slice(ac.to);
  const caret = ac.from + insert.length;
  f.focus(); f.setSelectionRange(caret, caret);
  closeAC();
}
function closeAC(){ ac.open = false; $("#ac-pop").classList.remove("open"); }

function onFieldInput(e){
  const f = e.target;
  if(!isLinkField(f)) return;
  const pos = f.selectionStart;
  const before = f.value.slice(0, pos);
  const m = before.match(/\[\[([^\[\]\n]*)$/);   // "[[" non fermé avant le curseur
  if(m) openAC(f, m[1], m.index, pos, "brackets");
  else if(ac.open && ac.mode==="brackets") closeAC();
}
function acWordTrigger(f){
  const pos = f.selectionStart;
  const before = f.value.slice(0, pos);
  const m = before.match(/([\wÀ-ÿ'’\-]+)$/);
  openAC(f, m ? m[1] : "", m ? pos - m[1].length : pos, pos, "word");
}
function onFieldKeydown(e){
  const f = e.target;
  if(isLinkField(f) && e.ctrlKey && (e.code==="Space" || e.key===" ")){ e.preventDefault(); acWordTrigger(f); return; }
  if(!ac.open) return;
  if(e.key==="ArrowDown"){ e.preventDefault(); moveAC(1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); moveAC(-1); }
  else if(e.key==="Enter" || e.key==="Tab"){ e.preventDefault(); acceptAC(); }
  else if(e.key==="Escape"){ e.preventDefault(); closeAC(); }
}

document.addEventListener("input", onFieldInput);
document.addEventListener("keydown", onFieldKeydown, true);
document.addEventListener("scroll", ()=>{ if(ac.open) closeAC(); }, true);
document.addEventListener("mousedown", e=>{ if(ac.open && !e.target.closest("#ac-pop") && e.target!==ac.field) closeAC(); });
$("#ac-pop").addEventListener("mousedown", e=>{ const it=e.target.closest("[data-ac]"); if(it){ e.preventDefault(); ac.sel=+it.dataset.ac; acceptAC(); } });

/* Coordonnées du curseur dans un textarea/input (technique du "miroir") */
function getCaretCoordinates(element, position){
  const isInput = element.nodeName === "INPUT";
  const div = document.createElement("div");
  const computed = getComputedStyle(element);
  const s = div.style;
  s.position = "absolute"; s.visibility = "hidden"; s.whiteSpace = "pre-wrap";
  if(!isInput) s.wordWrap = "break-word"; else { s.whiteSpace = "pre"; s.overflow = "hidden"; }
  ["boxSizing","width","height","overflowX","overflowY","borderTopWidth","borderRightWidth","borderBottomWidth","borderLeftWidth",
   "paddingTop","paddingRight","paddingBottom","paddingLeft","fontStyle","fontVariant","fontWeight","fontStretch","fontSize",
   "lineHeight","fontFamily","textAlign","textTransform","textIndent","letterSpacing","wordSpacing","tabSize"]
    .forEach(p=>{ s[p] = computed[p]; });
  document.body.appendChild(div);
  div.textContent = element.value.substring(0, position);
  if(isInput) div.textContent = div.textContent.replace(/\s/g, " ");
  const span = document.createElement("span");
  span.textContent = element.value.substring(position) || ".";
  div.appendChild(span);
  const coords = { top: span.offsetTop + parseInt(computed.borderTopWidth), left: span.offsetLeft + parseInt(computed.borderLeftWidth), height: parseInt(computed.lineHeight) || parseInt(computed.fontSize) };
  document.body.removeChild(div);
  return coords;
}
